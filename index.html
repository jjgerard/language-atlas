https://www2.education.vic.gov.au/pal/eal-provision/print-all"},{"label":"EAL Support and Funding - Policy","url":"https://www2.education.vic.gov.au/pal/eal-support/policy"},{"label":"EAL Annual Report 2023","url":"https://www.education.vic.gov.au/Documents/school/teachers/teachingresources/diversity/eal/EAL-Annual-Report-2023.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Western Australia","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"partial","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhnhnnnn","filled":["Newcomer criteria","Removal criteria","L2 support"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"The EAL/D Progress Map (Early Childhood, Middle Childhood, Secondary versions) is the identification/planning/assessment tool, applying to any student needing Standard Australian English support, overseas-arrived or Australian-born. No published numeric threshold or formal 'newcomer' test was found.","removalCriteria":"Not found — no exit/removal criteria are published on the department pages reviewed.","l2Support":"The Student-Centred Funding Model states it provides 'additional funding for children with English as a second language,' but no public document specifies the eligibility test, per-student amount, or staffing ratio — confirmed as a genuine gap in public documentation, not a search failure (the department's own funding page refers detailed inquiries to a direct email contact rather than publishing the formula)."},"history":[],"docLinks":[{"label":"EAL/D Progress Map","url":"https://myresources.education.wa.edu.au/programs/eal-d-progress-map"},{"label":"Funding public schools (Student-Centred Funding Model overview)","url":"https://www.education.wa.edu.au/funding-public-schools"}],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Queensland","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"partial","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhnhnnnn","filled":["Newcomer criteria","Removal criteria","L2 support"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Identified via the Bandscales for EAL/D learners (4 domains — listening, speaking, reading, writing — scored 1-6), applied at enrolment and through ongoing classroom observation/work samples, reviewed roughly every six months. A separate identification flowchart exists for Aboriginal and Torres Strait Islander EAL/D learners.","removalCriteria":"Clear only for the international-student funding stream: Bandscale Level 6 equals $0 funding, i.e. proficiency no longer warranting targeted support. For general/domestic EAL/D students there is no published exit criterion — a genuine documentation gap, not a search miss.","l2Support":"Two distinct tracks: (1) international students (dependants of subclass-500 visa holders) get per-semester Bandscale-based funding from $3,120/yr (Level 1) down to $0 (Level 6) via the International Student Management System; (2) general/domestic EAL/D students get classroom-embedded differentiation guided by Bandscales, with no equivalent named funding model publicly documented — unlike NSW/Victoria, Queensland does not appear to publish a parallel resourcing formula for this larger group."},"history":[],"docLinks":[{"label":"English language support in Queensland state schools","url":"https://education.qld.gov.au/students/inclusive-education/english-language-support"},{"label":"International students - EAL/D funding","url":"https://education.qld.gov.au/about-us/budgets-funding-grants/grants/state-schools/core-funding/english-language-dialect"},{"label":"Bandscales for EAL/D learners - User guide","url":"https://education.qld.gov.au/student/Documents/bandscales-eald-learners-user-guide.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"HK","name":"Hong Kong","nat":false,"region":"Asia","subregion":"Eastern Asia","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhhhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"No single formal legal test defines 'non-Chinese speaking' (NCS) student on EDB's public pages — in practice it denotes students of non-Chinese ethnic origin (mostly South/Southeast Asian) for whom Chinese is not the home language. Note the reversed direction from most entries in this catalog: the relevant additional-language support is for Chinese (the language of instruction), not English.","removalCriteria":"Not found — support continues through the curriculum modes below as needed, rather than via a pass/fail exit gate.","newcomerProportion":"2023-2024 — ~12,505 pupils — NCS students in the primary sector (public sector 9,554 across 356 schools; DSS 932 across 16 schools; private 2,019 across 49 schools). Over 70% of Hong Kong's primary and secondary schools admit at least one NCS student.","l2Support":"Since 2014/15, the Chinese Language Curriculum Second Language Learning Framework provides four curriculum modes ('immersion,' 'bridging/transition,' 'specific learning purposes,' 'integration') for NCS students at different proficiency stages. Schools admitting NCS students receive additional recurrent subsidy (roughly HK$0.16M-1.6M/year depending on NCS enrolment). Other measures: intensive small-group learning, dedicated Chinese Language Assessment Tools, university-operated Chinese Language Learning Support Centres, and an Induction/Initiation Programme for newly arrived children.","l1Support":"Not found — EDB's public NCS pages describe only Chinese-acquisition and general integration support; no mother-tongue-maintenance programme (e.g. Urdu, Nepali, Tagalog) is referenced.","l3Support":"NCS students generally take the standard English curriculum alongside their peers; no distinct 'L3' policy document for this group was located.","bilingualEducationNotes":"Applied Learning Chinese (ApL(C)), introduced 2014/15, is a senior-secondary alternative Chinese-language qualification (270 contact hours, Qualifications Framework Levels 1-3) for NCS students who studied Chinese for under six years, or six-plus years only via an adapted curriculum. Most post-secondary institutions accept ApL(C) 'Attained' as an alternative to mainstream Chinese Language qualification for NCS-student admission.","policyHistory":"2013-2014 — Abolished the 'designated schools' system for NCS students, encouraging mainstream-school integration.\n2014-2015 — Chinese Language Curriculum Second Language Learning Framework introduced; ApL(C) launched.\n2019-2020 — Enhanced kindergarten support via a five-tier grant system based on NCS enrolment."},"history":[{"year":"2013-2014","description":"Abolished the 'designated schools' system for NCS students, encouraging mainstream-school integration.","links":[]},{"year":"2014-2015","description":"Chinese Language Curriculum Second Language Learning Framework introduced; ApL(C) launched.","links":[{"label":"Applied Learning Chinese (ApL(C))","url":"https://www.edb.gov.hk/en/curriculum-development/cross-kla-studies/applied-learning/applied-learning-chinese/index.html"}]},{"year":"2019-2020","description":"Enhanced kindergarten support via a five-tier grant system based on NCS enrolment.","links":[]}],"docLinks":[{"label":"Education services for non-Chinese speaking (NCS) students","url":"https://www.edb.gov.hk/en/student-parents/ncs-students/about-ncs-students/index.html"},{"label":"Summary of NCS support services","url":"https://www.edb.gov.hk/en/student-parents/ncs-students/summary-ncs-support-services/index.html"},{"label":"Applied Learning Chinese (ApL(C))","url":"https://www.edb.gov.hk/en/curriculum-development/cross-kla-studies/applied-learning/applied-learning-chinese/index.html"},{"label":"LCQ12: Measures to support non-Chinese speaking students (28 May 2025, statistics)","url":"https://www.info.gov.hk/gia/general/202505/28/P2025052800526.htm"}],"supportLinks":[],"collaborators":[]}],"dld":[{"cc":"AD","name":"Andorra","nat":true,"region":"Europe","subregion":"Southern Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AE","name":"United Arab Emirates","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AF","name":"Afghanistan","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AG","name":"Antigua and Barbuda","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AL","name":"Albania","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlnnnnnnnnn","filled":["Assessments"],"looked":["Multilingual provision"],"nFields":13,"docs":2,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Albanian, developed by Enkeleida Kapia (Academy of Albanian Studies, Albania; Ludwig Maximilian University, Germany). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"AM","name":"Armenia","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AO","name":"Angola","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AR","name":"Argentina","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AT","name":"Austria","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnhnhnhnnnnn","filled":["Terminology","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Sprachstörung\" (German; roughly \"language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Austria in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 102 respondents from Austria who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 77% and in both languages 10%; intervention in the mainstream language only 83% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 77%, in intervention 55% and in counselling 83%. On whether the country offers training for practitioners working with bi/multilingual children (n = 113): optional 45%, none 28% and unsure 25%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 204 from Austria): private practice 55%, hospital 22% and mainstream school 18%, with respondents placing themselves in private 54%, public health 36% and public education 30%. Direct intervention for the reference child was most often weekly (81% of 204). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (67% yes), social position (67% yes) and cost to parents (64% yes) (n ≈ 108). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 204 from Austria): state health insurance 70%, government education 23%, family 23% and government health 18%. 14% said a maximum number of sessions applied (n = 204). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Austria chapter, Law et al. eds., Dornstauder, Holzinger, Maasz, Maierhofer & Pfaller, pp. 136-148","url":"https://doi.org/10.4324/9780429455308-8"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Australia","nat":true,"region":"Oceania","subregion":"Australia and New Zealand","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hhnlhhhhhnlhh","filled":["Terminology","Identification criteria","Referral pathway","Service model","Legal entitlement","Funding","Workforce","Identified prevalence","Policy history"],"looked":["Multilingual provision","Outcomes evidence"],"nFields":13,"docs":8,"supports":2,"values":{"terminology":"'Developmental language disorder' is used, and Australian advocacy has adopted it firmly — The DLD Project and Language Disorder Australia both campaign under the DLD label. It has no corresponding statutory category in either the disability or the education system.","identificationCriteria":"No national criteria. Diagnosis is made by speech pathologists on clinical grounds. The consequential thresholds are eligibility thresholds rather than diagnostic ones, and they sit in the funding systems described under entitlement below.","multilingualProvision":"Not established from the sources consulted for this entry — no national protocol for assessing multilingual children was identified in the sources consulted, and none of the three funding systems appears to specify one. This is a substantial gap for a country where a large minority of school pupils speak a language other than English at home, and for Aboriginal and Torres Strait Islander children speaking traditional languages or Aboriginal English. If you work in this system, this is exactly the field to fill in.","referralPathway":"Multiple parallel entry points — private speech pathology, NDIS early childhood approach for children under 7 (which can proceed without a formal diagnosis), state education department referral where that exists, and GP referral to a Medicare Chronic Disease Management plan.","serviceModel":"Fragmented across three systems that do not align: the federally funded NDIS, state and territory education departments, and private practice. A survey of speech-language pathology service delivery in Australian schools found referral to a department-employed speech-language pathologist was possible in the ACT, Queensland, South Australia, Tasmania and Victoria, but that the services on offer varied substantially between them — so which state a child lives in materially changes what they get.","legalEntitlement":"The clearest example in this catalog of a diagnosis that confers no entitlement. DLD is not on the NDIS list of conditions accepted as likely to meet the disability requirements, so access requires demonstrating substantially reduced functional capacity case by case, and refusals are widely reported. Speech Pathology Australia has taken this to the NDIA directly, reporting significant variation in access decisions for lifelong communication conditions such as DLD and particularly for applicants over the age of seven. On the education side, pupils whose only disability is a speech, language or communication disorder are unlikely to qualify for individual targeted educational funding, despite documented effects on educational participation and achievement. The fallback, a Medicare Chronic Disease Management plan, is capped at five subsidised sessions a year.","funding":"Mixed public and private, with the gaps carried by families. NDIS packages for those who get access; state education budgets where departmental speech pathologists exist; Medicare subsidy capped at five sessions annually; otherwise private fees.","workforce":"Speech pathology is self-regulating in Australia through Speech Pathology Australia rather than registered under AHPRA. The 2014 Senate Community Affairs References Committee inquiry into speech, language and communication disorders and speech pathology services found gaps in supply, lengthy public-system waiting lists, and particular shortfalls in rural and remote areas. SPA's 2023 Workforce Analysis reported that speech pathologists remain inequitably distributed and that supply is not meeting estimated population need, alongside growth of 27% in graduates and 25% in first-year enrolments; 98% of SPA members are women.","outcomesEvidence":"Not established from the sources consulted for this entry — no national outcome reporting for DLD as a distinct category was identified; because DLD does not map to a funding category, it is largely invisible in administrative data. If you work in this system, this is exactly the field to fill in.","identifiedPrevalence":"2026 — ~7 — Commonly cited in Australian advocacy as '1 in 14' children — an epidemiological estimate carried over from international prevalence work, not an Australian identification rate.","policyHistory":"2014 — Senate Community Affairs References Committee reports on the prevalence of speech, language and communication disorders and the availability and adequacy of speech pathology services in Australia."},"history":[{"year":"2014","description":"Senate Community Affairs References Committee reports on the prevalence of speech, language and communication disorders and the availability and adequacy of speech pathology services in Australia.","links":[{"label":"Senate Community Affairs References Committee — prevalence of speech, language and communication disorders and speech pathology services in Australia (2014)","url":"https://www.aph.gov.au/-/media/Committees/Senate/committee/clac_ctte/speech_pathology/report/report.pdf"},{"label":"Australian Government response to the Senate speech pathology inquiry","url":"https://www.health.gov.au/sites/default/files/response-speech-pathology-services-in-australia.pdf"}]}],"docLinks":[{"label":"AHHA Deeble evidence brief no. 21 — DLD and the NDIS","url":"https://ahha.asn.au/resource/deeble-evidence-brief-no-21-developmental-language-disorder-and-the-ndis/"},{"label":"The DLD Project — DLD and the NDIS: a practical guide for families","url":"https://thedldproject.com/dld-and-the-ndis-a-practical-guide-for-families/"},{"label":"Speech Pathology Australia — Workforce Analysis (2023)","url":"https://www.speechpathologyaustralia.org.au/Common/Uploaded%20files/Smart%20Suite/Smart%20Library/3c538667-094d-4674-8e7e-8c0edf784cae/Speech%20Pathology%20Workforce%20Analysis%20report%202023.pdf"},{"label":"A survey of speech-language pathology service delivery in Australian schools (2024)","url":"https://www.tandfonline.com/doi/full/10.1080/17549507.2024.2404035"},{"label":"Language Disorder Australia — DLD","url":"https://languagedisorder.org.au/what-is-language-disorder/dld/"},{"label":"Senate Community Affairs References Committee — prevalence of speech, language and communication disorders and speech pathology services in Australia (2014)","url":"https://www.aph.gov.au/-/media/Committees/Senate/committee/clac_ctte/speech_pathology/report/report.pdf"},{"label":"Australian Government response to the Senate speech pathology inquiry","url":"https://www.health.gov.au/sites/default/files/response-speech-pathology-services-in-australia.pdf"},{"label":"Speech Pathology Australia — submission to the NDIS Review (2022)","url":"https://www.speechpathologyaustralia.org.au/Common/Uploaded%20files/Smart%20Suite/Smart%20Library/5a86c970-7f79-477e-8796-5677095df3a3/SPA%20submission%20NDIS%20review%2020221231.pdf"}],"supportLinks":[{"label":"NSW Department of Education — DLD professional learning","url":"https://cer.schools.nsw.gov.au/professional-learning/developmental-language-disorder"},{"label":"RADLD — Raising Awareness of DLD","url":"https://radld.org/"}],"collaborators":[]},{"cc":"AU","name":"New South Wales","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Queensland","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"South Australia","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Victoria","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Western Australia","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AZ","name":"Azerbaijan","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BA","name":"Bosnia and Herzegovina","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":1,"supports":0,"values":{},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Bosnia and Herzegovina chapter, Law et al. eds., Salić & Tutnjević, pp. 149-157","url":"https://doi.org/10.4324/9780429455308-9"}],"supportLinks":[],"collaborators":[]},{"cc":"BB","name":"Barbados","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BD","name":"Bangladesh","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BE","name":"Belgium — French Community (Wallonia-Brussels Federation)","nat":false,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnnhnhnhnnnnn","filled":["Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":2,"supports":0,"values":{"multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 75 respondents from Belgium who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 64%, in the mother tongue where it differs from the mainstream language 17% and in the mother tongue only 17%; intervention in the mainstream language only 65% and in the mother tongue 14% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 36%, in intervention 14% and in counselling 51%. On whether the country offers training for practitioners working with bi/multilingual children (n = 115): optional 35%, none 19% and unsure 45%. These are practitioner perceptions rather than a record of policy (Law et al., 2020). 286 of the 289 Belgian respondents answered in French, so this reflects French-speaking Belgium rather than the country as a whole.","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 289 from Belgium): private practice 84%, mainstream school 48% and nursery or kindergarten 18%, with respondents placing themselves in private 85%, public education 27% and public health 20%. Direct intervention for the reference child was most often twice weekly (69% of 289). Asked which factors affect access to services in their country, respondents most often named social position (65% yes), cost to parents (64% yes) and income level (56% yes) (n ≈ 103). Multiple answers were allowed (Law et al., 2020). 286 of the 289 Belgian respondents answered in French, so this reflects French-speaking Belgium rather than the country as a whole.","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 289 from Belgium): government health 71%, family 57% and government education 8%. 75% said a maximum number of sessions applied (n = 288). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020). 286 of the 289 Belgian respondents answered in French, so this reflects French-speaking Belgium rather than the country as a whole."},"history":[],"docLinks":[{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"BF","name":"Burkina Faso","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BG","name":"Bulgaria","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnhnhnhnnnnn","filled":["Terminology","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Езиково нарушение\" (Bulgarian; roughly \"language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Bulgaria in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 50 respondents from Bulgaria who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 64%, in both languages 23% and in the mother tongue where it differs from the mainstream language 21%; intervention in the mainstream language only 65% and in the mother tongue 23% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 61%, in intervention 54% and in counselling 67%. On whether the country offers training for practitioners working with bi/multilingual children (n = 60): optional 17%, none 33% and unsure 50%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 99 from Bulgaria): nursery or kindergarten 45%, private practice 41% and mainstream school 29%, with respondents placing themselves in public education 60% and private 51%. Direct intervention for the reference child was most often twice weekly (60% of 98). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (64% yes), linguistic or cultural community (53% yes) and cost to parents (51% yes) (n ≈ 59). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 99 from Bulgaria): family 51%, government education 45%, government social services 12% and pro bono 10%. 11% said a maximum number of sessions applied (n = 98). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Bulgaria chapter, Law et al. eds., Dionissieva, Stankova & Boyadzhieva-Deleva, pp. 158-168","url":"https://doi.org/10.4324/9780429455308-10"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"BH","name":"Bahrain","nat":true," },{"cc":"BS","name":"Bahamas","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BT","name":"Bhutan","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BW","name":"Botswana","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BY","name":"Belarus","nat":true,"region":"Europe","subregion":"Eastern Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BZ","name":"Belize","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Alberta","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"British Columbia","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Canada","nat":true,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Manitoba","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Nova Scotia","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Ontario","nat":false,"region":"Americas","subregion":"Northern America","status":"partial","confidence":"official-document","lastVerified":"2026-08","coverage":"has","fieldStates":"hhnlhhhnnnnnh","filled":["Terminology","Identification criteria","Referral pathway","Service model","Legal entitlement","Policy history"],"looked":["Multilingual provision"],"nFields":13,"docs":7,"supports":1,"values":{"terminology":"'Language Impairment' is the formal category — one of the exceptionalities in the Ministry of Education's Communication group, alongside Autism, Deaf and Hard of Hearing, and Learning Disability. 'DLD' has no standing in the provincial framework, so Ontario is a clear case of a system where clinical and administrative vocabularies have not converged.","identificationCriteria":"Identification is an administrative decision by an IPRC, not a clinical one: the committee is made up of at least three school board staff including the principal or superintendent, and speech-language pathologists on student services staff contribute a professional opinion rather than deciding. O. Reg. 181/98 builds in a least-restrictive-placement presumption — before considering a special education class the committee must first consider placement in a regular class with appropriate special education services, and must decide for the regular class where that would meet the pupil's needs and is consistent with parental preference. The criteria that matter in practice are set locally: the definition of 'language impairment' used to qualify a pupil can differ between neighbouring school boards within the same province, which makes provincial-level comparison of identification rates unsafe.","multilingualProvision":"Not established from the sources consulted for this entry — the provincial exceptionality definitions and IPRC materials reviewed here do not set out a protocol for assessing pupils who speak more than one language, and no province-wide guidance was found. Given how board-dependent the criteria already are, board-level practice is likely to vary and is not documented here. If you work in this system, this is exactly the field to fill in.","referralPathway":"School-initiated or parent-requested referral to the board's IPRC process. Health-side and preschool speech and language services run separately from the school system; their referral routes were not established from the sources consulted.","serviceModel":"School-board employed speech-language pathologists working within student services. Placement options set by regulation range from a regular class with withdrawal support for under 50% of the day, through a special education class with integration for at least one instructional period daily, to a full-time special education class.","legalEntitlement":"An IPRC identification leads to an Individual Education Plan, and the decision is appealable — Ontario operates Special Education Tribunals for disputes that are not resolved at board level. The entitlement therefore attaches to the IPRC identification rather than to a clinical diagnosis of language disorder.","policyHistory":"1998 — Ontario Regulation 181/98 requires every school board to establish an Identification, Placement and Review Committee (IPRC).\n1998 — Ontario Regulation 181/98 requires every school board to establish an IPRC, and requires the committee to consider a regular-class placement before a special education class."},"history":[{"year":"1998","description":"Ontario Regulation 181/98 requires every school board to establish an Identification, Placement and Review Committee (IPRC).","links":[{"label":"O. Reg. 181/98 — Identification and Placement of Exceptional Pupils (CanLII)","url":"https://www.canlii.org/en/on/laws/regu/o-reg-181-98/latest/o-reg-181-98.html"},{"label":"Special education in Ontario, K–12 — policy and resource guide: identification and placement","url":"https://www.ontario.ca/document/special-education-ontario-policy-and-resource-guide-kindergarten-grade-12/identification"}]},{"year":"1998","description":"Ontario Regulation 181/98 requires every school board to establish an IPRC, and requires the committee to consider a regular-class placement before a special education class.","links":[{"label":"Special education in Ontario — requirements under O. Reg. 181/98 and PPM 140/156","url":"https://www.ontario.ca/document/special-education-ontario-policy-and-resource-guide-kindergarten-grade-12/requirements"},{"label":"Special education in Ontario, K–12 — policy and resource guide: identification and placement","url":"https://www.ontario.ca/document/special-education-ontario-policy-and-resource-guide-kindergarten-grade-12/identification"}]}],"docLinks":[{"label":"Language Impairment exceptionality — Teach Special Education (Ontario)","url":"https://www.teachspeced.ca/language-impairment-exceptionality"},{"label":"Categories and definitions of exceptionalities (YRDSB special education plan)","url":"https://www2.yrdsb.ca/student-support/special-education/special-education-plan/2-7-Categories-and-Definitions"},{"label":"Justice for Children and Youth — IPRC rights","url":"https://jfcy.org/en/rights/special-education-iprc/"},{"label":"Identification, Placement and Review Committees in Ontario's schools (research paper)","url":"https://files.eric.ed.gov/fulltext/EJ1277996.pdf"},{"label":"O. Reg. 181/98 — Identification and Placement of Exceptional Pupils (CanLII)","url":"https://www.canlii.org/en/on/laws/regu/o-reg-181-98/latest/o-reg-181-98.html"},{"label":"Special education in Ontario, K–12 — policy and resource guide: identification and placement","url":"https://www.ontario.ca/document/special-education-ontario-policy-and-resource-guide-kindergarten-grade-12/identification"},{"label":"Special education in Ontario — requirements under O. Reg. 181/98 and PPM 140/156","url":"https://www.ontario.ca/document/special-education-ontario-policy-and-resource-guide-kindergarten-grade-12/requirements"}],"supportLinks":[{"label":"CASLPO — College of Audiologists and Speech-Language Pathologists of Ontario","url":"https://www.caslpo.com/"}],"collaborators":[]},{"cc":"CA","name":"Quebec","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CD","name":"DR Congo","nat":true,"region":"Africa", gual children (n = 218): obligatory 6%, optional 57%, none 23% and unsure 11%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 372 from Switzerland): mainstream school 56%, nursery or kindergarten 33% and private practice 28%, with respondents placing themselves in public education 76% and private 26%. Direct intervention for the reference child was most often weekly (51% of 368). Asked which factors affect access to services in their country, respondents most often named parental education (44% yes), linguistic or cultural community (40% yes) and urban or rural residence (34% yes) (n ≈ 211). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 372 from Switzerland): government education 81% and government health 17%. 36% said a maximum number of sessions applied (n = 371). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Switzerland chapter, Law et al. eds., Skoruppa, Haid & Schwob, pp. 472-484","url":"https://doi.org/10.4324/9780429455308-40"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"CI","name":"Ivory Coast","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CL","name":"Chile","nat":true,"region":"Americas","subregion":"South America","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnnhhnnnnnnn","filled":["Terminology","Referral pathway","Service model"],"looked":[],"nFields":13,"docs":1,"supports":0,"values":{"terminology":"Diagnoses are registered in the Chilean system as \"trastorno específico del lenguaje\" (specific language impairment, SLI) rather than as DLD, an administrative label that Muñoz-Lizana et al. (2026) treat as aligned with DLD. The label matters beyond naming: caregivers described the diagnosis operating as a sociocultural and administrative credential, the thing that unlocks access to services rather than merely describing the child.","referralPathway":"Caregivers in Santiago described a nonlinear route rather than a pathway. Muñoz-Lizana et al. (2026) identify three stages: initial suspicion and early help-seeking, marked by uncertainty, uneven professional guidance and trial-and-error navigation; diagnosis and entry into specialised services, in which the Escuelas de Lenguaje (Special Language Schools) act as the gateway to diagnostic confirmation and to sustained support; and primary education, where support shifts to the School Integration Programme (Programa de Integración Escolar, PIE). Based on narrative interviews with nine primary caregivers of children aged 6-9, so this is how families experienced the route, not a description of the regulations.","serviceModel":"Education-led in practice. Muñoz-Lizana et al. (2026) report that support relies heavily on education-sector gateways — the Escuelas de Lenguaje, then the PIE in primary school — within a mixed and weakly articulated system. Caregivers described discontinuities in intensity, communication and coordination at the transition into primary education, weak intersectoral coordination between primary care and the education services, and socioeconomic barriers to the complementary private therapy that fills the gap. The authors characterise caregivers as ending up the informal coordinators of their own child's care."},"history":[],"docLinks":[{"label":"Support pathways for DLD in Santiago (2026): Muñoz-Lizana, Iturra-Osorio & Helo, Folia Phoniatrica et Logopaedica","url":"https://doi.org/10.1159/000553368"}],"supportLinks":[],"collaborators":[]},{"cc":"CM","name":"Cameroon","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CN","name":"China","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CO","name":"Colombia","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CR","name":"Costa Rica","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CU","name":"Cuba","nat":true,"region":"America  assessing multilingual children, where monolingual norms do not apply. Cyprus has tasks for both Cypriot Greek and Standard Greek, which matters in a bidialectal setting. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 15 respondents from Cyprus who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 87%, in both languages 40% and in the mother tongue where it differs from the mainstream language 27%; intervention in the mainstream language only 67% and targeting two or more languages 29% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. On whether the country offers training for practitioners working with bi/multilingual children (n = 16): optional 50%, none 13% and unsure 38%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 46 from Cyprus): private practice 43%, mainstream school 41% and private rehabilitation centre 28%, with respondents placing themselves in private 63% and public education 43%. Direct intervention for the reference child was most often twice weekly (82% of 44). Asked which factors affect access to services in their country, respondents most often named cost to parents (50% yes), parental education (44% yes) and linguistic or cultural community (38% yes) (n ≈ 15). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 46 from Cyprus): family 70% and government education 39%. 9% said a maximum number of sessions applied (n = 45). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Cyprus chapter, Law et al. eds., Theodorou, Petinou & Kambanaros, pp. 179-188","url":"https://doi.org/10.4324/9780429455308-12"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"CZ","name":"Czechia","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnnhnhnhnnnnn","filled":["Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":2,"supports":0,"values":{"multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 53 respondents from Czechia who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 70%, in the mother tongue only 19% and in the mother tongue where it differs from the mainstream language 10%; intervention in the mainstream language only 74% and in the mother tongue 14% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 69%, in intervention 68% and in counselling 72%. On whether the country offers training for practitioners working with bi/multilingual children (n = 63): optional 29%, none 14% and unsure 52%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 134 from Czechia): health clinic or centre 40%, hospital 32% and private practice 16%, with respondents placing themselves in public health 77%, government-funded private 21% and private 19%. Direct intervention for the reference child was most often fortnightly (55% of 134). Asked which factors affect access to services in their country, respondents most often named linguistic or cultural community (58% yes), parental education (51% yes) and urban or rural residence (41% yes) (n ≈ 63). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 134 from Czechia): state health insurance 65%, government health 46%, family 15% and government education 14%. 10% said a maximum number of sessions applied (n = 133). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"DE","name":"Germany","nat":true,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhhnhnhnnnnn","filled":["Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for German, developed by Cornelia Hamann and Lina Abed Ibrahim (University of Oldenburg) with Solveig Chilla (University of Flensburg) and Esther Ruigendijk (University of Oldenburg). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Extensively published, including Hamann & Abed Ibrahim (2017), 'Methods for identifying specific language impairment in bilingual populations in Germany', Frontiers in Communication 2:16, and work specifically on Arabic-German and Turkish-German bilinguals. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 137 respondents from Germany who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 77%; intervention in the mainstream language only 83% and targeting two or more languages 10% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 59%, in intervention 31% and in counselling 74%. On whether the country offers training for practitioners working with bi/multilingual children (n = 150): optional 58%, none 23% and unsure 18%. These are practitioner perceptions rather than a record of policy (Law et al., 2020). Access runs through a medical prescription: Scharff Rethfeldt (2019) surveyed 28 speech and language therapy practices across districts of Bremen about children referred with a suspected language disorder, and clustered the practices by the proportion of minor migrants and minor welfare recipients in each district — treating sociospatial polarisation as the relevant variable in who reaches a service. More than one in three children in Germany has a migrant background, and the proportion in Bremen is higher still. The study exists because comprehensive data on provision and uptake for multilingual children was, and largely remains, inadequate. Read from the published abstract rather than the full text.","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 258 from Germany): private practice 60% and nursery or kindergarten 28%, with respondents placing themselves in private 65%, public health 30% and public education 29%. Direct intervention for the reference child was most often weekly (64% of 252). Asked which factors affect access to services in their country, respondents most often named parental education (67% yes), social position (62% yes) and urban or rural residence (61% yes) (n ≈ 142). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 258 from Germany): state health insurance 77%, government health 15%, government education 13% and government social services 9%. 37% said a maximum number of sessions applied (n = 251). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Germany chapter, Law et al. eds., Buchmann & Kauschke, pp. 235-247","url":"https://doi.org/10.4324/9780429455308-17"},{"label":"COST Action IS140 ply. Published as Gavarró, A. (2017), 'A sentence repetition task for Catalan-speaking children and children with Specific Language Impairment', Frontiers in Psychology, 8:1865. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"ES","name":"Spain","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnhhnhnhnnnnn","filled":["Terminology","Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Trastorno del lenguaje infantil\" (Spanish; roughly \"childhood language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Spain in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","assessments":"A LITMUS sentence repetition (SRep) task exists for Spanish, developed by Silvina Montrul (University of Illinois at Urbana-Champaign) and Begoña Arechabaleta (University of Chicago). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Developed in a US heritage-speaker research context; a separate Catalan task exists for Catalonia. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 134 respondents from Spain who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 46%, in both languages 28% and in the mother tongue where it differs from the mainstream language 25%; intervention in the mainstream language only 55% and in the mother tongue 29% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 39%, in intervention 28% and in counselling 45%. On whether the country offers training for practitioners working with bi/multilingual children (n = 171): optional 37%, none 26% and unsure 32%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 396 from Spain): mainstream school 38%, private practice 32% and private rehabilitation centre 17%, with respondents placing themselves in private 56% and public education 35%. Direct intervention for the reference child was most often twice weekly (58% of 391). Asked which factors affect access to services in their country, respondents most often named cost to parents (

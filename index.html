-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"The 2007 'Strategy for Including Migrant Children and Pupils' defines five migrant sub-groups: former migrants with Slovenian citizenship; non-citizen permit holders; asylum seekers/international-protection beneficiaries; other EU citizens; and children of returning Slovenian emigrant workers.","removalCriteria":"Schools may apply adjusted teaching methods, assessment timing and grading for up to two school years for migrant pupils; pupils may progress a grade despite incomplete marks in all subjects during that window.","newcomerProportion":"2023-11 — 17,348 pupils (~8.9%) — pupils with foreign citizenship/residence out of ~194,000 primary pupils; 57% of migrant pupils classified socio-economically disadvantaged vs. 25% of the general pupil population","l2Support":"Schools organize Slovenian-language classes/courses on enrolment; a dedicated 'Slovenian as a foreign language' subject curriculum exists for upper secondary, plus intensive-course rules. New official 'Guidelines for the Inclusion of Children, Pupils and Upper-Secondary Students from Different Linguistic and Cultural Backgrounds' were published in 2024 by the Ministry of Education, covering pre-primary through secondary.","l1Support":"The state funds, under certain conditions, lessons in pupils' first language (not the instruction language) — Slovenia is noted as one of few European systems that financially supports migrant pupils' mother-tongue classes.","bilingualEducationNotes":"Slovenia has statutory bilingual schools for the Italian- and Hungarian-language national minority areas, a separate legal framework, not migrant-targeted.","policyHistory":"2007 — Strategy to Include Children and Student Migrants adopted.\n2018 — Rules on Slovenian language courses for secondary pupils.\n2024 — New Guidelines for Inclusion of pupils from different linguistic/cultural backgrounds published."},"history":[{"year":"2007","description":"Strategy to Include Children and Student Migrants adopted.","links":[]},{"year":"2018","description":"Rules on Slovenian language courses for secondary pupils.","links":[]},{"year":"2024","description":"New Guidelines for Inclusion of pupils from different linguistic/cultural backgrounds published.","links":[{"label":"Ministry of Education — 2024 Guidelines for Inclusion (PDF)","url":"https://www.gov.si/assets/ministrstva/MVI/Dokumenti/Srednja-sola/Smernice-za-vkljucevanje-otrok-ucencev-in-dijakov-iz-drugih-jezikovnih-in-kulturnih-okolij-v-slovenski-vzgojno-izobrazevalni-sistem.pdf"}]}],"docLinks":[{"label":"Eurydice: Slovenia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/slovenia/support-measures-learners-early-childhood-and-school-education"},{"label":"Ministry of Education — 2024 Guidelines for Inclusion (PDF)","url":"https://www.gov.si/assets/ministrstva/MVI/Dokumenti/Srednja-sola/Smernice-za-vkljucevanje-otrok-ucencev-in-dijakov-iz-drugih-jezikovnih-in-kulturnih-okolij-v-slovenski-vzgojno-izobrazevalni-sistem.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"SB","name":"Solomon Islands","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SO","name":"Somalia","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ZA","name":"South Africa","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KR","name":"South Korea","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SS","name":"South Sudan","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ES","name":"Spain","nat":true,"region":"Europe","subregion":"Southern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhnnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Nationally, 'alumnado de incorporación tardía' (late-incorporation pupils) = pupils enrolling in the Spanish system after the normal start date of their age-appropriate year (LOMLOE, Ley Orgánica 3/2020, amending LOE 2/2006, Título II, Arts. 78-79). Regional (autonomous-community) decrees implement this — e.g. Madrid's Decreto 23/2023, Art. 17-18. Identification is via initial assessment of Spanish proficiency and grade-level academic gap.","removalCriteria":"Not specified nationally; regional rules (e.g. Madrid) describe individualized 'recovery plans' aiming to mainstream pupils into age-appropriate coursework 'as soon as possible,' without a fixed national timeline or test.","newcomerProportion":"2023-2024 — 1,066,875 pupils (12.2%) — foreign-nationality pupils in non-university general education; 14.6% in Primary specifically (16.6% in public schools vs. 10.5% in private/subsidized) — Ministerio de Educación, FP y Deportes advance statistics","l2Support":"LOMLOE Art. 79 requires education authorities to run 'specific programmes' for pupils with serious language deficiencies, run in parallel with (not instead of) mainstream classroom enrolment. Regional implementations include 'aulas de enlace' (link classrooms, e.g. Madrid, from 3rd year of Primary) and language-support services plus interpreting services.","bilingualEducationNotes":"Spain has extensive co-official-language bilingual education, a separate framework not targeted at migrant pupils.","policyHistory":"2006 — LOE (Ley Orgánica 2/2006) Art. 78 establishes the state's duty to promote late-incorporation pupils' schooling.\n2020 — LOMLOE (Ley Orgánica 3/2020) reforms Título II equity provisions.\n2023 — Example of regional implementation: Madrid Decreto 23/2023 (22 March)."},"history":[{"year":"2006","description":"LOE (Ley Orgánica 2/2006) Art. 78 establishes the state's duty to promote late-incorporation pupils' schooling.","links":[]},{"year":"2020","description":"LOMLOE (Ley Orgánica 3/2020) reforms Título II equity provisions.","links":[{"label":"LOMLOE (BOE official text)","url":"https://www.boe.es/buscar/doc.php?id=BOE-A-2020-17264"}]},{"year":"2023","description":"Example of regional implementation: Madrid Decreto 23/2023 (22 March).","links":[{"label":"Comunidad de Madrid — Integración tardía (regional example)","url":"https://www.comunidad.madrid/servicios/educacion/integracion-tardia-sistema-educativo-espanol"}]}],"docLinks":[{"label":"LOMLOE (BOE official text)","url":"https://www.boe.es/buscar/doc.php?id=BOE-A-2020-17264"},{"label":"Comunidad de Madrid — Integración tardía (regional example)","url":"https://www.comunidad.madrid/servicios/educacion/integracion-tardia-sistema-educativo-espanol"},{"label":"Ministry statistics — foreign-pupil figures 2023-24","url":"https://www.lamoncloa.gob.es/serviciosdeprensa/notasprensa/educacion-fp-deportes/Documents/2024/280624-%20Avance%20estad%C3%ADstica%20de%20ense%C3%B1anzas%20no%20universitarias%202023-24.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"LK","name":"Sri Lanka","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SD","name":"Sudan","nat":true,"region":"Africa","subregion":"Northern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SR","name":"Suriname","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CH","name":"Switzerland","nat":true,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-07","coverage":"has","fieldStates":"hhnhhhhh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Switzerland's 26 cantons each administer education independently — this entry reflects only the federal coordinating framework (EDK/CDIP, the Swiss Conference of Cantonal Ministers of Education), not binding cantonal policy; genuine policy and cantonal variation is not captured here. No single Swiss legal 'newcomer' definition; the operative EDK/CDIP category is 'fremdsprachige Kinder' (foreign-language-speaking children), from the 1991 EDK recommendation ('Empfehlungen zur Schulung der fremdsprachigen Kinder', 24 Oct 1991), which established the principle that all foreign-language-speaking children resident in Switzerland be integrated into public schools without discrimination.","removalCriteria":"Not standardized nationally — varies by canton, from short intensive offers (a few weeks-months) to longer offers (1+ years, 1-3 lessons/week), per the EDK's own cantonal survey (Kantonsumfrage B43).","l2Support":"Every canton offers instruction-language support for foreign-language pupils — either supplementary courses alongside regular classes, or separate reception/integration classes ('classes d'accueil,' 'Aufnahmeklassen,' 'Integrationsklassen'). Documented via the EDK's recurring Kantonsumfrage B43 survey.","l1Support":"The EDK's 2004 national language strategy provides for promoting migrant pupils' heritage languages through voluntary 'Unterricht in Heimatlicher Sprache und Kultur' (HSK) courses, typically run by countries of origin, associations, or occasionally cantons/school authorities. First-language competence acquired via HSK can be taken into account in assessment/promotion decisions.","l3Support":"Not migrant-specific; general foreign-language curriculum policy (two foreign languages in primary school, one a national language) applies to all pupils under the same 2004 EDK strategy.","bilingualEducationNotes":"HSK functions as a parallel, largely voluntary/non-integrated heritage-language track rather than an integrated bilingual-education model.","policyHistory":"1991 — EDK 'Empfehlungen zur Schulung der fremdsprachigen Kinder' (24 Oct).\n2004 — EDK national Sprachenstrategie (foreign-language curriculum + HSK promotion)."},"history":[{"year":"1991","description":"EDK 'Empfehlungen zur Schulung der fremdsprachigen Kinder' (24 Oct).","links":[]},{"year":"2004","description":"EDK national Sprachenstrategie (foreign-language curriculum + HSK promotion).","links":[]}],"docLinks":[{"label":"EDK/CDIP — Grundlagentexte (foundational texts)","url":"https://www.edk.ch/dyn/11984.php"},{"label":"EDK/CDIP — Kantonsumfrage B43, Förderangebote für Fremdsprachige","url":"https://www.cdip.ch/de/bildungssystem/kantonale-schulorganisation/kantonsumfrage/b-43-foerderangebote-fremdsprachige"},{"label":"Swiss Federal Statistical Office — Obligatorische Schule statistics","url":"https://www.bfs.admin.ch/bfs/de/home/statistiken/bildung-wissenschaft/personen-ausbildung/obligatorische-schule.html"}],"supportLinks":[],"collaborators":[]},{"cc":"SY","name":"Syria","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TJ","name":"Tajikistan","nat":true,"region":"Asia","subregion":"Central Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TZ","name":"Tanzania","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TH","name":"Thailand","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TL","name":"Timor-Leste","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TG","name":"Togo","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TO","name":"Tonga","nat":true,"region":"Oceania","subregion":"Polynesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TT","name":"Trinidad and Tobago","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TN","name":"Tunisia","nat":true,"region":"Africa","subregion":"Northern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TR","name":"Türkiye","nat":true,"region":"Asia","subregion":"Western Asia","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"MoNE Circular 2014/21 'Education Services for Foreigners' (23 Sept 2014, repealing Circular 2010/48) defines eligible foreign/Syrian students as those holding either a residence permit under Law No. 6458 (Law on Foreigners and International Protection) or a foreigner identification document. This circular established Temporary Education Centers (TECs) in provinces with mass influx. Circular 2025/62 (14 Aug 2025) formalized 'Adaptation Classes' (uyum sınıfı) for newly arrived foreign pupils entering 2nd grade (extended to 3rd grade for 2025/26) to build Turkish proficiency before mainstream placement.","removalCriteria":"Provincial Student Placement/Transfer Commissions assess credentials to transition students from TECs/adaptation classes into standard grade-level schooling. TECs were phased out grade-by-grade from 2016/17 (Syrian children in 1st/5th/9th grades barred from TEC re-enrollment, directed to Turkish public schools; extended to 2nd/6th/10th grades in 2017), with full TEC closure by around 2019-2021.","newcomerProportion":"2020-2021 — 750,350 pupils — Syrian children enrolled (61.81% of the Syrian school-age population), ~94% in public schools\n2025-2026 — 34,945 pupils — foreign students in Adaptation Classes; 19,168 receiving PIKTES Turkish-language instruction; 54,496 receiving PIKTES guidance/counseling across 29 provinces","l2Support":"PIKTES (Promoting Integration of Syrian Kids into the Turkish Education System), EU-funded under the Facility for Refugees in Turkey, implemented by MoNE's General Directorate of Lifelong Learning, launched 2016 (~EUR 300m initial budget). Funds Turkish-language instruction, catch-up/remedial classes, free transport, materials, an exam/guidance system, and training of 15,000+ teachers. A CEFR-aligned 'Turkish Language Teaching Program for Foreigners' underlies Adaptation Classes. PIKTES IV began Feb 2025 (29 provinces, 18 months); the overall project was reported concluded Oct 2025.","l1Support":"Some Arabic-language courses were funded under PIKTES/TECs for Syrian students alongside Turkish, but this was not a systematic mother-tongue-maintenance mandate — more a transitional/heritage element during the TEC period.","bilingualEducationNotes":"TECs historically delivered partly Arabic-medium instruction (adapted Syrian curriculum) before the shift to Turkish public schools; no permanent bilingual public-school track identified post-TEC.","policyHistory":"2013 — Law No. 6458 (Law on Foreigners and International Protection).\n2014 — Circular 2014/21 (23 Sept) establishes Temporary Education Centers and enrollment criteria.\n2016 — PIKTES launched under the EU Facility for Refugees in Turkey.\n2016-2017 — Phased TEC closure by grade begins.\n2025 — PIKTES IV begins (Feb); Circular 2025/62 on Adaptation Classes (14 Aug); PIKTES project reported concluded (Oct)."},"history":[{"year":"2013","description":"Law No. 6458 (Law on Foreigners and International Protection).","links":[]},{"year":"2014","description":"Circular 2014/21 (23 Sept) establishes Temporary Education Centers and enrollment criteria.","links":[{"label":"Circular 2014/21 — Education Services for Foreigners (Turkish legal-aid summary)","url":"https://www.multecihukuku.net/ulusal-mevzuat/yabancilara-yonelik-egitim-ve-ogretim-hizmetleri-genelgesi/"}]},{"year":"2016","description":"PIKTES launched under the EU Facility for Refugees in Turkey.","links":[{"label":"UNHCR Global Compact — PIKTES good practice entry","url":"https://globalcompactrefugees.org/good-practices/promoting-integration-syrian-kids-turkish-education-system-piktes"}]},{"year":"2016-2017","description":"Phased TEC closure by grade begins.","links":[]},{"year":"2025","description":"PIKTES IV begins (Feb); Circular 2025/62 on Adaptation Classes (14 Aug); PIKTES project reported concluded (Oct).","links":[{"label":"UNHCR Global Compact — PIKTES good practice entry","url":"https://globalcompactrefugees.org/good-practices/promoting-integration-syrian-kids-turkish-education-system-piktes"}]}],"docLinks":[{"label":"Circular 2014/21 — Education Services for Foreigners (Turkish legal-aid summary)","url":"https://www.multecihukuku.net/ulusal-mevzuat/yabancilara-yonelik-egitim-ve-ogretim-hizmetleri-genelgesi/"},{"label":"UNHCR Global Compact — PIKTES good practice entry","url":"https://globalcompactrefugees.org/good-practices/promoting-integration-syrian-kids-turkish-education-system-piktes"},{"label":"Eurydice: Türkiye — national reforms in school education","url":"https://eurydice.eacea.ec.europa.eu/eurypedia/turkiye/national-reforms-general-school-education"},{"label":"UNICEF — Report on Analysis for Out-of-School Syrian Children","url":"https://www.unicef.org/turkiye/en/media/18041/file/REPORT%20ON%20ANALYSIS%20FOR%20OUT-OF-SCHOOL%20SYRIAN%20CHILDREN.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"TM","name":"Turkmenistan","nat":true,"region":"Asia","subregion":"Central Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TV","name":"Tuvalu","nat":true,"region":"Oceania","subregion":"Polynesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UG","name":"Uganda","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UA","name":"Ukraine","nat":true,"region":"Europe","subregion":"Eastern Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"AE","name":"United Arab Emirates","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"United States","nat":true,"region":"Americas","subregion":"North America","status":"partial","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"The U.S. has no single national English Learner (EL) policy — states set their own identification, funding, and exit rules. Title VI of the Civil Rights Act, the Equal Educational Opportunities Act (1974), and ESSA Title III require states/districts to identify EL students in a timely manner, but the specific instrument (e.g. home language survey plus screener) is state-determined. See California, Texas, New York, Washington, and Illinois entries for actual state policy.","removalCriteria":"No federal exit test. Districts must provide a 'sound educational program' for ELs under the Castañeda v. Pickard (1981) three-part test, incorporated into federal civil-rights enforcement: (1) based on sound theory, (2) implemented with adequate resources/staff, (3) evaluated and adjusted for effectiveness. ESSA requires states to set a uniform statewide EL exit procedure and monitor former ELs for at least 2 years post-exit.","newcomerProportion":"2021 — 5.3 million (10.6%) — of U.S. public school enrollment, up from 9.4%/4.6M in fall 2011 (NCES, latest published figure)","l2Support":"Federal law does not mandate a specific instructional model or staffing ratio — it requires the Castañeda test be met. ESSA Title III provides supplemental federal grant funding to states/districts for EL language-instruction programs.","l1Support":"Federal law is program-model neutral (bilingual and English-only models are both permissible) as long as the Castañeda test is met — no federal mandate either way.","policyHistory":"1974 — Lau v. Nichols (Supreme Court): schools must take affirmative steps to help LEP/EL students access curriculum.\n1974 — Equal Educational Opportunities Act (EEOA) enacted.\n1981 — Castañeda v. Pickard (5th Cir.) establishes the three-part test for EL program adequacy, still used today.\n2015 — OCR/DOJ joint Dear Colleague Letter on EL students restates Title VI/EEOA obligations.\n2015-2016 — Every Student Succeeds Act (ESSA) reauthorizes Title III, requires statewide uniform EL entrance/exit procedures."},"history":[{"year":"1974","description":"Lau v. Nichols (Supreme Court): schools must take affirmative steps to help LEP/EL students access curriculum.","links":[]},{"year":"1974","description":"Equal Educational Opportunities Act (EEOA) enacted.","links":[]},{"year":"1981","description":"Castañeda v. Pickard (5th Cir.) establishes the three-part test for EL program adequacy, still used today.","links":[]},{"year":"2015","description":"OCR/DOJ joint Dear Colleague Letter on EL students restates Title VI/EEOA obligations.","links":[{"label":"OCR/DOJ Dear Colleague Letter on EL Students (7 Jan 2015)","url":"https://www.ed.gov/about/offices/list/ocr/letters/colleague-el-201501.pdf"}]},{"year":"2015-2016","description":"Every Student Succeeds Act (ESSA) reauthorizes Title III, requires statewide uniform EL entrance/exit procedures.","links":[]}],"docLinks":[{"label":"U.S. Dept. of Education - English Learner Toolkit for State and Local Education Agencies","url":"https://www.ed.gov/teaching-and-administration/lead-and-manage-my-school/state-support-network/ssn-resources/english-learner-toolkit-for-state-and-local-education-agencies-seas-and-leas"},{"label":"OCR/DOJ Dear Colleague Letter on EL Students (7 Jan 2015)","url":"https://www.ed.gov/about/offices/list/ocr/letters/colleague-el-201501.pdf"},{"label":"NCES - English Learners in Public Schools","url":"https://nces.ed.gov/programs/coe/indicator/cgf/english-learners"}],"supportLinks":[],"collaborators":[]},{"cc":"UY","name":"Uruguay","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UZ","name":"Uzbekistan","nat":true,"region":"Asia","subregion":"Central Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VU","name":"Vanuatu","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VA","name":"Vatican City","nat":true,"region":"Europe","subregion":"Southern Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VE","name":"Venezuela","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VN","name":"Vietnam","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"YE","name":"Yemen","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ZM","name":"Zambia","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ZW","name":"Zimbabwe","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GB","name":"England","nat":false,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"An EAL-funded pupil is one whose first language (recorded via the annual schools census) is other than English, and who entered the English state-maintained school system within the last 3 years (tracked via Unique Pupil Number issuance date). This is a funding definition, not a separate legal 'newcomer' status.","removalCriteria":"No proficiency-based exit test — EAL funding eligibility simply lapses automatically 3 years after census-recorded entry, regardless of English proficiency actually reached.","newcomerProportion":"2024-2025 — 21.4% — of pupils had a first language other than English (Jan 2025 census), up from 18.0% in 2015/16; ranges 7.6% (alternative provision) to 30.2% (nursery)","l2Support":"EAL is a compulsory factor in the DfE schools block National Funding Formula: £590/pupil (primary) and £1,585/pupil (secondary) for each of the first 3 years after entry (2024/25 rates, 2.11% uplift applied for 2026-27). This is unringfenced funding added to general school budgets — DfE does not mandate a specific instructional model.","l1Support":"No national policy found on home-language/mother-tongue maintenance instruction — a confirmed gap, not a search miss.","policyHistory":"2023 — National Funding Formula policy document confirms £590/£1,585 EAL rates for 2024-25.\n2026 — Schools block NFF technical note applies a 2.11% uplift to the EAL factor for 2026-27."},"history":[{"year":"2023","description":"National Funding Formula policy document confirms £590/£1,585 EAL rates for 2024-25.","links":[]},{"year":"2026","description":"Schools block NFF technical note applies a 2.11% uplift to the EAL factor for 2026-27.","links":[{"label":"Schools block NFF technical note 2026-27","url":"https://assets.publishing.service.gov.uk/media/6920955d25317fc65a5cfddc/2026-2027_NFF_schools_block_technical_note.pdf"}]}],"docLinks":[{"label":"National funding formula tables 2026 to 2027","url":"https://www.gov.uk/government/publications/national-funding-formula-tables-for-schools-and-high-needs-2026-to-2027"},{"label":"Schools block NFF technical note 2026-27","url":"https://assets.publishing.service.gov.uk/media/6920955d25317fc65a5cfddc/2026-2027_NFF_schools_block_technical_note.pdf"},{"label":"Schools, pupils and their characteristics 2024/25","url":"https://explore-education-statistics.service.gov.uk/find-statistics/school-pupils-and-their-characteristics/2024-25"}],"supportLinks":[],"collaborators":[]},{"cc":"GB","name":"Scotland","nat":false,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"No standalone national EAL definition or test. EAL sits inside the statutory Additional Support for Learning (ASL) framework (Education (Additional Support for Learning) (Scotland) Act 2004); the statutory Code of Practice lists EAL as one example of a circumstance that *may* create an additional support need, but explicitly not an automatic trigger — individualised assessment governs.","removalCriteria":"No formal national exit process — consistent with the framework's individualised, non-categorical approach; support is delivered and withdrawn at local-authority/school discretion.","newcomerProportion":"2024 — 58,153 pupils (8.3%) — of 702,428 total pupils recorded with EAL (Figure 23, Summary Statistics for Schools in Scotland 2024)","l2Support":"No national per-pupil EAL funding formula, unlike England — support is delivered through local-authority-run EAL teams under the general statutory duty to meet additional support needs. Under the national '1+2 languages' policy, EAL pupils' required first additional language (L2) is explicitly set as English, with an 'enhanced role for EAL teaching' built into that framework.","l1Support":"The national '1+2 languages' policy explicitly instructs schools/authorities to develop strategies including pupils' community/home languages as part of language provision for EAL learners.","policyHistory":"2004 — Education (Additional Support for Learning) (Scotland) Act establishes the ASL legal framework EAL sits within.\n2026 — 'Supporting Children's Learning' statutory Code of Practice, 4th edition, includes EAL as an ASL example."},"history":[{"year":"2004","description":"Education (Additional Support for Learning) (Scotland) Act establishes the ASL legal framework EAL sits within.","links":[{"label":"Language learning in Scotland: a 1+2 approach","url":"https://www.gov.scot/publications/language-learning-scotland-12-approach/pages/5/"}]},{"year":"2026","description":"'Supporting Children's Learning' statutory Code of Practice, 4th edition, includes EAL as an ASL example.","links":[{"label":"Supporting Children's Learning: Code of Practice (4th ed.)","url":"https://www.gov.scot/publications/supporting-childrens-learning-code-practice-statutory-guidance-education-additional-support-learning-scotland-act-2004-fourth-edition-2026/pages/2/"}]}],"docLinks":[{"label":"Supporting Children's Learning: Code of Practice (4th ed.)","url":"https://www.gov.scot/publications/supporting-childrens-learning-code-practice-statutory-guidance-education-additional-support-learning-scotland-act-2004-fourth-edition-2026/pages/2/"},{"label":"Summary statistics for schools in Scotland 2024 - Classes and pupils","url":"https://www.gov.scot/publications/summary-statistics-for-schools-in-scotland-2024/pages/classes-and-pupils/"},{"label":"Language learning in Scotland: a 1+2 approach","url":"https://www.gov.scot/publications/language-learning-scotland-12-approach/pages/5/"}],"supportLinks":[],"collaborators":[]},{"cc":"GB","name":"Wales","nat":false,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhnhhnhh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"First-language data has been mandatory in the Pupil Level Annual School Census since January 2012 (Circular 001/2011). Because Welsh/English bilingual provision is already a given nationally, 'English and/or Welsh' is recorded as one combined category — the real purpose of the data is identifying pupils whose first language is neither English nor Welsh.","removalCriteria":"The Five Stage Model of EAL Acquisition (Stages A-E, assessed across Speaking & Listening, Reading, Writing) is the operative progression framework. Stage E ('Fluent') is defined as 'operates without EAL support across the curriculum' — the de facto exit point, based on ongoing teacher assessment rather than a fixed time window (unlike England's 3-year funding cutoff or Northern Ireland's 3-year designation).","l2Support":"The Five Stage Model plus Hwb's language-acquisition-needs-assessment survey toolkit. Historically funded via the Minority Ethnic Achievement Grant (MEAG); MEAG was discontinued in 2017/18 and folded into the broader Education Improvement Grant, which no longer has an EAL-specific ring-fenced per-pupil rate.","l1Support":"Circular 001/2011 explicitly frames first-language data collection as enabling family-language support, interpreting/translation provision, and 'encouraging home language use, and bilingualism in all languages' — though no dedicated mother-tongue instruction programme was found.","bilingualEducationNotes":"Wales runs a genuinely trilingual-in-practice system (Jan 2025 census: 21% of pupils in Welsh-medium schools, 5% dual-language, 74% English-medium). The Five Stage Model is applied in parallel tracks: 'EAL learners in English-medium schools' and 'WAL (Welsh as an Additional Language) learners in Welsh-medium schools' — a pupil whose first language is neither English nor Welsh, attending a Welsh-medium school, is tracked for Welsh acquisition rather than assumed to need English support. Estyn/Hwb materials note initial assessments are rarely conducted in the pupil's actual first language, making it hard to distinguish a language-acquisition need from an underlying additional learning need.","policyHistory":"2011 — Circular 001/2011 'Collecting and recording data on pupils' first language' issued; Review of the Minority Ethnic Achievement Grant also published.\n2012 — First-language reporting becomes mandatory in the Pupil Level Annual School Census.\n2017-2018 — MEAG funding discontinued, folded into the broader Education Improvement Grant.\n2023 — Review of ESOL policy for Wales published (predominantly adult-focused; flags a pre-16 provision gap)."},"history":[{"year":"2011","description":"Circular 001/2011 'Collecting and recording data on pupils' first language' issued; Review of the Minority Ethnic Achievement Grant also published.","links":[{"label":"Circular 001/2011 - Collecting and recording data on pupils' first language","url":"https://www.gov.wales/sites/default/files/publications/2018-03/collecting-and-recording-data-on-pupils-first-language.pdf"},{"label":"Review of the Minority Ethnic Achievement Grant","url":"https://www.gov.wales/review-minority-ethnic-achievement-grant-0"}]},{"year":"2012","description":"First-language reporting becomes mandatory in the Pupil Level Annual School Census.","links":[]},{"year":"2017-2018","description":"MEAG funding discontinued, folded into the broader Education Improvement Grant.","links":[{"label":"Review of the Minority Ethnic Achievement Grant","url":"https://www.gov.wales/review-minority-ethnic-achievement-grant-0"}]},{"year":"2023","description":"Review of ESOL policy for Wales published (predominantly adult-focused; flags a pre-16 provision gap).","links":[{"label":"Review of ESOL policy for Wales (executive summary)","url":"https://www.gov.wales/review-english-speakers-other-languages-esol-policy-wales-executive-summary-html"}]}],"docLinks":[{"label":"Circular 001/2011 - Collecting and recording data on pupils' first language","url":"https://www.gov.wales/sites/default/files/publications/2018-03/collecting-and-recording-data-on-pupils-first-language.pdf"},{"label":"Five Stage Model of EAL Acquisition (Hwb Annex A)","url":"https://hwb.gov.wales/api/storage/cefd3a14-bdf9-4db1-a8de-ed00199173b8/AnnexA5stagemodeloflanguageacquisition.pdf"},{"label":"Review of the Minority Ethnic Achievement Grant","url":"https://www.gov.wales/review-minority-ethnic-achievement-grant-0"},{"label":"Review of ESOL policy for Wales (executive summary)","url":"https://www.gov.wales/review-english-speakers-other-languages-esol-policy-wales-executive-summary-html"}],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"California","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"Home Language Survey at enrollment; if a language other than English is indicated, the student takes the Initial ELPAC (English Language Proficiency Assessments for California) to confirm English Learner status. ELPAC replaced the older CELDT assessment (operational since 2018).","removalCriteria":"State-standardized 4-criteria reclassification: (1) Summative ELPAC Overall Performance Level 4 (or Alternate ELPAC Level 3 for students with significant cognitive disabilities); (2) teacher evaluation including curriculum-mastery review; (3) parent opinion/consultation; (4) comparison of basic-skills performance against English-proficient peers. Reclassification can occur any time in the year once all four are met, per local (LEA) policy.","newcomerProportion":"2023-2024 — 887,077 pupils (~15%) — identified as English Learners; an additional 16% are Reclassified Fluent English Proficient","l2Support":"Governed by the CA English Learner Roadmap (State Board of Education policy adopted 12 July 2017) plus LCFF/LCAP — districts receive supplemental/concentration funding for EL pupils through the Local Control Funding Formula and must detail EL services in their Local Control and Accountability Plans.","l1Support":"The EL Roadmap explicitly promotes multilingualism; the state supports Dual Language Immersion (DLI) programs as an option (not mandatory) under the 'Global California 2030' initiative.","bilingualEducationNotes":"Proposition 58 (2016) restored local flexibility for bilingual education after Proposition 227 (1998) had restricted it to English-immersion.","policyHistory":"1998 — Proposition 227 restricted bilingual education, mandated English immersion.\n2016 — Proposition 58 repealed most Prop 227 restrictions, restored local program choice.\n2017 — State Board of Education adopts the California English Learner Roadmap policy (12 July)."},"history":[{"year":"1998","description":"Proposition 227 restricted bilingual education, mandated English immersion.","links":[]},{"year":"2016","description":"Proposition 58 repealed most Prop 227 restrictions, restored local program choice.","links":[]},{"year":"2017","description":"State Board of Education adopts the California English Learner Roadmap policy (12 July).","links":[{"label":"California English Learner Roadmap","url":"https://www.cde.ca.gov/sp/ml/roadmap.asp"}]}],"docLinks":[{"label":"California English Learner Roadmap","url":"https://www.cde.ca.gov/sp/ml/roadmap.asp"},{"label":"Reclassification (exit criteria) - CDE","url":"https://www.cde.ca.gov/sp/ml/reclassification.asp"},{"label":"Title III, LCAP Addendum Criteria and Guidance","url":"https://www.cde.ca.gov/sp/ml/t3lcapguidance.asp"},{"label":"TK Multilingual Students FAQs","url":"https://www.cde.ca.gov/sp/ml/ab2268faqs.asp"}],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"Texas","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Home language survey at enrollment; a Language Proficiency Assessment Committee (LPAC) reviews and makes identification/placement determinations for 'emergent bilingual' (EB) students, under Texas Education Code §29.051-29.064 and 19 TAC Chapter 89, Subchapter BB.","removalCriteria":"Reclassification requires: TELPAS Advanced High in all four domains (Listening, Speaking, Reading, Writing); a qualifying score on a standardized reading assessment (e.g. STAAR Reading for grades 3-8, STAAR English I/II EOC for grades 9-12); and a subjective teacher evaluation on a state-standardized rubric. Rule changes effective the 2026-27 school year remove the parental-approval requirement (notice only) once criteria are met.","newcomerProportion":"2023-2024 — 1,345,961 pupils (24.3%) — emergent bilingual students, up from 18.8% in 2017-18; ~10% identified as newcomers, 13% dually identified with disabilities","l2Support":"Two statutory program models: Bilingual Education (including transitional bilingual/dual-language options) and ESL, funded through a weighted bilingual/ESL allotment under the Foundation School Program. Ten standardized, TEA-mandated parent-communication letters must be used statewide at each step.","l1Support":"Bilingual education (native-language instruction with transition to English) is a required program option, mandatory once a language group reaches roughly 20 EB students in the same grade at a campus (TEC §29.053).","policyHistory":"2025 — Updated EB-EL Reclassification Criteria Chart issued (February).\n2026 — Rule amendments effective the 2026-27 school year revise ASL identification, parental-notice, and re-enrollment procedures."},"history":[{"year":"2025","description":"Updated EB-EL Reclassification Criteria Chart issued (February).","links":[{"label":"TEA - EB-EL Reclassification Criteria Chart","url":"https://www.txel.org/media/f0elc5oj/reclassification-criteria-chart.pdf"}]},{"year":"2026","description":"Rule amendments effective the 2026-27 school year revise ASL identification, parental-notice, and re-enrollment procedures.","links":[]}],"docLinks":[{"label":"TEA - Bilingual and ESL Education Programs","url":"https://tea.texas.gov/academics/special-student-populations/english-learner-support/bilingual-and-english-as-a-second-language-education-programs"},{"label":"TEA - Changes to Emergent Bilingual Identification and Reclassification Practices","url":"https://tea.texas.gov/taa-letters/changes-emergent-bilingual-identification-and-reclassification-practices"},{"label":"TEA - EB-EL Reclassification Criteria Chart","url":"https://www.txel.org/media/f0elc5oj/reclassification-criteria-chart.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"New York","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Home Language Questionnaire (available in 43 languages) at registration, followed by an individual interview; if a language other than English is indicated, the student takes the NYSITELL placement test, scored into Entering/Emerging/Transitioning/Expanding/Commanding bands. Governed by Commissioner's Regulations Part 154 (amended Fall 2014).","removalCriteria":"Exit via the annual NYSESLAT: scoring Commanding/Proficient exits at any grade. Alternative pathways: grades 3-8 need Expanding/Advanced on NYSESLAT plus a level-3+ score on the state ELA exam the same year; grades 9-12 need Expanding/Advanced plus 65+ on the Regents English exam the same year.","newcomerProportion":"2023-2024 — 10.1% statewide — identified as ELLs; New York City alone ~18% (~148,500 students), with ~44% (~356,000) having a non-English home language","l2Support":"Districts submit a Comprehensive ELL Education Plan under CR Part 154 detailing identification procedures and instructional plan; required minimum units of English as a New Language (ENL) instruction scale to proficiency level.","l1Support":"Bilingual education (Transitional Bilingual Education / Dual Language) is a mandated program option once a district has sufficient concentration of a single home-language group.","policyHistory":"2014 — Board of Regents adopts major amendments to CR Part 154, the current governing framework."},"history":[{"year":"2014","description":"Board of Regents adopts major amendments to CR Part 154, the current governing framework.","links":[{"label":"CR Part 154 / Comprehensive ELL Education Plan (CEEP)","url":"https://www.nysed.gov/bilingual-ed/cr-part-154-comprehensive-ell-education-plan-ceep"}]}],"docLinks":[{"label":"CR Part 154 / Comprehensive ELL Education Plan (CEEP)","url":"https://www.nysed.gov/bilingual-ed/cr-part-154-comprehensive-ell-education-plan-ceep"},{"label":"ELL Identification & Placement / Home Language Questionnaire","url":"https://www.nysed.gov/bilingual-ed/ell-identification-placementhome-language-questionnaire"},{"label":"Former ELL/MLL Services","url":"https://www.nysed.gov/bilingual-ed/former-english-language-learner-and-multilingual-learner-services"}],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"Washington","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Districts use a home-language screening survey followed by the WIDA Screener to determine multilingual-learner (ML) eligibility, under RCW Chapter 28A.180 (the Transitional Bilingual Instruction Act, 1979).","removalCriteria":"Annual WIDA ACCESS assessment. Exit thresholds: overall composite score of 4.0 in grades K-1, 4.7 in grades 2-12. As of the 2024 cycle, an additional pathway exists for grades 3-12: 4.3-4.6 on WIDA ACCESS combined with Level 3/4 on the state ELA assessment. Exited students receive mandatory 2-year post-exit monitoring.","newcomerProportion":"2023-2024 — ~160,000 pupils — served via TBIP; statewide % of total enrollment not confirmed from a single clean source","l2Support":"The Transitional Bilingual Instruction Program (TBIP) is the statewide frame; state funding flows through a per-pupil TBIP formula. Since 2019-20, teachers delivering TBIP instruction must hold a bilingual education and/or ELL endorsement.","l1Support":"TBIP's core design is native-language transitional instruction; OSPI also promotes Dual Language programs statewide alongside the transitional model.","policyHistory":"1979 — Senate Bill 2149 establishes the Transitional Bilingual Instruction Act (RCW 28A.180).\n2019-2020 — New teacher bilingual/ELL endorsement requirement takes effect for TBIP-funded instructors.\n2024 — Expanded WIDA exit pathway added (4.3-4.6 + ELA Level 3/4) for grades 3-12."},"history":[{"year":"1979","description":"Senate Bill 2149 establishes the Transitional Bilingual Instruction Act (RCW 28A.180).","links":[{"label":"RCW Chapter 28A.180 (Transitional Bilingual Instruction Program)","url":"https://app.leg.wa.gov/rcw/default.aspx?cite=28A.180&full=true"},{"label":"Transitional Bilingual Instruction Program Guidance","url":"https://ospi.k12.wa.us/student-success/access-opportunity-education/migrant-and-multilingual-education/multilingual-education-program/transitional-bilingual-instruction-program-guidance"}]},{"year":"2019-2020","description":"New teacher bilingual/ELL endorsement requirement takes effect for TBIP-funded instructors.","links":[]},{"year":"2024","description":"Expanded WIDA exit pathway added (4.3-4.6 + ELA Level 3/4) for grades 3-12.","links":[{"label":"WIDA ACCESS Exit Criteria Standard","url":"https://ospi.k12.wa.us/sites/default/files/2024-01/acs_widaexitcriteria_2022.pdf"}]}],"docLinks":[{"label":"Transitional Bilingual Instruction Program Guidance","url":"https://ospi.k12.wa.us/student-success/access-opportunity-education/migrant-and-multilingual-education/multilingual-education-program/transitional-bilingual-instruction-program-guidance"},{"label":"WIDA ACCESS Exit Criteria Standard","url":"https://ospi.k12.wa.us/sites/default/files/2024-01/acs_widaexitcriteria_2022.pdf"},{"label":"RCW Chapter 28A.180 (Transitional Bilingual Instruction Program)","url":"https://app.leg.wa.gov/rcw/default.aspx?cite=28A.180&full=true"}],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"Illinois","nat":false,"region":"Americas","subregion":"North America","status":"partial","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Every newly enrolling PK-12 student completes a Home Language Survey (23 Ill. Admin. Code Part 228, §228.15); a language other than English triggers formal English-proficiency screening. Statutory basis: Illinois School Code Article 14C (105 ILCS 5/14C).","removalCriteria":"Not independently verified from a directly readable primary source in this pass — the 23 IAC 228 exit-provisions text could not be machine-extracted. Secondary sources indicate exit is based on demonstrating proficiency on a WIDA/ACCESS assessment, reviewed annually; exact score thresholds unconfirmed.","newcomerProportion":"2023-2024 — 16.4% — of total Illinois enrollment, up from 14.6% in 2022-23 (ISBE Illinois Report Card)","l2Support":"105 ILCS 5/14C-3 requires districts to provide Transitional Bilingual Education (TBE) — mandatory once an attendance centre enrolls 20+ EL students of the same language classification — or, below that threshold, a Transitional Program of Instruction (TPI)/ESL alternative. Statewide model mix: TBE ~38%, TPI/ESL ~33%, dual-language ~16% (ISBE data).","l1Support":"TBE is the state's native-language transitional model, statutorily mandated above the 20-student-per-language-group threshold.","policyHistory":"2024 — Identification and Screening of Potential English Learners guidance updated."},"history":[{"year":"2024","description":"Identification and Screening of Potential English Learners guidance updated.","links":[{"label":"Identification and Screening of Potential English Learners","url":"https://www.isbe.net/Documents/Identification-Screening-Potential-EL-Intro.pdf"}]}],"docLinks":[{"label":"ISBE - English Learners / Bilingual Education program page","url":"https://www.isbe.net/Pages/EL-Bilingual-Education.aspx"},{"label":"23 IAC Part 228 (Transitional Bilingual Education regulation text)","url":"https://www.isbe.net/documents/228ark.pdf"},{"label":"Identification and Screening of Potential English Learners","url":"https://www.isbe.net/Documents/Identification-Screening-Potential-EL-Intro.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Ontario","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhnhhhhh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"An English Language Learner (ELL) is a student 'whose first language is a language other than English, or is a variety of English significantly different from that used for instruction in Ontario's schools.' New students undergo initial assessment (language, literacy, numeracy) at a board reception centre.","removalCriteria":"No fixed rule or numeric year-limit (unlike BC/Alberta/Manitoba) — programming is meant to be temporary, phased out once a student reaches proficiency for mainstream instruction, tracked via the STEP (Steps to English Proficiency) framework used by many boards.","l2Support":"ESL courses build proficiency in the language of instruction; ELD (English Literacy Development) courses serve students with limited prior schooling via accelerated literacy programming. Funded through the Grants for Student Needs Language Grant's ESL/ELD Allocation: elementary rate of $3,885 per eligible pupil (2025-26), similarly weighted for secondary.","l1Support":"A separate 'International Languages' program (JK-Grade 8, free, 100+ languages) is explicitly framed to 'maintain and develop' pupils' heritage/home languages alongside new-language acquisition.","l3Support":"The International Languages program doubles as general additional-language provision, open to all students regardless of language background.","bilingualEducationNotes":"No formal newcomer bilingual/reception-class model at provincial policy level (unlike Quebec) — reception happens via board-level reception centres, not a mandated province-wide bilingual program.","policyHistory":"2007 — The Ontario Curriculum, Grades 9-12: ESL and ELD published.\n2014 — Core policy 'English Language Learners/ESL and ELD Programs and Services' updated."},"history":[{"year":"2007","description":"The Ontario Curriculum, Grades 9-12: ESL and ELD published.","links":[{"label":"The Ontario Curriculum, Grades 9-12: ESL and ELD","url":"https://www.edu.gov.on.ca/eng/curriculum/secondary/esl912currb.pdf"}]},{"year":"2014","description":"Core policy 'English Language Learners/ESL and ELD Programs and Services' updated.","links":[{"label":"English Language Learners/ESL and ELD Programs and Services","url":"https://www.edu.gov.on.ca/eng/document/esleldprograms/esleldprograms.pdf"},{"label":"International Languages / learning programs policy","url":"https://www.ontario.ca/document/ontario-schools-kindergarten-grade-12-policy-and-program-requirements/learning-programs"}]}],"docLinks":[{"label":"English Language Learners/ESL and ELD Programs and Services","url":"https://www.edu.gov.on.ca/eng/document/esleldprograms/esleldprograms.pdf"},{"label":"Supporting English Language Learners with Limited Prior Schooling","url":"https://www.edu.gov.on.ca/eng/document/manyroots/ELL_LPS.pdf"},{"label":"The Ontario Curriculum, Grades 9-12: ESL and ELD","url":"https://www.edu.gov.on.ca/eng/curriculum/secondary/esl912currb.pdf"},{"label":"International Languages / learning programs policy","url":"https://www.ontario.ca/document/ontario-schools-kindergarten-grade-12-policy-and-program-requirements/learning-programs"}],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"British Columbia","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhnnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Requires an annual assessment showing the student's English is 'sufficiently different from the academic English of B.C. schools' that specialised services are needed to access curriculum; documented via Form 1701. Also covers Canadian-born/English-speaking-background students needing academic English support (English Skills Development).","removalCriteria":"Funding/support eligibility caps at 5 years total (non-consecutive) per student, or earlier if the student no longer meets the annual proficiency criteria. An Annual Instructional Plan tracks progress reported to parents each period.","newcomerProportion":"2022-2023 — ~76,091 pupils (~11.2%) — of ~679,281 total K-12 enrollment; up 6,886 over the prior year (approximate, aggregated from BC Ministry demographic data)","l2Support":"Districts are funded per FTE ELL student per the current year's Operating Grant Manual; governed by the English Language Learning Policy Guidelines (issued 2002, revised effective July 2011) and separate ELL Standards (2001) describing developmental stages.","bilingualEducationNotes":"No dedicated newcomer bilingual/reception-class model identified at provincial policy level; support is integrated/pull-out ELL service within regular classrooms.","policyHistory":"2001 — ELL Standards published.\n2011 — Policy Guidelines revised, effective July 2011."},"history":[{"year":"2001","description":"ELL Standards published.","links":[{"label":"English Language Learning Standards (2001)","url":"https://www2.gov.bc.ca/assets/gov/education/administration/kindergarten-to-grade-12/english-language-learners/standards.pdf"}]},{"year":"2011","description":"Policy Guidelines revised, effective July 2011.","links":[]}],"docLinks":[{"label":"English Language Learners Policy Guidelines","url":"https://www2.gov.bc.ca/assets/gov/education/administration/kindergarten-to-grade-12/english-language-learners/guidelines.pdf"},{"label":"English Language Learning Standards (2001)","url":"https://www2.gov.bc.ca/assets/gov/education/administration/kindergarten-to-grade-12/english-language-learners/standards.pdf"},{"label":"K-12 Funding - English Language Learning (ELL)","url":"https://www2.gov.bc.ca/gov/content/education-training/k-12/administration/legislation-policy/public-schools/k-12-funding-english-language-learning-ell"}],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Alberta","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhnhnnnh","filled":["Newcomer criteria","Removal criteria","L2 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Mandatory intake assessment at school start or arrival, using the Alberta K-12 EAL Proficiency Benchmarks (Benchmarks 2.0, building on the original Benchmarks 1.0 from 2010); assesses listening/speaking/reading/writing across 5 proficiency levels. Annual re-assessment required.","removalCriteria":"EAL coding must be removed once a student reaches grade-level communicative competence and no longer needs EAL programming, per ongoing benchmark assessment. Funding eligibility is capped at a maximum of 5 years following initial assessment.","l2Support":"The provincial Funding Manual for School Authorities allocates the EAL grant based on a weighted moving average of assessed EAL student counts, within the 'Services and Supports' funding category. The 2023/24 manual formally renamed ESL to EAL to align with Benchmarks terminology.","policyHistory":"2010 — Alberta K-12 ESL Proficiency Benchmarks ('Benchmarks 1.0') released.\n2023 — Funding Manual formally replaces ESL terminology with EAL, aligned to Benchmarks 2.0 (2023/24 school year)."},"history":[{"year":"2010","description":"Alberta K-12 ESL Proficiency Benchmarks ('Benchmarks 1.0') released.","links":[{"label":"EAL Benchmarks 2.0","url":"https://curriculum.learnalberta.ca/cdn/resources/m/documents/eslapb/EAL_Benchmarks_2_0.pdf"},{"label":"K-12 Education Funding Framework overview","url":"https://www.alberta.ca/k-12-education-funding-framework"}]},{"year":"2023","description":"Funding Manual formally replaces ESL terminology with EAL, aligned to Benchmarks 2.0 (2023/24 school year).","links":[{"label":"EAL Benchmarks 2.0","url":"https://curriculum.learnalberta.ca/cdn/resources/m/documents/eslapb/EAL_Benchmarks_2_0.pdf"}]}],"docLinks":[{"label":"EAL Benchmarks 2.0","url":"https://curriculum.learnalberta.ca/cdn/resources/m/documents/eslapb/EAL_Benchmarks_2_0.pdf"},{"label":"K-12 Education Funding Framework overview","url":"https://www.alberta.ca/k-12-education-funding-framework"},{"label":"EAL Assessment Supports","url":"https://education.alberta.ca/english-as-an-additional-language-k-12/assessment-supports/"}],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Manitoba","nat":false,"region":"Americas","subregion":"North America","status":"partial","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhnhnnhh","filled":["Newcomer criteria","Removal criteria","L2 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Manitoba uses additive 'EAL' terminology and distinguishes LAL (Literacy, Academics and Language) for newcomer students with disrupted or limited prior schooling. Identification runs through a dedicated EAL Intake Process (separate protocols for Early/Middle/Senior Years) explicitly described as preliminary, not diagnostic; interpreter access is required.","removalCriteria":"Not clearly specified in the sources located in this pass — the EAL Support Grant guidelines document could not be text-extracted.","l2Support":"Governed by the Manitoba K-12 Curriculum Framework for EAL and LAL Programming (2021), funded via an EAL Support Grant tied to limited-English-proficiency status and receipt of EAL curriculum/services (reported as of the September 30 enrolment count each year).","bilingualEducationNotes":"The LAL stream is Manitoba's closest analog to a specialised reception programme for newcomers with interrupted schooling, integrated within regular EAL programming rather than run as a separate bilingual school model.","policyHistory":"2021 — K-12 EAL/LAL Curriculum Framework released (Early/Middle/Senior Years components)."},"history":[{"year":"2021","description":"K-12 EAL/LAL Curriculum Framework released (Early/Middle/Senior Years components).","links":[{"label":"EAL/LAL Curriculum Framework hub","url":"https://www.edu.gov.mb.ca/k12/cur/eal/curriculum.html"}]}],"docLinks":[{"label":"EAL/LAL Curriculum Framework hub","url":"https://www.edu.gov.mb.ca/k12/cur/eal/curriculum.html"},{"label":"EAL Support Grant Guidelines","url":"https://www.edu.gov.mb.ca/k12/docs/support/eal_sup_grant/guidelines.pdf"},{"label":"EAL Intake Process - Early Years","url":"https://www.edu.gov.mb.ca/k12/cur/eal/docs/eal_intake_ey2.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Nova Scotia","nat":false,"region":"Americas","subregion":"North America","status":"partial","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hnnhhhhh","filled":["Newcomer criteria","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"EAL is defined as study of English by learners who speak at least one other language or come from a home where another language is used. Every arriving EAL student is connected with a 'navigator' on arrival.","l2Support":"Governed by the original 'Guidelines for English as a Second Language (ESL) Programming and Services' (2003) and the newer EAL and FAL Strategy Framework (2021), which grew out of a 2019 EAL/FAL Advisory Working Group consultation and is aligned with the province's Inclusive Education Policy and Multi-Tiered System of Supports. Virtual translation/interpretation services have been expanded to support rural EAL students.","l1Support":"The 2003 ESL Guidelines are described as building on the EAL student's first language and culture to support positive self-image (not independently confirmed via direct text extraction).","l3Support":"Nova Scotia has a distinct French as an Additional Language (FAL) framework alongside EAL, relevant to allophone newcomers entering Francophone or French Immersion programs.","bilingualEducationNotes":"Francophone Immersion programs are noted as serving both Francophone newcomers and allophone newcomers alongside EAL provision.","policyHistory":"2003 — Guidelines for English as a Second Language (ESL) Programming and Services published.\n2019 — EAL/FAL Advisory Working Group consultations begin.\n2021 — EAL and FAL Strategy Framework released, integrated with Inclusive Education Policy / MTSS."},"history":[{"year":"2003","description":"Guidelines for English as a Second Language (ESL) Programming and Services published.","links":[{"label":"Guidelines for English as a Second Language (ESL) Programming and Services (2003)","url":"https://studentservices.ednet.ns.ca/sites/default/files/esl_guidelines_web.pdf"}]},{"year":"2019","description":"EAL/FAL Advisory Working Group consultations begin.","links":[]},{"year":"2021","description":"EAL and FAL Strategy Framework released, integrated with Inclusive Education Policy / MTSS.","links":[{"label":"EAL and FAL Strategy Framework (2021)","url":"https://curriculum.novascotia.ca/sites/default/files/documents/resource-files/EAL%20and%20FAL%20Strategy%20Framework%20(2021).pdf"}]}],"docLinks":[{"label":"Guidelines for English as a Second Language (ESL) Programming and Services (2003)","url":"https://studentservices.ednet.ns.ca/sites/default/files/esl_guidelines_web.pdf"},{"label":"EAL and FAL Strategy Framework (2021)","url":"https://curriculum.novascotia.ca/sites/default/files/documents/resource-files/EAL%20and%20FAL%20Strategy%20Framework%20(2021).pdf"},{"label":"Languages policy (Nova Scotia Public School Program)","url":"https://www.ednet.ns.ca/psp/equity-inclusive-education/culturally-responsive-pedagogy/languages"}],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Quebec","nat":false,"region":"Americas","subregion":"North America","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Newly arrived allophone students go through a structured welcome protocol: enrollment, an initial interview to build a student profile, French/maths assessment, and formal reception ('accueil'), governed by the Régime pédagogique and annual ministerial instructions.","removalCriteria":"Not explicitly detailed as a fixed rule — students move from the more intensive SASAF service to the lighter SLAF service (for students who can already partly follow French-medium instruction) as proficiency allows, a locally-determined transition rather than a numeric threshold.","newcomerProportion":"2015 — ~15% — of Quebec students had a third language (neither French nor English) as mother tongue, more than tripled since 1971 (most recent figure located; a live statistical dashboard exists but was not queried for a current-year number)","l2Support":"Core services are SASAF (services d'accueil et de soutien à l'apprentissage du français, more intensive reception/French-learning support) and SLAF (services de soutien linguistique d'appoint en francisation, lighter supplementary support), under the ILSS Program (Intégration Linguistique, Scolaire et Sociale). Funding is delivered via annual ministry allocations to school service centres.","l1Support":"Explicit mother-tongue/heritage-language services exist: 'services de soutien scolaire dans la langue maternelle ou d'usage' (academic support in the home language) and separate 'services d'enseignement des langues d'origine' (heritage-language instruction), both named in the ministry's financial-support framework.","bilingualEducationNotes":"'Classes d'accueil' (welcome classes) are Quebec's signature reception-class model, dating to 1969 and generalised province-wide after the 1977 Charter of the French Language (Bill 101) required immigrant children to attend French-language schools.","policyHistory":"1969 — Quebec's first classes d'accueil created at the Montreal Catholic School Commission.\n1977 — Charter of the French Language (Bill 101, 26 August) requires immigrant children to attend French-language schools, generalising welcome classes province-wide.\n2024-2025 — Annual ministerial instruction and 'Guide de soutien au milieu scolaire' updated."},"history":[{"year":"1969","description":"Quebec's first classes d'accueil created at the Montreal Catholic School Commission.","links":[]},{"year":"1977","description":"Charter of the French Language (Bill 101, 26 August) requires immigrant children to attend French-language schools, generalising welcome classes province-wide.","links":[]},{"year":"2024-2025","description":"Annual ministerial instruction and 'Guide de soutien au milieu scolaire' updated.","links":[{"label":"Guide de soutien au milieu scolaire 2024-2025","url":"https://cdn-contenu.quebec.ca/cdn-contenu/education/integration-education-interculturelle/Guide-soutien-milieu-scolaire.pdf"}]}],"docLinks":[{"label":"Ministry financial support (SASAF/SLAF, heritage-language services)","url":"https://www.education.gouv.qc.ca/enseignants/aide-et-soutien/immigration-et-education-interculturelle/soutien-financier/"},{"label":"Accueil et intégration hub (quebec.ca)","url":"https://www.quebec.ca/education/prescolaire-primaire-et-secondaire/ressources-outils-reseau-scolaire/accueil-integration-education-interculturelle/accueil-integration"},{"label":"Guide de soutien au milieu scolaire 2024-2025","url":"https://cdn-contenu.quebec.ca/cdn-contenu/education/integration-education-interculturelle/Guide-soutien-milieu-scolaire.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"New South Wales","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"EAL/D status is identified via the mandatory EAL/D Learning Progression (4 phases: Beginning, Emerging, Developing, Consolidating), recorded and updated at least twice yearly. The separate New Arrivals Program (NAP) has its own eligibility test: non-English first language, Beginning/Emerging proficiency, enrolled in an Australian school within 6 months of arrival (18 months for Kindergarten), and citizen/PR/eligible-visa status.","removalCriteria":"No single fixed exit rule for general EAL/D status — tied to progression through the Learning Progression phases. One specific dated rule: the bilingual SLSO refugee allocation is limited to the student's first four terms of enrolment.","newcomerProportion":"2024-2025 — ~24% — of NSW public school students are EAL/D learners (CESE data)\n2023 — 8,185 new-arrival students — speaking 133 languages","l2Support":"New Arrivals Program (intensive on-arrival English tuition via extra staffing) plus an English Language Proficiency (ELP) equity loading, funded through the Resource Allocation Model.","l1Support":"Two parallel programs: the in-school-hours Community Languages Program K-6, and the after-hours Community Languages Schools Program (60+ languages, ~36,000 students statewide).","bilingualEducationNotes":"Bilingual School Learning Support Officers (SLSOs) provide classroom support and family liaison/interpreting; the refugee-background allocation is capped at the student's first 4 terms.","policyHistory":"2005 — Multicultural Education Policy (PD-2005-0234) implemented.\n2024 — Major policy revision (9 May).\n2025 — 'Advice on using the EAL/D Learning Progressions' reissued."},"history":[{"year":"2005","description":"Multicultural Education Policy (PD-2005-0234) implemented.","links":[{"label":"Multicultural Education Policy PD-2005-0234","url":"https://education.nsw.gov.au/policy-library/policies/pd-2005-0234"}]},{"year":"2024","description":"Major policy revision (9 May).","links":[]},{"year":"2025","description":"'Advice on using the EAL/D Learning Progressions' reissued.","links":[]}],"docLinks":[{"label":"New Arrivals Program","url":"https://education.nsw.gov.au/teaching-and-learning/multicultural-education/english-as-an-additional-language-or-dialect/new-arrivals-program"},{"label":"NAP Operational Guidelines","url":"https://education.nsw.gov.au/content/dam/main-education/teaching-and-learning/curriculum/multicultural-education/eald/NAP-Operational-Guidelines.pdf"},{"label":"Multicultural Education Policy PD-2005-0234","url":"https://education.nsw.gov.au/policy-library/policies/pd-2005-0234"},{"label":"Bilingual support","url":"https://education.nsw.gov.au/teaching-and-learning/multicultural-education/refugee-students-in-schools/whole-school-response/teaching-and-learning/bilingual-support"}],"supportLinks":[],"collaborators":[]},{"cc":"AU","name":"Victoria","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhhhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"The LBOTE (Language Background Other Than English) Census, collected every August, feeds the EAL Index used for identification and funding.","removalCriteria":"No fixed proficiency threshold or time-limit is published for general EAL Index eligibility. The Department is transitioning from 'EAL 1.0' to 'EAL 2.0', mandated for full implementation from 2027, which is likely to change eligibility/exit rules. Separately, the Newly Arrived Students program runs 6-12 months (up to 4 terms via the Virtual New Arrivals Program for rural schools).","newcomerProportion":"2023 — ~14% — of Victorian government school students are EAL learners\n2023 — 8,020 newly-arrived EAL students — enrolled (EAL Annual Report 2023)","l2Support":"EAL Index funding is delivered via the Student Resource Package; principals must preferentially staff EAL positions with TESOL-qualified teachers. A separate EAL Provision for Newly Arrived Students policy funds intensive/targeted newcomer support plus contingency funding for mid-year enrolment spikes.","l1Support":"Not documented as a dedicated home-language-maintenance instruction program — Multicultural Education Aides (MEAs) facilitate family communication in-language, but this isn't framed as L1 curriculum support. A confirmed gap.","l3Support":"A general Languages Education policy (not EAL/D-specific) requires all government schools to run a language program F-10, minimum 150 minutes/week.","bilingualEducationNotes":"Multicultural Education Aides are funded alongside EAL specialist teachers in roughly 500 government schools per year.","policyHistory":"2015 — EAL Handbook published (updated 2019).\n2020 — EAL Provision for Newly Arrived Students policy dated from January, last updated August 2024.\n2027 — EAL 2.0 full implementation mandated."},"history":[{"year":"2015","description":"EAL Handbook published (updated 2019).","links":[]},{"year":"2020","description":"EAL Provision for Newly Arrived Students policy dated from January, last updated August 2024.","links":[{"label":"EAL Provision for Newly Arrived Students - Policy","url":"https://www2.education.vic.gov.au/pal/eal-provision/print-all"}]},{"year":"2027","description":"EAL 2.0 full implementation mandated.","links":[]}],"docLinks":[{"label":"English as an Additional Language (EAL) - schools.vic.gov.au","url":"https://www.schools.vic.gov.au/eal"},{"label":"EAL Provision for Newly Arrived Students - Policy","url":"

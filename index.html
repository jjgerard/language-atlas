<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Language Provision Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">

<style>
/* ---------------------------------------------------------------
   Palette: the muted inks of a printed thematic atlas plate.
   Region hue carries WHICH part of the world; fill state carries
   WHETHER anything is documented. Two variables, never conflated.
   --------------------------------------------------------------- */
:root {
  --ground:      #E4E9EE;   /* sea — a cool paper, biased toward the lapis accent */
  --ground-deep: #D6DDE4;
  --surface:     #FBFCFD;
  --surface-2:   #F1F4F7;
  --ink:         #101820;
  --ink-soft:    #5B6771;
  --ink-faint:   #8A959F;
  --hair:        #C3CDD6;
  --hair-strong: #9DAAB6;
  --focus:       #3F5BA9;

  --nodata:      #C4CDD5;   /* nothing recorded */
  --hatch-bg:    #CFD7DE;   /* looked, found nothing */
  --hatch-line:  #8E9BA7;

  --r-africa:   #C2703D;
  --r-americas: #2E8B7A;
  --r-asia:     #93548F;
  --r-europe:   #3F5BA9;
  --r-oceania:  #B5455F;

  --shadow: 0 1px 2px rgba(16,24,32,.08), 0 8px 24px -8px rgba(16,24,32,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0D1319;
    --ground-deep: #080C11;
    --surface:     #161F27;
    --surface-2:   #1D2831;
    --ink:         #E7EEF4;
    --ink-soft:    #97A6B2;
    --ink-faint:   #6B7A87;
    --hair:        #2A3640;
    --hair-strong: #3E4E5A;
    --focus:       #8AA3E8;

    --nodata:      #2B3742;
    --hatch-bg:    #2B3742;
    --hatch-line:  #566673;

    --r-africa:   #E0925C;
    --r-americas: #4DBBA4;
    --r-asia:     #C07ABB;
    --r-europe:   #7E9AE8;
    --r-oceania:  #E4738C;

    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:      #0D1319;
  --ground-deep: #080C11;
  --surface:     #161F27;
  --surface-2:   #1D2831;
  --ink:         #E7EEF4;
  --ink-soft:    #97A6B2;
  --ink-faint:   #6B7A87;
  --hair:        #2A3640;
  --hair-strong: #3E4E5A;
  --focus:       #8AA3E8;

  --nodata:      #2B3742;
  --hatch-bg:    #2B3742;
  --hatch-line:  #566673;

  --r-africa:   #E0925C;
  --r-americas: #4DBBA4;
  --r-asia:     #C07ABB;
  --r-europe:   #7E9AE8;
  --r-oceania:  #E4738C;

  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px -10px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: Archivo, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

.eyebrow {
  font-size: 10.5px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
}

/* ---------------- shell ---------------- */
.app { display: flex; flex-direction: column; height: 100dvh; }

header.bar {
  display: flex; align-items: center; gap: 20px;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--hair);
  flex-wrap: wrap;
  z-index: 5;
}
.wordmark { display: flex; align-items: baseline; gap: 10px; margin-right: 4px; }
.wordmark h1 {
  font-family: Newsreader, Georgia, serif;
  font-size: 20px; font-weight: 500; letter-spacing: -.01em;
  margin: 0; white-space: nowrap;
}
.wordmark .tag {
  font-size: 11px; color: var(--ink-faint); white-space: nowrap;
}

nav.domains {
  display: flex; gap: 2px; flex-wrap: nowrap; min-width: 0;
  overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
}
nav.domains::-webkit-scrollbar { display: none; }
nav.domains button {
  font: inherit; font-size: 13px; font-weight: 500; flex: none;
  padding: 6px 12px; border-radius: 3px;
  border: 1px solid transparent; background: none; color: var(--ink-soft);
  cursor: pointer; white-space: nowrap;
}
nav.domains button:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
nav.domains button[aria-current="true"] {
  background: var(--ink); color: var(--surface); border-color: var(--ink);
}
nav.domains button:disabled { color: var(--ink-faint); cursor: not-allowed; opacity: .65; }
nav.domains button:disabled::after {
  content: "planned"; margin-left: 7px; font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; border: 1px solid var(--hair-strong);
  border-radius: 2px; padding: 1px 4px; vertical-align: 1px;
}

.searchwrap { position: relative; margin-left: auto; }
.searchwrap input {
  font: inherit; font-size: 13px;
  width: 210px; padding: 7px 10px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hair); border-radius: 3px;
}
.searchwrap input::placeholder { color: var(--ink-faint); }
.results {
  position: absolute; top: calc(100% + 6px); right: 0; width: 280px;
  max-height: 340px; overflow-y: auto; z-index: 40;
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 4px; box-shadow: var(--shadow); padding: 4px;
}
.results:empty { display: none; }
.results button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: 13px; text-align: left;
  padding: 6px 8px; border: 0; border-radius: 3px;
  background: none; color: var(--ink); cursor: pointer;
}
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results .sub { color: var(--ink-faint); font-size: 11.5px; margin-left: auto; }

/* ---------------- map ---------------- */
/* The panel parks off-screen via a transform, which still counts toward the
   scrollable area — clip it here so the page itself never scrolls. */
.stage { position: relative; flex: 1; min-height: 0; background: var(--ground); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }

.unit { stroke: var(--ground-deep); stroke-width: .5px; vector-effect: non-scaling-stroke; }
.unit.hit { cursor: pointer; }
.unit.base { pointer-events: none; }
/* Inherited: same fill as the country it follows, with its border kept as a
   hairline so you can still see there is something clickable there. */
.unit.inherited { stroke: var(--surface); stroke-width: .75px; stroke-dasharray: 3 2.5; opacity: .96; }
.dot.inherited { stroke-dasharray: 2 2; }
.unit.sel { stroke: var(--ink); stroke-width: 2px; }
.unit.hov { stroke: var(--ink); stroke-width: 1.5px; }
.dot { stroke: var(--ground-deep); stroke-width: 1px; vector-effect: non-scaling-stroke; cursor: pointer; }
.dot.sel, .dot.hov { stroke: var(--ink); stroke-width: 2px; }
.leader { stroke: var(--hair-strong); stroke-width: .75px; vector-effect: non-scaling-stroke; fill: none; }

/* floating panels over the map */
.overlay {
  position: absolute; background: var(--surface);
  border: 1px solid var(--hair); border-radius: 4px;
  box-shadow: var(--shadow);
}
.controls { top: 14px; left: 14px; width: 252px; padding: 13px 14px 14px; }
.controls h2 { font: inherit; font-size: 11px; margin: 0 0 7px; }
.controls select {
  font: inherit; font-size: 13px; width: 100%;
  padding: 7px 8px; border-radius: 3px;
  border: 1px solid var(--hair); background: var(--surface-2); color: var(--ink);
}
.blurb { font-size: 12px; color: var(--ink-soft); margin: 10px 0 0; }

.tally { display: flex; gap: 3px; margin-top: 13px; }
.tally .seg { height: 7px; border-radius: 1px; }
.tallylabels {
  display: flex; justify-content: space-between; margin-top: 6px;
  font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums;
}

.legend { bottom: 14px; left: 14px; padding: 12px 14px 13px; width: 252px; }
.legend h2 { font: inherit; font-size: 11px; margin: 0 0 9px; }
.legend .row { display: flex; align-items: center; gap: 9px; font-size: 12px; margin-bottom: 6px; }
.legend .row:last-child { margin-bottom: 0; }
.legend .sw { width: 22px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.legend .note { font-size: 11px; color: var(--ink-faint); margin: 10px 0 0; line-height: 1.45; }
.legend .hues { display: flex; gap: 3px; margin-top: 11px; }
.legend .hues span { flex: 1; height: 7px; border-radius: 1px; }
.legend .hueslabels {
  display: flex; gap: 3px; margin-top: 5px;
  font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em;
}
.legend .hueslabels span { flex: 1; text-align: center; }

.zoomctl { bottom: 14px; right: 14px; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.zoomctl button {
  font: inherit; font-size: 17px; line-height: 1;
  width: 34px; height: 34px; border: 0; background: var(--surface);
  color: var(--ink); cursor: pointer;
}
.zoomctl button + button { border-top: 1px solid var(--hair); }
.zoomctl button:hover { background: var(--surface-2); }
.zoomctl .reset { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

/* tooltip */
.tip {
  position: absolute; z-index: 30; pointer-events: none;
  max-width: 280px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--hair-strong);
  border-radius: 4px; box-shadow: var(--shadow);
  opacity: 0; transition: opacity .09s;
}
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
.tip.on { opacity: 1; }
.tip .name { font-weight: 600; font-size: 13.5px; }
.tip .meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
.tip .state { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-top: 7px; }
.tip .state .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.tip .inherit {
  font-size: 11px; color: var(--ink-soft); margin-top: 7px;
  padding-top: 7px; border-top: 1px solid var(--hair);
}
.tip .hintline { font-size: 10.5px; color: var(--ink-faint); margin-top: 8px; }

/* field checklist — the point of the hover is "what is and isn't here" */
.fieldgrid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair);
}
.fieldgrid span {
  font-size: 11px; line-height: 1.5; color: var(--ink-faint);
  display: flex; align-items: center; gap: 6px;
}
.fieldgrid span::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  border: 1px solid var(--hair-strong); background: transparent;
}
.fieldgrid span.on { color: var(--ink); }
.fieldgrid span.on::before { background: var(--mark, var(--r-europe)); border-color: var(--mark, var(--r-europe)); }
.fieldgrid span.looked { color: var(--ink-soft); }
.fieldgrid span.looked::before { background: var(--hatch-line); border-color: var(--hatch-line); opacity: .55; }

/* full entry in the panel */
.field { padding: 11px 0; border-bottom: 1px solid var(--hair); }
.field:last-child { border-bottom: 0; }
.field h4 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 5px; display: flex; align-items: center; gap: 7px;
}
.field h4::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  border: 1px solid var(--hair-strong);
}
.field.on h4 { color: var(--ink-soft); }
.field.on h4::before { background: var(--mark, var(--r-europe)); border-color: var(--mark, var(--r-europe)); }
.field.looked h4::before { background: var(--hatch-line); border-color: var(--hatch-line); opacity: .55; }
.field p {
  margin: 0; font-size: 13.5px; line-height: 1.58; white-space: pre-line;
  overflow-wrap: break-word;
}
.field.empty p, .field.looked p { color: var(--ink-faint); font-style: italic; }
.field.inh h4::before { background: transparent; border-style: dashed; border-color: var(--hair-strong); }
.field.inh p { color: var(--ink-soft); }
.field h4 .from {
  margin-left: auto; letter-spacing: .04em; text-transform: none;
  font-weight: 500; font-size: 10px; color: var(--ink-faint); font-style: italic;
}

a.cite {
  color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus);
}
a.cite:hover { color: var(--focus); text-decoration-style: solid; }

/* policy history reads as a dated list, each row carrying its document */
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.hist li { display: grid; grid-template-columns: 58px 1fr; gap: 11px; align-items: start; }
.hist .yr {
  font-variant-numeric: tabular-nums; font-size: 11.5px; font-weight: 600;
  color: var(--ink-faint); padding-top: 2px; letter-spacing: .01em;
}
.hist p { margin: 0; }
.hist .links { margin-top: 5px; gap: 4px; }
.hist .links a { font-size: 12px; }

.links { display: flex; flex-direction: column; gap: 7px; }
.links a {
  font-size: 12.5px; line-height: 1.4; color: var(--focus);
  text-decoration: none; overflow-wrap: anywhere;
}
.links a:hover { text-decoration: underline; }
.links a { position: relative; padding-left: 15px; }
.links a::before {
  content: ""; position: absolute; left: 1px; top: .48em;
  width: 5px; height: 5px; opacity: .55;
  border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor;
  transform: rotate(45deg);
}
.viaterr {
  font-size: 11.5px; color: var(--ink-soft); line-height: 1.5;
  background: var(--surface-2); border-left: 2px solid var(--hair-strong);
  padding: 9px 11px; border-radius: 0 3px 3px 0; margin: 13px 0 0;
}

/* detail panel */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 380px;
  background: var(--surface); border-left: 1px solid var(--hair);
  box-shadow: var(--shadow); overflow-y: auto; z-index: 20;
  transform: translateX(100%); transition: transform .18s ease;
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.panel.on { transform: none; }
.panel .inner { padding: 18px 20px 40px; }
.panel .close {
  position: sticky; top: 0; float: right; margin: -4px -6px 0 0;
  font: inherit; font-size: 20px; line-height: 1;
  width: 30px; height: 30px; border: 0; border-radius: 3px;
  background: var(--surface); color: var(--ink-soft); cursor: pointer;
}
.panel .close:hover { background: var(--surface-2); color: var(--ink); }
.panel h2 {
  font-family: Newsreader, Georgia, serif; font-weight: 500;
  font-size: 25px; line-height: 1.18; margin: 6px 0 3px;
  text-wrap: balance; letter-spacing: -.01em;
}
.panel .where { font-size: 12.5px; color: var(--ink-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 13px 0 0; }
.chip {
  font-size: 11px; padding: 3px 8px; border-radius: 2px;
  border: 1px solid var(--hair-strong); color: var(--ink-soft);
}
.chip.solid { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip.hatched {
  background-image: repeating-linear-gradient(45deg,
    transparent 0 3px, var(--hatch-line) 3px 4px);
  background-color: var(--hatch-bg); color: var(--ink);
  border-color: var(--hair-strong);
}

.sect { margin-top: 22px; }
.sect > h3 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 9px; padding-bottom: 6px; border-bottom: 1px solid var(--hair);
}
.kv { display: grid; grid-template-columns: 108px 1fr; gap: 5px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink-faint); }
.kv dd { margin: 0; }
.excerpt {
  font-family: Newsreader, Georgia, serif; font-size: 14.5px; line-height: 1.55;
  color: var(--ink); margin: 0;
}
.excerpt .lbl {
  display: block; font-family: Archivo, sans-serif; font-size: 10.5px;
  font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 5px;
}
.sibs { display: flex; flex-direction: column; gap: 1px; }
.sibs button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  font: inherit; font-size: 12.5px; text-align: left;
  padding: 7px 8px; margin-left: -8px; border: 0; border-radius: 3px;
  background: none; color: var(--ink); cursor: pointer;
}
.sibs button:hover { background: var(--surface-2); }
.sibs button[disabled] { cursor: default; background: var(--surface-2); }
.sibs .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.sibs .role { margin-left: auto; font-size: 10.5px; color: var(--ink-faint); }
.cross { display: flex; flex-direction: column; gap: 1px; }
.cross .r { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 5px 0; }
.cross .r .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.cross .r .n { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.caveat {
  font-size: 11.5px; color: var(--ink-soft); line-height: 1.5;
  background: var(--surface-2); border-left: 2px solid var(--hair-strong);
  padding: 9px 11px; border-radius: 0 3px 3px 0; margin: 0;
}

/* ---------------- mobile ---------------- */
@media (max-width: 820px) {
  header.bar { gap: 10px; padding: 9px 12px; }
  .wordmark h1 { font-size: 17px; }
  .wordmark .tag { display: none; }
  .searchwrap { margin-left: 0; width: 100%; order: 3; }
  .searchwrap input { width: 100%; padding: 10px; }
  .results { width: 100%; }
  nav.domains { order: 2; width: 100%; padding-bottom: 2px; }
  nav.domains button { padding: 9px 13px; }

  /* The map keeps the whole viewport it is given; the legend and the domain
     summary sit below it in normal flow instead of floating over it. */
  .stage { display: flex; flex-direction: column; }
  #map { flex: 1 1 auto; min-height: 0; }

  .controls, .legend {
    position: static; width: auto; flex: none;
    border-radius: 0; border-left: 0; border-right: 0; box-shadow: none;
  }
  .controls { order: 2; border-top: 1px solid var(--hair); border-bottom: 0; padding: 10px 14px 0; }
  .controls .blurb { display: none; }
  .controls h2 { margin-bottom: 4px; }
  .legend { order: 3; padding: 10px 14px 12px; }
  .legend h2 { display: none; }
  .legend .rows { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .legend .row { margin-bottom: 0; font-size: 11.5px; }
  .legend .hues, .legend .hueslabels, .legend .note { display: none; }

  .zoomctl { display: none; }
  .tip { display: none; }

  .panel {
    top: auto; left: 0; width: auto; height: 74dvh;
    border-left: 0; border-top: 1px solid var(--hair);
    border-radius: 10px 10px 0 0; transform: translateY(100%);
  }
  .panel.on { transform: none; }
  .panel .inner { padding: 16px 16px 40px; }
  .hist li { grid-template-columns: 50px 1fr; gap: 9px; }
}

</style>

<div class="app">
  <header class="bar">
    <div class="wordmark">
      <h1>Language Provision Atlas</h1>
      <span class="tag">prototype · seed data</span>
    </div>
    <nav class="domains" id="domains" aria-label="Domain"></nav>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Find a country or region" autocomplete="off" aria-label="Find a country or region">
      <div class="results" id="results" role="listbox"></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <svg id="map" role="img" aria-label="World map of documentation coverage"></svg>

    <div class="overlay controls">
      <h2 class="eyebrow" id="domainName"></h2>
      <p class="blurb" id="blurb"></p>
      <div class="tally" id="tally"></div>
      <div class="tallylabels" id="tallylabels"></div>
    </div>

    <div class="overlay legend">
      <h2 class="eyebrow">Fill</h2>
      <div class="rows">
        <div class="row"><span class="sw" id="sw-has"></span> Documented</div>
        <div class="row"><span class="sw" id="sw-looked"></span> Looked, found nothing</div>
        <div class="row"><span class="sw" id="sw-none"></span> Nothing recorded</div>
        <div class="row"><span class="sw" id="sw-inh"></span> Follows its country</div>
      </div>
      <div class="hues" id="hues"></div>
      <div class="hueslabels">
        <span>Africa</span><span>Americas</span><span>Asia</span><span>Europe</span><span>Oceania</span>
      </div>
      <p class="note">Hue is the world region, so neighbours stay apart. It carries no judgement about the policy.</p>
    </div>

    <div class="overlay zoomctl">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zreset" class="reset" title="Reset view" aria-label="Reset view">Fit</button>
    </div>

    <div class="tip" id="tip" aria-hidden="true"></div>

    <aside class="panel" id="panel" aria-label="Unit detail" tabindex="-1"></aside>

ge of seven.","removalCriteria":"4 years after 'newly arrived' designation.","newcomerProportion":"2025 — 25 — no elaboration yet on trend over time","l2Support":"Special conditions for newly arrived pupils; preparation class; more Swedish in the curriculum; focus on certain subjects to enter gymnasium (upper secondary school).","l1Support":"Mother tongue study guide.","bilingualEducationNotes":"Bilingual education (Swedish/Finnish; Swedish/Arabic); trilingual education (Montessori school: Swedish/English/French); international schools.","policyHistory":"1970-1980 — Two new subjects in the Swedish school: Swedish as a second language, and Mother tongue (when the mother tongue is another language than Swedish).\n2011 — Different curricula for Swedish and Swedish as a second language.\n2018 — New concept: newly arrived pupils — a newly arrived pupil is a child who has been living abroad and starts education in Sweden later than the age of seven. After four years of school the pupil is no longer regarded as newly arrived."},"history":[{"year":"1970-1980","description":"Two new subjects in the Swedish school: Swedish as a second language, and Mother tongue (when the mother tongue is another language than Swedish).","links":[]},{"year":"2011","description":"Different curricula for Swedish and Swedish as a second language.","links":[]},{"year":"2018","description":"New concept: newly arrived pupils — a newly arrived pupil is a child who has been living abroad and starts education in Sweden later than the age of seven. After four years of school the pupil is no longer regarded as newly arrived.","links":[]}],"docLinks":[],"supportLinks":[],"collaborators":["Natalia Ringblom","Gisela Håkansson"]},{"cc":"AU","name":"South Australia","nat":false,"region":"Oceania","subregion":"Australia and New Zealand","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhnhhn","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L3 support","Bilingual education"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"EAL/D students are those whose first language is a language or dialect other than English and who require additional support to develop proficiency in Standard Australian English (SAE). May include First Nations Australian learners, immigrants and temporary visa holders, students of refugee background, Australian-born children of migrant heritage where English isn't spoken at home, English-speaking returnees from non-English settings, children of Deaf adults using Auslan, and international students.","removalCriteria":"When proficient in Standard Australian English, assessed via the LEAP (Learning English: Achievement and Proficiency) levels tool.","newcomerProportion":"30% LBOTE / 25% English L2 / 12% — three overlapping measures as reported; reference period unspecified","l2Support":"Three funding models: Intensive New Arrivals English Program (12-18 months, class size ≤14, 100% funded; geographically isolated students receive centrally-delivered remote teaching); EAL/D mainstream support (gap funding model weighted to greatest need); Aboriginal EAL/D learners in 10 APY-land schools have their own dedicated funding model.","l3Support":"Foreign languages offered in mainstream but limited to Chinese, Japanese, Indonesian, German, French and some South Asian languages.","bilingualEducationNotes":"Bilingual education for Aboriginal students in the APY lands. 2 bilingual schools in metropolitan South Australia (Chinese/English, French/English — the latter only existing for ~6 years). 10 Anangu schools in the APY lands teach Pitjantjatjara/Yankunytjatjara/English."},"history":[],"docLinks":[{"label":"EAL/D funding for schools","url":"https://www.education.sa.gov.au/schools-and-educators/curriculum-and-teaching/curriculum-programs/english-additional-language-or-dialect-program"},{"label":"How long it takes to learn English while learning the curriculum","url":"https://www.edresearch.edu.au/research/research-reports/how-long-it-takes-learn-english-while-learning-curriculum"},{"label":"EAL/D Learning Progression (ACARA)","url":"https://docs.acara.edu.au/resources/EALD_Learning_Progression.pdf"}],"supportLinks":[],"collaborators":["Rose Nyaramba"]},{"cc":"BE","name":"Belgium — French Community (Wallonia-Brussels Federation)","nat":false,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"official-document","lastVerified":"2021","coverage":"has","fieldStates":"nnnhhnnh","filled":["L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"l2Support":"Separate model: DASPA (Dispositif d'Accueil et de Scolarisation des élèves Primo-Arrivants et Assimilés) 'bridge class' with dedicated French-as-a-learning-language (FLA) teaching for 1 week to 1 year where a school has 8+ newly arrived students; otherwise direct integration into mainstream class with FLA support. Teacher support provided via CPD.","l1Support":"No dedicated mother-tongue instruction found at top-level policy. The Openness to Languages and Cultures (OLC) circular allows volunteer schools to host teachers from partner countries to teach the language/culture of origin — not specific to newly arrived migrant students.","policyHistory":"2007 — Circular no. 1841 on the language and culture of origin.\n2009 — Decree organising a differentiated framework for equal opportunities for social emancipation.\n2017 — Decree establishing socio-economic index variables for schools.\n2019 — Decree on reception, schooling and support of pupils who do not master the language of instruction (DASPA).\n2020 — Circular no. 7522 on openness to languages and cultures."},"history":[{"year":"2007","description":"Circular no. 1841 on the language and culture of origin.","links":[]},{"year":"2009","description":"Decree organising a differentiated framework for equal opportunities for social emancipa AL teaching supports via the Department of Education's teacher-allocation system. A 2024 inspectorate report found effective schools use CEFR-aligned assessment, whole-school structures, and target-setting.","l1Support":"Schools encouraged to 'use every opportunity to respect the children's native languages and encourage continued development of these languages, where possible' (NCCA, 2005) — explicitly not a commitment to teach all mother tongues in mainstream provision (DES & OPMI, 2010).","policyHistory":"2009 — Circular 15/2009 (legacy) - meeting the needs of pupils learning English as an additional language.\n2024 — Inspectorate report 'Meeting Additional Language Needs' - whole-school and classroom approaches.\n2026 — Guidelines for applying for EAL supports for Criteria A (New Entrants), 2026/27 school year."},"history":[{"year":"2009","description":"Circular 15/2009 (legacy) - meeting the needs of pupils learning English as an additional language.","links":[{"label":"Circular 15/2009 - Meeting the needs of pupils learning English as an additional language","url":"https://circulars.gov.ie/pdf/circular/education/2009/15.pdf"}]},{"year":"2024","description":"Inspectorate report 'Meeting Additional Language Needs' - whole-school and classroom approaches.","links":[{"label":"Meeting Additional Language Needs: Whole-school and Classroom Approaches (2024)","url":"https://oide.ie/wp-content/uploads/2023/09/Meeting-Additional-Language-Needs-Whole-school-and-Classroom-Approaches-for-Inclusive-Language-Learning.pdf"}]},{"year":"2026","description":"Guidelines for applying for EAL supports for Criteria A (New Entrants), 2026/27 school year.","links":[{"label":"Guidelines for applying for EAL supports for Criteria A - New Entrants (2026/27)","url":"https://www.gov.ie/en/department-of-education/guidelines-for-applying-for-eal-supports-for-criteria-a-new-entrants-for-the-202627-school-year/"}]}],"docLinks":[{"label":"Intercultural Education Strategy 2010-2015","url":"https://www.education.ie/en/Schools-Colleges/Information/Intercultural-Education-Strategy/mig_intercultural_education_strategy.pdf"},{"label":"The Migration Integration Strategy: A Blueprint for the Future (2017)","url":"http://www.justice.ie/en/JELR/Migrant_Integration_Strategy_English.pdf/Files/Migrant_Integration_Strategy_English.pdf"},{"label":"OECD Reviews of Migrant Education: Ireland (2009)","url":"https://www.oecd.org/ireland/44344245.pdf"},{"label":"Guidelines for applying for EAL supports for Criteria A - New Entrants (2026/27)","url":"https://www.gov.ie/en/department-of-education/guidelines-for-applying-for-eal-supports-for-criteria-a-new-entrants-for-the-202627-school-year/"},{"label":"Allocation of teachers to schools","url":"https://www.gov.ie/en/department-of-education/services/allocation-of-teachers-to-schools/"},{"label":"Meeting Additional Language Needs: Whole-school and Classroom Approaches (2024)","url":"https://oide.ie/wp-content/uploads/2023/09/Meeting-Additional-Language-Needs-Whole-school-and-Classroom-Approaches-for-Inclusive-Language-Learning.pdf"},{"label":"Circular 15/2009 - Meeting the needs of pupils learning English as an additional language","url":"https://circulars.gov.ie/pdf/circular/education/2009/15.pdf"}],"supportLinks":[],"collaborators":["Amalee Meehan"]},{"cc":"MT","name":"Malta","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"official-document","lastVerified":"2021","coverage":"has","fieldStates":"hnnhnhnh","filled":["Newcomer criteria","L2 support","L3 support","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"NAMS identified as a specific category at top-level policy (Eurydice, 2019, p.54); managed centrally through the Migrant Learners Unit.","l2Support":"Both separate and integrated models depending on the school; centralised induction via the Migrant Learners Unit; all textbooks free to all students; psychosocial services and material support for disadvantaged students centrally provided (Ministry for Education and Employment, 2019).","l3Support":"Training for cultural mediation (University of Malta, 2020).","policyHistory":"2012 — National Curriculum Framework for All — 'Diversity' as an underlying principle.\n2019 — National Policy of Teaching Maltese as a Foreign Language.\n2020 — Training for cultural mediation introduced (University of Malta)."},"history":[{"year":"2012","description":"National Curriculum Framework for All — 'Diversity' as an underlying principle.","links":[]},{"year":"2019","description":"National Policy of Teaching Maltese as a Foreign Language.","links":[{"label":"National Policy of Teaching Maltese as a Foreign Language (2019)","url":"https://meae.gov.mt/en/Public_Consultations/MEDE/Documents/EN%20National%20Policy.pdf"}]},{"year":"2020","description":"Training for cultural mediation introduced (University of Malta).","links":[]}],"docLinks":[{"label":"Migrant Learners Unit","url":"https://migrantlearnersunit.gov.mt/en/Pages/Education%20System/Education-system.aspx"},{"label":"National Policy of Teaching Maltese as a Foreign Language (2019)","url":"https://meae.gov.mt/en/Public_Consultations/MEDE/Documents/EN%20National%20Policy.pdf"}],"supportLinks":[],"collaborators":["Glorianne Borg-Axisa"]},{"cc":"NO","name":"Norway","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"official-document","lastVerified":"2021","coverage":"has","fieldStates":"hhnhhnnh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"NAMS identified as a specific category at top-level policy (Eurydice, 2019, p.54). The Education Act allows municipalities to choose among special introductory schools, introductory classes, or second-language lessons parallel to ordinary classes.","removalCriteria":"Pupils are entitled to adapted/second-language instruction 'until they are sufficiently proficient in Norwegian to follow the normal instruction of the school' (Education Act §2-8) — no fixed time limit at top level; decentralised to municipalities.","l2Support":"Second-language learning responsibility is decentralised to municipalities; access to CPD and extra resources for teachers varies by municipality/region (Båtevik et al., 2017, 2019).","l1Support":"Pupils with a mother tongue other than Norwegian/Sami are entitled to mother-tongue instruction and/or bilingual subject teaching if necessary to acquire the language of instruction (Education Act §2-8) — in practice interpreted as a bridge to Norwegian rather than sustained bilingual education (Båtevik et al., 2017).","policyHistory":"1998 — Education Act §2-8 — right to adapted Norwegian instruction and, if necessary, mother-tongue/bilingual subject teaching.\n2016 — National teacher-training curriculum requires a 15-ECTS module in multicultural and multi-religious competence.\n2019 — Core curriculum revision strengthens intercultural awareness as part of citizenship development."},"history":[{"year":"1998","description":"Education Act §2-8 — right to adapted Norwegian instruction and, if necessary, mother-tongue/bilingual subject teaching.","links":[{"label":"Education Act (Lov om grunnskolen og den videregående skolen), §2-8","url":"https://lovdata.no/dokument/NLE/lov/1998-07-17-61"}]},{"year":"2016","description":"National teacher-training curriculum requires a 15-ECTS module in multicultural and multi-religious competence.","links":[]},{"year":"2019","description":"Core curriculum revision strengthens intercultural awareness as part of citizenship development.","links":[{"label":"Core curriculum — values and principles for primary and secondary education (2019)","url":"https://www.regjeringen.no/en/dokumenter/verdier-og-prinsipper-for-grunnopplaringen---overordnet-del-av-lareplanverket/id2570003/"}]}],"docLinks":[{"label":"Education Act (Lov om grunnskolen og den videregående skolen), §2-8","url":"https://lovdata.no/dokument/NLE/lov/1998-07-17-61"},{"label":"Core curriculum — values and principles for primary and secondary education (2019)","url":"https://www.regjeringen.no/en/dokumenter/verdier-og-prinsipper-for-grunnopplaringen---overordnet-del-av-lareplanverket/id2570003/"}],"supportLinks":[],"collaborators":["Øystein Lund Johannessen"]},{"cc":"PT","name":"Portugal","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"official-document","lastVerified":"2021","coverage":"has","fieldStates":"hnnhnnnh","filled":["Newcomer criteria","L2 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Immigration to Portugal is comparatively recent (since the turn of the millennium); NAMS comprise the large majority of children with a migrant background attending school (Baganha, Marques & Góis, 2009).","l2Support":"'Portuguese as a Non-Native Language' — a dedicated programme taught in parallel with mainstream Portuguese lessons, blending integrated and separate models (Ministry of Education, 2018a, 2018b). Educational Territories Programme for Priority Intervention allocates extra teachers/resources to schools with high numbers of foreign students — the only one of the Meehan et al. (2021) countries offering NAMS-targeted academic support via quotas/grants.","policyHistory":"2005 — Portuguese as a non-native language introduced into the national curriculum.\n2012 — Educational Territories Programme for Priority Intervention (Normative Order No. 20/2012).\n2015 — Strategic Plan for Migration 2015-2020 (High Commission for Migration).\n2017 — Network of Schools for Intercultural Education; Intercultural School Seal."},"history":[{"year":"2005","description":"Portuguese as a non-native language introduced into the national curriculum.","links":[{"label":"Portuguese as a non-native language in the national curriculum (2005)","url":"https://www.dge.mec.pt/sites/default/files/Basico/Documentos/plnmdoc_orientador.pdf"}]},{"year":"2012","description":"Educational Territories Programme for Priority Intervention (Normative Order No. 20/2012).","links":[{"label":"Educational Territories for Priority Intervention (Normative Order 20/2012)","url":"https://www.dge.mec.pt/sites/default/files/EPIPSE/despacho_normativo_20_2012.pdf"}]},{"year":"2015","description":"Strategic Plan for Migration 2015-2020 (High Commission for Migration).","links":[{"label":"Strategic Plan for Migration 2015-2020","url":"https://www.acm.gov.pt/documents/10181/222357/PEM_ACM_final.pdf/9ffb3799-7389-4820-83ba-6dcfe22c13fb"}]},{"year":"2017","description":"Network of Schools for Intercultural Education; Intercultural School Seal.","links":[]}],"docLinks":[{"label":"Portuguese as a non-native language in the national curriculum (2005)","url":"https://www.dge.mec.pt/sites/default/files/Basico/Documentos/plnmdoc_orientador.pdf"},{"label":"Educational Territories for Priority Intervention (Normative Order 20/2012)","url":"https://www.dge.mec.pt/sites/default/files/EPIPSE/despacho_normativo_20_2012.pdf"},{"label":"Strategic Plan for Migration 2015-2020","url":"https://www.acm.gov.pt/documents/10181/222357/PEM_ACM_final.pdf/9ffb3799-7389-4820-83ba-6dcfe22c13fb"}],"supportLinks":[],"collaborators":["Silvia de Almeida","Barbara Bäckström"]},{"cc":"RO","name":"Romania","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"official-document","lastVerified":"2021","coverage":"has","fieldStates":"hnnhhnhh","filled":["Newcomer criteria","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":1,"supports":0,"values":{"newcomerCriteria":"Romania is the only one of the six Meehan et al. (2021) countries with net emigration rather than immigration; NAMS are overwhelmingly Romanian-speaking returnees, so top-level NAMS-specific policy is minimal (Anghel et al., 2016).","l2Support":"Protected minors have legal access to language courses (OUG 194/2002, OUG 44/2004), but with very few non-Romanian-speaking NAMS, little top-level support for teaching the language of instruction exists in practice.","l1Support":"Not applicable to NAMS specifically, but Romania is the only one of the six Meehan et al. (2021) countries to provide free public education in a foreign language for its historic Hungarian (6%) and German (1%) national minorities, legally protected from primary through tertiary education (National Education Law, 2011).","bilingualEducationNotes":"Free public-system education through Hungarian and German for national minorities — not NAMS-specific.","policyHistory":"2002 — Government Emergency Order (OUG) 194/2002 on the regime for foreigners in Romania.\n2004 — OUG 44/2004 on social inclusion of foreigners with international protection.\n2006 — Law on asylum in Romania.\n2011 — National Education Law — mother-tongue education rights for Hungarian/German minorities."},"history":[{"year":"2002","description":"Government Emergency Order (OUG) 194/2002 on the regime for foreigners in Romania.","links":[{"label":"OUG 194/2002 on the regime for foreigners (Romanian National Education Law is cited by the source paper without a stable URL)","url":"http://igi.mai.gov.ro/en/content/legislation"}]},{"year":"2004","description":"OUG 44/2004 on social inclusion of foreigners with international protection.","links":[]},{"year":"2006","description":"Law on asylum in Romania.","links":[]},{"year":"2011","description":"National Education Law — mother-tongue education rights for Hungarian/German minorities.","links":[]}],"docLinks":[{"label":"OUG 194/2002 on the regime for foreigners (Romanian National Education Law is cited by the source paper without a stable URL)","url":"http://igi.mai.gov.ro/en/content/legislation"}],"supportLinks":[],"collaborators":["Monica Roman"]},{"cc":"AF","name":"Afghanistan","nat":true,"region":"Asia","subregion":"Southern Asia","st  all pupils spoke a language other than German at home (Statistik Austria)","l2Support":"Deutschförderklassen/-kurse system (§ 8h Schulorganisationsgesetz, introduced for school year 2018/19), partially integrated, age-differentiated, time-limited German instruction; plus mandatory half-day kindergarten attendance since 2010 for early German language stimulation, and standardized pre-school German testing.","l1Support":"'Muttersprachlicher Unterricht' (mother-tongue instruction) — offered as an ungraded free elective (compulsory school) or graded elective (upper secondary/VET), in ~26 languages; open to all pupils with a first language other than German regardless of citizenship, length of residence, or German proficiency (BMBWF circular Rundschreiben 1997/38).","bilingualEducationNotes":"No dedicated bilingual-education-for-migrants program beyond the mother-tongue-instruction elective track, which runs alongside rather than integrated with mainstream subject teaching.","policyHistory":"1986 — SchUG (BGBl. 472/1986) establishes the 'außerordentlicher Schüler' category.\n2010 — Mandatory half-day kindergarten introduced for children with German language deficits.\n2018 — Deutschförderklassen/-kurse system introduced via § 8h SchOG amendment, from school year 2018/19."},"history":[{"year":"1986","description":"SchUG (BGBl. 472/1986) establishes the 'außerordentlicher Schüler' category.","links":[{"label":"SchUG § 4 (RIS, consolidated federal law)","url":"https://ris.bka.gv.at/eli/bgbl/1986/472/P4/NOR40203764"}]},{"year":"2010","description":"Mandatory half-day kindergarten introduced for children with German language deficits.","links":[]},{"year":"2018","description":"Deutschförderklassen/-kurse system introduced via § 8h SchOG amendment, from school year 2018/19.","links":[]}],"docLinks":[{"label":"SchUG § 4 (RIS, consolidated federal law)","url":"https://ris.bka.gv.at/eli/bgbl/1986/472/P4/NOR40203764"},{"label":"BMBWF — Deutschförderklassen und Deutschförderkurse" me":"Botswana","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BR","name":"Brazil","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BN","name":"Brunei","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BG","name":"Bulgaria","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhnhhnhh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Target groups defined in law/ordinance: children of migrants, children of third-country nationals under international protection, children of EU/EEA/Swiss citizens, and children/pupils from ethnic minorities whose mother tongue is not Bulgarian. No single formal 'newcomer' test found; eligibility for free Bulgarian-language support is triggered by native language differing from Bulgarian.","removalCriteria":"Not clearly specified in primary sources found; secondary sources describe Bulgarian-as-additional-language support as generally available for around 12 months, but no primary-law removal timeline was located.","l2Support":"Free Bulgarian language training for migrant/EU-EEA children, arranged at parent/guardian's request, delivered individually or in groups depending on need, residence, age, and health; curricula/materials approved by the Ministry of Education and Science. Differentiated: integrated individual-form instruction for grades I-VII, and preparatory classes for pupils with no Bulgarian at all (Ordinance No. 3 of 19 June 2009).","l1Support":"Mother-tongue and home-culture instruction available at parental request, organized at the pupil's school or another venue arranged via the diplomatic representation of the country of origin (Pre-school and School Education Act, in force since 1 August 2016), which also states that pupils whose native language is not Bulgarian have the right to study it.","bilingualEducationNotes":"No integrated bilingual-education model for migrants found — support is parallel/supplementary, not a bilingual instruction track. Ethnic-minority integration handled separately via the 2004 Strategy for Educational Integration of Children and Pupils of Ethnic Minorities.","policyHistory":"2004 — Strategy for Educational Integration of Children and Pupils of Ethnic Minorities (2005-2015) approved.\n2009 — Ordinance No. 3 (19 June) on free Bulgarian-language instruction for migrant/EU children.\n2016 — Pre-school and School Education Act enters into force (1 Aug); Ordinance on Inclusive Education (Council of Ministers Decree No. 286) follows (4 Nov)."},"history":[{"year":"2004","description":"Strategy for Educational Integration of Children and Pupils of Ethnic Minorities (2005-2015) approved.","links":[]},{"year":"2009","description":"Ordinance No. 3 (19 June) on free Bulgarian-language instruction for migrant/EU children.","links":[]},{"year":"2016","description":"Pre-school and School Education Act enters into force (1 Aug); Ordinance on Inclusive Education (Council of Ministers Decree No. 286) follows (4 Nov).","links":[{"label":"Pre-school and School Education Act (full text PDF)","url":"https://www.navet.government.bg/bg/media/ZAKON-ZA-PREDUCHILISHTNOTO-I-UCHILISHTNOTO-OBRAZOVANIE.pdf"}]}],"docLinks":[{"label":"Pre-school and School Education Act (full text PDF)","url":"https://www.navet.government.bg/bg/media/ZAKON-ZA-PREDUCHILISHTNOTO-I-UCHILISHTNOTO-OBRAZOVANIE.pdf"},{"label":"Eurydice: Bulgaria — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/bulgaria/support-measures-learners-early-childhood-and-school-education"}],"supportLinks":[],"collaborators":[]},{"cc":"BF","name":"Burkina Faso","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"BI","name":"Burundi","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KH","name":"Cambodia","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CM","name":"Cameroon","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CA","name":"Canada","nat":true,"region":"Americas

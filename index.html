ylum seekers/foreigners under international protection, family members of EU citizens, national minority members, and foreigners with (permanent) residence rights. Identification via enrolment documentation, decisions from competent authorities, and pedagogical-psychological assessment by the school's professional service.","l2Support":"'Preparatory' or 'supplementary' classes organized for pupils with insufficient Croatian, framed as mandatory for effective integration for the eligible groups above. Legal basis for access: 2008 Ordinance on asylum seekers and protected persons, guaranteeing primary-education access on the same terms as Croatian citizens, 'with the possibility of organising additional classes and adjustments.'","l1Support":"Not clearly documented for migrant pupils specifically; minority-language mother-tongue instruction exists structurally but is framed around national minorities rather than migrants.","bilingualEducationNotes":"Three long-standing minority-education models: Model A (full instruction in minority language, Croatian mandatory as a subject), Model B (bilingual instruction), Model C (Croatian-medium instruction with supplementary minority-language lessons). A Roma-specific Model C curriculum was adopted. These are minority- rather than migrant-oriented programs.","policyHistory":"2008 — Ordinance on asylum seekers' and protected persons' educational access.\n2015 — Ordinance on primary/secondary education for pupils with developmental difficulties."},"history":[{"year":"2008","description":"Ordinance on asylum seekers' and protected persons' educational access.","links":[]},{"year":"2015","description":"Ordinance on primary/secondary education for pupils with developmental difficulties.","links":[{"label":"Primary/secondary education act (zakon.hr)","url":"https://www.zakon.hr/z/317/zakon-o-odgoju-i-obrazovanju-u-osnovnoj-i-srednjoj-skoli"}]}],"docLinks":[{"label":"Eurydice: Croatia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/croatia/support-measures-learners-early-childhood-and-school-education"},{"label":"Primary/secondary education act (zakon.hr)","url":"https://www.zakon.hr/z/317/zakon-o-odgoju-i-obrazovanju-u-osnovnoj-i-srednjoj-skoli"}],"supportLinks":[],"collaborators":[]},{"cc":"CU","name":"Cuba","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CY","name":"Cyprus","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-07","coverage":"has","fieldStates":"hnhhnnhn","filled":["Newcomer criteria","Newcomer proportion","L2 support","Bilingual education"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Framed around 'bilingual children' including children of returnees, foreigners, and migrant workers. No formal legal definition/threshold located; identification appears to occur via placement testing rather than a codified newcomer status.","newcomerProportion":"2021-2022 — 9,616 pupils — migrant pupils in elementary schools (8,144 with a mother tongue other than Greek) — figure from web-search synthesis, not independently verified against a primary MOEC statistical table; treat with caution","l2Support":"'Parallel classes' for intensive/fast Greek-language acquisition; placement tests used to rank and assign pupils to appropriate language classes; in-service teacher training for Greek-as-a-second/foreign-language delivered via the Pedagogical Institute; schools with significant numbers of immigrant pupils can be designated 'Educational Priority Zones' for additional resources.","bilingualEducationNotes":"Intercultural elements integrated into curricula/textbooks; educational materials produced for pupils whose home language is not Greek; an induction guide for foreign pupils and parents exists in eight languages."},"history":[],"docLinks":[{"label":"Eurydice: Cyprus — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/cyprus/support-measures-learners-early-childhood-and-school-education"},{"label":"Cyprus Ministry of Education, Sport and Youth","url":"https://www.moec.gov.cy/"}],"supportLinks":[],"collaborators":[]},{"cc":"CZ","name":"Czechia","nat":true,"region":"Europe","subregion":"Central Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhhhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Defined via foreigner status under Czech law (non-Czech citizen, including EU citizens) combined with insufficient Czech proficiency. Operationalized through a 3-level support framework: Level 1 (advanced Czech, no formal recommendation needed), Level 2 (insufficient Czech — 3 hrs/week, up to 120 hrs), Level 3 (no Czech — up to 200 hrs instruction + 2 hrs/week special pedagogical care).","removalCriteria":"Eligibility for free language preparation is capped by prior time in the Czech education system: max. 24 months of prior Czech schooling for basic-education eligibility; for upper-secondary, residence in Czechia under 36 months (narrowed to under 12 months from 2024/25 for temporary-protection holders specifically). From September 2025, eligibility extended to Czech citizens with foreigner-equivalent integration needs.","newcomerProportion":"2023-03 — 51,281 pupils — Ukrainian refugee pupils enrolled (2.8% of total school population; 3.9% at basic schools)\n2025-09 — 11,579 pupils — in 1,762 language-training groups in basic education (MŠMT data)","l2Support":"Legal basis § 20, Education Act (561/2004 Sb.). Pre-primary: mandatory language-training groups when 4+ foreign children need them (max. 8, 1 hr/week). Basic education: free preparation at designated schools (5%+ foreign pupils), groups of 2-8/2-10, 100-400 hours over max. 20 months. Upper secondary (since 2022/23): groups of 5-15, 100-400 hours over max. 30 months. Implementing decrees: No. 48/2005 Sb. and No. 14/2005 Sb.","l1Support":"Regional authority, in cooperation with the pupil's country of origin, is to support study of the pupil's own mother tongue and culture 'if possible' — a limited/aspirational provision for EU-national children, not a robust program.","l3Support":"From 1 September 2023, schools may substitute a second foreign language with additional Czech-as-a-second-language instruction where in the pupil's best interest, at the school leader's discretion.","bilingualEducationNotes":"Polish-language minority schools operate in Silesia (22 nursery, 20 basic, 1 upper-secondary school in 2025/26); bilingual Czech/minority-language subject teaching permitted where minimum pupil thresholds are met — minority-language provision, not migrant-specific.","policyHistory":"2004 — Education Act (561/2004 Sb.) establishes the individual educational needs principle and § 20 basis.\n2022 — 'Lex Ukrajina' package: Acts No. 65-67/2022 on temporary protection, employment/social security, and educational measures for Ukrainian refugees; language-training system extended to upper secondary.\n2023 — Amendment (1 Sept) allows Czech-as-second-language to substitute for a second foreign language.\n2025 — Eligibility for free language preparation extended to Czech citizens with foreigner-equivalent needs (Sept)."},"history":[{"year":"2004","description":"Education Act (561/2004 Sb.) establishes the individual educational needs principle and § 20 basis.","links":[]},{"year":"2022","description":"'Lex Ukrajina' package: Acts No. 65-67/2022 on temporary protection, employment/social security, and educational measures for Ukrainian refugees; language-training system extended to upper secondary.","links":[]},{"year":"2023","description":"Amendment (1 Sept) allows Czech-as-second-language to substitute for a second foreign language.","links":[]},{"year":"2025","description":"Eligibility for free language preparation extended to Czech citizens with foreigner-equivalent needs (Sept).","links":[]}],"docLinks":[{"label":"MŠMT — Metodika k poskytování bezplatné jazykové přípravy 2025/26","url":"https://msmt.gov.cz/uploads/210/Metodika_JP_2025_26.pdf"},{"label":"Eurydice: Czechia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/czechia/support-measures-learners-early-childhood-and-school-education"}],"supportLinks":[],"collaborators":[]},{"cc":"DK","name":"Denmark","nat":true,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Officially termed 'tosprogede børn/elever' (bilingual children/pupils) — a linguistic/functional definition under the Folkeskole Act framework: children with a mother tongue other than Danish who do not acquire Danish until in contact with the surrounding society, e.g. through school. Not an arrival-date or age-cutoff test.","removalCriteria":"No fixed timeline found; support level (basic vs. supplementary Danish-as-a-second-language instruction) is determined per-pupil by the school leader based on ongoing assessment rather than a statutory expiry.","newcomerProportion":"~10.5% — of pupils in Danish folkeskoler are 'tosprogede' (bilingual), most commonly with roots in Turkey, Iraq and Somalia; year of underlying data not stated in source, treat as approximate","l2Support":"'Dansk som andetsprog' (Danish as a Second Language) under Bekendtgørelse nr. 1053 af 29/06/2016, issued under Folkeskole Act § 5(6). Distinguishes 'basic instruction' (reception classes, special groups, or one-to-one teaching) from 'supplementary instruction' delivered alongside mainstream teaching. Early-childhood: municipalities must provide language-stimulation training (15 or 30 hrs/week) to bilingual children assessed as needing it. Asylum-seeker children in asylum centres receive Danish instruction matching compulsory-education hour minimums for their age.","l1Support":"'Modersmålsundervisning' (mother-tongue instruction) under decree no. 689 of 20 June 2014. Municipal councils are obliged to offer instruction in the official language of the relevant state specifically for children of EU/EEA-national residents in Denmark; provision for other groups is limited/discretionary.","bilingualEducationNotes":"No dedicated bilingual (dual-medium) education program for migrants — provision is parallel Danish-as-second-language plus optional/limited mother-tongue tuition, not integrated bilingual instruction.","policyHistory":"2014 — Decree no. 689 (20 June) on mother-tongue instruction.\n2016 — Decree no. 1053 (29 June, in force 1 Aug) on Danish-as-a-second-language instruction in the Folkeskole.\n2017 — New official guidance ('vejledning') issued on teaching bilingual pupils (March)."},"history":[{"year":"2014","description":"Decree no. 689 (20 June) on mother-tongue instruction.","links":[]},{"year":"2016","description":"Decree no. 1053 (29 June, in force 1 Aug) on Danish-as-a-second-language instruction in the Folkeskole.","links":[{"label":"Bekendtgørelse om dansk som andetsprog (BEK nr 1053 af 29/06/2016)","url":"https://www.retsinformation.dk/eli/lta/2016/1053"}]},{"year":"2017","description":"New official guidance ('vejledning') issued on teaching bilingual pupils (March).","links":[]}],"docLinks":[{"label":"Bekendtgørelse om dansk som andetsprog (BEK nr 1053 af 29/06/2016)","url":"https://www.retsinformation.dk/eli/lta/2016/1053"},{"label":"Bekendtgørelse om folkeskolens modersmålsundervisning","url":"https://www.retsinformation.dk/eli/accn/B20140068905"},{"label":"Undervisningsministeriet — love og regler på tosprogsområdet","url":"https://uvm.dk/grundskole/folkeskolen/laering-og-laeringsmiljoe/laeringsmiljoe/tosprogede/love-og-regler/"}],"supportLinks":[],"collaborators":[]},{"cc":"DJ","name":"Djibouti","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"DM","name":"Dominica","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"DO","name":"Dominican Republic","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"CD","name":"DR Congo","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"EC","name":"Ecuador","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"EG","name":"Egypt","nat":true,"region":"Africa","subregion":"Northern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SV","name":"El Salvador","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GQ","name":"Equatorial Guinea","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ER","name":"Eritrea","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"EE","name":"Estonia","nat":true,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"No single formal 'newcomer' label. Defined functionally: a pupil whose mother tongue differs from the language of instruction, or who has arrived from a foreign country. Enhanced Estonian-language support applies to pupils with fewer than 3 years' residence in Estonia; a separate threshold (less than 6 academic years of prior Estonian-medium schooling) is used in some basic-school support provisions.","removalCriteria":"The enhanced Estonian-language-support entitlement (4 extra lessons/week) lapses after 3 years of residence in Estonia; no separate formal status is revoked via testing.","newcomerProportion":"2021 — 13.5% — of all students educated in Russian-medium instruction (73 schools) — a proxy for the linguistic-minority population, not a strict newcomer count","l2Support":"Pupils resident under 3 years get 4 extra Estonian lessons/week if in Estonian-medium or immersion classes; free Estonian instruction for asylum seekers/refugees; adaptation programmes ease transition to upper-secondary/VET. Since Dec 2022, the Riigikogu has legislated a system-wide transition of all schooling to Estonian-medium instruction by 2030 (starting with pre-school/grade 1/grade 4 in 2024/25), motivated by the large Russian-medium-instruction population.","l1Support":"Mother-tongue instruction (2 hrs/week) available where the pupil's home language differs from the instruction language and 10+ students request it; otherwise the mother tongue may be studied as a foreign language.","bilingualEducationNotes":"Estonian-English and Estonian-Finnish bilingual basic-education tracks exist in two schools each.","policyHistory":"2022 — Government action plan for transition to Estonian-language education (2023/24-2024/25 priorities: teacher proficiency, multilingual-student training, materials, recruitment).\n2022 — Riigikogu passes Basic Schools and Upper Secondary Schools Act amendments (12 Dec, 62-16) targeting full Estonian-medium transition by 2030."},"history":[{"year":"2022","description":"Government action plan for transition to Estonian-language education (2023/24-2024/25 priorities: teacher proficiency, multilingual-student training, materials, recruitment).","links":[{"label":"Ministry of Education — transition programme","url":"https://www.hm.ee/en/node/234"}]},{"year":"2022","description":"Riigikogu passes Basic Schools and Upper Secondary Schools Act amendments (12 Dec, 62-16) targeting full Estonian-medium transition by 2030.","links":[{"label":"Basic Schools and Upper Secondary Schools Act (Riigi Teataja, English)","url":"https://www.riigiteataja.ee/en/eli/501022018002/consolide"}]}],"docLinks":[{"label":"Eurydice: Estonia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/estonia/support-measures-learners-early-childhood-and-school-education"},{"label":"Ministry of Education — transition programme","url":"https://www.hm.ee/en/node/234"},{"label":"Basic Schools and Upper Secondary Schools Act (Riigi Teataja, English)","url":"https://www.riigiteataja.ee/en/eli/501022018002/consolide"}],"supportLinks":[],"collaborators":[]},{"cc":"SZ","name":"Eswatini","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ET","name":"Ethiopia","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"FJ","name":"Fiji","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"FI","name":"Finland","nat":true,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"No fixed statutory 'newcomer' label. Pupils aged 6-16 with insufficient Finnish/Swedish skills to join mainstream comprehensive education qualify for preparatory education (perusopetukseen valmistava opetus). Eurydice's synthesis frames 'newly arrived' as having lived in Finland less than roughly 4 years.","removalCriteria":"Preparatory education lasts one year (extendable), after which the pupil transitions to a mainstream class; not legally mandatory for municipalities to offer. Continued remedial Finnish/Swedish-as-second-language teaching remains available afterward without a fixed cutoff, funded via government subsidy.","newcomerProportion":"2023 — 8,200 pupils — in preparatory education nationally; 90% foreign-born, ~1% Finnish-background; 42% concentrated in the Uusimaa region","l2Support":"Preparatory instruction (minimum 900 hours ages 6-10, minimum 1,000 hours ages 11+) focused on Finnish/Swedish as a second language plus other subjects, with partial mainstream integration (sports, music, arts) during the preparatory year. Legal basis: Basic Education Act 628/1998. Government subsidies fund remedial L2 instruction. Upper-secondary options: general upper-secondary preparatory education (1 year/25 courses) and a vocational preparatory course (6 months-1 year); reforms scheduled for Aug 2025 (general) and Aug 2026 (VET).","l1Support":"Government subsidies available for education providers to teach immigrant pupils' own mother tongue as a supplementary subject.","policyHistory":"1998 — Basic Education Act 628/1998 establishes the right to preparatory education.\n2022 — 'TUVA' — a new combined preparatory pathway for post-comprehensive learners without an upper-secondary qualification — introduced."},"history":[{"year":"1998","description":"Basic Education Act 628/1998 establishes the right to preparatory education.","links":[{"label":"Basic Education Act 628/1998 (English translation, Finlex)","url":"https://www.finlex.fi/en/legislation/translations/1998/eng/628"}]},{"year":"2022","description":"'TUVA' — a new combined preparatory pathway for post-comprehensive learners without an upper-secondary qualification — introduced.","links":[]}],"docLinks":[{"label":"Eurydice: Finland — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/finland/support-measures-learners-early-childhood-and-school-education"},{"label":"Finnish National Agency for Education — support for migrant/multilingual pupils","url":"https://www.oph.fi/en/education-and-qualifications/education-and-support-pupils-migrant-and-multilingual-background"},{"label":"Basic Education Act 628/1998 (English translation, Finlex)","url":"https://www.finlex.fi/en/legislation/translations/1998/eng/628"}],"supportLinks":[],"collaborators":[]},{"cc":"FR","name":"France","nat":true,"region":"Europe","subregion":"Western Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhhnh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","L3 support","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"EANA (Élève Allophone Nouvellement Arrivé) — officially, a pupil who has not attended school in France in the previous school year and does not have sufficient mastery of the curricula to enter an ordinary course immediately. New arrivals undergo an official assessment (French proficiency, other-language skills, literacy in any script, prior academic skills).","removalCriteria":"Not explicitly time-boxed at national level; pupils exit UPE2A support once assessed as sufficiently proficient/integrated into mainstream, determined at school/CASNAV level.","newcomerProportion":"2023-2024 — 88,500 pupils — EANA pupils enrolled (down ~1,000 from 2022/23); 9 in 10 receive FLSco instruction; plus 1,400 in the MLDS dropout-prevention scheme and 3,300 awaiting placement (DEPP, June 2025)","l2Support":"UPE2A (Unité Pédagogique pour Élèves Allophones Arrivants) provides variable-hours French-as-a-second-language (FLSco) instruction while pupils join mainstream classes for non-language-dependent subjects; secondary level has UPE2A-NSA for pupils with no prior schooling; groups capped at 15 pupils. Regional CASNAV centres coordinate provision.","l1Support":"Historically via ELCO (Enseignement de Langue et Culture d'Origine, Circular 76-128 of 1976, bilateral agreements with origin countries); phased out from 2016 and formally ended in Feb 2020 (affecting ~80,000 pupils), replaced by EILE (Enseignement International de Langues Étrangères) — open to all pupils, no longer tied to origin/nationality or foreign-state-paid teachers.","l3Support":"Standard modern-language curriculum; EILE now partly functions as this (international-language offering open to all pupils, not just migrant background).","policyHistory":"1976 — Circular 76-128 — foreign-language courses in elementary schools (ELCO precursor).\n2002 — Circular 2002-063 — enrollment/schooling procedures for newcomers.\n2012 — Circulars 2012-141 (organisation of EANA schooling) and 2012-143 (CASNAV missions).\n2013 — Law 2013-595 establishes the inclusive-education principle for all children.\n2020 — ELCO formally ended (announced 18 Feb 2020), replaced by EILE."},"history":[{"year":"1976","description":"Circular 76-128 — foreign-language courses in elementary schools (ELCO precursor).","links":[]},{"year":"2002","description":"Circular 2002-063 — enrollment/schooling procedures for newcomers.","links":[]},{"year":"2012","description":"Circulars 2012-141 (organisation of EANA schooling) and 2012-143 (CASNAV missions).","links":[{"label":"Circular on organisation of EANA schooling","url":"https://www.education.gouv.fr/bo/12/Hebdo37/MENE1234231C.htm"},{"label":"Éduscol — resources for EANA reception and schooling","url":"https://eduscol.education.gouv.fr/5421/ressources-pour-l-accueil-et-la-scolarisation-des-eleves-allophones-nouvellement-arrives-eana"}]},{"year":"2013","description":"Law 2013-595 establishes the inclusive-education principle for all children.","links":[]},{"year":"2020","description":"ELCO formally ended (announced 18 Feb 2020), replaced by EILE.","links":[]}],"docLinks":[{"label":"Eurydice: France — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/france/support-measures-learners-early-childhood-and-school-education"},{"label":"Éduscol — resources for EANA reception and schooling","url":"https://eduscol.education.gouv.fr/5421/ressources-pour-l-accueil-et-la-scolarisation-des-eleves-allophones-nouvellement-arrives-eana"},{"label":"Circular on organisation of EANA schooling","url":"https://www.education.gouv.fr/bo/12/Hebdo37/MENE1234231C.htm"},{"label":"DEPP statistical note n.25.42 (June 2025)","url":"https://archives-statistiques-depp.education.gouv.fr/doc/SYRACUSE/56355"}],"supportLinks":[],"collaborators":[]},{"cc":"GA","name":"Gabon","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GM","name":"Gambia","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GE","name":"Georgia","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"DE","name":"Germany","nat":true,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhnhhnhh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"Germany's 16 Länder each administer education independently — this entry reflects only the federal coordinating framework (KMK, the Standing Conference of the Ministers of Education), not binding state-level policy; terminology, thresholds, and duration vary significantly by Land. At KMK level, there is no single legal definition of 'newcomer' — the framework refers generically to children/young people with a migrant background or non-German language of origin, with language deficiency (not arrival-recency) as the trigger for support.","removalCriteria":"Not standardized federally; determined by individual Land/school assessment of German proficiency, sometimes referencing DSD I (German Language Diploma, First Level) attainment.","l2Support":"Preparatory/transitional classes exist under various Länder-specific names (Vorbereitungskurse, Sprachlernklassen, Deutschförderklassen, Übergangsklassen) providing intensive German-as-a-second-language (DaZ) instruction; DSD I / DSD I PRO certification available. KMK-level coordinating programmes: FörMig ('Förderung von Kindern und Jugendlichen mit Migrationshintergrund') and BISS ('Bildung durch Sprache und Schrift').","l1Support":"Supplementary native-language instruction (up to 5 periods/week, covering geography/history/culture of country of origin) offered in some Länder, not standardized federally.","bilingualEducationNotes":"Bilingual classes (native language + German) offered in some Länder, not standardized federally.","policyHistory":"2013 — KMK recommendation 'Interkulturelle Bildung und Erziehung in der Schule' (Intercultural Education and Upbringing in Schools).\n2016 — KMK declaration on refugee integration, following the 2015/16 refugee arrivals.\n2017 — KMK report on implementation of the 2013 intercultural-education recommendation.\n2025 — KMK 'Integration als Chance — gemeinsam für mehr Chancengerechtigkeit' update/self-commitment paper, alongside a revised diversity-conscious/intercultural education paper."},"history":[{"year":"2013","description":"KMK recommendation 'Interkulturelle Bildung und Erziehung in der Schule' (Intercultural Education and Upbringing in Schools).","links":[]},{"year":"2016","description":"KMK declaration on refugee integration, following the 2015/16 refugee arrivals.","links":[]},{"year":"2017","description":"KMK report on implementation of the 2013 intercultural-education recommendation.","links":[]},{"year":"2025","description":"KMK 'Integration als Chance — gemeinsam für mehr Chancengerechtigkeit' update/self-commitment paper, alongside a revised diversity-conscious/intercultural education paper.","links":[{"label":"KMK 'Integration als Chance' (2025)","url":"https://www.kmk.org/fileadmin/Dateien/pdf/Bildung/AllgBildung/2025-09-22-Umsetzung-Integration-als-Chance.pdf"}]}],"docLinks":[{"label":"Eurydice: Germany — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/germany/support-measures-learners-early-childhood-and-school-education"},{"label":"KMK — support and guidance (Eurydice excerpt, English)","url":"https://www.kmk.org/fileadmin/Dateien/pdf/Eurydice/EN/support_and_guidance.pdf"},{"label":"KMK 'Integration als Chance' (2025)","url":"https://www.kmk.org/fileadmin/Dateien/pdf/Bildung/AllgBildung/2025-09-22-Umsetzung-Integration-als-Chance.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"GH","name":"Ghana","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GR","name":"Greece","nat":true,"region":"Europe","subregion":"Southern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhnhhhhh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Pupils 'integrated into the Greek education system without holding the required level of attainment in Greek' (covers foreign, repatriate, refugee, Roma, and other vulnerable-group pupils) are eligible for ZEP (Zones of Educational Priority) reception classes under Law 3879/2010. Two tiers: ZEP I (minimum/zero Greek competence) and ZEP II (average Greek competence).","removalCriteria":"ZEP II support is capped at up to 2 years in secondary (exceptionally 3) and up to 3 years in primary; pupils who complete ZEP II cannot re-attend ZEP reception classes. Separate DYEP refugee reception facilities are capped at 1 year, extendable by 1 more year.","l2Support":"ZEP I pupils receive intensive instruction while attending mainstream classes concurrently for PE, Arts, Music, and Foreign Languages; ZEP II pupils receive lighter support. Class-size rules: primary minimum 9 pupils, secondary minimum 7/maximum 17. Separate DYEP (Reception Facilities for Refugee Education, launched 2016) provide refugee-specific schooling with set weekly hours (primary: Greek 6h, English 4h, Maths 3h, PE 3h, IT 2h, Arts 2h).","l1Support":"No dedicated L1/mother-tongue policy found for general newcomer/refugee pupils. Formal minority bilingual schooling exists in Thrace (Greek-Turkish, equal teaching hours/materials) for the recognized Muslim minority, but this is treaty-based and distinct from general newcomer provision.","l3Support":"Foreign languages (typically English) continue as mainstream subjects alongside reception-class support; DYEP curriculum includes English as a core subject for refugee pupils.","bilingualEducationNotes":"Long-standing treaty-based Greek-Turkish bilingual schools in Thrace for the recognized Muslim minority — not migrant-specific.","policyHistory":"2010 — Law 3879/2010 establishes ZEP/reception classes.\n2016 — DYEP refugee reception facilities launched.\n2018 — Law 4547/2018 — legislative framework for refugee children's education services.\n2019 — Law 4636/2019 — guarantees refugee minors' inclusion in public education during their stay in the country.\n2020 — Law 4692/2020 establishes the School Life Advisor institution.\n2024 — Updated Ministerial Decisions on ZEP class structure/hours (April and September)."},"history":[{"year":"2010","description":"Law 3879/2010 establishes ZEP/reception classes.","links":[]},{"year":"2016","description":"DYEP refugee reception facilities launched.","links":[]},{"year":"2018","description":"Law 4547/2018 — legislative framework for refugee children's education services.","links":[]},{"year":"2019","description":"Law 4636/2019 — guarantees refugee minors' inclusion in public education during their stay in the country.","links":[]},{"year":"2020","description":"Law 4692/2020 establishes the School Life Advisor institution.","links":[]},{"year":"2024","description":"Updated Ministerial Decisions on ZEP class structure/hours (April and September).","links":[]}],"docLinks":[{"label":"Eurydice: Greece — support measures for learners","url":"https://eurydice.eacea.e :"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"HN","name":"Honduras","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"HU","name":"Hungary","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-07","coverage":"has","fieldStates":"hnnhhhhh","filled":["Newcomer criteria","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"No specific formal 'newcomer pupil' definition found. Pupils with unfinished studies started abroad may continue in Hungarian public education, with recognition/admission decisions made by the school head. Refugee/asylum-seeking/protected pupils are referenced under Act LXXX of 2007 in relation to drop-out-risk support eligibility.","l2Support":"No dedicated newcomer-specific preparatory-class system comparable to other countries was found; support appears folded into general 'at risk of drop-out' pedagogical support and the National Core Curriculum's general provisions. The 2013 Migration Strategy (2014-2020 implementation) included teacher training in Hungarian as a foreign language and intercultural pedagogy.","l1Support":"Not found specifically for migrant pupils — Hungary's mother-tongue-instruction framework (2011 National Public Education Act) is oriented toward recognized national minorities, not migrant newcomers.","l3Support":"National Core Curriculum requires general intercultural-competence and foreign-language content; not migrant-specific.","bilingualEducationNotes":"The 'Tanoda' after-school programme (integrated into the Child Protection Law in 2019, ~200 centres, ~15,000 disadvantaged pupils/year) primarily targets disadvantaged/Roma pupils but per some sources has extended to migrant pupils and those in refugee reception facilities. Not a bilingual-education programme — a supplementary support scheme.","policyHistory":"2011 — Act CXC of 2011 on National Public Education — general legal framework, includes minority mother-tongue-education rights.\n2013 — Hungary's Migration Strategy adopted (2014-2020 implementation), including intercultural-education and Hungarian-as-foreign-language teacher training.\n2019 — Tanoda formally integrated into the Child Protection Law as a basic child-welfare service."},"history":[{"year":"2011","description":"Act CXC of 2011 on National Public Education — general legal framework, includes minority mother-tongue-education rights.","links":[]},{"year":"2013","description":"Hungary's Migration Strategy adopted (2014-2020 implementation), including intercultural-education and Hungarian-as-foreign-language teacher training.","links":[]},{"year":"2019","description":"Tanoda formally integrated into the Child Protection Law as a basic child-welfare service.","links":[]}],"docLinks":[{"label":"Eurydice: Hungary — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/hungary/support-measures-learners-early-childhood-and-school-education"},{"label":"Eurydice: Hungary — national reforms","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/hungary/national-reforms-school-education"}],"supportLinks":[],"collaborators":[]},{"cc":"IS","name":"Iceland","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Pupils whose mother tongue is not Icelandic, or children of immigrants, are the defined target group entitled to 'Icelandic as a Second Language' instruction, per Eurydice's synthesis of Icelandic compulsory-school regulation. No specific age cutoff found.","removalCriteria":"Non-binding guideline: within 2-4 years, newly arrived pupils are expected to reach 'competence level three,' after which they join the standard Icelandic curriculum with little or no further support. Allocation of support hours is decided at individual-school level.","newcomerProportion":"2023 — 7,361 pupils (15.5%) — of 47,507 total compulsory-school pupils had a foreign language as mother tongue (up ~800 from the prior year); ~30% of pupils had some foreign background overall (Statistics Iceland)","l2Support":"Statutory entitlement to Icelandic-as-second-language instruction, aimed at pupils becoming 'actively bilingual' and able to participate in compulsory schooling and Icelandic society; implementation (hours, format) devolved to individual schools/municipalities against Directorate of Education guideline timetables. Reykjavík's Icelandic language centres provide newly arrived pupils aged 11-16 with 3-9 months of dedicated instruction.","l1Support":"Not found in the material retrieved beyond the general 'actively bilingual' policy goal.","bilingualEducationNotes":"Stated policy goal is functional bilingualism (Icelandic + home language) rather than a structured dual-language education program.","policyHistory":"2003 — Child Welfare Act nr. 76/2003 (referenced re: school-welfare-service collaboration for these pupils).\n2024 — Government platform pledges increased efforts on Icelandic-language training for pupils with a migrant background."},"history":[{"year":"2003","description":"Child We ).\n2022-2024 — Teacher-reallocation rule for high-newcomer-concentration classes; new curriculum guidelines add migration-history content."},"history":[{"year":"2006","description":"Circolare Ministeriale n.24 — first reception/integration guidelines.","links":[]},{"year":"2010","description":"CM n.2 — indications on distribution/integration of non-Italian-citizenship pupils.","links":[]},{"year":"2014","description":"Updated 'Linee guida per l'accoglienza e l'integrazione degli alunni stranieri' (CM n.4233, 19 Feb).","links":[]},{"year":"2022-2024","description":"Teacher-reallocation rule for high-newcomer-concentration classes; new curriculum guidelines add migration-history content.","links":[]}],"docLinks":[{"label":"MIUR/MIM 2014 Guidelines for reception and integration of foreign pupils","url":"https://www.mim.gov.it/documents/20182/2223566/linee_guida_integrazione_alunni_stranieri.pdf"},{"label":"Eurydice: Italy overview","url":"https://eurydice.eacea.ec.europa.eu/eurypedia/italy/overview"}],"supportLinks":[],"collaborators":[]},{"cc":"CI","name":"Ivory Coast","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"JM","name":"Jamaica","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"JP","name":"Japan","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[] inks":[],"supportLinks":[],"collaborators":[]},{"cc":"LA","name":"Laos","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LV","name":"Latvia","nat":true,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Governed by a Cabinet of Ministers regulation effective 13 Jan 2022 (procedures for admitting/withdrawing pupils in general education). A school-level three-member assessment commission evaluates the pupil's Latvian proficiency and prior subject mastery to place remigrant/foreign children.","removalCriteria":"Support runs for one to two school years per the assessment commission's recommendation; no further fixed statutory exit test found.","newcomerProportion":"2023-2024 — 6 asylum seekers, 259 remigrants — IZM (Ministry of Education) enrollment data\n2025-2026 — 14 asylum seekers, 321 remigrants — IZM enrollment data","l2Support":"Intensive Latvian-language study (individual or group), support for other subjects in Latvian, teacher professional development, summer camps/courses for teachers in linguistically diverse classrooms.","l1Support":"Not found as a newcomer-specific policy. Separately, Latvia has been phasing out historic minority-language (mostly Russian) bilingual education, mandating full transition to Latvian-only instruction by 2025 — a minority-education reform, not a migrant-newcomer L1 policy.","bilingualEducationNotes":"Historic Russian/other minority-language bilingual programs, now being eliminated under the Latvian-only transition — relevant context but not migrant-newcomer-specific.","policyHistory":"2015 — MK Regulation No. 591 — support for pupils returning from abroad (1+ academic year).\n2018 — Education Law/General Education Law amendments begin gradual Latvian-medium transition.\n2022 — Further amendments (7 June) mandate full transition by 2025; Cabinet regulation (13 Jan) on admission/assessment procedures for newcomer/returnee pupils."},"history":[{"year":"2015","description":"MK Regulation No. 591 — support for pupils returning from abroad (1+ academic year).","links":[]},{"year":"2018","description":"Education Law/General Education Law amendments begin gradual Latvian-medium transition.","links":[]},{"year":"2022","description":"Further amendments (7 June) mandate full transition by 2025; Cabinet regulation (13 Jan) on admission/assessment procedures for newcomer/returnee pupils.","links":[]}],"docLinks":[{"label":"Vispārējās izglītības likums (General Education Law)","url":"https://likumi.lv/ta/id/20243-visparejas-izglitibas-likums"},{"label":"Ministry of Education — guidance for families returning to Latvia","url":"https://www.izm.gov.lv/lv/ja-gimene-gatavojas-atgriezties-latvija"}],"supportLinks":[],"collaborators":[]},{"cc":"LB","name":"Lebanon","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LS","name":"Lesotho","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LR","name":"Liberia","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LY","name":"Libya","nat":true,"region":"Africa","subregion":"Northern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LI","name":"Liechtenstein","nat":true,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhnhhnnh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Defined via the DaZ (Deutsch als Zweitsprache) framework as children/adolescents with a migration background whose first language is not German. A specific sub-category, the 'Intensivkurs' (Intensive Course), targets newly arrived migrant children aged 8+ whose German is not yet sufficient to follow regular classes.","removalCriteria":"Intensivkurs is capped at a maximum of 1 year, after which pupils integrate into regular classes. Broader DaZ supplementary support ('Ergänzungsunterricht') has a maximum support period of 7 years; exit is proficiency-based rather than a fixed test.","l2Support":"Two-track model: (1) Intensivkurs (1 year max, ages 8+, integrates German learning with general schooling); (2) DaZ supplementary lessons, delivered 1-4x/week in groups of 3-6, based on a national DaZ curriculum framework. Free of charge.","l1Support":"Voluntary 'Heimatliche Sprache und Kultur' (HSK) instruction in pupils' native language/culture. Legal basis: 1995 ordinance on promoting migrant workers' children in mother tongue and homeland studies.","policyHistory":"1971 — Schulgesetz (School Act).\n1995 — Ordinance on promoting migrant workers' children in mother tongue and homeland studies.\n2004 — Schulorganisationsverordnung (School Organisation Ordinance)."},"history":[{"year":"1971","description":"Schulgesetz (School Act).","links":[]},{"year":"1995","description":"Ordinance on promoting migrant workers' children in mother tongue and homeland studies.","links":[]},{"year":"2004","description":"Schulorganisationsverordnung (School Organisation Ordinance).","links":[]}],"docLinks":[{"label":"Eurydice: Liechtenstein — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/liechtenstein/support-measures-learners-early-childhood-and-school"},{"label":"Schulamt — Deutsch als Zweitsprache","url":"https://www.llv.li/de/landesverwaltung/schulamt/bildungsbereiche/schulische-foerdermassnahmen/deutsch-als-zweitsprache"}],"supportLinks":[],"collaborators":[]},{"cc":"LT","name":"Lithuania","nat":true,"region":"Europe","subregion":"Northern Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"'Atvykę ar grįžę iš užsienio' (arrived/returned from abroad) pupils. Governed by the Sequential Learning Procedure (Minister Order No. 259, 2003, formalised as Order ISAK-556 in 2005, amended). Pupils are admitted immediately (no prior testing) based on declared residence address; parents submit documentation of prior schooling and the school places the child with age peers after interviews.","removalCriteria":"No fixed national timeline found; Lithuanian-language proficiency is tracked against a CEFR-based A1-B2 framework via dedicated teaching materials, but exit criteria are not centrally specified.","newcomerProportion":"~14,600 children — from other countries currently in Lithuanian educational institutions (State Control Office figure, reported by LRT; precise year not stated but reporting is recent, 2024-25)","l2Support":"Lithuanian taught in 'lyginamosios klasės' (levelling/compensatory classes) or via mobile groups/individually; children of migrants moving to/returning to Lithuania are entitled to an extra 30% funding on top of the standard 'pupil's basket' to fund integration specialists; A1-B2 leveled textbooks published by the ministry.","l1Support":"Nothing substantive found at national level; policy focus is on integration into Lithuanian-medium schooling.","bilingualEducationNotes":"Lithuania has established Polish/Russian-medium minority schools, but these serve historic minorities, not migrant/newcomer populations.","policyHistory":"2003 — Minister Order No. 259 — basis of the sequential-learning procedure.\n2005 — ISAK-556 formal approval.\n2022 — 'Grįžusių Lietuvos Respublikos piliečių ugdymo organizavimo modelio aprašas' — model for organising education of returning citizens.\n2023 — Implementation recommendations for the leveled (A1-B2) Lithuanian-language program."},"history":[{"year":"2003","description":"Minister Order No. 259 — basis of the sequential-learning procedure.","links":[]},{"year":"2005","description":"ISAK-556 formal approval.","links":[{"label":"ISAK-556 legal act (e-tar.lt)","url":"https://www.e-tar.lt/portal/lt/legalActEditions/TAR.310753DF1036"}]},{"year":"2022","description":"'Grįžusių Lietuvos Respublikos piliečių ugdymo organizavimo modelio aprašas' — model for organising education of returning citizens.","links":[]},{"year":"2023","description":"Implementation recommendations for the leveled (A1-B2) Lithuanian-language program.","links":[]}],"docLinks":[{"label":"ISAK-556 legal act (e-tar.lt)","url":"https://www.e-tar.lt/portal/lt/legalActEditions/TAR.310753DF1036"},{"label":"Ministry of Education, Science and Sport — info for arrivals","url":"https://smsm.lrv.lt/web/lt/smm-svietimas/informacija-atvykstantiems-is-usienio-isvykstantiems-i-uzsieni/atvykstantiems-gyventi-ir-mokytis-lietuvoje"}],"supportLinks":[],"collaborators":[]},{"cc":"LU","name":"Luxembourg","nat":true,"region":"Europe","subregion":"Western Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhhhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"'Élèves nouvellement arrivés.' Ages 3-11 are welcomed/oriented via their municipality of residence and placed in a 'classe d'attache' (home class) matching their age in cycles 2-4, based on prior schooling, age, and assessment tests in maths and native language. Framework: Règlement grand-ducal du 16 juin 2009, reformed in 2022 (Projet de loi 8069).","removalCriteria":"In elementary/fundamental education, welcome courses (cours d'accueil) run alongside the regular class rather than instead of it, so pupils are integrated immediately with no separate removal milestone. In secondary (ESG), classes d'accueil provide 1 year of intensive French, implying mainstreaming after roughly one year (extendable). The 2022 reform mandates structured follow-up during the pupil's first two years.","newcomerProportion":"2018 — 55% — of 15-year-olds had an immigrant background per PISA 2018, up from 40% in 2009; Luxembourg did not participate in PISA 2022","l2Support":"Cours d'accueil (intensive German and/or French instruction, plus introduction to Luxembourgish); intercultural mediators for parents/teachers; since 2022, the 'Service de l'intégration et de l'accueil scolaires' (SIA) coordinates support, welcome classes were extended into secondary, and new integration classes were created in primary.","l1Support":"'Cours de Langue et Culture d'Origine' (LCO) — optional, extracurricular mother-tongue/culture courses, organised and funded by origin-country institutions or nonprofit associations, mostly outside school hours, religiously/politically neutral.","l3Support":"The mainstream system is inherently trilingual (Luxembourgish/German/French); no distinct additional migrant-specific L3 policy found beyond LCO.","bilingualEducationNotes":"No separate 'bilingual' migrant program beyond the LCO/accueil structure — the whole system is multilingual by design.","policyHistory":"2009 — Règlement grand-ducal (16 June, republished 3 Sept) establishing classes/cours d'accueil.\n2022 — Projet de loi 8069 creates SIA, extends welcome classes to secondary, adds primary integration classes."},"history":[{"year":"2009","description":"Règlement grand-ducal (16 June, republished 3 Sept) establishing classes/cours d'accueil.","links":[{"label":"Règlement grand-ducal du 16 juin 2009 (Legilux)","url":"https://legilux.public.lu/eli/etat/leg/trep/2009/09/03/n4/jo"}]},{"year":"2022","description":"Projet de loi 8069 creates SIA, extends welcome classes to secondary, adds primary integration classes.","links":[]}],"docLinks":[{"label":"Règlement grand-ducal du 16 juin 2009 (Legilux)","url":"https://legilux.public.lu/eli/etat/leg/trep/2009/09/03/n4/jo"},{"label":"MENJE — scolarisation des élèves étrangers (fondamental)","url":"https://men.public.lu/fr/systeme-educatif/scolarisation-eleves-etrangers/enseignement-fondamental.html"},{"label":"Chambre des Députés — nouveau cadre pour les élèves nouvellement arrivés","url":"https://www.chd.lu/en/node/956"},{"label":"Liste des cours L1 (langue et culture d'origine)","url":"https://portal.education.lu/Portals/23/Flyers/Cours%20de%20L1/20250522_LISTE_L1.pdf"}],"supportLinks":[],"collaborators":[]},{"cc":"MG","name":"Madagascar","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"un :"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ME","name":"Montenegro","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-07","coverage":"has","fieldStates":"hnnhnnhn","filled":["Newcomer criteria","L2 support","Bilingual education"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"No formal 'newcomer'/EAL definition found for school-age pupils. Eurydice's comparative report states Montenegro places all newly arrived migrant pupils directly into mainstream classes with no separate preparatory-class model. 'Immigrants' as a named target group with adapted-programme entitlement appears specifically in adult-education law, not confirmed for school-age pupils.","l2Support":"No dedicated school-age migrant-pupil language-support scheme identified (contrast with Montenegro's more developed Roma/Egyptian-population measures: inclusion assistants, scholarships, free transport, literacy programs). At adult-education level only, immigrants are a named target group for adapted programmes.","bilingualEducationNotes":"Minority-language instruction exists (e.g. Albanian-language instruction in 12 primary schools in Bar, Plav, Podgorica, Rožaje, Ulcinj) but this is national-minority provision, not migrant/newcomer-targeted."},"history":[],"docLinks":[{"label":"Eurydice: Montenegro — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/montenegro/support-measures-learners-early-childhood-and-school"},{"label":"Law on Primary Education and Upbringing (Zakon o osnovnom obrazovanju i vaspitanju)","url":"https://www.skolskiportal.edu.me/Docs/Propisi/Zakoni/Zakon%20o%20osnovnom%20obrazovanju%20i%20vaspitanju.pdf"}],"supportLinks":[],"co :[],"collaborators":[]},{"cc":"NL","name":"Netherlands","nat":true,"region":"Europe","subregion":"Western Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"'Nieuwkomer' = a pupil recently arrived in the Netherlands who does not yet speak Dutch well enough and has never previously been enrolled in a Dutch school. Applies to temporary newcomer provisions (nieuwkomersvoorziening) in primary, and ISK (Internationale Schakelklas) from roughly age 12 in secondary.","removalCriteria":"Since October 2023, a formal cap: a pupil may not be enrolled in a temporary newcomer provision for more than 2 years total, after which they move into mainstream/regular education.","newcomerProportion":"2022 — ~14% — immigrant-background student share (OECD PISA 2022), described as stable","l2Support":"Minimum of 10 hours/week Dutch-language instruction; schools receive additional quarterly funding during the pupil's first 2 years; regional newcomer-education coordinators link the Ministry, school boards and municipalities; LOWAN's intake-assessment method is available but not mandatory.","l1Support":"No current national policy. Historically, 'Onderwijs in Eigen Taal en Cultuur' (OETC, from 1974) funded mother-tongue/culture teaching; narrowed to 'Onderwijs in Allochtone Levende Talen' (OALT) in 1998 and abolished entirely on 1 August 2004, on grounds of prioritising Dutch acquisition and lack of proven positive effect.","bilingualEducationNotes":"General (non-migrant-specific) bilingual primary/secondary pilots exist (Dutch-English), but nothing targeting migrant pupils was found.","policyHistory":"1974 — OETC (mother-tongue/culture instruction) introduced.\n1998 — OETC replaced by OALT (narrower scope).\n2004 — OALT abolished (1 Aug).\n2023 — 2-year cap on newcomer provisions formalised (Oct).\n2024 — Temporary Ukraine-specific provisions ended (summer)."},"history":[{"year":"1974","description":"OETC (mother-tongue/culture instruction) introduced.","links":[]},{"year":"1998","description":"OETC replaced by OALT (narrower scope).","links":[]},{"year":"2004","description":"OALT abolished (1 Aug).","links":[]},{"year":"2023","description":"2-year cap on newcomer provisions formalised (Oct).","links":[]},{"year":"2024","description":"Temporary Ukraine-specific provisions ended (summer).","links":[]}],"docLinks":[{"label":"Rijksoverheid — Onderwijs voor nieuwkomers","url":"https://www.rijksoverheid.nl/onderwerpen/basisonderwijs/onderwijs-voor-nieuwkomers"},{"label":"LOWAN — Nieuwkomers in het primair en voortgezet onderwijs (2022)","url":"https://www.lowan.nl/wp-content/uploads/2022/08/2022-56_Nieuwkomers-in-het-primair-en-voortgezet-onderwijs.pdf"},{"label":"VO-raad — Onderwijs aan nieuwkomers","url":"https://www.vo-raad.nl/onderwerpen/onderwijs-aan-nieuwkomers"}],"supportLinks":[],"collaborators":[]},{"cc":"NZ","name":"New Zealand","nat":true,"region":"Oceania","subregion":"Australia and New Zealand","status":"complete","confidence":"official-document","lastVerified":"2026","coverage":"has","fieldStates":"hhhhhhhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","L3 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":4,"supports":0,"values":{"newcomerCriteria":"ESOL funding eligibility covers three categories: migrant students (proof of NZ entry date), former refugees (official refugee-status documentation), and NZ-born students with at least one migrant/refugee parent where a language other than English is usually spoken at home. First language must not be English or te reo Māori. International fee-paying students are excluded.","removalCriteria":"No explicit proficiency-based exit test — funding is instead capped by duration: up to 5 years (20 terms) for migrant/former-refugee students, up to 3 years (12 terms) for NZ-born children of migrant/refugee parents. Progress is tracked via the English Language Learning Progressions (ELLP), scored twice yearly. ESOL verifiers visit schools roughly every 3 years to review identification/exit processes.","newcomerProportion":"2026 — 90,771 pupils across 1,754 schools — received ESOL funding (Terms 1-2), more than double the 37,640 recorded in 2016; largest groups Indian (~20%), Filipino, Chinese (Ministry of Education data via RNZ)","l2Support":"ESOL Resourcing Policy: funding paid to schools twice yearly (application rounds by 10 March and 1 August), roughly NZ$780/year (primary/intermediate) and NZ$1,000/year (secondary), usable for specialist ESOL teachers, teacher aides, bilingual resource people, or ELL resources.","l1Support":"No unified national policy — academic literature notes the 'continued absence of a Pasifika bilingual education plan'; heritage/community-language support is fragmented rather than centrally funded for ESOL-eligible students specifically.","l3Support":"'Learning Languages' is a general learning area in the New Zealand Curriculum available to all students — not a targeted newcomer policy.","bilingualEducationNotes":"A Bilingual Assessment Service, delivered by trained Resource Teachers (Learning and Behaviour) working with bilingual support people, is used for complex cases where language-acquisition difficulty may be intertwined with other learning needs — a diagnostic/learning-support service, not a bilingual instructional program. Teacher capability is supported through TESSOL (Teaching English to Speakers of Other Languages) scholarships.","policyHistory":"2018 — Budget 2018 allocates NZ$34.5m additional ESOL funding.\n2019 — Further NZ$13.2m funding boost announced (16 August), bringing combined new funding to $47.7m."},"history":[{"year":"2018","description":"Budget 2018 allocates NZ$34.5m additional ESOL funding.","links":[{"label":"Apply for ESOL funding","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/funding-and-financials/english-speakers-other-languages-esol-funding/apply-english-speakers-other-languages-esol-funding"},{"label":"ESOL resources / funding overview","url":"https://www.education.govt.nz/school/student-support/english-for-speakers-of-other-languages-esol-information/esol-resources"}]},{"year":"2019","description":"Further NZ$13.2m funding boost announced (16 August), bringing combined new funding to $47.7m.","links":[]}],"docLinks":[{"label":"Apply for ESOL funding","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/funding-and-financials/english-speakers-other-languages-esol-funding/apply-english-speakers-other-languages-esol-funding"},{"label":"ESOL resources / funding overview","url":"https://www.education.govt.nz/school/student-support/english-for-speakers-of-other-languages-esol-information/esol-resources"},{"label":"Bilingual assessment service","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/learning-support/bilingual-assessment-service"},{"label":"TESSOL scholarships","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/scholarships-and-study-awards/teaching-english-schools-speakers-other-languages-scholarships"}],"supportLinks":[],"collaborators":[]},{"cc":"NI","name":"Nicaragua","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NE","name":"Niger","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looke jects for at least one school year, using programmes developed by the Bureau for Development of Education.","bilingualEducationNotes":"Extensive minority-language instruction exists generally (Albanian, Turkish, etc.), and Roma-inclusion projects exist (e.g. EU-funded 'Regular Class: Action for Inclusion of Roma in Primary Education'), but these are minority/Roma programs, not migrant-newcomer-specific."},"history":[],"docLinks":[{"label":"Eurydice: North Macedonia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/republic-north-macedonia/support-measures-learners-early-childhood-and"},{"label":"Law for Primary Education (consolidated text, Ministry-sourced)","url":"https://sonk.org.mk/wp-content/uploads/2026/01/zakon-za-osnovnoto-obrazovanie-konsolidiran-tekst-izvor-ministerstvo-za-obrazovanie-i-nauka.pdf"},{"label":"UNICEF North Macedonia — migrant and refugee crisis","url":"https://www.unicef.org/northmacedonia/topics/migrant-and-refugee-crisis"}],"supportLinks":[],"collaborators":[]},{"cc":"OM","name":"Oman","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PK","name":"Pakistan","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PW","name":"Palau","nat":true,"region":"Oceania","subregion":"Micronesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docL ","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"'Uczeń przybywający z zagranicy' — covers both non-Polish citizens and Polish citizens who previously studied in a foreign country's school system. Defined by the MEN regulation of 23 August 2017 implementing the 14 Dec 2016 Prawo oświatowe (Education Law), consolidated text at Dz.U. 2023 poz. 2301.","removalCriteria":"Preparatory class (oddział przygotowawczy) lasts typically one school year, extendable or reducible by up to one further year. Polish citizens returning from abroad get a 12-month entitlement to extra Polish lessons. Foreign nationals with insufficient Polish get open-ended free additional Polish lessons, though combined Polish-language + remedial support is capped at 5 hours/week.","l2Support":"Oddziały przygotowawcze (preparatory classes) with a Polish-language curriculum based on a national framework program; free additional Polish-language classes; targeted subvention funding weights (P44 = 1.5 for Polish-language support, P45 = 0.3 for preparatory classes) allocated to local government education budgets per pupil.","l1Support":"A teacher's aide who speaks the pupil's native language may assist for up to 12 months; diplomatic missions or cultural organisations may organise heritage-language/culture instruction with the school director's approval.","bilingualEducationNotes":"Poland has established minority-language schools (German, Lithuanian, Belarusian, etc.) serving historic minorities; nothing migrant-specific found.","policyHistory":"2016 — Prawo oświatowe (Education Law), 14 Dec.\n2017 — MEN regulation (23 Aug) on educating pupils arriving from abroad.\n2023 — Consolidated/amended text (Dz.U. 2023 poz. 2301), reflecting adjustments likely tied to the 2022 Ukraine refugee influx."},"history":[{"year":"2016","description":"Prawo oświatowe (Education Law), 14 Dec.","links":[]},{"year":"2017","description":"MEN regula overage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SN","name":"Senegal","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"RS","name":"Serbia","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"complete","confidence":"official-document","lastVerified":"2026-07","coverage":"has","fieldStates":"hhhhhnhh","filled":["Newcomer criteria","Removal criteria","Newcomer proportion","L2 support","L1 support","Bilingual education","Policy history"],"looked":[],"nFields":8,"docs":2,"supports":0,"values":{"newcomerCriteria":"Law on Foundations of the Education System ('Official Gazette of the RS' No. 88/17), Art. 23: foreign nationals, stateless persons, citizenship seekers, exiled/displaced persons, refugees, migrants, and readmission-agreement returnees who cannot speak the language of instruction. Upon arrival, a school-based 'Team for entry-knowledge assessment' completes an assessment within 7 working days, producing a 'Pupil/Student Support Plan' and grade placement.","removalCriteria":"Not a fixed multi-year timeline — pupils undergo a preparatory adaptation period of 2 weeks to 2 months, then move into regular classes while continuing parallel supplemental Serbian-language classes.","newcomerProportion":"2017-2018 — 586 pupils — 503 enrolled in 45 schools (447 primary + 56 secondary) plus 83 attending classes in collective/transit centres (12 schools) — Ministry data","l2Support":"Schools must organize Serbian language courses, preparatory classes, and supplemental classes per the Minister's 'Professional Instruction for Inclusion of Refugee/Asylum Seeking Students' (May 2017). Model: 2 subject classes + 2 workshop classes, or 2 elective courses if the pupil already speaks English or Serbian. Standards/curriculum for 'Serbian as a Foreign Language' were under development as of 2017; 350+ teachers/staff trained Aug 2017.","l1Support":"No dedicated migrant mother-tongue-maintenance program found (distinct from national-minority-language education, which exists separately).","bilingualEducationNotes":"General minority-language bilingual education exists under the 2017 Law (instruction in a minority language + Serbian, or foreign language + Serbian/minority language) but is not migrant-specific.","policyHistory":"2007 — Law on Asylum (Gazette 109/07).\n2013 — Laws on Primary Education and Secondary Education (55/13) establish entry-assessment procedures.\n2017 — Law on Foundations of the Education System (88/17); Professional Instruction for Inclusion of Refugee/Asylum Seeking Students issued (May); nationwide staff training (Aug)."},"history":[{"year":"2007","description":"Law on Asylum (Gazette 109/07).","links":[]},{"year":"2013","description":"Laws on Primary Education and Secondary Education (55/13) establish entry-assessment procedures.","links":[]},{"year":"2017","description":"Law on Foundations of the Education System (88/17); Professional Instruction for Inclusion of Refugee/Asylum Seeking Students issued (May); nationwide staff training (Aug).","links":[]}],"docLinks":[{"label":"Education for Migrant Students in the Republic of Serbia — Legal Regulations (Ministry-sourced, Nov 2017)","url":"https://kidsempowerment.org/wp-content/uploads/2022/07/Education-for-Migrant-Students-in-the-Republic-of-Serbia_-Legal-Regulations.pdf"},{"label":"Eurydice: Serbia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/eurypedia/serbia/support-measures-learners-early-childhood-and-school-education"}],"supportLinks":[],"collaborators":[]},{"cc":"SC","name":"Seychelles","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SL","name":"Sierra Leone","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SG","name":"Singapore","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnn","filled":[],"looked":[],"nFields":8,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SK","name":"Slovakia","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-07","coverage":"has","fieldStates":"hhnhhnnh","filled":["Newcomer criteria","Removal criteria","L2 support","L1 support","Policy history"],"looked":[],"nFields":8,"docs":3,"supports":0,"values":{"newcomerCriteria":"No single formal legal 'newcomer' status. Pupils are identified as needing support when their mother tongue differs from the language of instruction or their command of the instruction language is inadequate for their age; this falls under the 'children with special educational needs' category in the School Act (245/2008 Z.z., §12). A July 2025 rule made education compulsory for Ukrainian refugee/'odídenec' children from 1 September 2025.","removalCriteria":"Not formally codified. Practitioner guidance (cited by the Slovak National Pedagogical Institute) distinguishes conversational fluency (6 months-2-3 years) from academic-language mastery (5-7 years, sometimes up to 10). Adaptation classes are capped at one school year and cannot be repeated.","l2Support":"'Language course' support measure funded via adjustable normative per-pupil financing; optional 'adaptation classes' (max. 1 school year, requires head-teacher authorization, teacher recommendation, counsellor input, parental consent). 'Slovak as a Second Language' curriculum/methodology maintained by the State Pedagogical Institute.","l1Support":"Not addressed in the material found (only mother-tongue instruction for recognized national minorities is covered, treated separately from migrant L1).","policyHistory":"2008 — School Act (245/2008 Z.z.) enacted, incl. §12 language-of-instruction provisions.\n2022 — Ministry-UNICEF memorandum on support for Ukrainian refugee children (May).\n2025 — Compulsory schooling extended to Ukrainian refugee children (1 Sept)."},"history":[{"year":"2008","description":"School Act (245/2008 Z.z.) enacted, incl. §12 language-of-instruction provisions.","links":[{"label":"School Act 245/2008 Z.z. (consolidated)","url":"https://static.slov-lex.sk/static/SK/ZZ/2008/245/20270101.html"}]},{"year":"2022","description":"Ministry-UNICEF memorandum on support for Ukrainian refugee children (May).","links":[]},{"year":"2025","description":"Compulsory schooling extended to Ukrainian refugee children (1 Sept).","links":[]}],"docLinks":[{"label":"Eurydice: Slovakia — support measures for learners","url":"https://eurydice.eacea.ec.europa.eu/national-education-systems/slovakia/support-measures-learners-early-childhood-and-school-education"},{"label":"School Act 245/2008 Z.z. (consolidated)","url":"https://static.slov-lex.sk/static/SK/ZZ/2008/245/20270101.html"},{"label":"State Pedagogical Institute — Slovak as a Second Language","url":"https://www.statpedu.sk/sk/cudzinci/slovencina-ako-druhy-jazyk/"}],"supportLinks":[],"collaborators":[]},{"cc":"SI","name":"Slovenia","nat":true,"region":"Europe","subregion":"Central Europe","status":"complete","confidence":"official

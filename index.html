nhnnnnn","filled":["Terminology","Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Çocukluk çağı dil bozukluğu\" (Turkish; roughly \"childhood language disorder\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Türkiye in the middle band (40-55% had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","assessments":"A LITMUS sentence repetition (SRep) task exists for Turkish, developed by Seyhun Topbaş (Istanbul Medipol University, School of Health Sciences). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Applied in theses on Turkish-English sequential bilinguals in England and on Turkish-German bilinguals in Germany, so much of the evidence concerns the diaspora rather than domestic monolinguals. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 30 respondents from Türkiye who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 57%, in the mother tongue only 28% and in both languages 12%; intervention in the mainstream language only 50% and in the mother tongue 25% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 78%, in intervention 61% and in counselling 96%. On whether the country offers training for practitioners working with bi/multilingual children (n = 34): obligatory 6%, optional 3%, none 21% and unsure 65%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 55 from Türkiye): private practice 60%, private rehabilitation centre 53% and hospital 22%, with respondents placing themselves in private 71% and government-funded private 38%. Direct intervention for the reference child was most often weekly (49% of 55). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (88% yes), income level (74% yes) and cost to parents (74% yes) (n ≈ 34). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 55 from Türkiye): family 58%, government education 38% and government health 9%. 40% said a maximum number of sessions applied (n = 55). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Turkey chapter, Law et al. eds., Topbaş, Bulut & Günhan, pp. 485-496","url":"https://doi.org/10.4324/9780429455308-41"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"TT","name":"Trinidad and Tobago","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TV","name":"Tuvalu","nat":true,"region":"Oceania","subregion":"Polynesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TZ","name":"Tanzania","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UA","name":"Ukraine","nat":true,"region":"Europe","subregion":"Eastern Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UG","name":"Uganda","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"California","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"Illinois","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"New York","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"Texas","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"US","name":"United States","nat":true,"region":"Americas","subregion":"Northern America","status":"partial","confidence":"official-document","lastVerified":"2026-08","coverage":"has","fieldStates":"hhhhhhhhhhhhh","filled":["Terminology","Identification criteria","Assessments","Multilingual provision","Referral pathway","Service model","Legal entitlement","Funding","Workforce","Discharge criteria","Outcomes evidence","Identified prevalence","Policy history"],"looked":[],"nFields":13,"docs":7,"supports":2,"values":{"terminology":"Fragmented across three vocabularies. Federal education law uses 'speech or language impairment' (SLI) as an IDEA eligibility category — a broad administrative label covering speech sound, fluency, voice and language difficulties together. Clinical/diagnostic practice uses DSM-5 'language disorder'. 'Developmental language disorder' (CATALISE) is used in research and by advocacy groups but has no standing in either the federal statute or DSM-5. The result is that the same child can be described three different ways depending on who is writing.","identificationCriteria":"Federal law sets the frame; states set the numbers. Under IDEA a child is eligible if they have a qualifying impairment AND it 'adversely affects educational performance' AND they need specially designed instruction — a two-part test that a diagnosis alone does not satisfy. States then add their own operational criteria on top (standard-deviation cut-offs, test-score requirements, severity rating scales), and these differ substantially state to state; states may add to the federal requirements but may not narrow them. Cognitive referencing (requiring a language–non-verbal-IQ discrepancy) is still permitted in some state frameworks despite being explicitly rejected by CATALISE and discouraged by ASHA — one of the clearest examples of policy lagging the consensus.","assessments":"No national mandated battery. IDEA requires assessment to be non-discriminatory, in the child's native language or mode of communication, using technically sound instruments and more than a single measure. In practice the field leans heavily on a small set of commercially published, English-normed omnibus batteries, supplemented by language sample analysis and dynamic assessment. State eligibility rules that specify a score cut-off effectively constrain which tools can be used. A LITMUS sentence repetition (SRep) task exists for English, developed by Theodoros Marinis, Shula Chiat and Sharon Armon-Lotem; a Spanish task was developed by Silvina Montrul (University of Illinois) and Begoña Arechabaleta (University of Chicago) in a US heritage-speaker context. Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Formally the strongest statutory language of any field in this catalog, and in practice the widest gap between statute and delivery. IDEA requires evaluation materials to be provided and administered in the child's native language unless clearly not feasible, and prohibits identifying a child as disabled where the determinant factor is limited English proficiency. The recurring practical problem is distinguishing DLD from typical second-language acquisition: normative data for most languages other than English is thin or absent, bilingual SLPs are a small minority of the workforce, and interpreter-mediated assessment is not consistently available. Recommended practice (ASHA) is assessment in both languages, dynamic assessment, language sample analysis and parent report rather than English standard scores — but this is guidance, not a requirement, and both under-identification (difficulty attributed to English learner status) and over-identification are documented.","referralPathway":"Two entry points by age. Birth to 3: IDEA Part C early intervention, via 'child find' obligations and referral by parents, physicians or childcare. Age 3–21: IDEA Part B, via school-based child find, parent request, or referral through a multi-tiered system of supports (MTSS/RTI). Private clinical assessment via health insurance runs in parallel and is not equivalent to educational eligibility.","serviceModel":"School-based and education-funded for the eligible population: services are delivered by school speech-language pathologists (SLPs) under an Individualized Education Program (IEP), most often as pull-out or push-in sessions specified in minutes per week. A parallel private/clinical route exists for families with insurance coverage, so the same child can have quite different provision depending on which route they enter.","legalEntitlement":"Strong and individually enforceable, once eligibility is established: a free appropriate public education (FAPE) in the least restrictive environment, with an IEP setting measurable goals and specifying service amount, and due-process rights for parents who disagree. The entitlement attaches to IDEA eligibility, not to a clinical diagnosis — a child with diagnosed DLD who does not meet the state's 'adverse effect' test has no IDEA entitlement.","funding":"Publicly funded through the education system for IDEA-eligible children, with federal IDEA Part B grants supplementing state and local funds (federal contribution has historically fallen well short of the authorised share, leaving most cost with states and districts). Clinical services outside school are funded by private insurance or Medicaid, with coverage limits and, in some states, exclusions for 'developmental' as opposed to 'acquired' conditions.","workforce":"Speech-language pathologists, requiring a master's degree, state licensure and typically ASHA's Certificate of Clinical Competence (CCC-SLP). Caseload sizes in schools are a persistent structural issue and are capped by state rule in some states and not others. Bilingual SLPs are a small proportion of the workforce relative to the multilingual school population.","dischargeCriteria":"Determined at the individual IEP level, not by national rule. Re-evaluation is required at least every three years, and services end when the team determines the child no longer meets eligibility or no longer requires specially designed instruction. Entitlement ends at 21 (or on high-school graduation).","outcomesEvidence":"Not systematically reported at national level for language disorder as distinct from the broader SLI category. Federal reporting covers IDEA categories in aggregate, so DLD-specific attainment, graduation and post-school outcome data is not routinely published.","identifiedPrevalence":"2023 — ~19 — % of all students served under IDEA Part B whose primary category is 'speech or language impairment' — the second-largest category after specific learning disability. Note this covers speech as well as language, so it is not a DLD prevalence figure.","policyHistory":"1975 — Education for All Handicapped Children Act (P.L. 94-142) establishes a federal right to special education, including for speech or language impairment.\n2004 — IDEA reauthorisation (IDEIA); 'speech or language impairment' remains one of the 13 federal disability categories.\n2017 — CATALISE consensus published; US uptake of the 'DLD' label is slower and more contested than in the UK, with 'language disorder' (DSM-5) and 'SLI' both still in use."},"history":[{"year":"1975","description":"Education for All Handicapped Children Act (P.L. 94-142) establishes a federal right to special education, including for speech or language impairment.","links":[]},{"year":"2004","description":"IDEA reauthorisation (IDEIA); 'speech or language impairment' remains one of the 13 federal disability categories.","links":[{"label":"IDEA statute and regulations (US Dept of Education)","url":"https://sites.ed.gov/idea/"},{"label":"ASHA — IDEA Part B: IEPs and eligibility for services","url":"https://www.asha.org/advocacy/idea/idea-part-b-issue-brief-individualized-education-programs-and-eligibility-for-services/"}]},{"year":"2017","description":"CATALISE consensus published; US uptake of the 'DLD' label is slower and more contested than in the UK, with 'language disorder' (DSM-5) and 'SLI' both still in use.","links":[]}],"docLinks":[{"label":"IDEA statute and regulations (US Dept of Education)","url":"https://sites.ed.gov/idea/"},{"label":"34 CFR §300.8(c)(11) — speech or language impairment definition","url":"https://sites.ed.gov/idea/regs/b/a/300.8/c/11"},{"label":"ASHA Practice Portal — Spoken Language Disorders","url":"https://www.asha.org/practice-portal/clinical-topics/spoken-language-disorders/"},{"label":"ASHA — IDEA Part B: IEPs and eligibility for services","url":"https://www.asha.org/advocacy/idea/idea-part-b-issue-brief-individualized-education-programs-and-eligibility-for-services/"},{"label":"ASHA — Evaluation and eligibility for speech-language services in schools","url":"https://pubs.asha.org/doi/10.1044/persp1.SIG16.78"},{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[{"label":"DLD and Me","url":"https://dldandme.org/"},{"label":"RADLD — Raising Awareness of DLD","url":"https://radld.org/"}],"collaborators":[]},{"cc":"US","name":"Washington","nat":false,"region":"Americas","subregion":"Northern America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UY","name":"Uruguay","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"UZ","name":"Uzbekistan","nat":true,"region":"Asia","subregion":"Central Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VA","name":"Vatican City","nat":true,"region":"Europe","subregion":"Southern Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VC","name":"Saint Vincent and the Grenadines","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VE","name":"Venezuela","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VN","name":"Vietnam","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"VU","name":"Vanuatu","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"WS","name":"Samoa","nat":true,"region":"Oceania","subregion":"Polynesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"YE","name":"Yemen","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ZA","name":"South Africa","nat":true,"region":"Africa","subregion":"Southern Africa","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"llhhhhhhhnnnh","filled":["Assessments","Multilingual provision","Referral pathway","Service model","Legal entitlement","Funding","Workforce","Policy history"],"looked":["Terminology","Identification criteria"],"nFields":13,"docs":11,"supports":1,"values":{"terminology":"Not established from the sources consulted for this entry — the South African literature reviewed here works largely in terms of 'language impairment' and 'communication disorders'; how far the CATALISE 'DLD' terminology has been adopted in local clinical and education practice could not be determined. If you work in this system, this is exactly the field to fill in.","identificationCriteria":"Not established from the sources consulted for this entry — no national diagnostic or eligibility criteria were identified. The dominant constraint reported in the literature is not the criteria but the assessment tools available to apply them — see below. If you work in this system, this is exactly the field to fill in.","assessments":"The central documented problem. There is an overall shortage of valid assessment tools for multilingual populations, and particularly for several South African languages. The tests actually in use are predominantly built on European and American linguistic, cultural and social contexts, with guidance that does not address the South African population. Language sample analysis is used as a partial response to the absence of appropriate standardised norms.","multilingualProvision":"South Africa is the sharpest case in this catalog of multilingualism being the whole problem rather than a complicating factor: eleven official spoken languages (plus South African Sign Language) make multilingual assessment the normal case, not the exception. The documented picture is a mismatch between requirement and capacity. The HPCSA requires cultural competence, but research reports that parts of the existing workforce in both public and private sectors do not meet it, and that there is a shortage of speech-language therapists fluent in and knowledgeable about African languages — with explicit implications for language rights and for language policy implementation. Where tools and language-matched clinicians are unavailable, informal 'solutions' are used — ad hoc translation and untrained interpreters — and the literature treats these as a risk to validity rather than an adequate workaround. Research also finds that less experienced therapists were significantly more likely than more experienced ones to be able to provide services and therapy materials in African languages, which points at the workforce pipeline rather than at individual practice as the lever. What bi- and multilingual children actually receive, as reported by the 41 respondents from South Africa who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 44%, in the mother tongue where it differs from the mainstream language 16% and in both languages 13%; intervention in the mainstream language only 39% and targeting two or more languages 18% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 57%, in intervention 54% and in counselling 59%. On whether the country offers training for practitioners working with bi/multilingual children (n = 41): obligatory 10%, optional 41%, none 12% and unsure 34%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","referralPathway":"Under SIAS, screening and identification start at school level with the School-Based Support Team (SBST), which escalates to the District-Based Support Team (DBST) where the school cannot meet the need. Support decided at district level may include strengthening the school's Individual Learner Support Plan (ILSP), classroom-level remedial support, educational-psychological assessment, assistive devices, speech and occupational therapy, or special-school placement — so speech and language therapy is named in policy as one option within a graduated response rather than as an entitlement in itself.","serviceModel":"Delivered by speech-language therapists in public health facilities and private practice, with an ongoing professional debate — reflected in the South African Journal of Communication Disorders — about the roles and responsibilities of speech-language therapists working in schools. Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 82 from South Africa): private practice 66%, mainstream school 51% and special school 34%, with respondents placing themselves in private 73%, public education 37% and public health 20%. Direct intervention for the reference child was most often weekly (49% of 82). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (88% yes), cost to parents (85% yes) and income level (78% yes) (n ≈ 41). Multiple answers were allowed (Law et al., 2020).","legalEntitlement":"Runs through inclusive-education policy rather than through a diagnosis. Education White Paper 6 (2001) set the national strategy for an inclusive education and training system, and the Screening, Identification, Assessment and Support (SIAS) policy (Department of Basic Education, 2014) operationalises it as a standardised process for identifying barriers to learning and allocating support. Entitlement therefore attaches to assessed support need under SIAS, not to a language-disorder diagnosis.","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 82 from South Africa): family 56%, private health insurance 21%, government education 18% and government health 13%. 15% said a maximum number of sessions applied (n = 82). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","workforce":"Registration and regulation by the Health Professions Council of South Africa (HPCSA). A shortage of therapists overall, and specifically of therapists who speak the African languages of the children they serve, is consistently reported.","policyHistory":"2001 — Education White Paper 6 sets the national strategy for an inclusive education and training system.\n2014 — Screening, Identification, Assessment and Support (SIAS) policy operationalises White Paper 6 as a standardised graduated-response process, naming speech therapy among the support options at district level."},"history":[{"year":"2001","description":"Education White Paper 6 sets the national strategy for an inclusive education and training system.","links":[{"label":"Education White Paper 6 — inclusive education (summary factsheet)","url":"http://www.included.org.za/R2ecwdsite/docs/Factsheet%203.pdf"},{"label":"Report on the implementation of Education White Paper 6 (Parliamentary Monitoring Group)","url":"https://static.pmg.org.za/160308overview.pdf"}]},{"year":"2014","description":"Screening, Identification, Assessment and Support (SIAS) policy operationalises White Paper 6 as a standardised graduated-response process, naming speech therapy among the support options at district level.","links":[{"label":"Education White Paper 6 — inclusive education (summary factsheet)","url":"http://www.included.org.za/R2ecwdsite/docs/Factsheet%203.pdf"},{"label":"Report on the implementation of Education White Paper 6 (Parliamentary Monitoring Group)","url":"https://static.pmg.org.za/160308overview.pdf"}]}],"docLinks":[{"label":"Are South African SLTs adequately equipped to assess EAL speakers from indigenous linguistic backgrounds?","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5843087/"},{"label":"Southwood — the challenge of linguistic and cultural diversity in managing children with language impairment","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5843084/"},{"label":"Wium — revisiting the roles and responsibilities of SLTs in South African schools (SAJCD)","url":"https://sajcd.org.za/index.php/sajcd/article/view/8/14"},{"label":"Winter et al. — how South African SLPs use language sample analysis for multilingual children (2026)","url":"https://onlinelibrary.wiley.com/doi/full/10.1111/1460-6984.70268"},{"label":"Education White Paper 6 — inclusive education (summary factsheet)","url":"http://www.included.org.za/R2ecwdsite/docs/Factsheet%203.pdf"},{"label":"Report on the implementation of Education White Paper 6 (Parliamentary Monitoring Group)","url":"https://static.pmg.org.za/160308overview.pdf"},{"label":"McKenzie et al. — universal design for learning in South African inclusive education policy (describes SIAS)","url":"https://ajod.org/index.php/ajod/article/view/776/1484"},{"label":"Inclusive education in South Africa: path dependencies and emergences","url":"https://www.tandfonline.com/doi/full/10.1080/13603116.2022.2061608"},{"label":"Managing Children with DLD (2019): South Africa chapter, Law et al. eds., Oosthuizen & Southwood, pp. 441-450","url":"https://doi.org/10.4324/9780429455308-37"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[{"label":"SASLHA — South African Speech-Language-Hearing Association","url":"https://www.saslha.co.za/"}],"collaborators":[]},{"cc":"ZM","name":"Zambia","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"ZW","name":"Zimbabwe","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]}],"fl":[],"adult":[],"ling":[]},"territories":[{"cc":"FR","name":"French Guiana","note":"An overseas department of France, on the South American mainland. French national policy applies to it unless something separate is documented.","polys":[[[[-51.66,4.16],[-52.25,3.24],[-52.56,2.5],[-52.94,2.12],[-53.42,2.05],[-53.56,2.33],[-53.78,2.38],[-54.09,2.11],[-54.52,2.31],[-54.27,2.73],[-54.18,3.19],[-54.01,3.62],[-54.4,4.21],[-54.48,4.9],[-53.96,5.76],[-53.62,5.65],[-52.88,5.41],[-51.82,4.57],[-51.66,4.16]]]],"bbox":[-54.52,2.05,-51.66,5.76]}],"domains":[{"id":"eal","label":"Majority language acquisition","blurb":"Support for children who arrive at school without the language it teaches in — known in schools as EAL.","live":true,"fields":[{"k":"newcomerCriteria","label":"Newcomer criteria"},{"k":"removalCriteria","label":"Removal criteria"},{"k":"newcomerProportion","label":"Newcomer proportion"},{"k":"l2Support","label":"L2 support"},{"k":"l1Support","label":"L1 support"},{"k":"l3Support","label":"L3 support"},{"k":"bilingualEducationNotes","label":"Bilingual education"},{"k":"policyHistory","label":"Policy history"}]},{"id":"dld","label":"Language disorder support","blurb":"Children with a lasting difficulty learning and using language: how it is identified, and what they are entitled to. Known in research as DLD.","live":true,"fields":[{"k":"terminology","label":"Terminology"},{"k":"identificationCriteria","label":"Identification criteria"},{"k":"assessments","label":"Assessments"},{"k":"multilingualProvision","label":"Multilingual provision"},{"k":"referralPathway","label":"Referral pathway"},{"k":"serviceModel","label":"Service model"},{"k":"legalEntitlement","label":"Legal entitlement"},{"k":"funding","label":"Funding"},{"k":"workforce","label":"Workforce"},{"k":"dischargeCriteria","label":"Discharge criteria"},{"k":"outcomesEvidence","label":"Outcomes evidence"},{"k":"identifiedPrevalence","label":"Identified prevalence"},{"k":"policyHistory","label":"Policy history"}]},{"id":"fl","label":"Foreign languages in school","blurb":"Compulsory or optional language learning by phase.","live":false,"planned":true,"fields":[]},{"id":"adult","label":"Majority language for adults","blurb":"Classes and entitlements for adults who move to a country, rather than children in its schools.","live":false,"planned":true,"fields":[]},{"id":"ling","label":"Studying language itself","blurb":"Where linguistics can be studied, in secondary school and beyond.","live":false,"planned":true,"fields":[]}]}</script>
<script>
const B = JSON.parse(document.getElementById('bundle').textContent);

/* ---------- Robinson projection ----------
   A world thematic map wants Robinson: it keeps mid-latitude shapes
   recognisable without Mercator's absurd polar inflation. */
const RX = [1,.9986,.9954,.99,.9822,.973,.96,.9427,.9216,.8962,.8679,.835,.7986,.7597,.7186,.6732,.6213,.5722,.5322];
const RY = [0,.062,.124,.186,.248,.31,.372,.434,.4958,.5571,.6176,.6769,.7346,.7903,.8435,.8936,.9394,.9761,1];
const K = 1000;
function project(lon, lat) {
  const a = Math.min(Math.abs(lat), 90);
  const i = Math.min(Math.floor(a / 5), 17), t = (a - i * 5) / 5;
  const x = RX[i] + (RX[i + 1] - RX[i]) * t;
  const y = RY[i] + (RY[i + 1] - RY[i]) * t;
  return [0.8487 * x * lon * Math.PI / 180 * K, -1.3523 * y * (lat < 0 ? -1 : 1) * K];
}

const REGION_VAR = {
  Africa: '--r-africa', Americas: '--r-americas', Asia: '--r-asia',
  Europe: '--r-europe', Oceania: '--r-oceania',
};
const cssvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- state ---------- */
const LIVE = B.domains.filter(d => d.live);
let domainId = LIVE[0].id;
let selected = null;         // unit key
let hovered = null;
const view = { k: 1, tx: 0, ty: 0 };
// Coastlines are simplified to ~1km, so past ~12x you are magnifying the
// simplification, not revealing detail.
const MAX_Z = 12;

const domain = () => B.domains.find(d => d.id === domainId);
const keyOf = u => u.cc + ':' + u.name;

/* Index every unit of every live domain once. */
const IDX = {};
for (const d of LIVE) {
  const byKey = new Map(), byCC = new Map();
  for (const u of B.units[d.id]) {
    byKey.set(keyOf(u), u);
    if (!byCC.has(u.cc)) byCC.set(u.cc, []);
    byCC.get(u.cc).push(u);
  }
  // The unit that owns the whole country outline: the national entry, or a
  // lone entry standing in for the country when no national one exists.
  const owner = new Map();
  for (const [cc, list] of byCC) {
    const nat = list.find(u => u.nat);
    if (nat) owner.set(cc, nat);
    else if (list.length === 1 && !B.subunits[keyOf(list[0])]) owner.set(cc, list[0]);
  }
  IDX[d.id] = { byKey, byCC, owner };
}

/* Shading answers one question only: is anything documented here?
   Which fields are and are not filled is the hover's job, and the full
   text is the panel's. */
function stateOf(u) { return u.coverage; }
const hueOf = u => cssvar(REGION_VAR[u.region] || '--r-europe');
function fillFor(u, st) {
  if (!u) return 'var(--nodata)';
  if (st === 'has') return `var(${REGION_VAR[u.region] || '--r-europe'})`;
  if (st === 'looked') return 'url(#hatch)';
  return 'var(--nodata)';
}
const STATE_LABEL = { has: 'Documented', looked: 'Looked, found nothing', none: 'Nothing recorded' };

/* ---------- build the scene once ---------- */
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

let ext = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
function pathFor(polys, box) {
  let d = '';
  for (const poly of polys) for (const ring of poly) {
    for (let i = 0; i < ring.length; i++) {
      const [px, py] = project(ring[i][0], ring[i][1]);
      d += (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
      if (px < ext.x0) ext.x0 = px; if (px > ext.x1) ext.x1 = px;
      if (py < ext.y0) ext.y0 = py; if (py > ext.y1) ext.y1 = py;
      if (box) {
        if (px < box.x0) box.x0 = px; if (px > box.x1) box.x1 = px;
        if (py < box.y0) box.y0 = py; if (py > box.y1) box.y1 = py;
      }
    }
    d += 'Z';
  }
  return d;
}

const defs = el('defs');
const pat = el('pattern', { id: 'hatch', patternUnits: 'userSpaceOnUse', width: 9, height: 9 });
pat.appendChild(el('rect', { width: 9, height: 9, fill: 'var(--hatch-bg)' }));
pat.appendChild(el('path', { d: 'M-2 2 L2 -2 M0 9 L9 0 M7 11 L11 7', stroke: 'var(--hatch-line)', 'stroke-width': 1.6 }));
defs.appendChild(pat);
svg.appendChild(defs);

const scene = el('g');
svg.appendChild(scene);
const gBase = el('g'), gSub = el('g'), gDot = el('g');
scene.append(gBase, gSub, gDot);

// One record per drawable shape. `key` links it back to a unit per domain.
const SHAPES = [];   // {node, cc, name|null, box}
const BOXES = {};    // key -> projected bbox

for (const [cc, c] of Object.entries(B.countries)) {
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const node = el('path', { d: pathFor(c.polys, box), class: 'unit' });
  node.dataset.cc = cc;
  gBase.appendChild(node);
  SHAPES.push({ node, cc, name: null, box });
  BOXES[cc] = box;
}
for (const [k, s] of Object.entries(B.subunits)) {
  const [cc, ...rest] = k.split(':');
  const name = rest.join(':');
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const node = el('path', { d: pathFor(s.polys, box), class: 'unit' });
  node.dataset.cc = cc; node.dataset.name = name;
  gSub.appendChild(node);
  SHAPES.push({ node, cc, name, box });
  BOXES[k] = box;
}
const TERR = [];
for (let i = 0; i < (B.territories || []).length; i++) {
  const t = B.territories[i];
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const node = el('path', { d: pathFor(t.polys, box), class: 'unit' });
  node.dataset.terr = String(i);
  gSub.appendChild(node);
  TERR.push({ node, t, box });
  BOXES['terr:' + i] = box;
}

/* A marker stands in for any unit too small to aim at. It holds a constant
   size on screen, so it fades out of the way as soon as zooming makes the
   real shape big enough to click. Units with no usable polygon at all keep
   their marker at every zoom. */
const DOTS = [];
function addMark(key, cx, cy, size, always) {
  const node = el('circle', { cx: cx.toFixed(1), cy: cy.toFixed(1), r: 4, class: 'dot' });
  gDot.appendChild(node);
  DOTS.push({ node, key, size, always });
  if (cx < ext.x0) ext.x0 = cx; if (cx > ext.x1) ext.x1 = cx;
  if (cy < ext.y0) ext.y0 = cy; if (cy > ext.y1) ext.y1 = cy;
  return node;
}
// Countries the geometry does not carry at all: anchored on their centroid.
for (const [cc, ll] of Object.entries(B.dots)) {
  if (B.countries[cc]) continue;
  const [px, py] = project(ll[0], ll[1]);
  addMark(cc, px, py, 0, true).dataset.cc = cc;
  BOXES[cc] = { x0: px, y0: py, x1: px, y1: py };
}
// Everything that does have a shape: a marker that only shows while small.
const CENTROID = {};
for (const [cc, ll] of Object.entries(B.dots)) CENTROID[cc] = project(ll[0], ll[1]);
for (const s of SHAPES.concat(TERR.map(t => ({ node: t.node, cc: t.t.cc, name: null, box: t.box, terr: t })))) {
  const b = s.box;
  if (!isFinite(b.x0)) continue;
  const size = Math.max(b.x1 - b.x0, b.y1 - b.y0);
  const c = (!s.name && !s.terr && CENTROID[s.cc]) ? CENTROID[s.cc] : [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];
  const node = addMark(null, c[0], c[1], size, false);
  node.dataset.cc = s.cc;
  if (s.name) node.dataset.name = s.name;
  if (s.terr) node.dataset.terr = s.node.dataset.terr;
}

const PAD = 30;
const VB = { x: ext.x0 - PAD, y: ext.y0 - PAD, w: (ext.x1 - ext.x0) + PAD * 2, h: (ext.y1 - ext.y0) + PAD * 2 };
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

/* ---------- paint ---------- */
function unitFor(cc, name) {
  const ix = IDX[domainId];
  if (name) return ix.byKey.get(cc + ':' + name) || null;
  return ix.owner.get(cc) || null;
}
const parentOf = u => (!u || u.nat) ? null : (IDX[domainId].owner.get(u.cc) || null);

/* A sub-unit exists because it differs from its country in SOME domain — the
   US states are split out because their EAL policy differs. In a domain where
   it has nothing of its own it does not become a hole in the country: it
   follows the national entry, which is what inheritance means. */
function resolve(cc, name) {
  const own = unitFor(cc, name);
  const nat = name ? (IDX[domainId].owner.get(cc) || null) : null;
  if (!name) return { unit: own, paint: own, inherited: false, via: null };
  if (!own) {
    // no entry at all in this domain — the shape stands in for the country
    return nat ? { unit: nat, paint: nat, inherited: true, via: name }
               : { unit: null, paint: null, inherited: false, via: null };
  }
  if (own.coverage !== 'has' && nat && nat.coverage === 'has') {
    return { unit: own, paint: nat, inherited: true, via: null };
  }
  return { unit: own, paint: own, inherited: false, via: null };
}

function paint() {
  const ix = IDX[domainId];
  for (const s of SHAPES) {
    const r = resolve(s.cc, s.name);
    // A country whose whole area is carved into sub-units (the UK) has no
    // entry of its own: draw it as an inert base beneath them.
    const carved = !s.name && !r.unit && (ix.byCC.get(s.cc) || []).some(x => B.subunits[keyOf(x)]);
    s.node.setAttribute('fill', carved ? 'var(--nodata)'
      : fillFor(r.paint, r.paint ? stateOf(r.paint) : 'none'));
    s.node.setAttribute('class', 'unit'
      + (carved ? ' base' : r.unit ? ' hit' : '')
      + (r.inherited ? ' inherited' : ''));
    s.node.dataset.key = r.unit ? keyOf(r.unit) : '';
    if (r.via) s.node.dataset.via = r.via; else delete s.node.dataset.via;
  }
  for (const { node, t } of TERR) {
    const u = unitFor(t.cc, null);
    node.dataset.via = t.name;
    node.setAttribute('fill', fillFor(u, u ? stateOf(u) : 'none'));
    node.setAttribute('class', 'unit' + (u ? ' hit' : ''));
    node.dataset.key = u ? keyOf(u) : '';
  }
  for (const d of DOTS) {
    const n = d.node;
    const r = resolve(n.dataset.cc, n.dataset.name || null);
    const u = r.unit || (n.dataset.name ? null : (IDX[domainId].byCC.get(n.dataset.cc) || [])[0]) || null;
    const pnt = r.paint || u;
    n.setAttribute('fill', fillFor(pnt, pnt ? stateOf(pnt) : 'none'));
    n.setAttribute('class', 'dot' + (r.inherited ? ' inherited' : ''));
    n.dataset.key = u ? keyOf(u) : '';
    if (r.via) n.dataset.via = r.via; else delete n.dataset.via;
    d.hasUnit = !!u;
  }
  updateMarks();
  markSelection();
  paintTally();
}

function markSelection() {
  for (const s of SHAPES) {
    if (s.node.classList.contains('base')) continue;
    s.node.classList.toggle('sel', !!selected && s.node.dataset.key === selected);
    s.node.classList.toggle('hov', !!hovered && s.node.dataset.key === hovered && hovered !== selected);
  }
  for (const d of DOTS.concat(TERR.map(x => ({ node: x.node })))) {
    d.node.classList.toggle('sel', !!selected && d.node.dataset.key === selected);
    d.node.classList.toggle('hov', !!hovered && d.node.dataset.key === hovered && hovered !== selected);
  }
  // Selected shapes last so their outline is never overdrawn by a neighbour.
  for (const s of SHAPES) if (s.node.classList.contains('sel')) s.node.parentNode.appendChild(s.node);
}

function paintTally() {
  const units = B.units[domainId];
  const c = { has: 0, looked: 0, none: 0 };
  for (const u of units) c[stateOf(u)]++;
  const bar = document.getElementById('tally');
  bar.innerHTML = '';
  const order = [['has', 'var(--r-europe)'], ['looked', 'url(#hatch)'], ['none', 'var(--nodata)']];
  for (const [k, col] of order) {
    if (!c[k]) continue;
    const d = document.createElement('div');
    d.className = 'seg';
    d.style.flex = c[k];
    d.style.background = k === 'looked'
      ? `repeating-linear-gradient(45deg, ${cssvar('--hatch-bg')} 0 3px, ${cssvar('--hatch-line')} 3px 4px)`
      : col;
    d.title = `${STATE_LABEL[k]}: ${c[k]}`;
    bar.appendChild(d);
  }
  // Counts each unit's OWN record. Inherited fills add colour to the map
  // without adding research, so they are deliberately not counted here.
  document.getElementById('tallylabels').innerHTML =
    `<span>${c.has} with their own record</span><span>${c.none + c.looked} without</span>`;
}

/* ---------- pan & zoom ----------
   Same canvas mechanics as the syntax-tree viewer: one finger or the mouse
   pans, two fingers pinch, ctrl/⌘-wheel zooms, plain wheel scrolls the view. */
// A fingertip needs a bigger target than a cursor, so both the marker and the
// size below which a shape gets one grow on a touch screen.
const COARSE = matchMedia('(pointer: coarse)').matches;
const MARK_MIN_PX = COARSE ? 20 : 13;
const MARK_R_PX = COARSE ? 7 : 4.5;
function updateMarks() {
  // r is authored in viewBox units, so convert from the screen size we want.
  const s = baseScale() * view.k;
  if (!s) return;
  const r = (MARK_R_PX / s).toFixed(2);
  for (const d of DOTS) {
    d.node.setAttribute('r', r);
    d.node.style.display = (d.hasUnit && (d.always || d.size * s < MARK_MIN_PX)) ? '' : 'none';
  }
}
function applyView() {
  scene.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  pat.setAttribute('patternTransform', `scale(${1 / view.k})`);
  updateMarks();
}
function baseScale() {
  const r = svg.getBoundingClientRect();
  return Math.min(r.width / VB.w, r.height / VB.h);
}
function screenToContent(sx, sy) {
  const r = svg.getBoundingClientRect(), s = baseScale();
  const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
  const vx = (sx - ox) / s + VB.x, vy = (sy - oy) / s + VB.y;
  return [(vx - view.tx) / view.k, (vy - view.ty) / view.k];
}
function zoomAt(sx, sy, factor) {
  const [cx, cy] = screenToContent(sx, sy);
  const k = Math.max(1, Math.min(MAX_Z, view.k * factor));
  if (k === view.k) return;
  const r = svg.getBoundingClientRect(), s = baseScale();
  const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
  const vx = (sx - ox) / s + VB.x, vy = (sy - oy) / s + VB.y;
  view.k = k; view.tx = vx - k * cx; view.ty = vy - k * cy;
  clampView(); applyView();
}
function clampView() {
  // Keep at least a third of the viewport covered by the map in each axis.
  const spanX = VB.w * view.k, spanY = VB.h * view.k;
  const minTx = VB.x + VB.w - spanX - VB.x * view.k - VB.w * 0.66;
  view.tx = Math.min(VB.x + VB.w * 0.66 - VB.x * view.k, Math.max(minTx, view.tx));
  const minTy = VB.y + VB.h - spanY - VB.y * view.k - VB.h * 0.66;
  view.ty = Math.min(VB.y + VB.h * 0.66 - VB.y * view.k, Math.max(minTy, view.ty));
}
function resetView() { view.k = 1; view.tx = 0; view.ty = 0; applyView(); }

function zoomToBox(box, margin = 5) {
  // Margin keeps the neighbours in frame: a unit shown with no surroundings
  // is much harder to place than one shown in its region.
  const w = Math.max(box.x1 - box.x0, 6) * margin, h = Math.max(box.y1 - box.y0, 6) * margin;
  const k = Math.max(1, Math.min(MAX_Z, Math.min(VB.w / w, VB.h / h)));
  const cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
  view.k = k;
  view.tx = VB.x + VB.w / 2 - k * cx;
  view.ty = VB.y + VB.h / 2 - k * cy;
  clampView(); applyView();
}

const ptrs = new Map();
let anchor = null, moved = false;
svg.addEventListener('pointerdown', ev => {
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  moved = false;
  if (ptrs.size === 1) {
    anchor = { mode: 'pan', x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
    svg.classList.add('dragging');
  } else if (ptrs.size === 2) {
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
    const [a, b] = [...ptrs.values()];
    anchor = { mode: 'pinch', dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: view.k,
               mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    anchor.c = screenToContent(anchor.mx, anchor.my);
  }
});
svg.addEventListener('pointermove', ev => {
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (anchor && anchor.mode === 'pan' && ptrs.size === 1) {
    const s = baseScale();
    const dx = ev.clientX - anchor.x, dy = ev.clientY - anchor.y;
    if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
      moved = true;
      // Capture only now: taking it on pointerdown would retarget the click.
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
    }
    view.tx = anchor.tx + dx / s; view.ty = anchor.ty + dy / s;
    clampView(); applyView();
    hideTip();
    return;
  }
  if (anchor && anchor.mode === 'pinch' && ptrs.size === 2) {
    moved = true;
    const [a, b] = [...ptrs.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const k = Math.max(1, Math.min(MAX_Z, anchor.k * (dist / anchor.dist)));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = svg.getBoundingClientRect(), s = baseScale();
    const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
    view.k = k;
    view.tx = ((mx - ox) / s + VB.x) - k * anchor.c[0];
    view.ty = ((my - oy) / s + VB.y) - k * anchor.c[1];
    clampView(); applyView();
    return;
  }
  hoverAt(ev);
});
function endPtr(ev) {
  ptrs.delete(ev.pointerId);
  if (ptrs.size === 0) { anchor = null; svg.classList.remove('dragging'); }
  else if (ptrs.size === 1) {
    const p = [...ptrs.values()][0];
    anchor = { mode: 'pan', x: p.x, y: p.y, tx: view.tx, ty: view.ty };
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('pointerleave', () => { hovered = null; markSelection(); hideTip(); });

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0025));
  } else {
    const s = baseScale();
    view.tx -= ev.deltaX / s; view.ty -= ev.deltaY / s;
    clampView(); applyView();
  }
}, { passive: false });

document.getElementById('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5); };
document.getElementById('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5); };
document.getElementById('zreset').onclick = resetView;

/* ---------- hover & select ---------- */
const tip = document.getElementById('tip');
function hideTip() { tip.classList.remove('on'); }

// Hit-test the point rather than trusting ev.target: pointer capture and
// the tooltip both sit between the cursor and the shape underneath it.
function shapeAt(ev) {
  const prev = tip.style.pointerEvents;
  tip.style.pointerEvents = 'none';
  const t = document.elementFromPoint(ev.clientX, ev.clientY);
  tip.style.pointerEvents = prev;
  if (!(t instanceof SVGElement)) return null;
  if (!t.classList.contains('hit') && !t.classList.contains('dot')) return null;
  return t;
}
function targetKey(ev) {
  const t = shapeAt(ev);
  return t ? (t.dataset.key || null) : null;
}
function hoverAt(ev) {
  const node = shapeAt(ev);
  const key = node ? (node.dataset.key || null) : null;
  if (key !== hovered) { hovered = key; markSelection(); }
  if (!key) return hideTip();
  const u = IDX[domainId].byKey.get(key);
  if (!u) return hideTip();
  const terr = node.dataset.terr ? B.territories[+node.dataset.terr] : null;
  tip.innerHTML = tipHTML(u, terr, node.dataset.via || null,
    node.classList.contains('inherited'));
  tip.classList.add('on');
  const r = document.getElementById('stage').getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 16;
  if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 16;
  if (y + th > r.height - 8) y = ev.clientY - r.top - th - 16;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
svg.addEventListener('click', ev => {
  if (moved) return;
  const node = shapeAt(ev);
  if (!node || !node.dataset.key) { closePanel(); return; }
  const terr = node.dataset.terr ? B.territories[+node.dataset.terr] : null;
  const via = terr ? { name: terr.name, note: terr.note }
    : node.dataset.via ? { name: node.dataset.via, note: null } : null;
  select(node.dataset.key, false, via);
});

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escAttr = esc;   // esc already escapes the double quote

/* ------------------------------------------------------------------
   In-text citation linking, lifted verbatim from the DLD catalogue's
   catalog.html so the two stay in step. Resolves a citation first
   against the entry's own docLinks labels, then against the DOI
   registry; anything that resolves to neither stays plain text.
   ------------------------------------------------------------------ */
const REFERENCES = {
  "armon-lotem|2016": "https://doi.org/10.1111/1460-6984.12242",
  "almeida|2017": "https://doi.org/10.1075/lab.15019.alm",
  "fleckstein|2018": "https://doi.org/10.1080/10489223.2016.1192635",
  "tuller|2018": "https://doi.org/10.1111/1460-6984.12397",
  "hamann|2017": "https://doi.org/10.3389/fcomm.2017.00016",
  "chondrogianni|2018": "https://doi.org/10.1111/1460-6984.12363",
  "antonijevic|2017": "https://doi.org/10.1075/lab.15026.ant",
  "antonijevic-elliott|2019": "https://doi.org/10.1080/02699206.2019.1637458",
  "gavarró|2017": "https://doi.org/10.3389/fpsyg.2017.01865",
  // The COST IS1406 volume cited in every vignette stub note.
  "law|2019": "https://doi.org/10.4324/9780429455308",
};

// An author-ish run immediately before a year, in either narrative
// "Author (2016)" or parenthetical "(Author et al., 2016)" form. The run is
// deliberately permissive and capped in length; correctness comes from
// resolution, not from parsing — a run that resolves to nothing stays plain.
// String.raw, not plain quotes: these are regex fragments, and inside an
// ordinary string literal "\w" collapses to "w" before RegExp ever sees it.
const NAME = String.raw`[A-ZÀ-Þ][\w'’À-ɏ-]+`;
const AUTHORISH = "(?:" + NAME + String.raw`|[A-ZÀ-Þ]\.|&amp;|and|et|al\.|de|van|von|den|der|ter|di|da|la|le)`;
const RUN = AUTHORISH + String.raw`(?:[,\s]+` + AUTHORISH + "){0,5}";
const YEARS = String.raw`((?:19|20)\d{2})[a-z]?(?:,\s*(?:19|20)\d{2}[a-z]?)*`;
const NARRATIVE_RE = new RegExp(RUN + String.raw`[,\s]*\(` + YEARS + String.raw`\)`, "g");
const PARENTHETICAL_RE = new RegExp(String.raw`\(` + RUN + String.raw`,?\s*` + YEARS + String.raw`\)`, "g");

function citationKey(surname, year) {
  return surname.toLowerCase().replace(/['\u2019]/g, "") + "|" + year;
}

// A source link on this same entry resolves a citation when its label names
// both the surname and the year — which is how the seed labels are written
// ("Norbury et al. (2016), SCALES prevalence study").
function resolveFromDocLinks(entry, surname, year) {
  // Same normalisation as citationKey — otherwise a surname with an apostrophe
  // matches the registry but never its own source link.
  const lower = surname.toLowerCase().replace(/['’]/g, "");
  const hit = (entry.docLinks || []).find(d => {
    const l = (d.label || "").toLowerCase();
    return l.includes(lower) && l.includes(year);
  });
  return hit ? hit.url : null;
}

// Try every capitalised token against every year in the match. This is what
// makes "See Chondrogianni & John (2018)" work — "See" simply resolves to
// nothing and the next candidate is tried.
function resolveCitation(matchText, entry) {
  const names = matchText.match(new RegExp(NAME, "g")) || [];
  const years = matchText.match(/(?:19|20)\d{2}/g) || [];
  for (const n of names) {
    // All-caps tokens are acronyms, not surnames ("TOS' (2016)" is a document
    // title, and its own source pill sits at the foot of the card).
    if (n.length > 1 && n === n.toUpperCase()) continue;
    for (const y of years) {
      const url = REFERENCES[citationKey(n, y)] || resolveFromDocLinks(entry, n, y);
      if (url) return { url, name: n };
    }
  }
  return null;
}

// Runs over already-escaped HTML, and only ever wraps a plain run in an <a>.
const KEEP_IN_LINK = /^[(\s]*(?:(?:de|van|von|den|der|ter|di|da|la|le)\s+)?$/i;

function linkCitations(escapedText, entry) {
  const wrap = (match) => {
    const hit = resolveCitation(match, entry);
    if (!hit) return match;
    // The run can absorb a leading ordinary word ("See Chondrogianni…",
    // "and Tuller…"). Start the link at the surname that actually resolved so
    // the anchor text is the citation and nothing else.
    const at = match.indexOf(hit.name);
    let lead = at > 0 ? match.slice(0, at) : "";
    let cite = at > 0 ? match.slice(at) : match;
    // An opening bracket or a lowercase name particle belongs to the citation,
    // not to the sentence — otherwise "(Bishop…2017)" links with an unbalanced
    // paren and "de Almeida" loses its "de".
    if (lead && KEEP_IN_LINK.test(lead)) { cite = lead + cite; lead = ""; }
    return `${lead}<a class="cite" href="${escAttr(hit.url)}" target="_blank" rel="noopener">${cite}</a>`;
  };
  return escapedText.replace(NARRATIVE_RE, wrap).replace(PARENTHETICAL_RE, wrap);
}
const swatch = (u, st) => {
  if (st === 'has') return `<span class="sw" style="background:${cssvar(REGION_VAR[u.region] || '--r-europe')}"></span>`;
  if (st === 'looked') return `<span class="sw" style="background:repeating-linear-gradient(45deg,${cssvar('--hatch-bg')} 0 3px,${cssvar('--hatch-line')} 3px 4px)"></span>`;
  return `<span class="sw" style="background:${cssvar('--nodata')}"></span>`;
};

function fieldMarks(u, d) {
  return d.fields.map((f, i) => {
    const c = u.fieldStates[i];
    const cls = c === 'h' ? 'on' : c === 'l' ? 'looked' : '';
    return `<span class="${cls}">${esc(f.label)}</span>`;
  }).join('');
}

function tipHTML(u, terr, via, inheriting) {
  const d = domain();
  const sibs = (IDX[domainId].byCC.get(u.cc) || []).filter(x => x !== u);
  const countryName = (B.countries[u.cc] || {}).name || u.cc;

  // When the shape follows its country, every number and marker has to come
  // from the country's entry — that is the record actually on offer here.
  const nat = IDX[domainId].owner.get(u.cc) || null;
  const src = (inheriting && !via && nat) ? nat : u;
  const st = stateOf(src);
  const nDoc = src.filled.length;

  let inherit = '';
  if (terr) {
    inherit = `${esc(terr.note)}`;
  } else if (via) {
    inherit = `No separate ${esc(d.label)} entry for ${esc(via)}. What applies is the <b>${esc(u.name)}</b> record shown here.`;
  } else if (inheriting) {
    inherit = `Nothing recorded for ${esc(u.name)} itself in this domain, so it follows <b>${esc(nat ? nat.name : countryName)}</b>. It is a separate unit because it differs in another domain.`;
  } else if (u.nat && sibs.length) {
    inherit = `${sibs.length} sub-national entr${sibs.length === 1 ? 'y' : 'ies'} also exist for ${esc(u.name)}. Each one falls back to this record where it has nothing of its own.`;
  } else if (sibs.length) {
    inherit = nat
      ? `Sits inside <b>${esc(nat.name)}</b>. Anything not recorded here follows the national entry.`
      : `${sibs.length + 1} separate entries for ${esc(countryName)} — nothing is recorded at national level, so none of them inherit.`;
  }

  const label = terr ? terr.name : (via || u.name);
  const meta = (terr || via) ? esc(u.name) + ' · shows that entry'
    : esc(u.subregion || u.region) + (u.nat ? ' · national' : ' · sub-national');
  return `
    <div class="name">${esc(label)}</div>
    <div class="meta">${meta}</div>
    <div class="state">${swatch(src, st)} ${nDoc} of ${d.fields.length} fields documented${src !== u ? ' by ' + esc(src.name) : ''}</div>
    <div class="fieldgrid" style="--mark:${hueOf(src)}">${fieldMarks(src, d)}</div>
    ${inherit ? `<div class="inherit">${inherit}</div>` : ''}
    <div class="hintline">Click for the full entry</div>`;
}

/* ---------- detail panel ---------- */
const panel = document.getElementById('panel');
function closePanel() { selected = null; panel.classList.remove('on'); markSelection(); }

function select(key, zoom, via) {
  const u = IDX[domainId].byKey.get(key);
  if (!u) return;
  selected = key;
  markSelection();
  panel.innerHTML = panelHTML(u, via);
  panel.classList.add('on');
  panel.scrollTop = 0;
  panel.querySelector('.close').onclick = closePanel;
  panel.querySelectorAll('.sibs button[data-key]').forEach(b => {
    b.onclick = () => select(b.dataset.key, true);
  });
  if (zoom) {
    const box = BOXES[key] || BOXES[u.cc];
    if (box) zoomToBox(box);
  }
}

// Each dated row links to the policy it names, where the entry's own sources
// hold it. Rows whose document could not be identified stay as plain text.
function historyHTML(rows, entry) {
  return `<ol class="hist">` + (rows || []).map(h => `<li>
      <span class="yr">${esc(h.year)}</span>
      <div>
        ${linkCitations(esc(h.description), entry) ? `<p>${linkCitations(esc(h.description), entry)}</p>` : ''}
        ${h.links.length ? `<div class="links">${linkList(h.links)}</div>` : ''}
      </div>
    </li>`).join('') + `</ol>`;
}

function linkList(links) {
  return links.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a>`
  ).join('');
}

function panelHTML(u, via) {
  const d = domain();
  const st = stateOf(u);
  const hue = hueOf(u);
  const countryName = (B.countries[u.cc] || {}).name || u.cc;
  const sibs = (IDX[domainId].byCC.get(u.cc) || []).filter(x => x !== u);
  const nat = sibs.find(x => x.nat);

  // Every field, in order. A field this unit has nothing of its own for falls
  // back to its country's text, marked as inherited rather than presented as
  // the unit's own work.
  const par = parentOf(u);
  let nInherited = 0;
  const block = (cls, label, body, from) =>
    `<div class="field ${cls}"><h4>${esc(label)}${from ? `<span class="from">inherited from ${esc(from)}</span>` : ''}</h4>${body}</div>`;
  const prose = (text, entry) => `<p>${linkCitations(esc(text), entry)}</p>`;
  const fields = d.fields.map((f, i) => {
    const c = u.fieldStates[i];
    const isHist = f.k === 'policyHistory';
    if (c === 'h') return block('on', f.label, isHist ? historyHTML(u.history, u) : prose(u.values[f.k], u));
    if (c === 'l') return block('looked', f.label, prose(u.values[f.k], u));
    const inheritable = par && (isHist ? (par.history || []).length : par.values[f.k]);
    if (inheritable) {
      nInherited++;
      return block('inh', f.label,
        isHist ? historyHTML(par.history, par) : prose(par.values[f.k], par), par.name);
    }
    return block('empty', f.label, '<p>Not recorded.</p>');
  }).join('');

  const cross = LIVE.map(dd => {
    const other = IDX[dd.id].byKey.get(keyOf(u));
    return `<div class="r">${other ? swatch(other, other.coverage) : swatch(u, 'none')}
      <span>${esc(dd.label)}</span>
      <span class="n">${other ? other.filled.length + '/' + other.nFields + ' fields' : 'no entry'}</span></div>`;
  }).join('');

  const sibRows = sibs.map(x =>
    `<button data-key="${esc(keyOf(x))}">${swatch(x, stateOf(x))}<span>${esc(x.name)}</span>
      <span class="role">${x.nat ? 'national' : 'sub-national'}</span></button>`).join('');

  const inheritNote = !sibs.length ? ''
    : u.nat
      ? `These sub-national units exist because they differ somewhere. In this domain each of them falls back to the record above wherever it has nothing of its own.`
      : nat
        ? `A field left blank here is not necessarily a gap in the record — it falls back to <b>${esc(nat.name)}</b>, marked as inherited above.`
        : `${esc(countryName)} has no national entry in this domain, so these ${sibs.length + 1} units inherit nothing from each other. Every field has to be documented separately.`;

  return `
  <div class="inner" style="--mark:${hue}">
    <button class="close" aria-label="Close">×</button>
    <div class="eyebrow">${esc(u.nat ? 'National' : 'Sub-national')} · ${esc(d.label)}</div>
    <h2>${esc(u.name)}</h2>
    <div class="where">${esc(u.nat ? u.subregion || u.region : countryName + ' · ' + (u.subregion || u.region))}</div>
    ${via ? `<p class="viaterr">You clicked <b>${esc(via.name)}</b>. ${via.note
      ? esc(via.note)
      : `There is no separate ${esc(d.label)} entry for it, so what applies is the ${esc(u.name)} record below.`}</p>` : ''}
    ${nInherited && !via ? `<p class="viaterr">${nInherited} of these ${d.fields.length} fields have nothing recorded for ${esc(u.name)} itself and follow <b>${esc(par.name)}</b>. They are marked below.</p>` : ''}

    <div class="chips">
      <span class="chip">${u.filled.length}/${d.fields.length} fields</span>
      <span class="chip">${esc(u.status)}</span>
      <span class="chip">${esc(u.confidence.replace(/-/g, ' '))}</span>
      ${u.lastVerified ? `<span class="chip">verified ${esc(u.lastVerified)}</span>` : ''}
    </div>

    <div class="sect">
      <h3>The entry</h3>
      ${fields}
    </div>

    ${u.docLinks.length ? `<div class="sect"><h3>Evidence for this entry</h3>
      <div class="links">${linkList(u.docLinks)}</div></div>` : ''}
    ${u.supportLinks.length ? `<div class="sect"><h3>Support available there</h3>
      <div class="links">${linkList(u.supportLinks)}</div></div>` : ''}

    <div class="sect">
      <h3>Across domains</h3>
      <div class="cross">${cross}</div>
    </div>

    ${u.collaborators.length ? `<div class="sect"><h3>Contributors</h3>
      <dl class="kv"><dt>Worked on by</dt><dd>${esc(u.collaborators.join(', '))}</dd></dl></div>` : ''}

    ${sibs.length ? `<div class="sect">
      <h3>Others in ${esc(countryName)}</h3>
      <div class="sibs">${sibRows}</div>
      <p class="caveat" style="margin-top:12px">${inheritNote}</p>
    </div>` : ''}
  </div>`;
}

/* ---------- chrome ---------- */
function buildDomains() {
  const nav = document.getElementById('domains');
  nav.innerHTML = '';
  for (const d of B.domains) {
    const b = document.createElement('button');
    b.textContent = d.label;
    b.disabled = !d.live;
    b.title = d.blurb;
    if (d.live) {
      b.setAttribute('aria-current', String(d.id === domainId));
      b.onclick = () => { domainId = d.id; closePanel(); buildDomains(); paint(); };
    }
    nav.appendChild(b);
  }
  document.getElementById('domainName').textContent = domain().label;
  document.getElementById('blurb').textContent = domain().blurb;
}

/* search */
const search = document.getElementById('search'), results = document.getElementById('results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  results.innerHTML = '';
  if (q.length < 2) return;
  const hits = B.units[domainId]
    .filter(u => u.name.toLowerCase().includes(q) || u.cc.toLowerCase() === q ||
                 (u.subregion || '').toLowerCase().includes(q) || u.region.toLowerCase().includes(q))
    .slice(0, 40);
  for (const u of hits) {
    const b = document.createElement('button');
    b.innerHTML = `${swatch(u, stateOf(u))}<span>${esc(u.name)}</span><span class="sub">${esc(u.subregion || u.region)}</span>`;
    b.onclick = () => { select(keyOf(u), true); results.innerHTML = ''; search.value = ''; };
    results.appendChild(b);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchwrap')) results.innerHTML = '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); results.innerHTML = ''; } });

/* legend swatches */
function paintLegend() {
  document.getElementById('sw-has').style.background =
    `linear-gradient(90deg, ${cssvar('--r-africa')}, ${cssvar('--r-americas')}, ${cssvar('--r-asia')}, ${cssvar('--r-europe')}, ${cssvar('--r-oceania')})`;
  document.getElementById('sw-looked').style.background =
    `repeating-linear-gradient(45deg, ${cssvar('--hatch-bg')} 0 3px, ${cssvar('--hatch-line')} 3px 4px)`;
  document.getElementById('sw-none').style.background = cssvar('--nodata');
  const inh = document.getElementById('sw-inh');
  inh.style.background = cssvar('--r-europe');
  inh.style.borderStyle = 'dashed';
  inh.style.borderColor = cssvar('--surface');
  const hues = document.getElementById('hues');
  hues.innerHTML = ['--r-africa', '--r-americas', '--r-asia', '--r-europe', '--r-oceania']
    .map(v => `<span style="background:${cssvar(v)}"></span>`).join('');
}

buildDomains(); paint(); applyView(); paintLegend();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintLegend(); paintTally(); });
addEventListener('resize', () => { clampView(); applyView(); });
</script>

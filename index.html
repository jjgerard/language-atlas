e more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Finland chapter, Law et al. eds., Kunnari, Laasonen & Smolander, pp. 215-224","url":"https://doi.org/10.4324/9780429455308-15"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"FJ","name":"Fiji","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"FM","name":"Micronesia","nat":true,"region":"Oceania","subregion":"Micronesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"FR","name":"France","nat":true,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhhnhnhnnnnn","filled":["Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":5,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for French, developed by Philippe Prévost, Laurie Tuller and Racha Zebib (University of Tours). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. One of the best-evidenced tasks in the set: see de Almeida et al. (2017), Linguistic Approaches to Bilingualism 7, 331–358; Fleckstein et al. (2018), Language Acquisition 25(1), 85–101; and Tuller et al. (2018), IJLCD 53(4), 888–904, which reports identification of language impairment in bilingual children in France and Germany together. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 66 respondents from France who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 82%, in the mother tongue where it differs from the mainstream language 10% and in the mother tongue only 10%; intervention in the mainstream language only 85% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 26%, in intervention 21% and in counselling 34%. On whether the country offers training for practitioners working with bi/multilingual children (n = 78): optional 51%, none 23% and unsure 26%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 197 from France): private practice 84%, with respondents placing themselves in private 58% and public health 30%. Direct intervention for the reference child was most often twice weekly (55% of 197). Asked which factors affect access to services in their country, respondents most often named social position (63% yes), urban or rural residence (54% yes) and parental education (51% yes) (n ≈ 70). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 197 from France): government health 90%, private health insurance 20% and family 8%. 10% said a maximum number of sessions applied (n = 195). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): France chapter, Law et al. eds., Kern & Topouzkhanian, pp. 225-234","url":"https://doi.org/10.4324/9780429455308-16"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"GA","name":"Gabon","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GB","name":"England","nat":false,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"official-document","lastVerified":"2026-08","coverage":"has","fieldStates":"hhhhhhhhhhhhh","filled":["Terminology","Identification criteria","Assessments","Multilingual provision","Referral pathway","Service model","Legal entitlement","Funding","Workforce","Discharge criteria","Outcomes evidence","Identified prevalence","Policy history"],"looked":[],"nFields":13,"docs":11,"supports":3,"values":{"terminology":"'Developmental language disorder' (DLD) is the term used clinically, following the CATALISE consensus (Bishop et al., 2016, 2017); it replaced 'specific language impairment' (SLI). Education legislation does not use 'DLD' at all — the statutory category is the much broader 'speech, language and communication needs' (SLCN), one of four areas of need in the SEND Code of Practice. The two vocabularies do not map onto each other cleanly, which is a recurring source of confusion between health and education services.","identificationCriteria":"No single statutory threshold. Clinically, identification follows CATALISE: language difficulties that create functional impairment, are unlikely to resolve by 5 years, and are not better accounted for by a differentiating biomedical condition (e.g. autism, sensorineural hearing loss, brain injury, genetic syndrome). CATALISE explicitly abandoned the discrepancy/cognitive-referencing criterion, so a non-verbal IQ cut-off is no longer required. Diagnosis is made by a speech and language therapist (SLT), usually with multidisciplinary input. Educational entitlement is decided separately, on the basis of SEND need rather than diagnosis.","assessments":"No mandated national battery — the choice of tool sits with the SLT service. Standardised assessments normed on UK English are in common use; practice guidance emphasises combining standardised scores with functional, curriculum-based and observational evidence rather than relying on a single cut-off. Because eligibility is need-based rather than score-based, services differ in what they treat as the threshold for input, and this is one of the main sources of local variation. A LITMUS sentence repetition (SRep) task exists for English, developed by Theodoros Marinis (University of Konstanz and University of Reading), Shula Chiat (City University London) and Sharon Armon-Lotem (Bar-Ilan University). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Weakly specified — this is a known gap rather than a settled policy. UK English norms do not apply to multilingual children, and RCSLT guidance requires assessment across all of a child's languages, with a trained interpreter or bilingual co-worker where the SLT does not share the language. In practice, availability of bilingual assessment, interpreters and appropriately normed tools varies widely by service and by language. The COST Action IS0804 LITMUS tools (sentence repetition, quasi-universal non-word repetition, MAIN narrative, PaBiQ parental questionnaire) exist for exactly this problem, but uptake in routine NHS practice is patchy. The practical consequence — multilingual children being either over-referred (typical L2 acquisition read as disorder) or under-referred (genuine DLD dismissed as 'just EAL') — is well documented but not addressed by any statutory instrument. What bi- and multilingual children actually receive, as reported by the 72 respondents from United Kingdom who answered Section 4 of the COST Action IS1406 survey (2017): assessment in both languages 45%, in the mother tongue where it differs from the mainstream language 42% and in the mainstream language only 15%; intervention in the mainstream language only 51% and targeting two or more languages 11% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 97%, in intervention 64% and in counselling 42%. On whether the country offers training for practitioners working with bi/multilingual children (n = 77): optional 68%, none 3% and unsure 27%. These are practitioner perceptions rather than a record of policy (Law et al., 2020). The survey did not separate the four UK nations, so this covers the UK as a whole.","referralPathway":"Open referral in most areas: parents, schools, health visitors and GPs can all refer directly to the NHS children's SLT service. There is no universal population screening for language. Separately, a parent, school or young person can request an EHC needs assessment from the local authority.","serviceModel":"Split across two systems. Assessment and therapy sit with NHS speech and language therapy services, commissioned locally; educational provision sits with schools and local authorities under the SEND framework. Delivery is typically a mix of direct therapy, indirect/consultative work delivered by school staff or parents, and training — with a strong policy push towards the indirect and universal/targeted end. The SEND Code of Practice states that SLT provision should normally be treated as educational provision, which places ultimate responsibility for delivering it with the local authority when it is written into sections B and F of an EHC plan. Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 144 from United Kingdom): mainstream school 88%, health clinic or centre 56% and nursery or kindergarten 44%, with respondents placing themselves in public health 80% and public education 33%. Direct intervention for the reference child was most often weekly (41% of 132). Asked which factors affect access to services in their country, respondents most often named regional variation (40% yes) (n ≈ 64). Multiple answers were allowed (Law et al., 2020). The survey did not separate the four UK nations, so this covers the UK as a whole.","legalEntitlement":"A DLD diagnosis on its own confers no entitlement. Entitlement runs through the Children and Families Act 2014: 'SEN support' at school level, or a statutory EHC plan (0–25) where needs cannot be met from the school's own resources. Where SLT is specified in sections B and F of an EHC plan, the local authority has an absolute duty to secure it — which is why the health/education classification of SLT provision is so heavily litigated.","funding":"Mixed and indirect. NHS SLT services are funded through local NHS commissioning; school-level SEN support is funded from the school's notional SEN budget (first ~£6,000 per pupil); provision above that is funded from the local authority's high-needs block. There is no per-child DLD funding stream. Bercow: Ten Years On found provision to be inconsistent across the country and reported significant unmet need and waiting times, attributing much of it to commissioning and resourcing rather than to the evidence base. Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 144 from United Kingdom): government health 60% and government education 47%. 28% said a maximum number of sessions applied (n = 134). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020). The survey did not separate the four UK nations, so this covers the UK as a whole.","workforce":"Speech and language therapists, regulated by the Health and Care Professions Council (HCPC), with the Royal College of Speech and Language Therapists (RCSLT) as the professional body. Much intervention is delivered by SLT assistants, teaching assistants and teachers under SLT direction. Workforce capacity relative to caseload is a long-standing pressure point.","dischargeCriteria":"No national rule — set service by service, typically on episode-of-care models (a block of intervention, review, then discharge to school-delivered support with re-referral open). This is a substantive difference from EAL status, which typically expires on a fixed timetable: DLD is understood as persistent, so 'discharge' means the end of a therapy episode, not the end of the condition or of educational need.","outcomesEvidence":"SCALES and related longitudinal work show language difficulties at school entry are highly stable, with limited catch-up during primary school, and are associated with poorer academic attainment and elevated social, emotional and behavioural difficulties. Routine education data does not report attainment for DLD as a category (the SEND census records SLCN), so system-level outcome monitoring for DLD specifically is not available.","identifiedPrevalence":"2016 — 7.58 — % of children at age 5–6 meeting DLD criteria — SCALES population study (Norbury et al., 2016), ~2 children per Year 1 class. A further 2.34% had language disorder associated with a biomedical condition. This is an epidemiological estimate, not the proportion actually identified by services.","policyHistory":"2008 — Bercow Review of services for children and young people (0–19) with speech, language and communication needs (SLCN).\n2014-2015 — Children and Families Act 2014 and the SEND Code of Practice (0–25); Statements replaced by Education, Health and Care (EHC) plans.\n2017 — CATALISE consensus published; 'developmental language disorder' begins to replace 'specific language impairment' in UK clinical usage.\n2018 — Bercow: Ten Years On (I CAN / RCSLT) — review of SLCN provision a decade after the original Bercow Review."},"history":[{"year":"2008","description":"Bercow Review of services for children and young people (0–19) with speech, language and communication needs (SLCN).","links":[]},{"year":"2014-2015","description":"Children and Families Act 2014 and the SEND Code of Practice (0–25); Statements replaced by Education, Health and Care (EHC) plans.","links":[{"label":"SEND Code of Practice: 0 to 25 years (2015)","url":"https://www.gov.uk/government/publications/send-code-of-practice-0-to-25"},{"label":"Children and Families Act 2014, Part 3","url":"https://www.legislation.gov.uk/ukpga/2014/6/part/3"}]},{"year":"2017","description":"CATALISE consensus published; 'developmental language disorder' begins to replace 'specific language impairment' in UK clinical usage.","links":[{"label":"Bishop et al. (2017), CATALISE Phase 2 — terminology","url":"https://acamh.onlinelibrary.wiley.com/doi/10.1111/jcpp.12721"}]},{"year":"2018","description":"Bercow: Ten Years On (I CAN / RCSLT) — review of SLCN provision a decade after the original Bercow Review.","links":[{"label":"Bercow: Ten Years On (2018)","url":"https://www.bercow10yearson.com/"}]}],"docLinks":[{"label":"SEND Code of Practice: 0 to 25 years (2015)","url":"https://www.gov.uk/government/publications/send-code-of-practice-0-to-25"},{"label":"Children and Families Act 2014, Part 3","url":"https://www.legislation.gov.uk/ukpga/2014/6/part/3"},{"label":"RCSLT clinical information on DLD","url":"https://www.rcslt.org/speech-and-language-therapy/clinical-information/developmental-language-disorder/"},{"label":"Bercow: Ten Years On (2018)","url":"https://www.bercow10yearson.com/"},{"label":"Norbury et al. (2016), SCALES prevalence study","url":"https://acamh.onlinelibrary.wiley.com/doi/10.1111/jcpp.12573"},{"label":"Bishop et al. (2017), CATALISE Phase 2 — terminology","url":"https://acamh.onlinelibrary.wiley.com/doi/10.1111/jcpp.12721"},{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): The United Kingdom chapter, Law et al. eds., Law, Roulstone & McCartney, pp. 497-509 (covers the UK as a whole)","url":"https://doi.org/10.4324/9780429455308-42"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v nts most often named regional variation (40% yes) (n ≈ 64). Multiple answers were allowed (Law et al., 2020). The survey did not separate the four UK nations, so this covers the UK as a whole.","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 144 from United Kingdom): government health 60% and government education 47%. 28% said a maximum number of sessions applied (n = 134). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020). The survey did not separate the four UK nations, so this covers the UK as a whole."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): The United Kingdom chapter, Law et al. eds., Law, Roulstone & McCartney, pp. 497-509 (covers the UK as a whole)","url":"https://doi.org/10.4324/9780429455308-42"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"GD","name":"Grenada","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GE","name":"Georgia

","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MK","name":"North Macedonia","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnnnnhnnhnnnn","filled":["Service model","Workforce"],"looked":[],"nFields":13,"docs":2,"supports":0,"values":{"serviceModel":"Speech and language therapists work across health care institutions, educational institutions, specialised hearing and speech rehabilitation centres, and private practice — the same four-way split as neighbouring Slovenia, a shared inheritance the authors trace to a common institutional history (Novšak Brce et al., 2023). No source consulted here establishes how a child is referred between them or who funds the placement.","workforce":"Organised speech and language therapy services date from 1950 and university training programmes from the mid-1980s, a few years later than in Slovenia; students from North Macedonia also train at the Slovenian university, and the two professions remain closely linked. Of 110 therapists surveyed across the two countries, 48 practised in North Macedonia, 95.8% of them female (Novšak Brce et al., 2023)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Republic of Macedonia chapter, Law et al. eds., Zorcec, Pavloska & Chepishevska-Vitlarova, pp. 325-331","url":"https://doi.org/10.4324/9780429455308-26"},{"label":"SLT cooperation with parents in Slovenia and North Macedonia (2023): Novšak Brce, Žolgar & Kogovšek, CEPS Journal","url":"https://doi.org/10.26529/cepsj.1535"}],"supportLinks":[],"collaborators":[]},{"cc":"ML","name":"Mali","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MM","name":"Myanmar","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MN","name":"Mongolia","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MR","name":"Mauritania","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MT","name":"Malta","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnhlnhnnnnnnn","filled":["Terminology","Assessments","Service model"],"looked":["Multilingual provision"],"nFields":13,"docs":6,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"specific language impairment\" (English; roughly \"the survey ran in English, with no separate translation\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Malta in the lowest of three bands (under 35% of respondents had heard of the concept) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","assessments":"A LITMUS sentence repetition (SRep) task exists for Maltese, developed by Helen Grech (University of Malta, Department of Communication Therapy). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Listed on the LITMUS site as having been created before LITMUS rather than within it. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve.","serviceModel":"Demand outstrips supply. Sant and Black (2024) analysed Speech and Language Centre activity data alongside interviews with service managers, speech-language pathologists and parents in western Malta, and report that clients were not receiving the required number of therapy sessions. The study frames the shortfall in terms of human-resource development, human-resource management and environmental factors rather than eligibility rules. Read from the published abstract and results summary rather than the full text."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Malta chapter, Law et al. eds., Grech & Galdes, pp. 332-338","url":"https://doi.org/10.4324/9780429455308-27"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Quality of the children's SLT service in Malta (2024): Sant & Black, IJLCD","url":"https://doi.org/10.1111/1460-6984.13093"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"MU","name":"Mauritius","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MV","name":"Maldives","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MW","name":"Malawi","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MX","name":"Mexico","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"MY","name":"Malaysia","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlnnnnnnnnn","filled":["Assessments"],"looked":["Multilingual provision"],"nFields":13,"docs":2,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Malay, developed by Rogayah Razak (Speech Science Programme, Universiti Kebangsaan Malaysia), Norsofiah Abu Bakar (Universiti Sains Malaysia) and Lim Hui Woan (UKM). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Applied in postgraduate work on Malay-English bilingual children and on Mandarin-English-Malay trilingual children — one of the few tasks in the set built for a routinely trilingual population. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"MZ","name":"Mozambique","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NA","name":"Namibia","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NE","name":"Niger","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NG","name":"Nigeria","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NI","name":"Nicaragua","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NL","name":"Netherlands","nat":true,"region":"Europe","subregion":"Western Europe","status":"partial","confidence":"official-document","lastVerified":"2026-08","coverage":"has","fieldStates":"hhhhhhhhnnnnh","filled":["Terminology","Identification criteria","Assessments","Multilingual provision","Referral pathway","Service model","Legal entitlement","Funding","Policy history"],"looked":[],"nFields":13,"docs":12,"supports":3,"values":{"terminology":"TOS — taalontwikkelingsstoornis — is the standard term across health, education and advocacy, and has largely displaced the older ESM (ernstige spraak- en taalmoeilijkheden). Unlike most systems in this catalog, the same term is used by clinicians, schools and parent organisations, which makes the Dutch literature unusually easy to compare across sectors. The label used with the public in the COST Action's 2017 European awareness survey was \"Taalontwikkelingsstoornis (TOS)\" (Dutch; roughly \"developmental language disorder\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Netherlands in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","identificationCriteria":"Diagnosis uses validated instruments to map communication and speech-language development, with multidisciplinary input to exclude other explanations such as hearing loss or intellectual disability. Access to cluster-2 (specialist) education is governed by Siméa's shared 'Richtlijn toelaatbaarheid', applied identically by all four cluster-2 institutions (Auris, Kentalis, VierTaal, Vitus Zuid). Notably, severity of the TOS is not sufficient on its own — the guideline makes eligibility turn on the pupil's education and support needs as well as the severity of the disorder. The specific score thresholds are set out in the guideline itself and are not reproduced here.","assessments":"Standardised, Dutch-normed instruments, applied under the NVLF clinical guideline for speech and language therapy in TOS. Audiological centres carry out the more complex diagnostic work. A LITMUS sentence repetition (SRep) task exists for Dutch, developed by Elma Blom (Utrecht University) and Jan de Jong (University of Bergen). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"One of the most explicitly worked-out multilingual protocols of any system in this catalog. Siméa's 'Handreiking meertaligheid en TOS' (2016) is national guidance dedicated to exactly this problem. It states that a language development disorder must be distinguished from a delay in second-language acquisition, requiring careful diagnosis and mapping of every factor affecting the child's speech and language development. For multilingual pupils it requires examination and observation data in both languages — using an interpreter where necessary — so that the level of each language can be judged separately. It supplies a diagnostic decision tree and a multilingual case-history (anamnese) form as practical instruments rather than leaving it to clinician judgement. What bi- and multilingual children actually receive, as reported by the 56 respondents from Netherlands who answered Section 4 of the COST Action IS1406 survey (2017): assessment in both languages 59%, in the mother tongue where it differs from the mainstream language 46% and in the mainstream language only 25%; intervention in the mainstream language only 72% and targeting two or more languages 19% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 73%, in intervention 23% and in counselling 81%. On whether the country offers training for practitioners working with bi/multilingual children (n = 60): optional 77%, none 2% and unsure 20%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","referralPathway":"Entry is usually through a first-line speech therapy practice (eerstelijns logopedie). Children whose persistent speech, language or communication difficulties have not responded sufficiently to ordinary speech therapy may be referred on for early treatment groups or specialist assessment at an audiological centre.","serviceModel":"Tiered. First-line speech therapy practices; audiological centres for diagnosis; third-line early-treatment and group treatment at Kentalis, Auris, Libra or Vitus Zuid for severe and persistent TOS; and cluster-2 special primary and secondary education for pupils who meet the Siméa criteria. Kentalis and Auris run cluster-2 schools nationally alongside their clinical services. Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 108 from Netherlands): special school 29%, private practice 22% and mainstream school 18%, with respondents placing themselves in public health 63% and public education 41%. Direct intervention for the reference child was most often twice weekly (40% of 103). Multiple answers were allowed (Law et al., 2020).","legalEntitlement":"Runs through the passend-onderwijs framework: a pupil meeting the Siméa criteria receives either an onderwijsarrangement (support brought to the mainstream school) or a place in cluster-2 education. Admission decisions can be disputed — the Geschillencommissie passend onderwijs issues advice on cluster-2 admission cases, so the entitlement is contestable rather than purely discretionary.","funding":"Mixed and routed by which system the child is in: speech therapy is covered under health insurance (Zorgverzekeringswet), day treatment and some support can run through long-term care or the municipality under the Jeugdwet, and cluster-2 education is funded through the education system. Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 108 from Netherlands): state health insurance 54%, government education 34% and government health 25%. 32% said a maximum number of sessions applied (n = 104). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","policyHistory":"2016 — Siméa publishes 'Handreiking meertaligheid en TOS' — national guidance on distinguishing TOS from second-language acquisition, with a diagnostic decision tree and a multilingual case-history form.\n2017 — Siméa 'Richtlijn toelaatbaarheid' — shared national eligibility guideline used by all four cluster-2 institutions.\n2024 — NVLF publishes the clinical guideline 'Richtlijn Logopedie bij taalontwikkelingsstoornissen'."},"history":[{"year":"2016","description":"Siméa publishes 'Handreiking meertaligheid en TOS' — national guidance on distinguishing TOS from second-language acquisition, with a diagnostic decision tree and a multilingual case-history form.","links":[{"label":"Siméa — Handreiking meertaligheid en TOS (2016)","url":"https://simea.nl/media/richtlijnen/simea_handreiking_meertaligheid_tos.pdf"}]},{"year":"2017","description":"Siméa 'Richtlijn toelaatbaarheid' — shared national eligibility guideline used by all four cluster-2 institutions.","links":[{"label":"Siméa — Richtlijn toelaatbaarheid (cluster-2 eligibility)","url":"https://simea.nl/toelaatbaarheid"},{"label":"Siméa — Richtlijn toelaatbaarheid (full PDF)","url":"https://simea.nl/media/richtlijnen/simea-brochure-richtlijn-toelaatbaarheid-20170901.pdf"}]},{"year":"2024","description":"NVLF publishes the clinical guideline 'Richtlijn Logopedie bij taalontwikkelingsstoornissen'.","links":[{"label":"NVLF — Richtlijn Logopedie bij taalontwikkelingsstoornissen","url":"https://nvlf.hellomembers.nl/app/uploads/2024/01/Richtlijn-TOS.pdf"}]}],"docLinks":[{"label":"Siméa — Richtlijn toelaatbaarheid (cluster-2 eligibility)","url":"https://simea.nl/toelaatbaarheid"},{"label":"Siméa — Handreiking meertaligheid en TOS (2016)","url":"https://simea.nl/media/richtlijnen/simea_handreiking_meertaligheid_tos.pdf"},{"label":"NVLF — Richtlijn Logopedie bij taalontwikkelingsstoornissen","url":"https://nvlf.hellomembers.nl/app/uploads/2024/01/Richtlijn-TOS.pdf"},{"label":"Kentalis — wat is TOS","url":"https://www.kentalis.nl/tos"},{"label":"TOS in beeld — materials hub","url":"https://tosinbeeld.nl/materialen/simea-handreiking-tos-en-meertaligheid/"},{"label":"Siméa — Richtlijn toelaatbaarheid (full PDF)","url":"https://simea.nl/media/richtlijnen/simea-brochure-richtlijn-toelaatbaarheid-20170901.pdf"},{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): The Netherlands chapter, Law et al. eds., Gerrits, de Jong, Zwitserlood & Klatte, pp. 339-350","url":"https://doi.org/10.4324/9780429455308-28"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[{"label":"Auris","url":"https://www.auris.nl/"},{"label":"VierTaal","url":"https://www.viertaal.nl/"},{"label":"Vitus Zuid","url":"https://www.vituszuid.nl/"}],"collaborators":[]},{"cc":"NO","name":"Norway","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhhhhnhnnnnn","filled":["Assessments","Multilingual provision","Referral pathway","Service model","Funding"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Norwegian, developed by Jan de Jong (University of Bergen). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Developed and piloted in a University of Bergen master's thesis (Bome & Kongtorp Vargen, 2017), so its validation base is thinner than the French or German tasks. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 34 respondents from Norway who answered Section 4 of the COST Action IS1406 survey (2017): assessment ; intervention in the mother tongue 54% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 73%, in intervention 50% and in counselling 85%. On whether the country offers training for practitioners working with bi/multilingual children (n = 39): optional 38%, none 8% and unsure 54%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","referralPathway":"For children in ordinary early childhood education and care, provision runs through the Educational Psychological Service (pedagogisk-psykologisk tjeneste), which writes the expert assessment recommending special educational assistance; the setting then implements it through an individual development plan. Joner et al. (2022) analysed 71 such documents for four children with language disorders and found the objectives and language interventions recommended in the expert assessments to be general or missing, and seldom tailored to the specific language disorder — a weakness that then propagated into the individual development plans. They describe responsibilities as divided between institutions in a way that leaves provision fragmented, with variation in the quality of what is recommended.","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 93 from Norway): mainstream school 63%, nursery or kindergarten 61% and private practice 16%, with respondents placing themselves in public education 76% and private 24%. Direct intervention for the reference child was most often weekly (30% of 86). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (45% yes) and regional variation (33% yes) (n ≈ 29). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 93 from Norway): government education 82%, family 10%, government health 9% and government social services 8%. 45% said a maximum number of sessions applied (n = 85). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Norway chapter, Law et al. eds., Vulchanova, Feilberg & Dahl, pp. 351-362","url":"https://doi.org/10.4324/9780429455308-29"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Special educational assistance in Norwegian ECEC (2022): Joner, Reikerås & Alvestad, European Journal of Special Needs Education — document analysis","url":"https://doi.org/10.1080/08856257.2022.2148602"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"NP","name":"Nepal","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NR","name":"Nauru","nat":true,"region":"Oceania","subregion":"Micronesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"NZ","name":"New Zealand","nat":true,"region":"Oceania","subregion":"Australia and New Zealand","status":"partial","confidence":"official-document","lastVerified":"2026-08","coverage":"has","fieldStates":"lhnlhhhhnnnnn","filled":["Identification criteria","Referral pathway","Service model","Legal entitlement","Funding"],"looked":["Terminology","Multilingual provision"],"nFields":13,"docs":3,"supports":1,"values":{"terminology":"Not established from the sources consulted for this entry — Ministry of Education material reviewed here uses functional descriptions ('high communication needs', 'significant language delay') rather than a diagnostic label, so whether 'DLD' is in official use could not be determined. If you work in this system, this is exactly the field to fill in.","identificationCriteria":"Access is defined by service thresholds rather than by a diagnostic definition. The Ongoing Resourcing Scheme (ORS) requires either ongoing extreme or severe difficulty in learning, hearing, vision, physical or communication ability, or moderate to high difficulty across several of those areas. The Ministry of Education Communication Service uses a narrower age-banded threshold — high communication needs, for example language skills well below the level expected for age.","multilingualProvision":"Not established from the sources consulted for this entry — no protocol for assessing children who speak more than one language was identified in the Ministry of Education material reviewed. How this interacts with te reo Māori, Māori-medium education and Pasifika languages is the obvious question for a contributor to answer. If you work in this system, this is exactly the field to fill in.","referralPathway":"Through the Ministry of Education's learning support pathway. ORS applications can be made at any time from age 4 years 8 months. The Communication Service covers children aged roughly five to eight.","serviceModel":"Education-led, which distinguishes New Zealand from most systems in this catalog: speech-language therapists are employed by the Ministry of Education rather than by health services, and work with pupils with severe communication needs across speech, fluency, voice, resonance and language. ORS resourcing can be used to buy in specialist input including speech-language therapy, psychology, occupational therapy or physiotherapy.","legalEntitlement":"ORS is a resourcing scheme with eligibility criteria, not an individually enforceable right to a named quantum of therapy — it provides resources to the school for pupils with high and very high needs in learning, vision, hearing, mobility, language and social communication.","funding":"Publicly funded through the education system; ORS is the principal vehicle for pupils with the highest needs."},"history":[],"docLinks":[{"label":"Ministry of Education — speech, language and communication support for children","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/learning-support/speech-language-and-communication-support-children"},{"label":"Ministry of Education — overview of the Ongoing Resourcing Scheme","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/learning-support/overview-ongoing-resourcing-scheme"},{"label":"Ministry of Education — apply for ORS for school students","url":"https://www.education.govt.nz/education-professionals/schools-year-0-13/learning-support/apply-ongoing-resourcing-scheme-school-students"}],"supportLinks":[{"label":"RTLB — Resource Teachers: Learning and Behaviour","url":"https://rtlb.tki.org.nz/"}],"collaborators":[]},{"cc":"OM","name":"Oman","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PA","name":"Panama","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PE","name":"Peru","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PG","name":"Papua New Guinea","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PH","name":"Philippines","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PK","name":"Pakistan","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PL","name":"Poland","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnhhnhnhnnnnn","filled":["Terminology","Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Specyficzne zaburzenie językowe\" (Polish; roughly \"specific language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Poland in the middle band (40-55% had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","assessments":"A LITMUS sentence repetition (SRep) task exists for Polish, developed by Natalia Banasik-Jemielniak (Maria Grzegorzewska University), Ewa Haman (University of Warsaw) and Magdalena Smoczyńska. Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Used in Antonijevic-Elliott et al. (2019), Clinical Linguistics & Phonetics, assessing monolingual and multilingual children with non-word and sentence repetition. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 59 respondents from Poland who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 76%, in the mother tongue where it differs from the mainstream language 26% and in the mother tongue only 19%; intervention in the mainstream language only 68% and in the mother tongue 25% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 52%, in intervention 51% and in counselling 49%. On whether the country offers training for practitioners working with bi/multilingual children (n = 98): optional 63%, none 8% and unsure 28%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 223 from Poland): nursery or kindergarten 42%, mainstream school 37% and private practice 32%, with respondents placing themselves in public education 82%, private 38% and public health 18%. Direct intervention for the reference child was most often weekly (60% of 222). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (85% yes), cost to parents (57% yes) and social position (54% yes) (n ≈ 98). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 223 from Poland): government education 72%, family 41%, government health 14% and state health insurance 13%. 21% said a maximum number of sessions applied (n = 222). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Poland chapter, Law et al. eds., Czaplewska, Faściszewska, Kurowska & Smoczynska, pp. 363-373","url":"https://doi.org/10.4324/9780429455308-30"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"PS","name":"Palestine","nat":true,"region":"Asia","subregion":"Western Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlnnnnnnnnn","filled":["Assessments"],"looked":["Multilingual provision"],"nFields":13,"docs":2,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Palestinian Arabic, developed by Sharon Armon-Lotem and Elinor Saiegh-Haddad (Bar-Ilan University), with Sahar Haj Yahye and Amna Halabi. Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"PT","name":"Portugal","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlhhnhhnnnn","filled":["Assessments","Referral pathway","Service model","Funding","Workforce"],"looked":["Multilingual provision"],"nFields":13,"docs":7,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Portuguese, developed by Maria Lobo (Universidade Nova de Lisboa) and Liliana Correia (Universidade do Minho). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve.","referralPathway":"Referral route differs by diagnosis. Among Portuguese speech-language pathologists surveyed by Pereira et al. (2024), children with DLD and pragmatic difficulties were most often referred by preschool teachers, and 90.3% of those DLD referrals came between the ages of three and six; children with autism were most often referred by paediatricians, and half of those referrals came between two and three. The authors link referral source to setting — clinic work arriving via paediatricians, preschool work via teachers.","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 75 from Portugal): private practice 67%, mainstream school 45% and nursery or kindergarten 37%, with respondents placing themselves in private 68%, public education 28% and charitable 21%. Direct intervention for the reference child was most often weekly (60% of 75). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (67% yes), cost to parents (62% yes) and income level (57% yes) (n ≈ 21). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 75 from Portugal): family 37%, government social services 25%, government health 21% and government education 15%. 12% said a maximum number of sessions applied (n = 75). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","workforce":"Two large surveys give an unusually firm denominator: 351 respondents representing 10.5% of speech-language pathologists working in Portugal (Pereira et al., 2024) and 357 representing about 10% (Azevedo et al., 2025). Of the first group, 64.2% worked in clinics, over 60% held a master's degree, and 97.4% were female. Confidence is the recurring finding: 89-91% of respondents to the second survey had never used any specific programme, method or approach for syntactic intervention, over 40% did not feel confident assessing syntactic skills and 43% did not feel confident intervening, with 92-98% reporting a need for more academic knowledge and practical training."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Portugal chapter, Law et al. eds., Castro & Alves, pp. 374-386","url":"https://doi.org/10.4324/9780429455308-31"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Portuguese SLP practice with pragmatic impairment (2024): Pereira, Ramalho & Lousada, Journal of Child Language","url":"https://doi.org/10.1017/S0305000923000764"},{"label":"Portuguese SLT practice with syntactic impairment (2025): Azevedo, Lousada & Martins, IJLCD","url":"https://doi.org/10.1111/1460-6984.70012"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"PW","name":"Palau","nat":true,"region":"Oceania","subregion":"Micronesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"PY","name":"Paraguay","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"QA","name":"Qatar","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"RO","name":"Romania","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnhnhnhnnnnn","filled":["Terminology","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Retard de limbaj\" (Romanian; roughly \"language delay or language retardation\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Romania in the middle band (40-55% had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 91 respondents from Romania who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mother tongue where it differs from the mainstream language 48%, in the mainstream language only 36% and in the mother tongue only 32%; intervention in the mother tongue 55% and in the mainstream language only 39% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 26%, in intervention 18% and in counselling 26%. On whether the country offers training for practitioners working with bi/multilingual children (n = 143): optional 24%, none 27% and unsure 45%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 288 from Romania): mainstream school 57%, nursery or kindergarten 35% and private practice 24%, with respondents placing themselves in public education 81% and private 26%. Direct intervention for the reference child was most often weekly (51% of 288). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (68% yes), parental education (52% yes) and cost to parents (46% yes) (n ≈ 136). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 288 from Romania): government education 61% and family 40%. 23% said a maximum number of sessions applied (n = 288). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Romania chapter, Law et al. eds., Zegan, Totolan & Ene, pp. 387-397","url":"https://doi.org/10.4324/9780429455308-32"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"RS","name":"Serbia","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnnhnhnhnnnnn","filled":["Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":3,"supports":0,"values":{"multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 24 respondents from Serbia who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 67%, in the mother tongue only 47% and in the mother tongue where it differs from the mainstream language 28%; intervention in the mainstream language only 75% and in the mother tongue 22% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. On whether the country offers training for practitioners working with bi/multilingual children (n = 30): optional 10%, none 30% and unsure 60%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 47 from Serbia): private practice 45%, nursery or kindergarten 23% and special school 15%, with respondents placing themselves in public education 43%, private 34% and public health 21%. Direct intervention for the reference child was most often twice weekly (40% of 47). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (70% yes), cost to parents (50% yes) and social position (47% yes) (n ≈ 30). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 47 from Serbia): family 47%, government health 30% and government education 26%. 26% said a maximum number of sessions applied (n = 47). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Serbia chapter, Law et al. eds., Vuković, Čolić, Anđelković & Savić, pp. 408-419","url":"https://doi.org/10.4324/9780429455308-34"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"RU","name":"Russia","nat":true,"region":"Europe","subregion":"Eastern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlnnnnnnnnn","filled":["Assessments"],"looked":["Multilingual provision"],"nFields":13,"docs":3,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Russian, developed by Natalia Meir and Sharon Armon-Lotem (Bar-Ilan University). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. The Russian and Hebrew tasks share the strongest diagnostic-accuracy evidence in the set: Armon-Lotem & Meir (2016), IJLCD 51(6), 715–731. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): The Russian Federation chapter, Law et al. eds., Tomas, Sevan & Shamaeva, pp. 398-407","url":"https://doi.org/10.4324/9780429455308-33"}],"supportLinks":[],"collaborators":[]},{"cc":"RW","name":"Rwanda","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SA","name":"Saudi Arabia","nat":true,"region":"Asia","subregion":"Western Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlnnnnnnnnn","filled":["Assessments"],"looked":["Multilingual provision"],"nFields":13,"docs":2,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Saudi Arabic, developed by Mada Al Hasan (University of Reading) and Theodoros Marinis (University of Konstanz and University of Reading). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"SB","name":"Solomon Islands","nat":true,"region":"Oceania","subregion":"Melanesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SC","name":"Seychelles","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SD","name":"Sudan","nat":true,"region":"Africa","subregion":"Northern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SE","name":"Sweden","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hhhhnhhhnnnhn","filled":["Terminology","Identification criteria","Assessments","Multilingual provision","Service model","Legal entitlement","Funding","Identified prevalence"],"looked":[],"nFields":13,"docs":10,"supports":2,"values":{"terminology":"'Språkstörning' is the established Swedish term; 'DLD' and the hybrid 'utvecklingsrelaterad språkstörning (DLD)' are increasingly used alongside it in clinical and school contexts, so both appear in current Swedish sources. The label used with the public in the COST Action's 2017 European awareness survey was \"Språkstörning\" (Swedish; roughly \"language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Sweden in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","identificationCriteria":"Assessment is carried out by a speech and language pathologist (logoped) and covers vocabulary, grammar, narrative, phonology and pronunciation as well as pragmatics, using standardised and normed tests alongside a detailed case history. The rule that does most work is the multilingual one below: difficulties must be present across all of the child's languages.","assessments":"Standardised, Swedish-normed instruments administered by a logoped, combined with case history and functional observation. No single nationally mandated battery was identified in the sources consulted.","multilingualProvision":"Sweden states the criterion explicitly, which is unusual: for a difficulty to count as språkstörning/DLD, the child must show language difficulties in all of their languages. Where a child is multilingual, the assessment maps every language the child uses regularly, and the logoped's job is specifically to determine whether the difficulties reflect a disorder or insufficient exposure to the language in question. Multilingual pupils perceived to have language difficulties at school should be given access to a professional logoped assessment rather than having the difficulty attributed to bilingualism by default. Swedish commentary nonetheless reports that schools' understanding of the interaction between multilingualism and språkstörning is a continuing weak point. What bi- and multilingual children actually receive, as reported by the 41 respondents from Sweden who answered Section 4 of the COST Action IS1406 survey (2017): assessment in both languages 69%, in the mother tongue where it differs from the mainstream language 64% and in the mainstream language only 24%; intervention in the mainstream language only 61% and targeting two or more languages 26% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 93%, in intervention 74% and in counselling 96%. On whether the country offers training for practitioners working with bi/multilingual children (n = 45): optional 51%, none 13% and unsure 29%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Split. Assessment and therapy sit with logopedi services run by the regions (regioner), including habilitering services for children with more complex needs; educational adaptation sits with schools. Language disorder is understood as affecting learning across every school subject rather than being a discrete speech problem, so the school-side response is curriculum-wide adaptation rather than only therapy. The National Agency for Special Needs Education and Schools (SPSM) sits alongside both: it provides advisory support and specialist educational assessment to municipalities and schools, funds accessible teaching materials and state grants, and runs ten state specialskolor, which include provision for pupils with severe language disorder (grav språkstörning). Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 101 from Sweden): mainstream school 36% and hospital 33%, with respondents placing themselves in public health 50% and public education 45%. Direct intervention for the reference child was most often weekly (47% of 85). Asked which factors affect access to services in their country, respondents most often named regional variation (44% yes) and urban or rural residence (41% yes) (n ≈ 37). Multiple answers were allowed (Law et al., 2020).","legalEntitlement":"Educational entitlement runs through the Education Act (skollagen) right to särskilt stöd, which is triggered by assessed need rather than by a diagnosis — a child does not need a språkstörning diagnosis to receive support, and having one does not automatically produce it.","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 101 from Sweden): government health 50% and government education 47%. 30% said a maximum number of sessions applied (n = 86). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","identifiedPrevalence":"2026 — 7-8 — % of children, adolescents and adults estimated to have språkstörning/DLD — Swedish clinical and advocacy sources. Epidemiological estimate, not the proportion identified by services."},"history":[],"docLinks":[{"label":"Internetmedicin — utvecklingsrelaterad språkstörning (DLD), clinical overview","url":"https://www.internetmedicin.se/skolhalsovard/utvecklingsrelaterad-sprakstoerning-dld"},{"label":"Afasiförbundet — språkstörning/DLD","url":"https://www.afasi.se/sprakstorning/"},{"label":"Processtöd — språkstörning/DLD","url":"https://processtod.se/sprakstorning/sprakstorning-dld/"},{"label":"Specialpedagogik — schools and the challenges of multilingualism","url":"https://www.vilarare.se/specialpedagogik/sarskilt-stod/skolan-maste-forsta-utmaningarna-med-flersprakighet/"},{"label":"SPSM — språkstörning (national agency guidance)","url":"https://www.spsm.se/funktionsnedsattningar/sprakstorning/"},{"label":"SPSM — Studiepaket språkstörning (staff training package)","url":"https://www.spsm.se/studiepaket-sprakstorning/"},{"label":"Managing Children with DLD (2019): Sweden chapter, Law et al. eds., Hansson, Håkansson, Ringblom & Jalali-Moghadam, pp. 460-471","url":"https://doi.org/10.4324/9780429455308-39"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[{"label":"Legilexi","url":"https://legilexi.org/"},{"label":"RADLD — Raising Awareness of DLD","url":"https://radld.org/"}],"collaborators":[]},{"cc":"SG","name":"Singapore","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"SI","name":"Slovenia","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnnnnhnhhnnnn","filled":["Service model","Funding","Workforce"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 50 from Slovenia): health clinic or centre 38%, nursery or kindergarten 26% and special school 26%, with respondents placing themselves in public education 54% and public health 48%. Direct intervention for the reference child was most often fortnightly (24% of 50). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (86% yes), linguistic or cultural community (64% yes) and social position (62% yes) (n ≈ 14). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 50 from Slovenia): government education 56%, government health 48%, state health insurance 20% and family 10%. 28% said a maximum number of sessions applied (n = 50). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","workforce":"Speech and language therapists work across four settings — health care institutions, educational institutions, specialised hearing and speech rehabilitation centres, and private practice. Organised speech and language therapy services date from 1942, with university training programmes established from the mid-1980s. In a survey of 110 therapists across two countries, the 62 Slovenian respondents rated their attitudes towards involving parents in therapy significantly higher than their 48 North Macedonian counterparts, while differences in self-rated knowledge and skills for working with parents were not statistically significant (Novšak Brce et al., 2023)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Slovenia chapter, Law et al. eds., Brce & Kogovšek, pp. 431-440","url":"https://doi.org/10.4324/9780429455308-36"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"SLT cooperation with parents in Slovenia and North Macedonia (2023): Novšak Brce, Žolgar & Kogovšek, CEPS Journal","url":"https://doi.org/10.26529/cepsj.1535"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"SK","name":"Slovakia","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnnhnhnhnnnnn","filled":["Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":3,"supports":0,"values":{"multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 17 respondents from Slovakia who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 71%, in the mother tongue where it differs from the mainstream language 29% and in the mother tongue only 20%; intervention in the mother tongue 28% and in the mainstream language only 21% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 21%, in intervention 9% and in counselling 14%. On whether the country offers training for practitioners working with bi/multilingual children (n = 42): optional 40%, none 19% and unsure 38%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 64 from Slovakia): health clinic or centre 31%, private rehabilitation centre 31% and special school 25%, with respondents placing themselves in public education 58%, public health 27% and private 23%. Direct intervention for the reference child was most often fortnightly (47% of 64). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (31% yes) (n ≈ 42). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 64 from Slovakia): government education 55%, family 39%, government health 27% and state health insurance 9%. 8% said a maximum number of sessions applied (n = 64). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Slovakia chapter, Law et al. eds., Kapalková & Slančová, pp. 420-430","url":"https://doi.org/10.4324/9780429455308-35"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in he sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"SZ","name":"Eswatini","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TD","name":"Chad","nat":true,"region":"Africa","subregion":"Middle Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TG","name":"Togo","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"TH","name":"Thailand","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"

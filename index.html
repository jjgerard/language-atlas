supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Standard Greek, developed by Vicky Chondrogianni (University of Edinburgh), Ianthi Tsimpli (University of Cambridge) and Maria Andreou (University of Cologne). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 39 respondents from Greece who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 90%, in the mother tongue where it differs from the mainstream language 21% and in both languages 16%; intervention in the mainstream language only 78% and in the mother tongue 15% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 54%, in intervention 40% and in counselling 46%. On whether the country offers training for practitioners working with bi/multilingual children (n = 40): optional 40%, none 30% and unsure 28%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 82 from Greece): private rehabilitation centre 56% and private practice 54%, with respondents placing themselves in private 95%. Direct intervention for the reference child was most often twice weekly (77% of 82). Asked which factors affect access to services in their country, respondents most often named cost to parents (82% yes), income level (64% yes) and urban or rural residence (62% yes) (n ≈ 39). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 82 from Greece): family 39%, state health insurance 38% and government health 35%. 41% said a maximum number of sessions applied (n = 82). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"GT","name":"Guatemala","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GW","name":"Guinea-Bissau","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"GY","name":"Guyana","nat":true,"region":"Americas","subregion":"South America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"HK","name":"Hong Kong","nat":false,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"HN","name":"Honduras","nat":true,"region":"Americas","subregion":"Central America","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"HR","name":"Croatia","nat":true,"region":"Europe","subregion":"Southeast Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnhhnhnhhnnnn","filled":["Terminology","Assessments","Multilingual provision","Service model","Funding","Workforce"],"looked":[],"nFields":13,"docs":7,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Jezične teškoće u djetinjstvu\" (Croatian; roughly \"language impairment in childhood\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Croatia in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","assessments":"A LITMUS sentence repetition (SRep) task exists for Croatian, developed by Gordana Hržica and Jelena Kuvač Kraljević (University of Zagreb, Department of Speech and Language Pathology) with Lana Kologranić (SUVAG Polyclinic). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 28 respondents from Croatia who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 61%, in the mother tongue only 24% and in the mother tongue where it differs from the mainstream language 12%; intervention in the mainstream language only 72% and in the mother tongue 11% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 40%, in intervention 33% and in counselling 40%. On whether the country offers training for practitioners working with bi/multilingual children (n = 42): optional 12%, none 24% and unsure 64%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 84 from Croatia): health clinic or centre 30%, nursery or kindergarten 23% and hospital 19%, with respondents placing themselves in public health 51% and public education 40%. Direct intervention for the reference child was most often weekly (48% of 83). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (76% yes), cost to parents (48% yes) and income level (38% yes) (n ≈ 42). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 84 from Croatia): government health 55%, government education 36%, family 23% and state health insurance 14%. 20% said a maximum number of sessions applied (n = 83). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","workforce":"A national survey of 255 Croatian speech-language pathologists reports where the profession sits: 37.6% employed in health care, 35.3% in education, 18.8% in private practice or an NGO and 8.2% in the social-care system. The workforce is young — 69% under 41, and 49.8% with fewer than ten years' experience — and 97.7% female. Preschool children aged 3-7 were the main caseload for 63.2% of respondents (Kuvač Kraljević et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Croatia chapter, Law et al. eds., Kraljević, Dokoza & Matić, pp. 169-178","url":"https://doi.org/10.4324/9780429455308-11"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Croatian SLP telepractice survey (2020): Kuvač Kraljević, Matić & Pavičić Dokoza, International Journal of Telerehabilitation","url":"https://doi.org/10.5195/ijt.2020.6325"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"HT","name":"Haiti","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"HU","name":"Hungary","nat":true,"region":"Europe","subregion":"Central Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnhnhnhnnnnn","filled":["Terminology","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Gyermekkori nyelvi zavar\" (Hungarian; roughly \"childhood language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Hungary in the middle band (40-55% had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 72 respondents from Hungary who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 67% and in the mother tongue only 28%; intervention in the mainstream language only 82% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 59%, in intervention 48% and in counselling 62%. On whether the country offers training for practitioners working with bi/multilingual children (n = 86): optional 7%, none 37% and unsure 56%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 185 from Hungary): nursery or kindergarten 72%, mainstream school 48% and special school 16%, with respondents placing themselves in public education 92% and private 20%. Direct intervention for the reference child was most often twice weekly (46% of 184). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (69% yes), regional variation (56% yes) and parental education (45% yes) (n ≈ 85). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 185 from Hungary): government education 90% and family 14%. 35% said a maximum number of sessions applied (n = 185). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Hungary chapter, Law et al. eds., Zajdó, Forró & Kas, pp. 248-260","url":"https://doi.org/10.4324/9780429455308-18"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"ID","name":"Indonesia","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"IE","name":"Ireland","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"official-document","lastVerified":"2026-08","coverage":"has","fieldStates":"hhhhhhhhnhnnh","filled":["Terminology","Identification criteria","Assessments","Multilingual provision","Referral pathway","Service model","Legal entitlement","Funding","Discharge criteria","Policy history"],"looked":[],"nFields":13,"docs":10,"supports":3,"values":{"terminology":"'Developmental language disorder' is now the term in education policy: Circular 0024/2025 explicitly retires 'specific speech and language disorder' (SSLD) for special-class entry and replaces it with 'Developmental Language Disorder – Speech Sound Disorder (DLD/SSD)'. This makes Ireland one of the clearer cases of CATALISE terminology reaching a statutory instrument rather than staying in clinical usage.","identificationCriteria":"Set for special-class entry by Circular 0024/2025, which revised the 2007 criteria. The most consequential change is the removal of IQ as an entry criterion — the earlier SSLD framework used cognitive referencing, and the current one does not. The 2007 rules defined the target group narrowly, as severe impairment in understanding and expressing spoken language not attributable to co-morbid factors such as general learning disability, deafness or behavioural difficulty. Identification involves both speech and language therapy and psychological assessment; the SLT nominates a child for a language-class place with parental consent.","assessments":"A LITMUS sentence repetition (SRep) task exists for Irish, developed by Stanislava Antonijevic (University of Galway) with Ruth Durham and Íde Ní Chonghaile (Health Service Executive). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Unusually for this set, the Irish task was built with practising HSE clinicians, and an Irish-English task exists alongside it — see Antonijevic, Durham & Ní Chonghaile (2017), Linguistic Approaches to Bilingualism 7, 359–393. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 45 respondents from Ireland who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 31%, in the mother tongue where it differs from the mainstream language 25% and in both languages 23%; intervention in the mainstream language only 52% and targeting two or more languages 22% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 87%, in intervention 52% and in counselling 45%. On whether the country offers training for practitioners working with bi/multilingual children (n = 47): optional 57%, none 19% and unsure 23%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","referralPathway":"Speech and language therapy referral is to the HSE Primary Care children's service. Special-class placement is a separate route: an HSE or NCSE speech and language therapist puts a child forward as a candidate, and enrolment is decided by the school under the circular criteria.","serviceModel":"Split between health and education. The HSE provides speech and language therapy through Primary Care and Children's Disability Network Teams; the Department of Education funds special classes for DLD/SSD attached to mainstream primary schools, taught by a qualified teacher with speech and language therapy support. Class size is capped at seven pupils (Circular 0038/2007). The NCSE also operates its own speech and language therapy service. Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 88 from Ireland): health clinic or centre 84%, mainstream school 34% and special school 23%, with respondents placing themselves in public health 81% and private 17%. Direct intervention for the reference child was most often weekly (48% of 87). Asked which factors affect access to services in their country, respondents most often named regional variation (57% yes), urban or rural residence (43% yes) and linguistic or cultural community (30% yes) (n ≈ 44). Multiple answers were allowed (Law et al., 2020).","legalEntitlement":"Weak relative to the clarity of the criteria. The EPSEN Act 2004, which would have created individual enforceable entitlements to assessment and provision, has only been partly commenced. A DLD/SSD diagnosis therefore does not by itself entitle a child to a special-class place: placement depends on availability, and continued enrolment for a second year 'can only be considered once all eligible children have been accommodated'.","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 88 from Ireland): government health 85%, government education 15% and family 14%. 47% said a maximum number of sessions applied (n = 86). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","dischargeCriteria":"Special-class placement is time-limited by design — under Circular 0038/2007 eligible pupils may spend up to two years in the class, with the second year contingent on capacity, after which the child returns to mainstream. Discharge from HSE speech and language therapy is decided service by service and is not set nationally.","policyHistory":"2004 — Education for Persons with Special Educational Needs (EPSEN) Act — only partly commenced.\n2007 — DES Circular 0038/2007 sets the criteria and operating rules for special classes for pupils with Specific Speech and Language Disorder (SSLD): maximum seven pupils, placement normally time-limited.\n2025 — Circular 0024/2025 replaces the SSLD criteria: the category is renamed Developmental Language Disorder / Speech Sound Disorder (DLD/SSD), and the IQ entry criterion is removed. Developed with the NCSE speech and language therapy service, IASLT and HSE speech and language therapists."},"history":[{"year":"2004","description":"Education for Persons with Special Educational Needs (EPSEN) Act — only partly commenced.","links":[{"label":"Citizens Information — special needs education in primary schools","url":"https://www.citizensinformation.ie/en/education/special-education-needs/special-needs-education-primary-schools/"}]},{"year":"2007","description":"DES Circular 0038/2007 sets the criteria and operating rules for special classes for pupils with Specific Speech and Language Disorder (SSLD): maximum seven pupils, placement normally time-limited.","links":[{"label":"Special classes for children with DLD or SSD (Department of Education)","url":"https://www.gov.ie/en/department-of-education/publications/special-classes-for-children-with-developmental-language-disorder-dld-or-speech-sound-disorder-ssd/"},{"label":"HSE — language classes","url":"https://www.hse.ie/eng/services/list/1/lho/cavanmonaghan/therapy-services/speech-and-language-therapy/children/language-class.html"}]},{"year":"2025","description":"Circular 0024/2025 replaces the SSLD criteria: the category is renamed Developmental Language Disorder / Speech Sound Disorder (DLD/SSD), and the IQ entry criterion is removed. Developed with the NCSE speech and language therapy service, IASLT and HSE speech and language therapists.","links":[{"label":"Circular 0024/2025 (revised DLD/SSD enrolment criteria)","url":"https://www.into.ie/app/uploads/2025/03/0024_2025.pdf"}]}],"docLinks":[{"label":"Special classes for children with DLD or SSD (Department of Education)","url":"https://www.gov.ie/en/department-of-education/publications/special-classes-for-children-with-developmental-language-disorder-dld-or-speech-sound-disorder-ssd/"},{"label":"Circular 0024/2025 (revised DLD/SSD enrolment criteria)","url":"https://www.into.ie/app/uploads/2025/03/0024_2025.pdf"},{"label":"Inspectorate review of educational provision for pupils with SSLD (2021)","url":"https://assets.gov.ie/133317/15aec2bb-671e-4ffe-b3c5-2a9daed448d5.pdf"},{"label":"HSE — language classes","url":"https://www.hse.ie/eng/services/list/1/lho/cavanmonaghan/therapy-services/speech-and-language-therapy/children/language-class.html"},{"label":"Citizens Information — special needs education in primary schools","url":"https://www.citizensinformation.ie/en/education/special-education-needs/special-needs-education-primary-schools/"},{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Ireland chapter, Law et al. eds., Frizelle, O’Toole, Lyons, Tangney & Murphy, pp. 272-284","url":"https://doi.org/10.4324/9780429455308-20"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[{"label":"IASLT — Irish Association of Speech and Language Therapists","url":"https://www.iaslt.ie/"},{"label":"National Council for Special Education","url":"https://ncse.ie/"},{"label":"RADLD — Raising Awareness of DLD","url":"https://radld.org/"}],"collaborators":[]},{"cc":"IL","name":"Israel","nat":true,"region":"Asia","subregion":"Western Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hlhhnhhhnnnnh","filled":["Terminology","Assessments","Multilingual provision","Service model","Legal entitlement","Funding","Policy history"],"looked":["Identification criteria"],"nFields":13,"docs":9,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"לקות שפה\" (Hebrew; roughly \"language disorder\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Israel in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","identificationCriteria":"Not established from the sources consulted for this entry — the diagnostic criteria and any score thresholds applied by the statutory placement committees could not be determined from the English-language sources consulted. If you work in this system, this is exactly the field to fill in.","assessments":"A LITMUS sentence repetition (SRep) task exists for Hebrew, developed by Sharon Armon-Lotem, Natalia Meir and Carmit Altman (Bar-Ilan University); Palestinian Arabic and Russian tasks were also developed at Bar-Ilan, covering the other two largest school languages. Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 16 respondents from Israel who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 31%, in both languages 13% and in the mother tongue where it differs from the mainstream language 13%; intervention in the mainstream language only 41% and in the mother tongue 18% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 60%, in intervention 47% and in counselling 63%. On whether the country offers training for practitioners working with bi/multilingual children (n = 19): optional 47%, none 21% and unsure 26%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Dual-system, with both routes live at once. Health maintenance organisations (kupot holim) deliver therapy under national health insurance, and the education system delivers additional therapeutic input either as an individualised basket of service hours for pupils in mainstream classes or through placement in a special education 'communication' class. For children under two where diagnosis is still uncertain, speech and occupational therapy can be accessed through HMOs without a formal diagnosis, on referral from a Child Development Clinic — an unusually low barrier to early intervention. Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 33 from Israel): nursery or kindergarten 58%, private practice 52% and health clinic or centre 39%, with respondents placing themselves in public education 64%, private 58% and public health 52%. Direct intervention for the reference child was most often weekly (82% of 33). Asked which factors affect access to services in their country, respondents most often named income level (44% yes), cost to parents (44% yes) and urban or rural residence (39% yes) (n ≈ 18). Multiple answers were allowed (Law et al., 2020).","legalEntitlement":"Statutory and comparatively strong. The Special Education Law defines 'special education' to include paramedical treatment — explicitly naming speech therapy — as part of the instruction and treatment the state must provide, free, for children with special needs aged three to twenty-one, and establishes a right to paramedical services, expressive therapies and assistive devices. Placement and entitlement decisions are made by a statutory committee (va'ada), and the scope of the state's duty has been litigated up to the Supreme Court.","funding":"Public, via two channels: national health insurance through the HMOs, and the education budget for service hours and special-class placement. Supplemental HMO insurance gives partial reimbursement for some assessments, so families with supplemental cover face a different effective entitlement from those without. Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 33 from Israel): government health 39%, family 36%, government education 30% and state health insurance 15%. 52% said a maximum number of sessions applied (n = 33). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","policyHistory":"1988 — Special Education Law establishes state responsibility for free special education for children with special needs, defining special education to include speech therapy alongside teaching.\n2018 — Amendment to the Special Education Law changes how placement and parental choice operate."},"history":[{"year":"1988","description":"Special Education Law establishes state responsibility for free special education for children with special needs, defining special education to include speech therapy alongside teaching.","links":[]},{"year":"2018","description":"Amendment to the Special Education Law changes how placement and parental choice operate.","links":[]}],"docLinks":[{"label":"UNESCO Education Profiles — Israel, inclusion","url":"https://education-profiles.org/northern-africa-and-western-asia/israel/~inclusion"},{"label":"OECD — autism policies in Israel (describes the HMO/education dual therapy route)","url":"https://www.oecd.org/en/publications/policy-responses-to-rising-autism-diagnoses-in-childhood_08394255-en/full-report/autism-policies-in-israel_9f9b0d86.html"},{"label":"Yated v. Ministry of Education (Israeli Supreme Court, special education entitlement)","url":"https://versa.cardozo.yu.edu/opinions/yated-v-ministry-education"},{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Israel chapter, Law et al. eds., Novogrodsky & Kreiser, pp. 285-294","url":"https://doi.org/10.4324/9780429455308-21"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"IN","name":"India","nat":true,"region":"Asia","subregion":"Southern Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hhnlnlhnhnnnh","filled":["Terminology","Identification criteria","Legal entitlement","Workforce","Policy history"],"looked":["Multilingual provision","Service model"],"nFields":13,"docs":2,"supports":2,"values":{"terminology":"The statutory category is 'speech and language disability' under the RPwD Act 2016. Critically for this catalog, the statutory definition turns on permanent, significant deviation in speech and/or language due to organic or neurological causes — a framing that does not straightforwardly accommodate DLD as CATALISE defines it, since DLD is precisely a language disorder without an identified organic or neurological cause. How far that gap affects access in practice was not established here, but it is the single most important thing to check about this system.","identificationCriteria":"For statutory purposes, certification rather than diagnosis is what counts: a disability certificate stating a disability score, issued by a medical board that includes a medical superintendent, a neurologist and a certified speech-language pathologist. Most entitlements under the Act attach to 'benchmark disability' — a certified disability of not less than 40%. A clinical opinion without a certificate carries no statutory weight.","multilingualProvision":"Not established from the sources consulted for this entry — no national protocol was identified. With 22 scheduled languages and widespread everyday multilingualism, the availability of appropriately normed assessments across Indian languages is the obvious question, and this entry does not answer it. If you work in this system, this is exactly the field to fill in.","serviceModel":"Not established from the sources consulted for this entry — how services are actually organised between hospitals, private clinics, NGOs and schools, and how they differ between states, could not be established from the sources consulted. If you work in this system, this is exactly the field to fill in.","legalEntitlement":"Runs through the RPwD Act 2016 and the National Trust Act 1999 rather than through education or health legislation specifically, and is gated by the certification process above rather than by clinical need.","workforce":"Regulated by the Rehabilitation Council of India: only professionals listed on the Central Rehabilitation Register may practise, and RCI approves the training programmes — over 900 approved institutions running more than 1,700 programmes as of 2022–23. Workforce numbers relative to population need were not established from the sources consulted.","policyHistory":"1992 — Rehabilitation Council of India Act — creates the Central Rehabilitation Register; only registered professionals may practise as rehabilitation professionals.\n2016 — Rights of Persons with Disabilities (RPwD) Act replaces the 1995 Act, listing 'speech and language disability' as a specified disability."},"history":[{"year":"1992","description":"Rehabilitation Council of India Act — creates the Central Rehabilitation Register; only registered professionals may practise as rehabilitation professionals.","links":[]},{"year":"2016","description":"Rights of Persons with Disabilities (RPwD) Act replaces the 1995 Act, listing 'speech and language disability' as a specified disability.","links":[{"label":"'Rights of Persons with Disability' Act: a boon for persons with aphasia (analysis of the Act's speech/language provisions)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7731671/"},{"label":"DEPwD — Acts, Rules & Regulations (RPwD Act 2016, National Trust Act, RCI Act)","url":"https://depwd.gov.in/en/acts/"}]}],"docLinks":[{"label":"DEPwD — Acts, Rules & Regulations (RPwD Act 2016, National Trust Act, RCI Act)","url":"https://depwd.gov.in/en/acts/"},{"label":"'Rights of Persons with Disability' Act: a boon for persons with aphasia (analysis of the Act's speech/language provisions)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7731671/"}],"supportLinks":[{"label":"Rehabilitation Council of India","url":"https://rehabcouncil.nic.in/"},{"label":"ISHA — Indian Speech and Hearing Association","url":"https://www.ishaindia.org.in/"}],"collaborators":[]},{"cc":"IQ","name":"Iraq","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"IR","name":"Iran","nat":true,"region":"Asia","subregion":"Southern Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhlnnnnnnnnn","filled":["Assessments"],"looked":["Multilingual provision"],"nFields":13,"docs":2,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Farsi, developed by Mariam Komeili, Parvaneh Tavakoli and Theodoros Marinis (University of Reading) with Yalda Kazemi (Isfahan University). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"Not established from the sources consulted — a language-appropriate LITMUS sentence repetition instrument exists for this system (see assessments above), but whether any service, clinical guideline or funder requires, supports or reimburses assessment in all of a child's languages was not determined. That gap between an available research instrument and routine clinical practice is the single most useful thing a contributor here could resolve."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"}],"supportLinks":[],"collaborators":[]},{"cc":"IS","name":"Iceland","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnhnhnhnnnnn","filled":["Terminology","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"málhömlun / málþroskaröskun barna\" (Icelandic; roughly \"language impairment / disorder of language development in children\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Iceland in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 18 respondents from Iceland who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 83%; intervention in the mainstream language only 72% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 53%, in intervention 28% and in counselling 89%. On whether the country offers training for practitioners working with bi/multilingual children (n = 19): optional 26%, none 32% and unsure 37%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 38 from Iceland): private practice 66%, nursery or kindergarten 42% and mainstream school 37%, with respondents placing themselves in public health 55%, public education 45% and private 29%. Direct intervention for the reference child was most often weekly (76% of 38). Asked which factors affect access to services in their country, respondents most often named regional variation (83% yes), urban or rural residence (78% yes) and linguistic or cultural community (50% yes) (n ≈ 18). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 38 from Iceland): state health insurance 58%, government education 47%, government health 34% and family 8%. 59% said a maximum number of sessions applied (n = 37). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Iceland chapter, Law et al. eds., Einarsdóttir & Úlfsdóttir, pp. 261-271","url":"https://doi.org/10.4324/9780429455308-19"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"IT","name":"Italy","nat":true,"region":"Europe","subregion":"Southern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhhnhnhnnnnn","filled":["Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":5,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Italian, developed by Chiara Levorato (University of Padua). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 280 respondents from Italy who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 70%; intervention in the mainstream language only 83% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 43%, in intervention 30% and in counselling 50%. On whether the country offers training for practitioners working with bi/multilingual children (n = 318): optional 57%, none 10% and unsure 31%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 606 from Italy): private practice 51%, health clinic or centre 37% and private rehabilitation centre 23%, with respondents placing themselves in private 61%, public health 36% and government-funded private 20%. Direct intervention for the reference child was most often twice weekly (53% of 603). Asked which factors affect access to services in their country, respondents most often named cost to parents (46% yes), urban or rural residence (43% yes) and income level (39% yes) (n ≈ 295). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 606 from Italy): family 58% and government health 44%. 23% said a maximum number of sessions applied (n = 596). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Italy chapter, Law et al. eds., De Cagno, Mollo, Citro, Roch & Marini, pp. 295-301","url":"https://doi.org/10.4324/9780429455308-22"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"JM","name":"Jamaica","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"JO","name":"Jordan","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"JP","name":"Japan","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KE","name":"Kenya","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KG","name":"Kyrgyzstan","nat":true,"region":"Asia","subregion":"Central Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KH","name":"Cambodia","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KI","name":"Kiribati","nat":true,"region":"Oceania","subregion":"Micronesia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KM","name":"Comoros","nat":true,"region":"Africa","subregion":"Eastern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KN","name":"Saint Kitts and Nevis","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KP","name":"North Korea","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KR","name":"South Korea","nat":true,"region":"Asia","subregion":"Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KW","name":"Kuwait","nat":true,"region":"Asia","subregion":"Western Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"KZ","name":"Kazakhstan","nat":true,"region":"Asia","subregion":"Central Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LA","name":"Laos","nat":true,"region":"Asia","subregion":"South-Eastern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LB","name":"Lebanon","nat":true,"region":"Asia","subregion":"Western Asia","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"nnhhnhnhhnnnn","filled":["Assessments","Multilingual provision","Service model","Funding","Workforce"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"assessments":"A LITMUS sentence repetition (SRep) task exists for Lebanese Arabic, developed by Laurie Tuller, Racha Zebib and Philippe Prévost (University of Tours, France) with Lina Choueiri (American University of Beirut). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. Documented in Saad, S. & Henry, G., 'L'épreuve Répétition de phrases: LITMUS-SR-Liban', in Zebib, Prévost, Tuller & Henry (eds), Plurilinguisme et Troubles Spécifiques du Langage au Liban (Presses universitaires de l'Université Saint-Joseph). This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 42 respondents from Lebanon who answered Section 4 of the COST Action IS1406 survey (2017): assessment in both languages 79%, in the mother tongue where it differs from the mainstream language 53% and in the mainstream language only 12%; intervention targeting two or more languages 77% and in the mother tongue 51% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 13%, in intervention 7% and in counselling 24%. On whether the country offers training for practitioners working with bi/multilingual children (n = 43): obligatory 28%, optional 28%, none 19% and unsure 23%. These are practitioner perceptions rather than a record of policy (Law et al., 2020). Multilingualism is the default condition rather than a special case. Kouba Hreich et al. (2020) describe every child in Lebanese schools, and every professional working with them, as at least bilingual: spoken Lebanese Arabic at home, Modern Standard Arabic as a formal classroom language used little in conversation, and at least one of English or French from the start of preschool, each language allocated roughly 6-7 hours a week. The school's chosen language of instruction is often favoured over Arabic. Every SLT respondent reported a bilingual practice. The practical consequence for identification is that no single language can be assumed to be the child's strongest.","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 75 from Lebanon): private practice 72%, special school 43% and health clinic or centre 41%, with respondents placing themselves in private 87%, NGO 27% and public education 21%. Direct intervention for the reference child was most often twice weekly (69% of 74). Asked which factors affect access to services in their country, respondents most often named income level (81% yes), cost to parents (81% yes) and social position (71% yes) (n ≈ 40). Multiple answers were allowed (Law et al., 2020). Predominantly private and school-mediated. Kouba Hreich et al. (2020) report that 74.9% of Lebanese preschoolers attend private schools against 25.1% in public ones, with a further 2.2% of schools run by UNRWA for Palestinian refugees. Of 1,259 preschool teachers surveyed, 52.4% said their school employs a speech and language therapist and 56.8% said they collaborate with one inside or outside the school, while 38.7% said they do not. Both professions recognised a role in supporting language development, but the study found little acknowledgement of any SLT role in prevention for all children as opposed to treatment of identified need.","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 75 from Lebanon): family 91%. 4% said a maximum number of sessions applied (n = 74). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020).","workforce":"The professional association listed 240 registered speech and language therapists when Kouba Hreich et al. (2020) surveyed the profession; the authors reached 391 Lebanese SLTs holding an email address and obtained around 200 responses, 98% of them female, with a mean of 7 years of experience. Of the SLT respondents, 42 were school-based and 36 of those worked in preschools — but 27 of the 36 also ran a private clinical practice alongside it, so school-based work is largely something practitioners do in addition to private practice rather than instead of it."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Lebanon chapter, Law et al. eds., Messarra & Hreich, pp. 310-317","url":"https://doi.org/10.4324/9780429455308-24"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Language support in Lebanese preschools (2020): Kouba Hreich, Messarra & Martinez-Perez, IJLCD","url":"https://doi.org/10.1111/1460-6984.12576"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"LC","name":"Saint Lucia","nat":true,"region":"Americas","subregion":"Caribbean","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LI","name":"Liechtenstein","nat":true,"region":"Europe","subregion":"Western Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LK","name":"Sri Lanka","nat":true,"region":"Asia","subregion":"Southern Asia","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LR","name":"Liberia","nat":true,"region":"Africa","subregion":"Western Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LS","name":"Lesotho","nat":true,"region":"Africa","subregion":"Southern Africa","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LT","name":"Lithuania","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnhhnhnhnnnnn","filled":["Terminology","Assessments","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":6,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"Kalbos sutrikimas (kalbos neišsivystymas)\" (Lithuanian; roughly \"language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Lithuania in the highest band (65% or more had heard of it) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","assessments":"A LITMUS sentence repetition (SRep) task exists for Lithuanian, developed by Eglė Krivickaitė-Leišienė and Ineta Dabašinskienė (Vytautas Magnus University). Sentence repetition tasks are reported to be highly sensitive and specific in identifying language impairment, and the LITMUS family was designed specifically for assessing multilingual children, where monolingual norms do not apply. This records that a language-appropriate instrument exists; it does not establish that any service here uses it.","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 22 respondents from Lithuania who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mainstream language only 59%, in the mother tongue only 38% and in both languages 30%; intervention in the mainstream language only 86% and in the mother tongue 19% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. On whether the country offers training for practitioners working with bi/multilingual children (n = 32): optional 13%, none 25% and unsure 31%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 95 from Lithuania): nursery or kindergarten 66% and mainstream school 37%, with respondents placing themselves in public education 96%. Direct intervention for the reference child was most often twice weekly (45% of 95). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (56% yes), linguistic or cultural community (32% yes) and parental education (32% yes) (n ≈ 32). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 95 from Lithuania): government education 92% and government health 11%. 35% said a maximum number of sessions applied (n = 94). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"LITMUS Sentence Repetition tasks — task list, developers and publications","url":"https://www.litmus-srep.info/"},{"label":"COST Action IS0804 — Language Impairment in a Multilingual Society (LITMUS)","url":"https://www.bi-sli.org/"},{"label":"Managing Children with DLD (2019): Lithuania chapter, Law et al. eds., Makauskienė & Krivickaitė-Leišienė, pp. 318-324","url":"https://doi.org/10.4324/9780429455308-25"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"LU","name":"Luxembourg","nat":true,"region":"Europe","subregion":"Western Europe","status":"stub","confidence":"unverified-submission","lastVerified":"","coverage":"none","fieldStates":"nnnnnnnnnnnnn","filled":[],"looked":[],"nFields":13,"docs":0,"supports":0,"values":{},"history":[],"docLinks":[],"supportLinks":[],"collaborators":[]},{"cc":"LV","name":"Latvia","nat":true,"region":"Europe","subregion":"Northern Europe","status":"partial","confidence":"secondary-source","lastVerified":"2026-08","coverage":"has","fieldStates":"hnnhnhnhnnnnn","filled":["Terminology","Multilingual provision","Service model","Funding"],"looked":[],"nFields":13,"docs":4,"supports":0,"values":{"terminology":"The label used with the public in the COST Action's 2017 European awareness survey was \"valodas traucējumi bērniem\" (Latvian; roughly \"childhood language impairment\"), chosen as the term then most commonly used in the country for childhood language impairment. Public recognition of the concept put Latvia in the lowest of three bands (under 35% of respondents had heard of the concept) of the 18 systems surveyed, where recognition ranged from 13% to over 90%. In almost every country far fewer people had heard of language impairment than of autism, dyslexia or ADHD — around 60% against over 90% for autism (Thordardottir and Topbaş, 2020).","multilingualProvision":"What bi- and multilingual children actually receive, as reported by the 31 respondents from Latvia who answered Section 4 of the COST Action IS1406 survey (2017): assessment in the mother tongue where it differs from the mainstream language 45%, in both languages 39% and in the mainstream language only 26%; intervention in the mother tongue 50% and targeting two or more languages 32% — percentages answering yes, with \"somewhat\" and \"don't know\" excluded. Interpreters are used at least sometimes in assessment 32%, in intervention 24% and in counselling 38%. On whether the country offers training for practitioners working with bi/multilingual children (n = 39): optional 36%, none 18% and unsure 33%. These are practitioner perceptions rather than a record of policy (Law et al., 2020).","serviceModel":"Practitioner-reported work settings (COST Action IS1406 survey, 2017; n = 69 from Latvia): nursery or kindergarten 64% and mainstream school 43%, with respondents placing themselves in public education 88%, public health 22% and private 16%. Direct intervention for the reference child was most often twice weekly (53% of 68). Asked which factors affect access to services in their country, respondents most often named urban or rural residence (51% yes), regional variation (34% yes) and parental education (32% yes) (n ≈ 37). Multiple answers were allowed (Law et al., 2020).","funding":"Practitioner-reported funding for one child on the respondent's own caseload (COST Action IS1406 survey, 2017; n = 69 from Latvia): government education 83%, government health 22%, family 19% and government social services 12%. 33% said a maximum number of sessions applied (n = 69). Practitioners could name more than one funder, and these are reports about individual cases rather than an analysis of national budgets (Law et al., 2020)."},"history":[],"docLinks":[{"label":"Managing Children with DLD (2019): Latvia chapter, Law et al. eds., Tūbele & Daniela, pp. 302-309","url":"https://doi.org/10.4324/9780429455308-23"},{"label":"COST Action IS1406 practitioner survey (2020): full dataset and coding manual, Law et al., CC BY 4.0","url":"https://doi.org/10.25405/data.ncl.9802880.v4"},{"label":"Public awareness of DLD across 18 systems (2020): Thordardottir & Topbaş, Journal of Communication Disorders","url":"https://doi.org/10.1016/j.jcomdis.2020.106057"},{"label":"Allocation and funding of SLT across Europe (2022): Knudsen, Jalali-Moghadam, Nieva, Czaplewska, Laasonen, Gerrits, McKean & Law, Research in Developmental Disabilities — corrected republication","url":"https://doi.org/10.1016/j.ridd.2021.104139"}],"supportLinks":[],"collaborators":[]},{"cc":"LY","name":"Libya","nat":true,"region":"Africa","subregion":"Northern Africa","status":"stub","confidence":"unverified-submission","last

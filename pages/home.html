<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Language Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/shared.css">

<style>
body { display: flex; flex-direction: column; min-height: 100dvh; }

/* The map is scenery here: one flat silhouette behind the choice, not a
   second interactive map competing with the one you are about to open. */
.hero {
  position: relative; flex: 1;
  display: flex; flex-direction: column; justify-content: center;
  padding: 56px 24px 64px;
}
/* Only the backdrop is clipped. Clipping the hero itself cut the planned list
   off the bottom of a short screen, with no way to scroll to it. */
.backdrop {
  position: absolute; inset: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--hair-strong); opacity: .32; pointer-events: none;
}
.backdrop img { width: 132%; max-width: none; }
.hero > .inner {
  position: relative; width: min(920px, 100%); margin: 0 auto;
  background: color-mix(in srgb, var(--ground) 72%, transparent);
  backdrop-filter: blur(2px);
  border-radius: 12px; padding: 4px;
}
@supports not (backdrop-filter: blur(2px)) { .hero > .inner { background: var(--ground); } }

.hero .wordmark {
  font-size: clamp(38px, 7vw, 60px); font-weight: 600; line-height: 1.02;
  letter-spacing: -.03em; margin: 0; color: var(--ink);
}
.hero .lede {
  margin: 10px 0 0; font-size: clamp(15px, 2.2vw, 18px); line-height: 1.5;
  color: var(--ink-soft);
}

.aboutrow { margin: 26px 0 0; font-size: 14px; }
.aboutrow a {
  color: var(--ink-soft); text-decoration: none;
  border-bottom: 1px solid var(--hair-strong); padding-bottom: 2px;
}
.aboutrow a:hover { color: var(--ink); border-bottom-color: var(--ink); }

.choose { margin: 38px 0 0; }
.choose > .eyebrow { display: block; margin-bottom: 12px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); }
.card {
  display: block; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 8px; padding: 17px 18px 18px; box-shadow: var(--shadow);
}
.card:hover { border-color: var(--ink-faint); }
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.card h3 {
  font: inherit; font-size: 16px; font-weight: 600; margin: 0;
  display: flex; align-items: baseline; gap: 8px;
}
.card h3::after {
  content: ""; width: 6px; height: 6px; margin-left: auto; flex: none;
  border-top: 1.5px solid var(--ink-faint); border-right: 1.5px solid var(--ink-faint);
  transform: rotate(45deg); align-self: center;
}
.card p { margin: 7px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }
.card .count {
  display: block; margin-top: 12px; padding-top: 10px; font-size: 12px;
  border-top: 1px solid var(--hair); color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.soonlist { margin: 26px 0 0; }
.soonlist > .eyebrow { display: block; margin-bottom: 10px; }

footer.foot {
  flex: none; padding: 14px 18px; background: var(--surface);
  border-top: 1px solid var(--hair);
  font-size: 12px; color: var(--ink-faint); line-height: 1.5;
}
footer.foot a { color: var(--ink-soft); }

@media (max-width: 820px) {
  /* Let the page scroll on a phone instead of trying to centre a column that
     does not fit. */
  body { min-height: 100dvh; }
  .hero { padding: 26px 16px 36px; justify-content: flex-start; }
  .hero .lede { font-size: 15px; }
  .choose { margin-top: 28px; }
  .soonlist { margin-top: 22px; }
  .backdrop img { width: 210%; }
  .hero > .inner { padding: 0; background: none; backdrop-filter: none; }
}
</style>

<div class="hero">
  <div class="backdrop"><img src="/world.svg" alt="" aria-hidden="true"></div>
  <div class="inner">
    <h1 class="wordmark">Language Atlas</h1>
    <p class="lede">Provision and policy, by region</p>

    <div class="choose">
      <span class="eyebrow">Open a map</span>
      <div class="cards" id="cards"></div>
    </div>

    <div class="soonlist">
      <span class="eyebrow">Planned pages</span>
      <div class="pills" id="soon"></div>
    </div>

    <p class="aboutrow"><a href="/about">About this project</a></p>
  </div>
</div>

<footer class="foot">
  Every country listed from the start, most still undocumented · entry text CC BY 4.0
</footer>

<script type="module">
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The home page needs the domain list and their counts, not the geometry, so
// it asks for the same payload the map uses and reads only the summary.
try {
  const atlas = await fetch('/api/atlas').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const live = atlas.domains.filter(d => d.live);
  document.getElementById('cards').innerHTML = live.map(d => {
    const s = atlas.stats[d.id] || {};
    return `<a class="card" href="/${esc(d.id)}">
      <h3>${esc(d.label)}</h3>
      <p>${esc(d.blurb)}</p>
      <span class="count">${s.documented ?? '—'} of ${s.entries ?? '—'} places documented so far</span>
    </a>`;
  }).join('');
  document.getElementById('soon').innerHTML = atlas.domains.filter(d => !d.live)
    .map(d => `<span class="pill soon" title="${esc(d.blurb)}">${esc(d.label)}</span>`).join('');
} catch (err) {
  // Never leave the page with no way in: fall back to plain links.
  document.getElementById('cards').innerHTML = `
    <a class="card" href="/eal"><h3>Majority language acquisition</h3></a>
    <a class="card" href="/dld"><h3>Language disorder support</h3></a>`;
}
</script>

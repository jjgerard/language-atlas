<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Language Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/shared.css">

<style>
/* Palette, base type and the site nav come from shared.css. Only rules the
   map itself needs live here. */
.app { display: flex; flex-direction: column; height: 100dvh; }
/* `hidden` is UA styling -- [hidden] { display: none } at specificity (0,1,0)
   -- so any class rule here that sets `display` silently outranks it and the
   element stays on screen. Several do. The two below (#dcontent, .domainnote)
   were each patched one at a time when it bit; this is the general form, and
   it is why the legend's coverage rows were still explaining hatching on a map
   shaded by a coded value. */
[hidden] { display: none !important; }

.searchwrap { position: relative; margin-left: auto; flex: none; }
.searchwrap input {
  font: inherit; font-size: 13px;
  width: 230px; padding: 8px 11px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hair); border-radius: 4px;
}
.searchwrap input::placeholder { color: var(--ink-faint); }
.results {
  position: absolute; top: calc(100% + 6px); right: 0; width: 300px;
  max-height: 340px; overflow-y: auto; z-index: 40;
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 4px; box-shadow: var(--shadow); padding: 4px;
}
.results:empty { display: none; }
.results button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: 13px; text-align: left;
  padding: 7px 8px; border: 0; border-radius: 3px;
  background: none; color: var(--ink); cursor: pointer;
}
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results .sub { color: var(--ink-faint); font-size: 11.5px; margin-left: auto; }

/* ---------------- map ---------------- */
/* The panel parks off-screen via a transform, which still counts toward the
   scrollable area — clip it here so the page itself never scrolls. */
.stage { position: relative; flex: 1; min-height: 0; background: var(--ground); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }

/* A country border and a border between two states of one country are not the
   same kind of line, and drawing them at one weight made a split country read
   as though its parts were countries. Countries keep the heavier line; the
   divisions inside one are drawn lighter and in a softer colour, so Spain
   still reads as Spain with regions in it. */
/* --hair-strong rather than --ground-deep, which was too pale to be the thing
   the hover highlight contrasts WITH. Measured against the hover white:
   --ground-deep 1.33:1, --hair 1.57:1, --hair-strong 2.31:1. And on the palest
   coverage fill --ground-deep scored 1.01:1 against the fill itself -- an
   invisible line, which is why the hover looked hidden on some borders: there
   was nothing there to change. --hair-strong reads at 1.74:1 on that fill. */
.unit { stroke: var(--hair-strong); stroke-width: .9px; vector-effect: non-scaling-stroke; }
/* The SAME grey at half the weight. It was --hair-strong, which is darker than
   the country line, so a region border was the more prominent of the two and
   the hierarchy read backwards. One colour, two weights. */
.unit.sub { stroke-width: .45px; }
.unit.hit { cursor: pointer; }
.unit.base { pointer-events: none; }

/* The country outline of a SPLIT country, drawn above its own regions so the
   regions cannot bury it, and paired with a wide invisible stroke that makes
   the border itself the way to select the country.
   Before this the only way to reach Spain was to find a piece of it that no
   region covered; now its edge is a target. Non-scaling so the band stays the
   same handful of screen pixels at every zoom. */
.edge { fill: none; stroke: var(--hair-strong); stroke-width: 1.4px;
        vector-effect: non-scaling-stroke; pointer-events: none; }
/* 12px of stroke, clipped to the country, so about 6 fall inside it -- the
   band a reader actually gets. Unclipped this would be twice as wide as
   intended and would spill over the border into the neighbour. */
.edgehit { fill: none; stroke: transparent; stroke-width: 12px;
           vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.edge.sel { stroke: var(--pick); stroke-width: 2.4px; }
.edge.hov { stroke: var(--pick); stroke-width: 1.9px; }
/* Inherited: dashed rather than solid, but in the same grey as any other
   border. It was white, which read as a different KIND of line rather than a
   different state of one. The dash has to stay: an inherited unit is painted
   at --cov-1, the palest coverage step, so without it "follows its country"
   and "a fifth of the questions answered" are the same picture. */
.unit.inherited { stroke-dasharray: 3 2.5; opacity: .96; }
.dot.inherited { stroke-dasharray: 2 2; }

/* Resting borders are grey and differ only in weight. Pointing at something
   turns its border WHITE, which reads on every fill in the ramp -- black
   disappeared into the dark end of it. */
.unit.sel { stroke: var(--pick); stroke-width: 2px; }
.unit.hov { stroke: var(--pick); stroke-width: 1.5px; }
/* The same two rules, on the copy that sits above every other shape. No fill:
   this is an outline over the real shape, not a second shape covering it, so
   the coverage colour underneath still shows through. */
.halo { fill: none; stroke: var(--pick); vector-effect: non-scaling-stroke; pointer-events: none; }
.halo.sel { stroke-width: 2px; }
.halo.hov { stroke-width: 1.5px; }
.halo.inherited { stroke-dasharray: 3 2.5; }
.dot { stroke: var(--hair-strong); stroke-width: 1px; vector-effect: non-scaling-stroke; cursor: pointer; }
.dot.sel, .dot.hov { stroke: var(--pick); stroke-width: 2px; }
.leader { stroke: var(--hair-strong); stroke-width: .75px; vector-effect: non-scaling-stroke; fill: none; }

/* floating panels over the map */
.overlay {
  position: absolute; background: var(--surface);
  border: 1px solid var(--hair); border-radius: 4px;
  box-shadow: var(--shadow);
}
/* Four boxes, one open. The map being read is the expanded one, so the switch
   and the thing switched to are the same object: there is no separate list of
   links, and adding a fifth domain adds a fifth collapsed header rather than
   199px to a row that had already run out of room. */
.domainstack {
  top: 14px; left: 14px; width: 258px; padding: 0;
  background: transparent; border: 0; box-shadow: none;
  display: flex; flex-direction: column; gap: 7px;
  max-height: calc(100% - 28px); overflow-y: auto;
}
.dbox {
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 4px; box-shadow: var(--shadow); overflow: hidden;
  /* The stack is a column flexbox with a max-height, so without this the
     boxes are flex items that SHRINK: the open one was squashed to nothing
     and its grid row resolved to 0 however the track was written. Let them
     keep their height and let the stack scroll instead. */
  flex: 0 0 auto;
}
/* The open box carries the map you are reading, so it should not be a box
   like the other three with more inside it. An inset edge in the ramp's own
   colour and a heavier heading; the padding shift keeps the text off the bar. */
.dbox.open {
  border-color: var(--ink-faint);
  box-shadow: var(--shadow), inset 3px 0 0 var(--cov-4);
}
.dhead {
  width: 100%; font: inherit; font-size: 11px; font-weight: 600;
  letter-spacing: .085em; text-transform: uppercase; color: var(--ink-soft);
  background: none; border: 0; padding: 11px 14px; cursor: pointer;
  display: flex; align-items: center; gap: 9px; text-align: left; line-height: 1.35;
}
.dhead:hover { color: var(--ink); background: var(--surface-2); }
.dbox.open .dhead {
  color: var(--ink); cursor: default; background: none;
  font-weight: 700; padding-left: 17px; padding-bottom: 5px;
}
.dbox.open .dhead:hover { background: none; }
/* The swatch is the map's own colour for that domain's best-documented step,
   so a collapsed box still says which map it is without reading the words. */
.dhead .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--cov-4); opacity: .55; }
.dbox.open .dhead .dot { opacity: 1; }
/* 0fr to 1fr animates; height:auto does not. The inner element carries the
   overflow so the content is clipped rather than spilling while it moves. */
.dbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s ease; }
.dbox.open .dbody { grid-template-rows: 1fr; }
.dinner { overflow: hidden; }
#dcontent { padding: 0 14px 12px 17px; }
#dcontent[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .dbody { transition: none; } }
.domainstack select {
  font: inherit; font-size: 13px; width: 100%;
  padding: 7px 8px; border-radius: 3px;
  border: 1px solid var(--hair); background: var(--surface-2); color: var(--ink);
}
.blurb { font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.45; }
/* A domain's note about its own framing. Set apart from the blurb by a rule
   rather than a colour, so it reads as an aside rather than as a warning —
   nothing here is wrong, the naming is just contested. */
.domainnote { margin: 6px 0 0; font-size: 11.5px; line-height: 1.45; }
.domainnote a {
  color: var(--focus); text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px;
}
.domainnote a:hover { text-decoration-style: solid; }
.domainnote[hidden] { display: none; }


/* Bottom of the map beside the zoom, laid out along the edge rather than down
   a column: it is a caption for the whole map now, not part of any one box. */
/* Swatches, then the ramp under them, both starting at the same left edge.
   Sitting them side by side centred the ramp against a block that wraps to
   two or three lines depending on the width, so it floated at a different
   height every time. */
.legendbox {
  bottom: 14px; right: 62px; padding: 10px 13px 11px;
  display: flex; flex-direction: column; gap: 9px;
  width: 236px;
}
.legendbox .rows { display: flex; flex-direction: column; gap: 5px; }
/* The focused panel: one question, one unit. */
.cpan .where { font-size: 12px; color: var(--ink-faint); margin: 2px 0 14px; }
.cpanval { margin: 0 0 16px; }
.cpanval .cv {
  display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1.4;
  padding: 7px 10px; border-radius: 5px; cursor: pointer; list-style: none;
  background: var(--surface-2); border: 1px solid var(--hair); color: var(--ink);
}
.cpanval .cv::-webkit-details-marker { display: none; }
.cpanval .cv .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid var(--hair); }
.cpanval .cv.ord { border-left: 3px solid var(--cov-3); }
.cpanval .cvwrap + .cvwrap, .cpanval .cvwrap + .cv, .cpanval .cv + .cv { margin-top: 6px; }
.cpanval .cgloss {
  margin: 7px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-soft);
  padding-left: 10px; border-left: 2px solid var(--hair); white-space: normal;
}
.cpanval .cgwhere {
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-faint); margin: 9px 0 3px; padding-left: 12px;
}
.cpanval .cglist {
  margin: 5px 0 0; padding: 0 0 0 10px; list-style: none;
  border-left: 2px solid var(--hair);
}
.cpanval .cglist li {
  position: relative; margin: 0 0 4px; padding-left: 13px;
  font-size: 12.5px; line-height: 1.55; color: var(--ink-soft);
}
.cpanval .cglist li:last-child { margin-bottom: 0; }
.cpanval .cglist li::before {
  content: ''; position: absolute; left: 2px; top: .62em;
  width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint);
}
.cpanval .ctail { font-style: italic; }
.cpanval .cnone { font-size: 13px; color: var(--ink-soft); margin: 0; }
.cpansrc { border-top: 1px dashed var(--hair); padding-top: 11px; }
.cpansrc .ch {
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 7px;
}
.cpansrc .cnone { font-size: 13px; color: var(--ink-faint); font-style: italic; margin: 0; }
.cpanlinks { border-top: 1px dashed var(--hair); padding-top: 11px; margin-top: 14px; }
.cpanlinks .ch {
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 7px;
}
.cpanlinks .links { display: flex; flex-direction: column; gap: 6px; }
.cpanlinks .links a {
  font-size: 12.5px; line-height: 1.45; color: var(--focus);
  text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px;
}
.cpanlinks .links a:hover { text-decoration-style: solid; }
.cpanlinks .cnone { font-size: 12.5px; color: var(--ink-faint); font-style: italic; margin: 0; }
.cpanlinks .srcrow { display: flex; flex-direction: column; gap: 1px; }
.cpanlinks .why { font-size: 10.5px; color: var(--ink-faint); letter-spacing: .02em; }
.cpanlinks .why b { font-weight: 600; color: var(--ink-soft); }
.cpanlinks .rest { margin-top: 11px; }
.cpanlinks .rest > summary {
  font-size: 11px; color: var(--ink-faint); cursor: pointer; list-style: none; padding: 2px 0;
}
.cpanlinks .rest > summary::-webkit-details-marker { display: none; }
.cpanlinks .rest > summary::before { content: 'B8 '; }
.cpanlinks .rest[open] > summary::before { content: 'BE '; }
.cpanlinks .rest > summary:hover { color: var(--ink-soft); }
.cpanlinks .rest .links { margin-top: 7px; }
.cpanlinks .note { font-size: 11px; color: var(--ink-faint); margin: 9px 0 0; line-height: 1.5; }
.cpanlinks .drafted { margin-bottom: 13px; }
.cpanlinks .drafted .ch { color: var(--ink-soft); }
.cpanlinks blockquote.q {
  margin: 3px 0 0; padding: 0 0 0 9px; border-left: 2px solid var(--hair);
  font-size: 11.5px; line-height: 1.5; color: var(--ink-soft);
}
.cpanlinks blockquote.q .where { display: block; margin-top: 2px; color: var(--ink-faint); font-size: 10.5px; }
.wholeentry {
  margin-top: 16px; font: inherit; font-size: 12px; color: var(--ink-soft);
  background: none; border: 1px solid var(--hair); border-radius: 5px;
  padding: 7px 11px; cursor: pointer; width: 100%; text-align: left;
}
.wholeentry:hover { color: var(--ink); border-color: var(--hair-strong); }
/* Label on its own line, menu on the next. Side by side the menu took whatever
   width its longest option wanted -- "rule locus — Newcomer criteria" -- and
   hung out over the map past the edge of the box it belongs to. Stacked, it
   takes the box's width and the option text truncates instead. */
.shadeby { display: flex; flex-direction: column; gap: 5px; margin: 0 0 9px; }
.crossby label { display: flex; align-items: center; gap: 6px; text-transform: none;
  letter-spacing: 0; font-size: 12px; cursor: pointer; }
.crossby input { accent-color: var(--ink-faint); }
.crossby select:disabled { opacity: .45; }
.cross-ramp { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 2px; }
.cross-ramp .rh { font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-faint); }
.cross-ramp .rr { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.cross-ramp .rr i { width: 15px; height: 10px; border: 1px solid var(--hair); font-style: normal; }
.shadeby label { font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; text-transform: uppercase; }
.shadeby select {
  font: inherit; font-size: 12px; padding: 4px 6px;
  width: 100%; max-width: 100%; box-sizing: border-box;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hair); border-radius: 4px;
}
.catlegend { display: flex; flex-direction: column; gap: 4px; margin: 0 0 9px; }
.catlegend .cl {
  display: flex; align-items: center; gap: 8px; font-size: 11.5px;
  background: none; border: 0; padding: 1px 0; color: var(--ink);
  text-align: left; cursor: pointer; width: 100%;
}
.catlegend .cl[disabled] { cursor: default; color: var(--ink-soft); }
.catlegend .cl .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid var(--hair); }
.catlegend .cl .n { margin-left: auto; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.catlegend .cl.off { opacity: .42; }
.catlegend .note { font-size: 11px; color: var(--ink-faint); line-height: 1.45; margin: 2px 0 0; }
.catlegend .readall {
  font-size: 11px; color: var(--ink-faint); text-decoration: none; margin-top: 4px;
  padding-top: 5px; border-top: 1px solid var(--hair);
}
.catlegend .readall:hover { color: var(--ink); text-decoration: underline; }
.legendbox .ramplabel {
  display: block; font-size: 10px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px;
}


.legend h2 { font: inherit; font-size: 11px; margin: 0 0 9px; }
.legendbox .row { display: flex; align-items: center; gap: 9px; font-size: 12px; margin-bottom: 6px; }
.legendbox .row { margin-bottom: 0; }
.legendbox .sw { width: 22px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.legend .note { font-size: 11px; color: var(--ink-faint); margin: 10px 0 0; line-height: 1.45; }
.legendbox .hues { display: flex; gap: 3px; }
.legendbox .hues span { flex: 1; height: 7px; border-radius: 1px; }
.legendbox .hueslabels {
  display: flex; gap: 3px; margin-top: 5px;
  font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em;
}
.legendbox .hueslabels span { flex: 1; text-align: center; }

.zoomctl { bottom: 14px; right: 14px; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.zoomctl button {
  font: inherit; font-size: 17px; line-height: 1;
  width: 34px; height: 34px; border: 0; background: var(--surface);
  color: var(--ink); cursor: pointer;
}
.zoomctl button + button { border-top: 1px solid var(--hair); }
.zoomctl button:hover { background: var(--surface-2); }
.zoomctl .reset { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

/* load + failure states, over the map */
.loading {
  position: absolute; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: var(--ground); text-align: center; padding: 24px;
}
.loading.done { display: none; }
.loading p { margin: 0; font-size: 13px; color: var(--ink-soft); max-width: 42ch; line-height: 1.5; }
.loading .spin {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--hair); border-top-color: var(--ink-soft);
  animation: spin .8s linear infinite;
}
.loading.failed .spin { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading .spin { animation-duration: 3s; } }

/* tooltip */
.tip {
  position: absolute; z-index: 30; pointer-events: none;
  max-width: 280px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--hair-strong);
  border-radius: 4px; box-shadow: var(--shadow);
  opacity: 0; transition: opacity .09s;
}
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
.tip.on { opacity: 1; }
.tip .name { font-weight: 600; font-size: 13.5px; }
.tip .meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
.tip .cq {
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-faint); margin-top: 8px;
}
.tip .state { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-top: 7px; }
.tip .cq + .state { margin-top: 4px; }
.tip .state .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.tip .inherit {
  font-size: 11px; color: var(--ink-soft); margin-top: 7px;
  padding-top: 7px; border-top: 1px solid var(--hair);
}
.tip .hintline { font-size: 10.5px; color: var(--ink-faint); margin-top: 8px; }

/* field checklist — the point of the hover is "what is and isn't here" */
.fieldgrid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair);
}
.fieldgrid span {
  font-size: 11px; line-height: 1.5; color: var(--ink-faint);
  display: flex; align-items: center; gap: 6px;
}
.fieldgrid span::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  border: 1px solid var(--hair-strong); background: transparent;
}
.fieldgrid span.on { color: var(--ink); }
.fieldgrid span.on::before { background: var(--mark, var(--cov-3)); border-color: var(--mark, var(--cov-3)); }
.fieldgrid span.looked { color: var(--ink-soft); }
.fieldgrid span.looked::before { background: var(--hatch-line); border-color: var(--hatch-line); opacity: .55; }

/* full entry in the panel */
/* No rule between fields: the uppercase label and its dot already separate
   them, and a hairline every 40px down a long entry reads as a table nobody
   asked for. Spacing alone does the work. */
.field { padding: 0 0 13px; }
.field:last-child { padding-bottom: 0; }
.field h4 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 5px; display: flex; align-items: center; gap: 7px;
}
.field h4::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  border: 1px solid var(--hair-strong);
}
.field.on h4 { color: var(--ink-soft); }
.field.on h4::before { background: var(--mark, var(--cov-3)); border-color: var(--mark, var(--cov-3)); }
.field.looked h4::before { background: var(--hatch-line); border-color: var(--hatch-line); opacity: .55; }
.field p {
  margin: 0; font-size: 13.5px; line-height: 1.58; white-space: pre-line;
  overflow-wrap: break-word;
}

.field.empty p, .field.looked p { color: var(--ink-faint); font-style: italic; }
/* Not applicable: the question has no meaning for this unit. Set apart from
   "empty" so it does not read as an invitation to fill it in. */
.field.na h4::before { background: transparent; border-style: dotted; border-color: var(--hair-strong); }
.field.na p { color: var(--ink-faint); font-style: italic; }
.fieldgrid span.na { color: var(--ink-faint); }
.fieldgrid span.na::before { background: transparent; border-style: dotted; border-color: var(--hair-strong); }
.field.inh h4::before { background: transparent; border-style: dashed; border-color: var(--hair-strong); }
.field.inh p { color: var(--ink-soft); }

/* Sub-bullets. A short rule rather than a dot: the field heading already
   carries a dot, and two dot sizes stacked in one narrow column read as a
   hierarchy that isn't there. */
.field ul.bul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.field ul.bul li {
  position: relative; padding-left: 13px;
  font-size: 13px; line-height: 1.5; overflow-wrap: break-word;
}
.field ul.bul li::before {
  content: ""; position: absolute; left: 2px; top: .68em;
  width: 5px; height: 1px; background: var(--hair-strong);
}
.field.looked ul.bul li { color: var(--ink-faint); font-style: italic; }
.field.inh ul.bul li { color: var(--ink-soft); }
.field h4 .from {
  margin-left: auto; letter-spacing: .04em; text-transform: none;
  font-weight: 500; font-size: 10px; color: var(--ink-faint); font-style: italic;
}
/* The way out to the same question asked everywhere. Quiet until the field is
   hovered: it belongs to every heading, and thirteen of them shouting at once
   would compete with the content the panel exists to show. `.from` also takes
   margin-left:auto, so on an inherited field the two share the right edge and
   this one sits after it. */
/* The field NAME is the link, so the heading has to keep looking like a
   heading: it inherits everything and earns an underline and an arrow on hover.
   The arrow is always there rather than appearing on hover, because on touch
   and keyboard there is no hover and the affordance has to exist anyway. */
.field h4 a.fieldmap {
  color: inherit; text-decoration: none; font: inherit; letter-spacing: inherit;
  text-transform: inherit; transition: color .12s;
}
.field h4 a.fieldmap span { color: var(--ink-faint); transition: color .12s; }
.field h4 a.fieldmap:hover, .field h4 a.fieldmap:focus-visible { color: var(--ink); text-decoration: underline; }
.field h4 a.fieldmap:hover span { color: var(--ink); }

a.cite {
  color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus);
}
a.cite:hover { color: var(--focus); text-decoration-style: solid; }

/* policy history reads as a dated list, each row carrying its document */
/* The languages themselves: a name that links to its WALS record where one
   exists, then classification, typology and identifiers, each stepping down in
   weight so the name is what the eye lands on. */
.langs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.langs li { display: flex; flex-direction: column; gap: 1px; }
.langs .lname { font-size: 13px; font-weight: 500; }
.langs .lname a { color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus); }
.langs .lname a:hover { color: var(--focus); text-decoration-style: solid; }
.langs .lcls { font-size: 11.5px; color: var(--ink-soft); }
.langs .ltyp { font-size: 11.5px; color: var(--ink-soft); }
.langs .lids { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
/* Offering and programme rows. Same visual grammar as .langs -- the head of
   the row reads as the name, everything under it as its detail -- because a
   reader moving between "The languages" and "Linguistics" on one panel should
   not have to learn two layouts. The institution is the link. */
.offs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.offs li { display: flex; flex-direction: column; gap: 1px; }
.offs .oname { font-size: 13px; font-weight: 500; }
.offs .oinst { font-size: 12px; }
.offs .oinst a { color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus); }
.offs .oinst a:hover { color: var(--focus); text-decoration-style: solid; }
.offs .ometa { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.offs .onote { font-size: 11.5px; color: var(--ink-soft); }

.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.hist li { display: grid; grid-template-columns: 58px 1fr; gap: 11px; align-items: start; }
.hist .yr {
  font-variant-numeric: tabular-nums; font-size: 11.5px; font-weight: 600;
  color: var(--ink-faint); padding-top: 2px; letter-spacing: .01em;
}
.hist p { margin: 0; }
.hist .links { margin-top: 5px; gap: 4px; }
.hist .links a { font-size: 12px; }

.links { display: flex; flex-direction: column; gap: 7px; }
.links a {
  font-size: 12.5px; line-height: 1.4; color: var(--focus);
  text-decoration: none; overflow-wrap: anywhere;
}
.links a:hover { text-decoration: underline; }
.links a { position: relative; padding-left: 15px; }
.links a::before {
  content: ""; position: absolute; left: 1px; top: .48em;
  width: 5px; height: 5px; opacity: .55;
  border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor;
  transform: rotate(45deg);
}
.viaterr {
  font-size: 11.5px; color: var(--ink-soft); line-height: 1.5;
  background: var(--surface-2); border-left: 2px solid var(--hair-strong);
  padding: 9px 11px; border-radius: 0 3px 3px 0; margin: 13px 0 0;
}

/* What was looked for and not found, where someone recorded it. Set apart from
   .viaterr because it is a finding about the world, not a note about how this
   panel is assembled. */
.stubnote {
  font-size: 12px; color: var(--ink-soft); line-height: 1.55;
  background: var(--surface-2); border-left: 2px solid var(--hatch-line);
  padding: 10px 12px; border-radius: 0 3px 3px 0; margin: 13px 0 0;
}
.stubnote b { color: var(--ink); font-weight: 600; }

/* Contributing, from the entry you are looking at. An empty record is the
   place a reader is most likely to know something, so the ask is loudest
   there and quietest where the entry is already full. */
.contribute { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hair); }
.contribute h3 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 8px;
}
.contribute p { margin: 0 0 11px; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
.contribute .row { display: flex; gap: 8px; flex-wrap: wrap; }
.cbtn {
  font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  padding: 8px 13px; border-radius: 6px; text-decoration: none;
  border: 1px solid var(--hair-strong); background: var(--surface); color: var(--ink-soft);
  display: inline-flex; align-items: center;
}
.cbtn:hover { border-color: var(--ink-faint); color: var(--ink); }
.cbtn.lead { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.cbtn.lead:hover { color: var(--surface); opacity: .9; }
.contribute .elsewhere { font-size: 11.5px; color: var(--ink-faint); margin: 10px 0 0; }

/* Correction dialog. Kept on the map rather than sending the reader to a
   separate page: a correction is about the entry they are already reading. */
.dlg {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 18px;
  background: color-mix(in srgb, var(--ink) 42%, transparent);
}
.dlg.on { display: flex; }
.dlg .box {
  background: var(--surface); border: 1px solid var(--hair); border-radius: 9px;
  box-shadow: var(--shadow); width: min(460px, 100%); max-height: 92dvh;
  overflow-y: auto; padding: 20px;
}
.dlg h3 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.dlg .sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 16px; }
.dlg label { display: block; font-size: 12.5px; font-weight: 600; margin: 0 0 4px; }
.dlg input, .dlg textarea {
  width: 100%; font: inherit; font-size: 13.5px; color: var(--ink);
  background: var(--ground); border: 1px solid var(--hair-strong);
  border-radius: 5px; padding: 8px 10px; margin-bottom: 13px;
}
.dlg textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg .said { font-size: 12.5px; padding: 9px 11px; border-radius: 5px; margin: 0 0 13px; }
.dlg .said.bad { background: color-mix(in srgb, var(--r-oceania) 15%, var(--surface)); }
.dlg .said.ok { background: color-mix(in srgb, var(--r-americas) 15%, var(--surface)); }

/* detail panel */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 380px;
  background: var(--surface); border-left: 1px solid var(--hair);
  box-shadow: var(--shadow); overflow-y: auto; z-index: 20;
  transform: translateX(100%); transition: transform .18s ease;
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.panel.on { transform: none; }
.panel .inner { padding: 18px 20px 40px; }
.panel .close {
  position: sticky; top: 0; float: right; margin: -4px -6px 0 0;
  /* Sticky and z-index:auto put this in DOM order against the other positioned
     elements in the panel, and every bullet and every source link is
     position:relative to hang its ::before marker on. All of them come later in
     the DOM, so anything scrolling under the button painted over it: the X went
     dead below its top few pixels, and a .links a passing through took the click
     and navigated away to the source. The panel is its own stacking context, so
     one z-index here is scoped to it. */
  z-index: 1;
  font: inherit; font-size: 20px; line-height: 1;
  width: 30px; height: 30px; border: 0; border-radius: 3px;
  background: var(--surface); color: var(--ink-soft); cursor: pointer;
}
.panel .close:hover { background: var(--surface-2); color: var(--ink); }
.panel h2 {
  font-weight: 500;
  font-size: 25px; line-height: 1.18; margin: 6px 0 3px;
  text-wrap: balance; letter-spacing: -.01em;
}
.panel .where { font-size: 12.5px; color: var(--ink-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 13px 0 0; }
.chip {
  font-size: 11px; padding: 3px 8px; border-radius: 2px;
  border: 1px solid var(--hair-strong); color: var(--ink-soft);
}
.chip.solid { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip.hatched {
  background-image: repeating-linear-gradient(45deg,
    transparent 0 3px, var(--hatch-line) 3px 4px);
  background-color: var(--hatch-bg); color: var(--ink);
  border-color: var(--hair-strong);
}

.sect { margin-top: 22px; }
.sect > h3 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 9px; padding-bottom: 6px; border-bottom: 1px solid var(--hair);
}
.kv { display: grid; grid-template-columns: 108px 1fr; gap: 5px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink-faint); }
.kv dd { margin: 0; }
.excerpt {
  font-size: 14.5px; line-height: 1.55;
  color: var(--ink); margin: 0;
}
.excerpt .lbl {
  display: block; font-family: Archivo, sans-serif; font-size: 10.5px;
  font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-faint); margin-bottom: 5px;
}
/* Moving between a state and its country. The country name was already
   printed above every sub-national entry and above every inheritance note, but
   only as text, so the way back up was the map or the sibling list at the very
   bottom of a long panel. */
.tocountry {
  font: inherit; color: var(--focus); background: none; border: 0; padding: 0;
  cursor: pointer; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px;
}
.tocountry:hover { text-decoration-style: solid; }
.viaterr .tocountry { color: var(--ink); font-weight: 600; }
.wherewrap { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.tosub {
  font: inherit; font-size: 12.5px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--hair-strong); border-radius: 4px; padding: 4px 7px;
  max-width: 100%; cursor: pointer;
}
.sibs { display: flex; flex-direction: column; gap: 1px; }
.sibs button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  font: inherit; font-size: 12.5px; text-align: left;
  padding: 7px 8px; margin-left: -8px; border: 0; border-radius: 3px;
  background: none; color: var(--ink); cursor: pointer;
}
.sibs button:hover { background: var(--surface-2); }
.sibs button[disabled] { cursor: default; background: var(--surface-2); }
.sibs .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.sibs .role { margin-left: auto; font-size: 10.5px; color: var(--ink-faint); }
.cross { display: flex; flex-direction: column; gap: 1px; }
.cross .r { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 5px 0; }
.cross .r .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.cross .r .n { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.caveat {
  font-size: 11.5px; color: var(--ink-soft); line-height: 1.5;
  background: var(--surface-2); border-left: 2px solid var(--hair-strong);
  padding: 9px 11px; border-radius: 0 3px 3px 0; margin: 0;
}

/* ---------------- mobile ---------------- */
@media (max-width: 820px) {
  /* Search stays in the bar on mobile — it is the fastest way to a country
     and does not belong behind a menu. */
  .searchwrap { flex: 1; min-width: 0; }
  .searchwrap input { width: 100%; padding: 9px 11px; }
  .results { width: calc(100vw - 24px); right: auto; left: 0; }

  /* The map keeps the whole viewport it is given; the panel sits below it in
     normal flow instead of floating over it. */
  .stage { display: flex; flex-direction: column; }
  /* The map takes every pixel the legend does not need. A world map is 2.3x as
     wide as it is tall, so on a portrait phone the drawn map is always limited
     by WIDTH — giving it more height cannot make the drawing bigger, it just
     centres it in more of the map's own ground colour. That is the right place
     for the slack: ground reads as ocean and belongs to the map, whereas the
     same gap under a short legend read as a dead white slab across the bottom
     third of the screen. */
  #map { flex: 0 0 auto; min-height: 140px; }

  /* THE ACCORDION IS A DESKTOP THING. On a phone there is no room to spend on
     three collapsed headers above a legend that is already pinned to the
     bottom of the screen, and the four maps are one tap away in the menu
     anyway. So the closed boxes are hidden, the open one drops its own
     chrome, and the stack becomes the single static panel this layout has
     always had. */
  .domainstack {
    /* Natural height, pushed to the bottom by margin-top:auto so the legend
       ends flush with the bottom of the screen. The slack left between map and
       legend is .stage's own ground colour — the same grey the map floats in —
       so it reads as ocean continuing down to the key rather than as a blank
       panel. Letting this box FLEX instead was worse both ways: stretch it and
       you get a white slab, shrink it and the legend silently scrolls with rows
       clipped off the bottom. */
    position: static; width: auto; flex: 0 0 auto; order: 2; margin-top: auto;
    /* min-height:0 lets a flex child shrink below its content, so a legend
       that does not fit scrolls instead of spilling past the clipped stage. */
    min-height: 0; max-height: none; overflow-y: auto;
    gap: 0; background: var(--surface);
    border-top: 1px solid var(--hair);
  }
  .dbox:not(.open) { display: none; }
  .dbox.open {
    border: 0; border-radius: 0; box-shadow: none; background: none;
  }
  .dhead { padding: 10px 14px 0; font-size: 10.5px; }
  .dhead:hover { background: none; }
  /* No animation to run when there is only ever one box showing. */
  .dbody { grid-template-rows: 1fr; transition: none; }
  #dcontent { padding: 0 14px 12px; }
  .legendbox {
    /* The desktop box is a fixed 236px so the ramp does not resize as domains
       change; in the phone layout it is a full-width strip instead. */
    position: static; order: 3; flex: 0 0 auto; width: auto;
    /* TOP-ALIGNED, because #catlegend is not the coverage key. These row rules
       were written for three short rows and a ramp; the category key carries
       one row per value -- 14 at the widest, on localTerm.family -- and as a
       column that is around 400px. Centred against it, the Shade by control
       sat 93px below the bottom of .stage, which has overflow:hidden, so the
       one control that gets a reader back OUT of a field view was not just
       off-screen but unreachable. */
    flex-direction: row; align-items: flex-start; justify-content: space-between;
    border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0;
    border-top: 1px solid var(--hair); box-shadow: none;
    padding: 9px 14px 11px; gap: 8px 14px;
  }
  .legendbox .rows { display: flex; flex-direction: row; flex-wrap: wrap; gap: 4px 14px; }
  /* Cap the values and let them scroll, the same answer .domainstack already
     gives: a key that does not fit scrolls instead of spilling past the clipped
     stage. sizeMap() hands the map whatever this leaves, so a short column
     still gets a big map. */
  .legendbox .catlegend { max-height: 34dvh; overflow-y: auto; }
  .legendbox .row { margin-bottom: 0; font-size: 11.5px; }
  .legendbox .ramp { flex: 0 1 190px; min-width: 0; }
  .legend .hues { margin-top: 12px; }

  /* The zoom buttons are an overlay on .stage, and on a phone the bottom of the
     stage is the blurb and the key rather than map. At 14px they sat on top of
     the legend -- over the ramp labels before, and over the category rows and
     their counts once the key grew. sizeMap() publishes what the furniture
     takes so they clear it and stay over the map.
     They cannot simply be hidden: there is no pinch handler on the SVG, only a
     pointerdown pan, so these buttons are the only way to zoom on a touch
     screen. The short-phone query below does hide them, and that is a trade
     made against a screen with no room, not a statement that they are spare. */
  .zoomctl { bottom: calc(var(--keyh, 0px) + 14px); }
}

/* A short phone has no room for the region key on top of everything else, and
   a half-shown legend reads as broken rather than as scrollable. */
@media (max-width: 820px) and (max-height: 740px) {
  .legend .hues, .legend .hueslabels { display: none; }

  .zoomctl { display: none; }
  .tip { display: none; }

  .panel {
    /* 74dvh is measured against the viewport, but the sheet is positioned
       inside the stage — on a short screen that pushed its top, and the close
       button with it, up under the header where the stage clips it. */
    top: auto; left: 0; width: auto; height: 74dvh; max-height: 100%;
    border-left: 0; border-top: 1px solid var(--hair);
    border-radius: 10px 10px 0 0; transform: translateY(100%);
  }
  .panel.on { transform: none; }
  .panel .inner { padding: 16px 16px 40px; }
  .hist li { grid-template-columns: 50px 1fr; gap: 9px; }
}

      <div class="shadeby crossby" id="crossby" hidden>

      </div>
    </div>
  </div>

</div>

<script type="module">
import { mountNav } from '/nav.js';

/* Geometry is a static build artifact; the units come from this server's own
   store, assembled into one payload by src/catalog.js. */
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');

async function loadAtlas() {
  const [geo, atlas] = await Promise.all([
    // ?v= is the content hash, stamped in by assemble.js. geometry.json is
    // cached for a day, so without it a rebuild would not reach anyone who had
    // already loaded the map until that day was up.
    fetch('geometry.json?v=__GEOMETRY_HASH__').then(r => { if (!r.ok) throw new Error('geometry ' + r.status); return r.json(); }),
    fetch('api/atlas').then(r => { if (!r.ok) throw new Error('data ' + r.status); return r.json(); }),
  ]);

  // Markers stand in for units too small, or too absent, to aim at. Which
  // countries have entries is only known once the live data is in.
  const dots = {};
  const present = new Set();
  for (const list of Object.values(atlas.units)) for (const u of list) present.add(u.cc);
  for (const cc of present) {
    const c = geo.countries[cc];
    if (c && c.area >= geo.areaMin) continue;
    if (geo.anchors[cc]) dots[cc] = geo.anchors[cc];
  }

  return {
    countries: geo.countries, subunits: geo.subunits, territories: geo.territories || [],
    dots, units: atlas.units, domains: atlas.domains, sources: atlas.sources, stats: atlas.stats,
    // The vocabularies, so a field in the panel can say what its coded value
    // MEANS rather than just naming it. Carries keyColumns, valueColumns,
    // ordinalColumns and the glosses themselves; see src/catalog.js.
    schemes: atlas.schemes || {},
  };
}

let B;
try {
  B = await loadAtlas();
} catch (err) {
  loading.classList.add('failed');
  loadingText.innerHTML = 'Could not load the map data.<br><span style="color:var(--ink-faint)">' +
    String(err.message || err).replace(/[<>&]/g, '') + '</span><br>Reload to try again.';
  throw err;
}

/* ---------- Equal Earth projection ----------
   Šavrič, Patterson & Jenny (2018). This map was Robinson, which is already a
   long way better than Mercator, but Robinson is a COMPROMISE projection: it
   is neither equal-area nor conformal, and it still runs about 1.5x too large
   at 60 degrees relative to the equator.

   That matters here more than it would on most maps. The one thing this map
   is for is comparing how much is recorded from place to place, and its
   coverage is not evenly distributed: on `fl`, uptake and assessment are
   filled for nearly every unit in Europe and Northern America and for almost
   none anywhere else. A projection that inflates the high latitudes gives the
   well-documented half of the world extra pixels, which is exactly the wrong
   thumb on the scale for a map whose subject is its own gaps.

   Equal Earth is equal-area, so a country's share of the ink is its share of
   the land. Geometry is stored as raw lon/lat and projected here, and the
   viewBox is computed from the projected extent, so this is a drop-in: no
   rebuild, nothing downstream re-tuned.

   K is set so the horizontal extent matches what Robinson produced at
   K=1000, because marker radii, the padding and the zoom ceiling are all
   authored in viewBox units against that scale. */
const EE_A1 = 1.340264, EE_A2 = -0.081106, EE_A3 = 0.000893, EE_A4 = 0.003796;
const EE_M = Math.sqrt(3) / 2;
const K = 985;
function project(lon, lat) {
  const phi = Math.max(-90, Math.min(90, lat)) * Math.PI / 180;
  const l = Math.asin(EE_M * Math.sin(phi));
  const l2 = l * l, l6 = l2 * l2 * l2;
  const x = lon * Math.PI / 180 * Math.cos(l) /
            (EE_M * (EE_A1 + 3 * EE_A2 * l2 + l6 * (7 * EE_A3 + 9 * EE_A4 * l2)));
  const y = l * (EE_A1 + EE_A2 * l2 + l6 * (EE_A3 + EE_A4 * l2));
  // Negated because SVG's y axis points down.
  return [x * K, -y * K];
}


/* ---------- state ---------- */
const LIVE = B.domains.filter(d => d.live);
// Each map has its own URL (/eal, /dld) so it can be linked and bookmarked.
const pathId = location.pathname.replace(/^\/|\/$/g, '');
let domainId = LIVE.some(d => d.id === pathId) ? pathId : LIVE[0].id;
let selected = null;         // unit key
let hovered = null;
const view = { k: 1, tx: 0, ty: 0 };
// Coastlines are simplified to ~1km, so past ~12x you are magnifying the
// simplification, not revealing detail.
const MAX_Z = 12;

const domain = () => B.domains.find(d => d.id === domainId);
const keyOf = u => u.cc + ':' + u.name;

/* Index every unit of every live domain once. */
const IDX = {};
for (const d of LIVE) {
  const byKey = new Map(), byCC = new Map();
  for (const u of B.units[d.id]) {
    byKey.set(keyOf(u), u);
    if (!byCC.has(u.cc)) byCC.set(u.cc, []);
    byCC.get(u.cc).push(u);
  }
  // The unit that owns the whole country outline: the national entry, or a
  // lone entry standing in for the country when no national one exists.
  const owner = new Map();
  for (const [cc, list] of byCC) {
    const nat = list.find(u => u.nat);
    if (nat) owner.set(cc, nat);
    else if (list.length === 1 && !B.subunits[keyOf(list[0])]) owner.set(cc, list[0]);
  }
  IDX[d.id] = { byKey, byCC, owner };
}

/* Shading answers one question: HOW MUCH of this unit's record is filled in.
   It used to answer only "is anything here at all", with hue standing for the
   world region — which meant a country with one sourced sentence and a country
   with eleven looked identical, and the map's own biggest weakness was the one
   thing it could not show.

   The ramp is five steps of the share of that domain's fields with content.
   Domains have different field counts (fl 11, dld 13, eal 9), so the share is
   computed per unit against its own domain rather than against a fixed number.

   Bucket 1 starts ABOVE zero on purpose: a unit with nothing documented is not
   the palest step of the ramp, it is --nodata, and a unit that was searched and
   came back empty is the hatch. Three states, still never conflated. */
function stateOf(u) { return u.coverage; }

const COV_STEPS = 5;
/* Share of fields with content, 0..1. nFields is per-domain and never zero,
   but the guard costs nothing and a divide-by-zero here would paint the whole
   map one colour without ever throwing. */
function covRatio(u) {
  const n = u && u.nFields ? u.nFields : 0;
  if (!n) return 0;
  // Own fields PLUS the ones answered by its country. A US state records the
  // four questions that vary by state and inherits the nine that IDEA settles
  // federally; counting only its own reported it as a pale, half-researched
  // place when every question about it has an answer. The panel still shows
  // which are its own and which are inherited, and the chip still counts only
  // its own, so nothing here claims the research was done twice.
  const own = u.filled ? u.filled.length : 0;
  const inherited = u.inh ? u.inh.length : 0;
  return Math.min(1, (own + inherited) / n);
}
/* 1..5. Anything documented is at least 1, so the ramp's low step always means
   "a little" and never "none". */
function covStep(u) {
  const r = covRatio(u);
  if (r <= 0) return 1;
  return Math.min(COV_STEPS, Math.ceil(r * COV_STEPS));
}
const covVar = u => `--cov-${covStep(u)}`;
/* Returns var(--cov-N), NOT a resolved hex. Anything written into an inline
   style must stay a var() reference: these are painted once at load, and a
   frozen hex silently keeps the old theme's colour when the reader switches
   between light and dark — which showed up as a legend contradicting the map
   it explains. */
const hueOf = u => `var(${covVar(u)})`;

/* ---------- shading by a CODED value instead of by coverage ----------
 *
 * CODED.key is "<field>.<column>" within the current domain, or null for the
 * coverage map. CODED.only isolates one value.
 *
 * Three rules this mode is built on, each of which is a claim the corpus makes
 * about itself rather than a rendering preference:
 *
 * 1. NO INHERITANCE. The coverage map paints a sub-national unit from its
 *    country where it has nothing of its own, because a US state answering four
 *    state-level questions is not half-researched. A CODING is different:
 *    EXIT_MECHANISM says outright that the United States is NOT `none
 *    established`, because the rule is made below. Inheriting a national coding
 *    downward would manufacture agreement the corpus does not assert, so a unit
 *    shows its own value or none.
 * 2. A LIST COLUMN HAS NO SINGLE COLOUR. `triggers`, `exclusions`,
 *    `exit_mechanism` and `force` hold several values at once, and picking one
 *    to paint would be a reduction -- which research/CROSSTABS.md is explicit is
 *    a claim. So a list column is ISOLATE-ONLY: the map answers "does this
 *    system's answer include X", which is a question the data can answer.
 * 3. ROW-GRAINED SCHEMES ARE NOT OFFERED AT ALL, the same refusal /patterns
 *    already makes, for the same reason.
 */
const CODED = { key: null, only: null };

function schemeFor(fieldKey) { return (B.schemes || {})[domainId + '.' + fieldKey]; }

/* WHAT A COLUMN IS CALLED. Every picker, legend and card here used to print the
   column KEY with its underscores swapped for spaces, which put `obliges`,
   `rule_locus`, `secured_by` and `after_adjustment` in front of a reader as
   though they were English. coding.js names them, catalog.js ships the names,
   and this is the only place that asks. Falls back to the old spacing, so a
   column added without a label degrades to what it did before. */
function colLabel(fieldKey, col) {
  const sc = schemeFor(fieldKey);
  return ((sc && sc.labels) || {})[col] || String(col || '').replace(/_/g, ' ');
}

/* Every column a reader can shade by, in this domain, wherever it lives. Two
   fields carrying a column of the SAME NAME -- `decided_by` and `rule_locus` sit
   on both newcomer and removal criteria -- are deliberately adjacent in the
   list, so the reader can hold "who decides" fixed and change which decision
   is meant. That is the whole reason the picker is built from columns rather
   than from fields. */
/* Values that say the ENTRY does not answer. They are findings about the
   record rather than about the system, and a map shaded mostly by them is a
   map of the corpus's silence. */
const NON_ANSWER = new Set(['not stated', 'not available', 'none stated',
  'not established', 'unknown', 'not recorded']);

/* WHICH COLUMNS ARE WORTH DRAWING.
   Every coded column used to be offered, which was 36 questions on dld, 28 on
   eal and 22 on indigenous -- a picker nobody could read, most of whose entries
   drew a map of one colour. Two different things were wrong with them and both
   are tested here, because neither test catches the other.

   A column can be dominated by a NON-ANSWER: identificationCriteria.exclusions
   is 96% `none stated`, multilingualProvision.local_norms 94% `not stated`,
   l3Support.exemption 92%. Those maps show where the record is silent, which is
   worth knowing and is not worth a choropleth.

   Or it can be dominated by ONE REAL VALUE, which is the opposite problem and
   passes a silence test cleanly: the seven `evidence_type` columns run 76-96%
   `policy`, outcomesEvidence.scope is 94% `disability generally`,
   revitalisation.status 91% `established`. The column is coded, answered, and
   tells a reader nothing they can see on a map.

   A third cut is coverage, and what it counts is HOW MUCH OF THE MAP IS GREY.
   Sixty units was the first bar and it was far too low: it let through columns
   that leave 330 countries blank. discharge basis, rule locus, evidence found
   and reporting each drew a map whose legend read `Nothing recorded 323`, which
   is a true statement about the corpus and an unreadable map -- and the default
   `what is documented` view already answers that question properly.
   Counting COLOURED units was the obvious measure and it was the wrong one,
   because it treats a documented absence as a hole. eal.removalCriteria colours
   122 units and marks 114 more `Recorded as absent`: 236 of 396 units carry an
   answer, and the colour count alone called it a sixth-empty map. So this
   counts what the legend's last row counts -- units in state `none`, and
   nothing else. An absence, a deliberate unset and a looked-and-found-nothing
   are all answers, and the map draws each of them.
   The corpus then puts the bar where it belongs. Ordered by grey the columns
   run 94, 87, 83, 82, 74, 61, 49, 40, then 28, 22, 20, 18 -- and the gap
   between 49 and 40, and again 40 and 28, is where the readable maps start.
   SHADE_MAX_GREY sits at 45. Coverage only grows, so a column above the line
   reappears once it has been coded enough to draw.

   NOTHING IS DELETED. These columns stay in the data, in /views/table and in
   the coded panel; this decides only what is worth SHADING A MAP by, which is
   a question about legibility rather than about the coding. The test is run
   against the live data rather than written down as a list, so a column that
   fills out later appears on its own. */
const SHADE_MAX_GREY = 0.45;     // above this the map is mostly grey
/* Past this share of units holding more than three values, a column opens on
   one isolated value instead of striping. Nothing reaches it today: the worst
   is `initiated by` at 2 units of 185, or 1.1%. It is a valve, not a rule. */
const SHADE_ISOLATE_SHARE = 0.08;
const SHADE_MAX_TOP = 0.65;      // one value owning more than this is one colour
const SHADE_MAX_SILENT = 0.40;   // non-answers taking more than this is a silence map
const SHADE_MIN_VALUES = 3;      // distinct real answers worth telling apart
const SHADE_VALUE_FLOOR = 0.05;  // ...each carried by at least this share

function columnVaries(key) {
  const units = B.units[domainId] || [];
  const counts = new Map();
  let coded = 0;
  for (const u of units) {
    const vs = codedValues(u, key);
    if (!vs) continue;
    coded++;
    for (const v of vs) counts.set(v, (counts.get(v) || 0) + 1);
  }
  // Exactly the legend's `Nothing recorded` tally, by the same three tests in
  // the same order, so the number this judges is the number a reader sees.
  let grey = 0;
  for (const u of units) {
    if (codedValues(u, key)) continue;
    if (isAbsent(u, key) || isUnset(u, key)) continue;
    if (fieldStateOf(u, key.split('.')[0]) === 'none') grey++;
  }
  if (grey > units.length * SHADE_MAX_GREY) return false;
  let top = 0, silent = 0, real = 0;
  for (const [v, n] of counts) {
    if (n > top) top = n;
    if (NON_ANSWER.has(v)) silent += n;
    else if (n / coded >= SHADE_VALUE_FLOOR) real++;
  }
  return top / coded <= SHADE_MAX_TOP
      && silent / coded <= SHADE_MAX_SILENT
      && real >= SHADE_MIN_VALUES;
}

/* Counting every column against every unit is cheap once and wasteful on every
   field heading in an open panel, which is what mappable() asks for. Keyed on
   the unit count as well as the domain so a picker built before the data
   arrived is not cached as the answer. */
let shadeCache = null;
function shadeableColumns() {
  const units = B.units[domainId] || [];
  const stamp = domainId + ':' + units.length;
  if (shadeCache && shadeCache.stamp === stamp) return shadeCache.cols;
  const out = [];
  for (const f of domain().fields) {
    const sc = schemeFor(f.k);
    if (!sc || sc.many || (sc.keyColumns || []).length) continue;   // row-grained: rule 3
    for (const c of (sc.valueColumns || [])) {
      const key = f.k + '.' + c;
      if (!columnVaries(key)) continue;
      out.push({ field: f.k, label: f.label, col: c, key: key });
    }
  }
  // BY FIELD, in the domain's own field order, not alphabetically by column.
  // Sorting on the column name scattered the three terminology questions to
  // three different places in the list -- `label`, `standing` and `term type`
  // have nothing in common as words -- and put `rule locus - Discharge
  // criteria` next to `rule locus - Identification criteria`, which are the
  // same question about two different things. The field is the subject; the
  // column is what is being asked about it, so the field groups.
  //
  // domains.js orders the fields as a reader should meet them, so that order is
  // reused rather than sorted again here.
  const order = domain().fields.map(f => f.k);
  out.sort((a, b) => order.indexOf(a.field) - order.indexOf(b.field)
                  || a.col.localeCompare(b.col));
  shadeCache = { stamp: stamp, cols: out };
  return out;
}

/* The unit's OWN value for the shading column, never its country's. */
function codedValues(u, key) {
  if (!u || !key) return null;
  const [f, c] = key.split('.');
  const cd = (u.coding || {})[f];
  if (!cd || Array.isArray(cd)) return null;
  const v = cd[c];
  if (v === undefined || v === null || !String(v).length) return null;
  return [].concat(v).map(String);
}
const isList = key => {
  let n = 0;
  for (const u of (B.units[domainId] || [])) { const v = codedValues(u, key); if (v && v.length > 1) n++; }
  return n > 0;
};

/* THE ORDER OF A RANKED COLUMN, and the only place that decides it.
 *
 * The coverage ramp used to sort an ordinal column with
 * `parseFloat(a) - parseFloat(b)`, which works for `obliges` because its
 * values are the digits 0 to 4 and for nothing else: every value of
 * `in statute > in policy > in professional use only` parses to NaN, falls
 * back to 0, and the ramp comes out in whatever order the units were read in.
 * That was invisible while the only ranked columns were numbers.
 *
 * So the order comes from the vocabulary, which declares it, reversed where
 * the vocabulary is written strongest-first. `not stated` is not a level and
 * is dropped: a unit that does not answer should stay off the ramp rather than
 * be painted as its palest rung. A column with no declared vocabulary is a
 * number -- months, years -- and sorts numerically. */
const NON_LEVEL = new Set(['not stated', 'not applicable', 'not measured', 'not adjusted', 'silent']);
function rankOrder(fieldKey, col, values) {
  const sc = schemeFor(fieldKey) || {};
  const present = new Set(values);
  const band = ((sc.bands || {})[col]);
  if (band) return band.labels.filter(v => present.has(v));
  const declared = Object.keys(((sc.values || {})[col]) || {});
  if (!declared.length) {
    return [...present].sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
  }
  const ord = declared.filter(v => present.has(v) && !NON_LEVEL.has(v));
  if ((sc.ordinalDescColumns || []).includes(col)) ord.reverse();
  return ord;
}

/* Values present in the corpus for this column, commonest first. Six get a hue
   and the rest share --cat-other, because six is the ceiling for a choropleth
   anyone can read without counting swatches. */
const CAT_MAX = 6;
function codedScale(key) {
  const counts = new Map();
  for (const u of (B.units[domainId] || [])) {
    for (const v of (codedValues(u, key) || [])) counts.set(v, (counts.get(v) || 0) + 1);
  }
  const ordered = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  const [f, c] = key.split('.');
  const sc = schemeFor(f);
  const ordinal = (sc && (sc.ordinalColumns || []).includes(c)) || false;
  const map = new Map();
  // How many values COULD have taken a hue, which is no longer the same as how
  // many there are: the ones that are not answers are out of the running.
  let hueCount = ordered.length;
  // An ordinal column's key keeps its own rank order, set in the branch below.
  let legend = ordered;
  if (ordinal) {
    // An ordinal column keeps the COVERAGE ramp, because its values are ranked
    // and the ramp is the one palette in this file that says so.
    const asc = rankOrder(f, c, counts.keys());
    legend = asc.map(v => [v, counts.get(v)])
      .concat(ordered.filter(([v]) => !asc.includes(v)));
    asc.forEach((v, i) => map.set(v, `var(--cov-${Math.min(COV_STEPS, 1 + Math.floor(i * COV_STEPS / Math.max(1, asc.length)))})`));
    // A value the ramp does not rank -- `not stated` -- still needs a fill, and
    // it is not the bottom rung. It takes the neutral the rest of the map uses
    // for an answer with no position.
    for (const v of counts.keys()) if (!map.has(v)) map.set(v, 'var(--cat-other)');
  } else {
    /* WHICH SIX GET A COLOUR, AND IN WHAT ORDER.
     *
     * By how many countries held the value, which put the loudest colour on
     * the map's least interesting answer. On dld terminology the commonest
     * `label` is `not applicable` -- 104 of 287, more than any real term --
     * so the map's cyan said "this question does not arise here", and
     * `developmental language disorder` (10), `language development disorder`
     * (6) and `specific language impairment` (5) were three of the quietest
     * things on it. A map about how systems name this had its own subject in
     * the overflow colour.
     *
     * Two changes. A value that is not an ANSWER -- `not stated`, `not
     * applicable` -- never takes a hue and never occupies one of the six
     * slots; it shares the neutral with the tail, which is what it is.
     *
     * And the six go in the order the VOCABULARY declares, not the order the
     * corpus happens to use. coding.js writes each list most-specific first:
     * `label` opens with developmental language disorder and works out through
     * SLI, the unqualified forms and the delay words to speech disorder and
     * communication needs. That is a claim by the people who built the
     * vocabulary about which answers the map is about, it is checkable against
     * the file, and it does not move when one more country is coded.
     *
     * The cost is real and worth stating: a common value declared seventh is
     * now in the neutral. On `label` that is `speech disorder` (17) and
     * `communication needs` (26). Six is the ceiling for a choropleth -- the
     * palette carries six for a measured reason -- so something has to be in
     * the tail, and this decides WHICH by the vocabulary rather than by how
     * often a word happens to be used. Every value keeps its own row and count
     * in the key either way. */
    const declared = Object.keys(((sc && sc.values) || {})[c] || {});
    const answers = ordered.map(([v]) => v).filter(v => !NON_LEVEL.has(v));
    const hueOrder = declared.filter(v => answers.includes(v))
      .concat(answers.filter(v => !declared.includes(v)));
    hueOrder.slice(0, CAT_MAX).forEach((v, i) => map.set(v, `var(--cat-${i + 1})`));
    hueCount = hueOrder.length;
    // THE KEY READS IN THE SAME ORDER THE COLOURS WERE HANDED OUT. Listing it
    // by count put the six hues in scattered positions down a list sorted by
    // something else, so the first row was whatever happened to be commonest
    // -- on `the term used` that is `not applicable`, in the neutral, above
    // every term the map exists to show. Coloured values first, in vocabulary
    // order; then the tail, commonest first, since among values that share one
    // colour the count is the only thing left to sort on.
    legend = hueOrder.map(v => [v, counts.get(v)])
      .concat(ordered.filter(([v]) => !hueOrder.includes(v)));
  }
  // How many DISTINCT COLOURS the busiest unit resolves to -- not how many
  // values, because two values past CAT_MAX both come out --cat-other and a
  // unit holding those two is paintable as one colour. This is the number that
  // decides whether the column can be drawn whole.
  let maxCols = 0, striped = 0, over = 0, coded = 0;
  for (const u of (B.units[domainId] || [])) {
    const vs = codedValues(u, key);
    if (!vs) continue;
    coded++;
    const n = new Set(vs.map(v => map.get(v) || 'var(--cat-other)')).size;
    if (n > maxCols) maxCols = n;
    if (n > 1 && n <= STRIPE_MAX) striped++;
    if (n > STRIPE_MAX) over++;
  }
  return {
    map, ordered, legend, ordinal, list: isList(key), maxCols, striped, over, coded,
    overflow: Math.max(0, hueCount - CAT_MAX),
  };
}
let SCALE = null;

/* What this unit's THIS FIELD is, which is the only state a coded map is about.
 *
 * The coded view was reading stateOf(u) -- the state of the whole ENTRY -- and
 * so painted "Recorded, not yet coded" over every unit that was documented
 * somewhere and had no coded value here. On eal.removalCriteria that was 274
 * units, of which 0 were actually prose waiting to be coded: 206 have nothing
 * in the field, 65 say Not applicable and 3 say Not established from the
 * sources consulted. The last two are somebody's deliberate answer, and the
 * label asserted the opposite of both.
 *
 * derive.js already computes exactly this, one character per field, so nothing
 * needs to be sent that is not already here. */
const FIELD_STATE = { h: 'has', l: 'looked', x: 'na', n: 'none' };
/* Prose with no colour has two quite different reasons, and calling both
   "not yet coded" mislabels the more interesting one. A field somebody has
   coded, where THIS column still has no value, is a deliberate unset -- the
   entry answers and no value fitted. EXIT_MECHANISM instructs exactly that for
   Spain, Italy and the United States, whose rule_locus carries what they say.
   Both keep the dot texture, because the map's claim is only "text here, no
   value"; the legend and the card carry the why. */
/* A DOCUMENTED ABSENCE answers the field and is complete -- the ruling this
   project already made, and what derive.js encodes by counting one as filled on
   the coverage map. 117 of the 125 national newcomerCriteria entries with no
   coding carry one, which is why they never reached a coding: `coding.js` says
   outright that the absence case is NOT a value in DESIGNATION, because a

  if (!isFinite(b.x0)) continue;
  const size = Math.max(b.x1 - b.x0, b.y1 - b.y0);
  const c = (!s.name && !s.terr && CENTROID[s.cc]) ? CENTROID[s.cc] : [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];
  const node = addMark(null, c[0], c[1], size, false);
  node.dataset.cc = s.cc;
  if (s.name) node.dataset.name = s.name;
  if (s.terr) node.dataset.terr = s.node.dataset.terr;
}

const PAD = 30;
const VB = { x: ext.x0 - PAD, y: ext.y0 - PAD, w: (ext.x1 - ext.x0) + PAD * 2, h: (ext.y1 - ext.y0) + PAD * 2 };
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

/* ---------- paint ---------- */
function unitFor(cc, name) {
  const ix = IDX[domainId];
  if (name) return ix.byKey.get(cc + ':' + name) || null;
  return ix.owner.get(cc) || null;
}
const parentOf = u => (!u || u.nat) ? null : (IDX[domainId].owner.get(u.cc) || null);

/* A sub-unit exists because it differs from its country in SOME domain — the
   US states are split out because their second-language policy differs. In a domain
   it has nothing of its own it does not become a hole in the country: it
   follows the national entry, which is what inheritance means. */
function resolve(cc, name) {
  const own = unitFor(cc, name);
  const nat = name ? (IDX[domainId].owner.get(cc) || null) : null;
  if (!name) return { unit: own, paint: own, inherited: false, via: null };
  if (!own) {
    // no entry at all in this domain — the shape stands in for the country
    return nat ? { unit: nat, paint: nat, inherited: true, via: name }
               : { unit: null, paint: null, inherited: false, via: null };
  }
  // Only where derive.js has marked this unit `inherited`, which it does from
  // the domain's own `nationalFor` list. Painting any empty sub-unit with its
  // country's colour was the old behaviour and it overstated: China's
  // provinces took the national colour on every map while being counted as
  // undocumented, so the picture and the tally underneath it disagreed.
  if (own.coverage === 'inherited' && nat && nat.coverage === 'has') {
    return { unit: own, paint: nat, inherited: true, via: null };
  }
  return { unit: own, paint: own, inherited: false, via: null };
}

function paint() {
  const ix = IDX[domainId];
  for (const s of SHAPES) {
    const r = resolve(s.cc, s.name);
    // A country whose whole area is carved into sub-units (the UK) has no
    // entry of its own: draw it as an inert base beneath them.
    const carved = !s.name && !r.unit && (ix.byCC.get(s.cc) || []).some(x => B.subunits[keyOf(x)]);
    s.node.setAttribute('fill', carved ? 'var(--nodata)'
      : fillFor(r.paint, r.paint ? stateOf(r.paint) : 'none', r.unit));
    s.node.setAttribute('class', 'unit'
      + (s.name ? ' sub' : '')
      + (carved ? ' base' : r.unit ? ' hit' : '')
      + (r.inherited ? ' inherited' : ''));
    s.node.dataset.key = r.unit ? keyOf(r.unit) : '';
    if (r.via) s.node.dataset.via = r.via; else delete s.node.dataset.via;
  }
  // The edge band selects the COUNTRY, so it is only live where the country
  // has an entry of its own. The United Kingdom is four nations and no
  // national row: its outline is still drawn, but there is nothing to select.
  for (const { hit, cc } of EDGES) {
    const u = unitFor(cc, null);
    hit.dataset.key = u ? keyOf(u) : '';
    hit.setAttribute('class', 'edgehit' + (u ? ' hit' : ''));
    hit.style.pointerEvents = u ? 'stroke' : 'none';
  }
  for (const { node, t } of TERR) {
    const u = unitFor(t.cc, null);
    node.dataset.via = t.name;
    node.setAttribute('fill', fillFor(u, u ? stateOf(u) : 'none', u));
    node.setAttribute('class', 'unit' + (u ? ' hit' : ''));
    node.dataset.key = u ? keyOf(u) : '';
  }
  for (const d of DOTS) {
    const n = d.node;
    const r = resolve(n.dataset.cc, n.dataset.name || null);
    const u = r.unit || (n.dataset.name ? null : (IDX[domainId].byCC.get(n.dataset.cc) || [])[0]) || null;
    const pnt = r.paint || u;
    n.setAttribute('fill', fillFor(pnt, pnt ? stateOf(pnt) : 'none', r.unit || u));
    n.setAttribute('class', 'dot' + (r.inherited ? ' inherited' : ''));
    n.dataset.key = u ? keyOf(u) : '';
    if (r.via) n.dataset.via = r.via; else delete n.dataset.via;
    d.hasUnit = !!u;
  }
  updateMarks();
  markSelection();
}

function markSelection() {
  // Territories are drawn into gSub alongside the regions, so they are
  // overdrawn by exactly the same rule and need the same treatment.
  const ALL = SHAPES.concat(TERR.map(x => ({ node: x.node })));
  for (const s of SHAPES) {
    if (s.node.classList.contains('base')) continue;
    s.node.classList.toggle('sel', !!selected && s.node.dataset.key === selected);
    s.node.classList.toggle('hov', !!hovered && s.node.dataset.key === hovered && hovered !== selected);
  }
  for (const d of DOTS.concat(TERR.map(x => ({ node: x.node })))) {
    d.node.classList.toggle('sel', !!selected && d.node.dataset.key === selected);
    d.node.classList.toggle('hov', !!hovered && d.node.dataset.key === hovered && hovered !== selected);
  }
  // A selected COUNTRY that is split cannot show its own outline: its shape
  // lives under its regions, and raising it inside gBase does not lift it past
  // them. The edge line is the part of it that is visible, so the highlight
  // goes there.
  for (const { hit, line } of EDGES) {
    const k = hit.dataset.key;
    line.classList.toggle('sel', !!k && k === selected);
    line.classList.toggle('hov', !!k && k === hovered && hovered !== selected);
  }
  // The outline of whatever is highlighted, redrawn on top. `inherited` comes
  // with it so a dashed border stays dashed when you point at it -- otherwise
  // hovering an inherited unit changes what KIND of line it has, not just its
  // colour.
  const paint = (halo, key, state) => {
    const s = key && ALL.find(x => x.node.dataset.key === key);
    halo.setAttribute('d', s ? s.node.getAttribute('d') : '');
    halo.setAttribute('class', 'halo ' + state +
      (s && s.node.classList.contains('inherited') ? ' inherited' : ''));
  };
  paint(haloSel, selected, 'sel');
  paint(haloHov, hovered && hovered !== selected ? hovered : null, 'hov');
}


/* ---------- pan & zoom ----------
   Same canvas mechanics as the syntax-tree viewer: one finger or the mouse
   pans, two fingers pinch, ctrl/⌘-wheel zooms, plain wheel scrolls the view. */
// A fingertip needs a bigger target than a cursor, so both the marker and the
// size below which a shape gets one grow on a touch screen.
const COARSE = matchMedia('(pointer: coarse)').matches;
const MARK_MIN_PX = COARSE ? 20 : 13;
const MARK_R_PX = COARSE ? 7 : 4.5;
function updateMarks() {
  // r is authored in viewBox units, so convert from the screen size we want.
  const s = baseScale() * view.k;
  if (!s) return;
  const r = (MARK_R_PX / s).toFixed(2);
  for (const d of DOTS) {
    d.node.setAttribute('r', r);
    d.node.style.display = (d.hasUnit && (d.always || d.size * s < MARK_MIN_PX)) ? '' : 'none';
  }
}
// On a portrait screen the stage is far taller than the map's proportions, so
// stretching the map into it just adds empty ground above and below. Allow a
// little letterboxing, not a screenful.
// The map is 2.33x as wide as it is tall; a portrait phone is about 1:2. So the
// drawing is always WIDTH-bound here and extra height cannot enlarge it — the
// only questions are how much ground it floats in and where the legend lands.
// Give the legend the height it actually needs, pin it to the bottom, and let
// the map take what is left up to a modest multiple of its own proportions.
/* ---------- the four boxes ---------- */
// Built once. Only the open/closed classes and where #dcontent lives change
// afterwards, so the headers keep their identity across a switch and the
// browser animates rather than re-rendering four elements.
function buildDomainStack() {
  const stack = document.getElementById('domainstack');
  stack.innerHTML = LIVE.map(d => `
    <section class="dbox" data-id="${esc(d.id)}">
      <button class="dhead" type="button" aria-expanded="false" aria-controls="dcontent">
        <span class="dot"></span><span>${esc(d.label)}</span>
      </button>
      <div class="dbody"><div class="dinner"></div></div>
    </section>`).join('');
  stack.querySelectorAll('.dhead').forEach(h => {
    h.onclick = () => switchDomain(h.closest('.dbox').dataset.id);
  });
}

// Move the single body into whichever box is open. The one leaving collapses
// as its grid row returns to 0fr; the one arriving expands to 1fr.
//
// The rAF is load-bearing, not politeness. Moving the content in and adding
// `open` in the same frame gives the transition no settled start: the row is
// measured against a box that is still empty, so it interpolates 0 to 0 and
// the panel silently stays shut. Laying the content out at 0fr first, then
// flipping the class on the next frame, gives it a real height to travel to.
function openDomainBox(id, animate = true) {
  const content = document.getElementById('dcontent');
  const target = document.querySelector('.dbox[data-id="' + id + '"]');
  if (!target) return;
  content.hidden = false;

  for (const box of document.querySelectorAll('.dbox')) {
    if (box === target) continue;
    box.classList.remove('open');
    box.querySelector('.dhead').setAttribute('aria-expanded', 'false');
  }

  const inner = target.querySelector('.dinner');
  if (content.parentElement !== inner) inner.appendChild(content);
  const head = target.querySelector('.dhead');
  head.setAttribute('aria-expanded', 'true');

  if (!animate || target.classList.contains('open')) { target.classList.add('open'); return; }
  void target.querySelector('.dbody').offsetHeight;   // settle at 0fr, with content
  // rAF does not fire in a tab that is not compositing, and a panel that never
  // opened is not a missing animation, it is a map with no legend and no way
  // back to one. The timer guarantees the state; the frame callback is only
  // there to make it move when the tab can see it. Adding the class twice
  // costs nothing.
  const open = () => target.classList.add('open');
  requestAnimationFrame(open);
  setTimeout(open, 60);
}

/* Switching is done here rather than by following a link, because every
   domain's units are already in this page's payload. A link would reload the
   whole map to show data the browser is holding, and the box would jump open
   instead of moving. The URL still changes, so /dld stays linkable and the
   back button still works. */
function switchDomain(id, push = true) {
  if (id === domainId || !LIVE.some(d => d.id === id)) return;
  domainId = id;
  closePanel();
  // The shading column is "<field>.<column>" and fields belong to a domain, so
  // a column chosen on one map means nothing on the next. Drop it and rebuild
  // the picker rather than carrying a dead key across and painting every
  // country "not coded".
  CODED.key = null; CODED.only = null; SCALE = null;
  openDomainBox(id);
  buildDomains();
  buildShadePicker();
  paintCatLegend();
  paint();
  paintLegend();
  sizeMap();
  clampView();
  applyView();
  if (push) history.pushState({ domain: id }, '', '/' + id);
}

addEventListener('popstate', () => {
  const id = location.pathname.replace(/^\/|\/$/g, '');
  if (LIVE.some(d => d.id === id)) switchDomain(id, false);
});

function sizeMap() {
  // The band's thickness depends on how wide the map is drawn, and this runs
  // whenever that can have changed. Ahead of the early return, because a
  // desktop window resizes too.
  measureStripes();
  if (!matchMedia('(max-width: 820px)').matches) { svg.style.height = ''; return; }
  const stage = document.getElementById('stage');
  const controls = document.getElementById('domainstack');
  const key = document.querySelector('.legendbox');
  // Collapse the map first so the panel reports its unconstrained height rather
  // than whatever the previous pass squeezed it to.
  svg.style.height = '0px';
  // scrollHeight excludes the element's own border, and on this layout both
  // boxes have a 1px top rule against the map. Two pixels is enough to clip
  // the ramp's bottom labels, so the borders are measured rather than ignored.
  const border = el => (el ? parseFloat(getComputedStyle(el).borderTopWidth) || 0 : 0);
  const need = controls.scrollHeight + border(controls)

             + (key ? key.getBoundingClientRect().height : 0);
  const natural = stage.clientWidth * (VB.h / VB.w);
  // Take everything the legend does not need. There is no cap: capping the box
  // cannot shrink the drawing (width-bound) and only decides whether the slack
  // shows as ocean around the map or as a void somewhere else. Centred in the
  // full field, the ocean sits symmetrically above and below the continents.
  // `natural` is still measured because a landscape phone can be shorter than
  // the map is tall, and there the box must not exceed what the drawing needs.
  // The overlay controls are positioned against the stage, whose bottom edge
  // is furniture on this layout. Publish the measurement rather than letting
  // the CSS guess at it.
  stage.style.setProperty('--keyh', Math.round(need) + 'px');
  const room = Math.max(140, stage.clientHeight - need);
  svg.style.height = Math.round(room < natural ? room : Math.max(room, natural)) + 'px';
}

function applyView() {
  scene.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  pat.setAttribute('patternTransform', `scale(${1 / view.k})`);
  patDots.setAttribute('patternTransform', `scale(${1 / view.k})`);
  patNA.setAttribute('patternTransform', `scale(${1 / view.k})`);
  STRIPES.forEach(q => q.setAttribute('patternTransform', stripeAngle()));
  updateMarks();
}
function baseScale() {
  const r = svg.getBoundingClientRect();
  return Math.min(r.width / VB.w, r.height / VB.h);
}
function screenToContent(sx, sy) {
  const r = svg.getBoundingClientRect(), s = baseScale();
  const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
  const vx = (sx - ox) / s + VB.x, vy = (sy - oy) / s + VB.y;
  return [(vx - view.tx) / view.k, (vy - view.ty) / view.k];
}
function zoomAt(sx, sy, factor) {
  const [cx, cy] = screenToContent(sx, sy);
  const k = Math.max(1, Math.min(MAX_Z, view.k * factor));
  if (k === view.k) return;
  const r = svg.getBoundingClientRect(), s = baseScale();
  const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
  const vx = (sx - ox) / s + VB.x, vy = (sy - oy) / s + VB.y;
  view.k = k; view.tx = vx - k * cx; view.ty = vy - k * cy;
  clampView(); applyView();
}
function clampView() {
  // Keep at least a third of the viewport covered by the map in each axis.
  const spanX = VB.w * view.k, spanY = VB.h * view.k;
  const minTx = VB.x + VB.w - spanX - VB.x * view.k - VB.w * 0.66;
  view.tx = Math.min(VB.x + VB.w * 0.66 - VB.x * view.k, Math.max(minTx, view.tx));
  const minTy = VB.y + VB.h - spanY - VB.y * view.k - VB.h * 0.66;
  view.ty = Math.min(VB.y + VB.h * 0.66 - VB.y * view.k, Math.max(minTy, view.ty));
}
function resetView() { view.k = 1; view.tx = 0; view.ty = 0; applyView(); }

function zoomToBox(box, margin = 5) {
  // Margin keeps the neighbours in frame: a unit shown with no surroundings
  // is much harder to place than one shown in its region.
  const w = Math.max(box.x1 - box.x0, 6) * margin, h = Math.max(box.y1 - box.y0, 6) * margin;
  const k = Math.max(1, Math.min(MAX_Z, Math.min(VB.w / w, VB.h / h)));
  const cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
  view.k = k;
  view.tx = VB.x + VB.w / 2 - k * cx;
  view.ty = VB.y + VB.h / 2 - k * cy;
  clampView(); applyView();
}

const ptrs = new Map();
let anchor = null, moved = false;
svg.addEventListener('pointerdown', ev => {
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  moved = false;
  if (ptrs.size === 1) {
    anchor = { mode: 'pan', x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
    svg.classList.add('dragging');
  } else if (ptrs.size === 2) {
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
    const [a, b] = [...ptrs.values()];
    anchor = { mode: 'pinch', dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: view.k,
               mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    anchor.c = screenToContent(anchor.mx, anchor.my);
  }
});
svg.addEventListener('pointermove', ev => {
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (anchor && anchor.mode === 'pan' && ptrs.size === 1) {
    const s = baseScale();
    const dx = ev.clientX - anchor.x, dy = ev.clientY - anchor.y;
    if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
      moved = true;
      // Capture only now: taking it on pointerdown would retarget the click.
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
    }
    view.tx = anchor.tx + dx / s; view.ty = anchor.ty + dy / s;
    clampView(); applyView();
    hideTip();
    return;
  }
  if (anchor && anchor.mode === 'pinch' && ptrs.size === 2) {
    moved = true;
    const [a, b] = [...ptrs.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const k = Math.max(1, Math.min(MAX_Z, anchor.k * (dist / anchor.dist)));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = svg.getBoundingClientRect(), s = baseScale();
    const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
    view.k = k;
    view.tx = ((mx - ox) / s + VB.x) - k * anchor.c[0];
    view.ty = ((my - oy) / s + VB.y) - k * anchor.c[1];
    clampView(); applyView();
    return;
  }
  hoverAt(ev);
});
function endPtr(ev) {
  ptrs.delete(ev.pointerId);
  if (ptrs.size === 0) { anchor = null; svg.classList.remove('dragging'); }
  else if (ptrs.size === 1) {
    const p = [...ptrs.values()][0];
    anchor = { mode: 'pan', x: p.x, y: p.y, tx: view.tx, ty: view.ty };
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('pointerleave', () => { hovered = null; markSelection(); hideTip(); });

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0025));
  } else {
    const s = baseScale();
    view.tx -= ev.deltaX / s; view.ty -= ev.deltaY / s;
    clampView(); applyView();
  }
}, { passive: false });

document.getElementById('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5); };
document.getElementById('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5); };
document.getElementById('zreset').onclick = resetView;

/* ---------- hover & select ---------- */
const tip = document.getElementById('tip');
function hideTip() { tip.classList.remove('on'); }

// Hit-test the point rather than trusting ev.target: pointer capture and
// the tooltip both sit between the cursor and the shape underneath it.
function shapeAt(ev) {
  const prev = tip.style.pointerEvents;
  tip.style.pointerEvents = 'none';
  const t = document.elementFromPoint(ev.clientX, ev.clientY);
  tip.style.pointerEvents = prev;
  if (!(t instanceof SVGElement)) return null;
  if (!t.classList.contains('hit') && !t.classList.contains('dot')) return null;
  return t;
}
function targetKey(ev) {
  const t = shapeAt(ev);
  return t ? (t.dataset.key || null) : null;
}
function hoverAt(ev) {
  const node = shapeAt(ev);
  const key = node ? (node.dataset.key || null) : null;
  if (key !== hovered) { hovered = key; markSelection(); }
  if (!key) return hideTip();
  const u = IDX[domainId].byKey.get(key);
  if (!u) return hideTip();
  const terr = node.dataset.terr ? B.territories[+node.dataset.terr] : null;
  tip.innerHTML = tipHTML(u, terr, node.dataset.via || null,
    node.classList.contains('inherited'), node.getAttribute('fill'));
  tip.classList.add('on');
  const r = document.getElementById('stage').getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 16;
  if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 16;
  if (y + th > r.height - 8) y = ev.clientY - r.top - th - 16;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
svg.addEventListener('click', ev => {
  if (moved) return;
  const node = shapeAt(ev);
  if (!node || !node.dataset.key) { closePanel(); return; }
  const terr = node.dataset.terr ? B.territories[+node.dataset.terr] : null;
  const via = terr ? { name: terr.name, note: terr.note }
    : node.dataset.via ? { name: node.dataset.via, note: null } : null;
  select(node.dataset.key, false, via);
});

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escAttr = esc;   // esc already escapes the double quote

/* ------------------------------------------------------------------
   In-text citation linking, lifted verbatim from the DLD catalogue's
   catalog.html so the two stay in step. Resolves a citation first
   against the entry's own docLinks labels, then against the DOI
   registry; anything that resolves to neither stays plain text.
   ------------------------------------------------------------------ */
const REFERENCES = {
  "armon-lotem|2016": "https://doi.org/10.1111/1460-6984.12242",
  "almeida|2017": "https://doi.org/10.1075/lab.15019.alm",
  "fleckstein|2018": "https://doi.org/10.1080/10489223.2016.1192635",
  "tuller|2018": "https://doi.org/10.1111/1460-6984.12397",
  "hamann|2017": "https://doi.org/10.3389/fcomm.2017.00016",
  "chondrogianni|2018": "https://doi.org/10.1111/1460-6984.12363",
  "antonijevic|2017": "https://doi.org/10.1075/lab.15026.ant",
  "antonijevic-elliott|2019": "https://doi.org/10.1080/02699206.2019.1637458",
  "gavarró|2017": "https://doi.org/10.3389/fpsyg.2017.01865",
  // The COST IS1406 volume cited in every vignette stub note.
  "law|2019": "https://doi.org/10.4324/9780429455308",
};

// An author-ish run immediately before a year, in either narrative
// "Author (2016)" or parenthetical "(Author et al., 2016)" form. The run is
// deliberately permissive and capped in length; correctness comes from
// resolution, not from parsing — a run that resolves to nothing stays plain.
// String.raw, not plain quotes: these are regex fragments, and inside an
// ordinary string literal "\w" collapses to "w" before RegExp ever sees it.
const NAME = String.raw`[A-ZÀ-Þ][\w'’À-ɏ-]+`;
const AUTHORISH = "(?:" + NAME + String.raw`|[A-ZÀ-Þ]\.|&amp;|and|et|al\.|de|van|von|den|der|ter|di|da|la|le)`;
const RUN = AUTHORISH + String.raw`(?:[,\s]+` + AUTHORISH + "){0,5}";
const YEARS = String.raw`((?:19|20)\d{2})[a-z]?(?:,\s*(?:19|20)\d{2}[a-z]?)*`;
const NARRATIVE_RE = new RegExp(RUN + String.raw`[,\s]*\(` + YEARS + String.raw`\)`, "g");
const PARENTHETICAL_RE = new RegExp(String.raw`\(` + RUN + String.raw`,?\s*` + YEARS + String.raw`\)`, "g");

function citationKey(surname, year) {
  return surname.toLowerCase().replace(/['\u2019]/g, "") + "|" + year;
}

// A source link on this same entry resolves a citation when its label names
// both the surname and the year — which is how the seed labels are written
// ("Norbury et al. (2016), SCALES prevalence study").
function resolveFromDocLinks(entry, surname, year) {
  // Same normalisation as citationKey — otherwise a surname with an apostrophe
  // matches the registry but never its own source link.
  const lower = surname.toLowerCase().replace(/['’]/g, "");
  const hit = (entry.docLinks || []).find(d => {
    const l = (d.label || "").toLowerCase();
    return l.includes(lower) && l.includes(year);
  });
  return hit ? hit.url : null;
}

// Try every capitalised token against every year in the match. This is what
// makes "See Chondrogianni & John (2018)" work — "See" simply resolves to
// nothing and the next candidate is tried.
function resolveCitation(matchText, entry) {
  const names = matchText.match(new RegExp(NAME, "g")) || [];
  const years = matchText.match(/(?:19|20)\d{2}/g) || [];
  for (const n of names) {
    // All-caps tokens are acronyms, not surnames ("TOS' (2016)" is a document
    // title, and its own source pill sits at the foot of the card).
    if (n.length > 1 && n === n.toUpperCase()) continue;
    for (const y of years) {
      const url = REFERENCES[citationKey(n, y)] || resolveFromDocLinks(entry, n, y);
      if (url) return { url, name: n };
    }
  }
  return null;
}

// Runs over already-escaped HTML, and only ever wraps a plain run in an <a>.
const KEEP_IN_LINK = /^[(\s]*(?:(?:de|van|von|den|der|ter|di|da|la|le)\s+)?$/i;

function linkCitations(escapedText, entry) {
  const wrap = (match) => {
    const hit = resolveCitation(match, entry);
    if (!hit) return match;
    // The run can absorb a leading ordinary word ("See Chondrogianni…",
    // "and Tuller…"). Start the link at the surname that actually resolved so
    // the anchor text is the citation and nothing else.
    const at = match.indexOf(hit.name);
    let lead = at > 0 ? match.slice(0, at) : "";
    let cite = at > 0 ? match.slice(at) : match;
    // An opening bracket or a lowercase name particle belongs to the citation,
    // not to the sentence — otherwise "(Bishop…2017)" links with an unbalanced
    // paren and "de Almeida" loses its "de".
    if (lead && KEEP_IN_LINK.test(lead)) { cite = lead + cite; lead = ""; }
    return `${lead}<a class="cite" href="${escAttr(hit.url)}" target="_blank" rel="noopener">${cite}</a>`;
  };
  return escapedText.replace(NARRATIVE_RE, wrap).replace(PARENTHETICAL_RE, wrap);
}
const swatch = (u, st) => {
  if (st === 'has') return `<span class="sw" style="background:var(${covVar(u)})"></span>`;
  if (st === 'looked') return `<span class="sw" style="background:repeating-linear-gradient(45deg,var(--hatch-bg) 0 3px,var(--hatch-line) 3px 4px)"></span>`;
  return `<span class="sw" style="background:var(--nodata)"></span>`;
};

function fieldMarks(u, d) {
  return d.fields.map((f, i) => {
    const c = u.fieldStates[i];
    const cls = c === 'h' ? 'on' : c === 'l' ? 'looked' : c === 'x' ? 'na' : '';
    return `<span class="${cls}">${esc(f.label)}</span>`;
  }).join('');
}

/* The hover card while the map is shaded by ONE question.
 *
 * The coverage card counts fields and lists which ones are filled, which is the
 * right summary of a map painted by how much is documented and the wrong one
 * for a map painted by a single answer: it describes everything except the
 * thing the reader is looking at. So this says what this unit answered.
 *
 * The swatch is read off the shape itself rather than recomputed, so it cannot
 * drift from the fill on the map -- and the words for the three no-value states
 * are the legend's words exactly, because the card is where a reader turns the
 * legend's colour back into a unit.
 */
function codedTipHTML(u, terr, via, fill) {
  const d = domain();
  const [fk, col] = CODED.key.split('.');
  const f = d.fields.find(x => x.k === fk) || { k: fk, label: fk };
  const vals = codedValues(u, CODED.key);
  const st = stateOf(u);

  const css = fillToCSS(fill);
  const sw = `<span class="sw" style="background:${css.bg};${css.size ? 'background-size:' + css.size + ';' : ''}"></span>`;

  const fs = fieldStateOf(u, fk);
  const answer = vals
    ? vals.map(v => esc(v)).join(', ')
    : isAbsent(u, CODED.key) ? 'Recorded as absent'
    : isUnset(u, CODED.key) ? 'Coded, and no value fitted'
    : fs === 'looked' ? 'Looked, found nothing'
    : fs === 'na' ? 'Not applicable here'
    : fs === 'none' ? 'Nothing recorded'
    : 'Recorded, not yet coded';

  // Say what the colour is doing. Isolated, it is a yes/no about one value and
  // the card names it; striped, it is both values at once and the card says so,
  // because a two-colour shape otherwise looks like a rendering fault.
  const bands = (vals && SCALE && SCALE.list)
    ? new Set(vals.map(v => SCALE.map.get(v) || 'var(--cat-other)')).size : 0;
  const note = (CODED.only && vals && vals.length > 1)
    ? `Shaded by whether this includes <b>${esc(CODED.only)}</b>.`
    : String(fill || '').indexOf('#manyvals') >= 0
      ? 'Crosshatched because this answer holds more values than a stripe can show.'
      : (bands > 1 && String(fill || '').indexOf('#stripe-') >= 0)
        ? `Striped because this answer holds ${bands === 2 ? 'both' : 'all three'}.`
        : '';

  const label = terr ? terr.name : (via || u.name);
  const meta = (terr || via) ? esc(u.name) + ' · shows that entry'
    : esc(u.subregion || u.region) + (u.nat ? ' · national' : ' · sub-national');
  return `
    <div class="name">${esc(label)}</div>
    <div class="meta">${meta}</div>
    <div class="cq">${esc(colLabel(f.k, col))} · ${esc(f.label)}</div>
    <div class="state">${sw} ${answer}</div>
    ${note ? `<div class="inherit">${note}</div>` : ''}
    <div class="hintline">Click for what that was read from</div>`;
}

function tipHTML(u, terr, via, inheriting, fill) {
  if (CODED.key) return codedTipHTML(u, terr, via, fill);
  const d = domain();
  const sibs = (IDX[domainId].byCC.get(u.cc) || []).filter(x => x !== u);
  const countryName = (B.countries[u.cc] || {}).name || u.cc;

  // When the shape follows its country, every number and marker has to come
  // from the country's entry — that is the record actually on offer here.
  const nat = IDX[domainId].owner.get(u.cc) || null;
  const src = (inheriting && !via && nat) ? nat : u;
  const st = stateOf(src);
  const nDoc = src.filled.length;

  let inherit = '';
  if (terr) {
    inherit = `${esc(terr.note)}`;
  } else if (via) {
    inherit = `No separate ${esc(d.label)} entry for ${esc(via)}. What applies is the <b>${esc(u.name)}</b> record shown here.`;
  } else if (inheriting) {
    inherit = `Nothing recorded for ${esc(u.name)} itself in this domain, so it follows <b>${esc(nat ? nat.name : countryName)}</b>. It is a separate unit because it differs in another domain.`;
  } else if (u.nat && sibs.length) {
    inherit = `${sibs.length} sub-national entr${sibs.length === 1 ? 'y' : 'ies'} also exist for ${esc(u.name)}. Each one falls back to this record where it has nothing of its own.`;
  } else if (sibs.length) {
    inherit = nat
      ? `Sits inside <b>${esc(nat.name)}</b>. Anything not recorded here follows the national entry.`
      : `${sibs.length + 1} separate entries for ${esc(countryName)} — nothing is recorded at national level, so none of them inherit.`;
  }

  const label = terr ? terr.name : (via || u.name);
  const meta = (terr || via) ? esc(u.name) + ' · shows that entry'
    : esc(u.subregion || u.region) + (u.nat ? ' · national' : ' · sub-national');
  return `
    <div class="name">${esc(label)}</div>
    <div class="meta">${meta}</div>
    <div class="state">${swatch(src, st)} ${nDoc} of ${d.fields.length} fields documented${src !== u ? ' by ' + esc(src.name) : ''}</div>
    <div class="fieldgrid" style="--mark:${hueOf(src)}">${fieldMarks(src, d)}</div>
    ${inherit ? `<div class="inherit">${inherit}</div>` : ''}
    <div class="hintline">Click for the full entry</div>`;
}

/* ---------- detail panel ---------- */
const panel = document.getElementById('panel');
function closePanel() { selected = null; panel.classList.remove('on'); markSelection(); }

function select(key, zoom, via) {
  const u = IDX[domainId].byKey.get(key);
  if (!u) return;
  // Opening the whole entry is a choice about ONE unit, so picking another one
  // starts from the focused view again rather than inheriting the last choice.
  if (key !== selected) panelFull = false;
  selected = key;
  markSelection();
  panel.innerHTML = (CODED.key && !panelFull) ? codedPanelHTML(u) : panelHTML(u, via);
  panel.classList.add('on');
  panel.scrollTop = 0;
  panel.querySelector('.close').onclick = closePanel;
  const whole = panel.querySelector('[data-full]');
  if (whole) whole.onclick = () => { panelFull = true; select(key, false, via); };
  panel.querySelectorAll('.sibs button[data-key], .tocountry[data-key]').forEach(b => {
    b.onclick = () => select(b.dataset.key, true);
  });
  const toSub = panel.querySelector('.tosub');
  if (toSub) toSub.onchange = () => { if (toSub.value) select(toSub.value, true); };
  const fix = panel.querySelector('[data-fix]');
  if (fix) fix.onclick = () => openFix(u);
  if (zoom) {
    const box = BOXES[key] || BOXES[u.cc];
    if (box) zoomToBox(box);
  }
}

// Each dated row links to the policy it names, where the entry's own sources
// hold it. Rows whose document could not be identified stay as plain text.
function historyHTML(rows, entry) {
  return `<ol class="hist">` + (rows || []).map(h => `<li>
      <span class="yr">${esc(h.year)}</span>
      <div>
        ${linkCitations(esc(h.description), entry) ? `<p>${linkCitations(esc(h.description), entry)}</p>` : ''}
        ${h.links.length ? `<div class="links">${linkList(h.links)}</div>` : ''}
      </div>
    </li>`).join('') + `</ol>`;
}

// A named language, with its classification and a link to its WALS record.
// The link exists ONLY where a WALS code was resolved from WALS's own data:
// wals.info uses codes of its own that are not ISO 639-3, and they collide
// (Maori is `mao` in WALS while `mri`, its ISO code, is Moraori in WALS). A row
// with no code is shown without a link rather than with a plausible wrong one.
function languagesHTML(rows) {
  return `<ul class="langs">` + (rows || []).map(l => {
    const cls = [l.family, l.genus].filter(Boolean).join(' › ');
    const ids = [l.iso ? `ISO ${l.iso}` : '', l.wals ? `WALS ${l.wals}` : ''].filter(Boolean).join(', ');
    const name = l.wals
      ? `<a href="https://wals.info/languoid/lect/wals_code_${encodeURIComponent(l.wals)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a>`
      : esc(l.name);
    return `<li>
      <span class="lname">${name}</span>
      ${cls ? `<span class="lcls">${esc(cls)}</span>` : ''}
      ${l.typology ? `<span class="ltyp">${esc(l.typology)}</span>` : ''}
      ${ids ? `<span class="lids">${esc(ids)}</span>` : ''}
    </li>`;
  }).join('') + `</ul>`;
}

// Offering and programme rows: "which institutions, and take me to one".
//
// Both shapes carry a `url` to the programme page and NEITHER was rendering
// it. The rows reached the panel through asText(), which flattens a row to a
// dash-joined line and drops `url` on the floor — so every one of those links
// was collected, gated, stored, and then shown to nobody.
//
// The head of each row is what the row is ABOUT: the language for an offering,
// the subject for a programme. The institution is the link, because that is
// the thing a reader wants to reach. A row with no institution but a count is
// a legitimate row -- a source that says "twelve universities" without naming
// them -- and renders as the count.
function rowsHTML(rows, headKey) {
  return `<ul class="offs">` + (rows || []).map(r => {
    const head = esc(r[headKey] || '');
    const inst = r.institution
      ? (r.url
          ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.institution)}</a>`
          : esc(r.institution))
      : (r.institutions ? `${esc(r.institutions)} institutions` : '');
    const meta = [r.level, r.orientation, r.year].filter(Boolean).map(esc).join(' · ');
    return `<li>
      ${head ? `<span class="oname">${head}</span>` : ''}
      ${inst ? `<span class="oinst">${inst}</span>` : ''}
      ${meta ? `<span class="ometa">${meta}</span>` : ''}
      ${r.note ? `<span class="onote">${esc(r.note)}</span>` : ''}
    </li>`;
  }).join('') + `</ul>`;
}

function linkList(links) {
  return links.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a>`
  ).join('');
}

/* The panel while the map is drawn by ONE question.
 *
 * A reader who arrived by clicking "Newcomer criteria" and is looking at a map
 * of rule locus has asked a narrow question, and the nine-field entry answers a
 * different one. So this shows that unit's answer to THAT question and the text
 * the answer was read from, and offers the whole entry as a way on rather than
 * as the default.
 *
 * The prose is still the record and the coding is still a reading of it, so the
 * value comes first and the bullets underneath are headed as what it was read
 * from -- the same separation the data keeps, in the order this reader needs.
 */
let panelFull = false;

/* A gloss laid out so it can be read rather than waded through.
 *
 * Every one of them is written the same way -- a definition, then the entries
 * that forced the value to exist, semicolon-separated inside one parenthesis,
 * then sometimes a note about what it is NOT. Run together that is a wall; the
 * examples are the part a reader checks the coding against, and they are a
 * list, so they are laid out as one.
 *
 * Nothing is reworded, dropped or reordered. Only the parenthesis is opened
 * out, and only when it holds more than one example -- a single example reads
 * better in the sentence that introduces it.
 */
function glossHTML(text) {
  const g = String(text);
  const open = g.indexOf('(');
  if (open < 0) return `<p class="cgloss">${esc(g)}</p>`;
  // The matching close, counting depth -- several glosses quote a source that
  // has parentheses of its own.
  let depth = 0, close = -1;
  for (let i = open; i < g.length; i++) {
    if (g[i] === '(') depth++;
    else if (g[i] === ')' && --depth === 0) { close = i; break; }
  }
  if (close < 0) return `<p class="cgloss">${esc(g)}</p>`;
  const items = g.slice(open + 1, close).split(/;\s+/).map(x => x.trim()).filter(Boolean);
  if (items.length < 2) return `<p class="cgloss">${esc(g)}</p>`;
  const lead = g.slice(0, open).trim().replace(/[,:]$/, '');
  const tail = g.slice(close + 1).replace(/^[.\s]+/, '').trim();
  // The list needs saying what it is. These are the entries that FORCED the
  // value to exist -- other countries, named in coding.js -- and on a panel
  // headed "Northern Territory" an unlabelled list of Morocco, Singapore and
  // Suriname reads as though it describes the Northern Territory. Inside the
  // original parenthesis the sentence carried that signal; opening it out
  // threw the signal away, so it goes back explicitly.
  // Not "coded this way elsewhere": a unit is often ITSELF one of the entries
  // that forced the value, and South Africa reading "elsewhere" above its own
  // name is the same category error one step down.
  return `<p class="cgloss">${esc(lead)}</p>
    <div class="cgwhere">Where this value comes from</div>
    <ul class="cglist">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${tail ? `<p class="cgloss ctail">${esc(tail)}</p>` : ''}`;
}


/* WHICH OF AN ENTRY'S SOURCES BACK ONE FIELD.
 *
 * docLinks are recorded per ENTRY. Nothing in the data says which link backs
 * which field, and showing the whole list under one field's four lines --
 * fifteen links on South Africa, one of which is about SIAS -- tells a reader
 * nothing about where THAT reading came from.
 *
 * So the field's own words are matched against the source titles, and only a
 * source the text actually names is presented as belonging to it. This is a
 * claim about the TEXT, not about the coder: "this line names SIAS and this
 * source is the SIAS policy". Everything else stays on the entry, under its
 * own heading, because an unmatched source may well be the one that was read
 * and the corpus does not record it either way.
 *
 * Measured over all 3,735 coded field-instances that carry sources: 27% name
 * at least one, 10% of link slots match. The other 73% are paraphrase that
 * shares no name with any title, and they say so rather than guessing.
 */
const srcFold = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[‘’“”]/g, "'");
const srcFlat = t => srcFold(t).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const srcFlatCase = t => srcFold(t).replace(/[^A-Za-z0-9]+/g, ' ').trim();

// Capitalised in prose without naming anything, and the nouns every entry in
// the corpus uses. `state` is here because "The State" matched every Indian
// rule whose title starts with the state's name.
const SRC_WEAK = new Set(('the a an and or of for in on at to by with from under where when ' +
  'this that these those it its is are was were be been has have no not all any each ' +
  'one two three four five six seven eight nine ten both state states ' +
  'children child school schools language languages support').split(' '));
const SRC_JOIN = new Set(('of and for the on in de du des da do della di van von y e a la le ' +
  'les el al als dan og').split(' '));

function srcTokens(text) {
  const raw = String(text == null ? '' : text);
  const out = [];
  // Acronyms and code-like names: SIAS, KEDASY, NDIS, IS1406.
  for (const m of raw.matchAll(/\b[A-Z][A-Z0-9]{2,}\b/g)) out.push({ t: m[0], kind: 'acronym' });
  // Instrument numbers: 245/2008, 2145-VIII, "61 of 1999".
  for (const m of raw.matchAll(/\b\d{1,5}\s*[\/–-]\s*[A-Za-z0-9][A-Za-z0-9\/–-]*\b/g)) out.push({ t: m[0], kind: 'number' });
  for (const m of raw.matchAll(/\b\d{1,4}\s+of\s+(?:19|20)\d\d\b/g)) out.push({ t: m[0], kind: 'number' });
  // Proper phrases: two or more capitalised words, lowercase joiners allowed
  // inside and never at either end.
  const words = raw.match(/[A-ZÀ-Ý][\w'À-ſ-]*|[a-z][a-z]*/g) || [];
  const isCap = w => /^[A-ZÀ-Ý]/.test(w);
  let run = [];
  const flush = () => {
    while (run.length && !isCap(run[run.length - 1])) run.pop();
    if (run.filter(isCap).length >= 2) out.push({ t: run.join(' '), kind: 'phrase' });
    run = [];
  };
  for (const w of words) {
    if (isCap(w)) run.push(w);
    else if (run.length && SRC_JOIN.has(w.toLowerCase())) run.push(w);
    else flush();
  }
  flush();

  const seen = new Set();
  return out.filter(o => {
    const f = srcFlat(o.t);
    if (!f || seen.has(f)) return false;
    seen.add(f);
    if (o.kind === 'acronym') return f.length >= 3 && !SRC_WEAK.has(f);
    // A number is distinctive when it carries a year, three digits, or a
    // letter suffix. "1-8" is a grade range and matches by accident.
    if (o.kind === 'number') return /(?:19|20)\d\d/.test(f) || f.replace(/\D/g, '').length >= 3 || /\d\s*[a-z]/.test(f);
    const ws = f.split(' ');
    return ws.length >= 2 && f.length >= 9 && !ws.every(w => SRC_WEAK.has(w));
  }).map(o => Object.assign({}, o, { f: srcFlat(o.t) }));
}

/* AN INSTRUMENT CITED BY NAME AND YEAR.
 *
 * Northern Ireland's legalEntitlement opens "Education (NI) Order 1996 art. 16"
 * and the entry's source is labelled "Education (Northern Ireland) Order 1996,
 * Part II" -- the same document, and no substring of either is a substring of
 * the other, because the drafter abbreviated the country. So an instrument is
 * matched by its YEAR plus two or more of its name-words IN ORDER, which
 * survives an abbreviation dropping out of the middle.
 *
 * The year is what makes this safe. `Act` and `Order` stay in the name-words
 * rather than being stopped, because requiring the same year already refuses
 * the generic match a stop-list would be guarding against.
 */
const INST_STOP = new Set(('the a an of and for in on to by no nr num part arts article ' +
  'articles ss reg regs sch schedule chapter section').split(' '));

function srcInstruments(text) {
  const out = [];
  for (const m of String(text).matchAll(/([A-Z][^.\n]{0,88}?)\b((?:19|20)\d{2})\b/g)) {
    // The window runs back up to 88 characters, so most of what it catches is
    // the sentence around the citation. The instrument is the CAPITALISED RUN
    // nearest the year: in "Scots has official status within Scotland,
    // Scottish Languages Act 2025" that is the last four words, not all six.
    // Cut at the last comma or semicolon first: a citation is what follows the
    // clause, not the clause. "...within Scotland, Scottish Languages Act 2025"
    // is the Act, and taking four words back from the year swept Scotland in.
    const near = m[1].split(/[,;:]\s*/).pop() || m[1];
    const caps = (near.match(/[A-Z][\w'’-]*/g) || []).slice(-4);
    const ws = caps.map(w => srcFlat(w)).filter(w => w.length >= 2 && !INST_STOP.has(w));
    if (ws.length >= 2) out.push({ year: m[2], words: ws, raw: caps.join(' ') + ' ' + m[2] });
  }
  return out;
}

function srcInstrumentHit(inst, labelFlat) {
  if (!labelFlat.includes(inst.year)) return null;
  let at = 0, hit = 0;
  for (const w of inst.words) {
    const i = labelFlat.indexOf(w, at);
    if (i < 0) continue;                 // abbreviated away in one of the two
    at = i + w.length; hit++;
  }
  return hit >= 2 ? inst.raw : null;
}

const srcInside = (hay, needle) => hay === needle ||
  hay.startsWith(needle + ' ') || hay.endsWith(' ' + needle) || hay.includes(' ' + needle + ' ');

function srcHit(tok, lab) {
  // An acronym is matched CASE-SENSITIVELY. ACCESS is a test in Rhode Island
  // and an ordinary verb in half the titles in the corpus; making the title
  // shout it back is what tells the two apart.
  if (tok.kind === 'acronym') return srcInside(lab.c, tok.t.toUpperCase()) ? tok.t : null;
  if (srcInside(lab.f, tok.f)) return tok.t;
  if (tok.kind !== 'phrase') return null;
  const ws = tok.t.split(' ');
  for (let n = ws.length - 1; n >= 2; n--) {
    if (SRC_JOIN.has(ws[n - 1].toLowerCase())) continue;   // "Ministry of" is not a name
    const part = ws.slice(0, n).join(' ');
    if (srcFlat(part).length >= 9 && srcInside(lab.f, srcFlat(part))) return part;
  }
  return null;
}

/* Sources recorded against THIS FIELD when the entry was drafted.
 *
 * Not a guess and not a match: research/parts/*.md carries an EVIDENCE block of
 * field -> verbatim quote -> source URL, written by the reader who did the
 * work, and derive.js ships it per unit. Where it exists it is the answer, and
 * the text matcher below is only the fallback for the entries it does not
 * cover -- roughly four in five, because the parts format post-dates most of
 * the corpus.
 *
 * A recorded source is sometimes NOT one of the entry's docLinks (317 of
 * 2,509): quoted while drafting, never added to the entry. It is still shown,
 * since the quote is the evidence that it was read, and it falls back to the
 * host name when no docLink supplies a label.
 */
function draftedSources(u, fieldKey) {
  const rows = (u.fieldSources || {})[fieldKey];
  if (!Array.isArray(rows) || !rows.length) return [];
  const byUrl = new Map();
  for (const l of (u.docLinks || [])) byUrl.set(String(l.url).split('#')[0], l.label || l.url);
  return rows.map(r => {
    const bare = String(r.url).split('#')[0];
    // The entry's own wording first, then the drafter's, and a hostname only
    // when there is nothing else. A URL match against docLinks is exact, so a
    // source recorded under a second address falls through to the drafter's
    // name rather than to "education-profiles.org".
    let label = byUrl.get(bare) || r.label;
    if (!label) { try { label = new URL(r.url).hostname.replace(/^www\./, ''); } catch (e) { label = r.url; } }
    return { url: r.url, label, quote: r.quote, where: r.where, found: !!r.found };
  });
}

function fieldSources(u, fieldKey) {
  const links = u.docLinks || [];
  const text = String((u.values || {})[fieldKey] == null ? '' : u.values[fieldKey]);
  // The place's own name discriminates nothing -- every source on the entry is
  // about that place, so matching on it would mark them all.
  const skip = new Set([srcFlat(u.name), srcFlat((B.countries[u.cc] || {}).name || '')]);
  const toks = srcTokens(text).filter(t => !skip.has(t.f));

  // A resolved citation is the strongest signal there is, and the panel body
  // is already showing it as an inline link on that very line.
  const cited = new Set();
  for (const line of text.split('\n')) {
    const r = resolveCitation(line, u);
    if (r && r.url) cited.add(r.url);
  }

  // Anything already shown as a recorded source is not repeated below it.
  // By url AND by title: PEER's profiles are cited at two addresses, so the
  // same document was appearing under both headings at once.
  const ds = draftedSources(u, fieldKey);
  const drafted = new Set(ds.map(d => String(d.url).split('#')[0]));
  const draftedNames = ds.map(d => srcFlat(d.label)).filter(t => t.length > 12);

  const insts = srcInstruments(text);

  const named = [], rest = [];
  for (const l of links) {
    if (drafted.has(String(l.url).split('#')[0])) continue;
    const lf = srcFlat(l.label || '');
    if (draftedNames.some(t => lf.startsWith(t) || t.startsWith(lf))) continue;
    const lab = { f: srcFlat(l.label || l.url || ''), c: srcFlatCase(l.label || l.url || '') };
    const on = [];
    for (const t of toks) { const h = srcHit(t, lab); if (h && on.indexOf(h) < 0) on.push(h); }
    for (const i of insts) { const h = srcInstrumentHit(i, lab.f); if (h && on.indexOf(h) < 0) on.push(h); }
    if (on.length || cited.has(l.url)) named.push({ link: l, on: on });
    else rest.push(l);
  }
  return { named: named, rest: rest, total: links.length };
}

function fieldSourcesHTML(u, fieldKey) {
  const { named, rest, total } = fieldSources(u, fieldKey);
  const drafted = draftedSources(u, fieldKey);
  if (!total && !drafted.length) return `<div class="cpanlinks"><p class="cnone">No source is recorded on this entry.</p></div>`;

  // Two different claims, and the panel does not blur them. A recorded source
  // is what a reader wrote down against this field at the time. A FOUND one is
  // this entry's own source that turned out to contain the wording above, which
  // is evidence about the document rather than a record of anybody's reading.
  const anyRecorded = drafted.some(d => !d.found);
  const draftedHTML = drafted.length ? `<div class="drafted">
      <div class="ch">${anyRecorded ? 'Read for this question' : 'This text is in'}</div>
      <div class="links">${drafted.map(d => `<div class="srcrow">
        <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.label)}</a>
        ${d.quote ? `<blockquote class="q">${esc(d.quote)}${d.where ? `<span class="where">${esc(d.where)}</span>` : ''}</blockquote>` : ''}
      </div>`).join('')}</div>
    </div>` : '';

  if (!named.length) {
    if (drafted.length) {
      return `<div class="cpanlinks">
        ${draftedHTML}
        ${rest.length ? `<details class="rest">
            <summary>${rest.length} other source${rest.length === 1 ? '' : 's'} on the ${esc(u.name)} entry</summary>
            <div class="links">${linkList(rest)}</div>
          </details>` : ''}
        <p class="note">${anyRecorded
          ? 'Recorded against this question when the entry was drafted, with the sentence it was read from.'
          : `Chosen from this entry's own sources by reading them: ${drafted.length === 1 ? 'this is the one that carries' : 'these carry'} the wording above, and the others do not.`}</p>
      </div>`;
    }
    return `<div class="cpanlinks">
      <div class="ch">Sources on this entry</div>
      <div class="links">${linkList(rest)}</div>
      <p class="note">These are the entry's sources, not this question's: nothing in the
        text above names one of them, and the corpus does not record which source each
        line was read from.</p>
    </div>`;
  }

  const rows = named.map(m => `<div class="srcrow">
      <a href="${esc(m.link.url)}" target="_blank" rel="noopener noreferrer">${esc(m.link.label || m.link.url)}</a>
      ${m.on.length ? `<span class="why">the text names <b>${m.on.map(x => esc(x)).join('</b>, <b>')}</b></span>`
                    : `<span class="why">cited in the text above</span>`}
    </div>`).join('');

  return `<div class="cpanlinks">
    ${draftedHTML}
    <div class="ch">Named in this text</div>
    <div class="links">${rows}</div>
    ${rest.length ? `<details class="rest">
        <summary>${rest.length} other source${rest.length === 1 ? '' : 's'} on the ${esc(u.name)} entry</summary>
        <div class="links">${linkList(rest)}</div>
      </details>` : ''}
    <p class="note">${drafted.length
      ? 'The first block was recorded against this question when the entry was drafted. The rest is matched on what the text names, which is a claim about the words above rather than about what the coder read.'
      : 'Matched on what the text names, which is a claim about the words above rather than about what the coder read. A source in the second list may well be the one this answer came from.'}</p>
  </div>`;
}

function codedPanelHTML(u) {
  const d = domain();
  const [fk, col] = CODED.key.split('.');
  const f = d.fields.find(x => x.k === fk) || { k: fk, label: fk };
  const sc = schemeFor(fk);
  const vals = codedValues(u, CODED.key);
  const defs = ((sc && sc.values) || {})[col] || {};
  const ordinal = !!(sc && (sc.ordinalColumns || []).includes(col));
  const question = colLabel(fk, col);

  const chips = vals ? vals.map(v => {
    const gloss = defs[v];
    const swatch = CODED.only
      ? (v === CODED.only ? 'var(--cat-1)' : 'var(--cat-other)')
      : ((SCALE && SCALE.map.get(v)) || 'var(--cat-other)');
    const head = `<span class="dot" style="background:${swatch}"></span>${esc(String(v))}`;
    return gloss
      ? `<details class="cvwrap" open><summary class="cv${ordinal ? ' ord' : ''}">${head}</summary>${glossHTML(gloss)}</details>`
      : `<div class="cv${ordinal ? ' ord' : ''}">${head}</div>`;
  }).join('') : '';

  // Why there is no value, said precisely -- and read off THIS FIELD, because
  // an entry can be full and this question still unanswered, or answered by
  // saying it does not apply.
  const fs = fieldStateOf(u, fk);
  const noValue = isAbsent(u, CODED.key)
    ? `<p class="cnone">${esc(u.name)} has no such thing, and the entry establishes that rather than leaving it open. That is a complete answer to this question, not a gap.</p>`
    : isUnset(u, CODED.key)
    ? `<p class="cnone">Somebody coded this entry and left this question with no value, because none of them fitted what it says. The text is below.</p>`
    : fs === 'looked'
    ? `<p class="cnone">Somebody looked for this on ${esc(u.name)} and found nothing to record.</p>`
    : fs === 'na'
      ? `<p class="cnone">This question does not apply to ${esc(u.name)}, and the entry says so.</p>`
      : fs === 'none'
        ? `<p class="cnone">Nothing is recorded for ${esc(u.name)} on this question.</p>`
        : `<p class="cnone">${esc(u.name)} has an answer written for this question, and nobody has coded it yet. The text is below.</p>`;

  const sources = fieldSourcesHTML(u, fk);

  const text = u.values[fk];
  const lines = String(text == null ? '' : text).split('\n').map(x => x.trim()).filter(Boolean);
  const body = lines.length
    ? `<ul class="bul">${lines.map(l => `<li>${linkCitations(esc(l), u)}</li>`).join('')}</ul>`
    : `<p class="cnone">Nothing recorded for this question.</p>`;

  return `
  <div class="inner cpan">
    <button class="close" aria-label="Close">×</button>
    <div class="eyebrow">${esc(u.nat ? 'National' : 'Sub-national')} · ${esc(question)}</div>
    <h2>${esc(u.name)}</h2>
    <div class="where">${esc(u.subregion || u.region)} · ${esc(f.label)}</div>
    <div class="cpanval">${vals ? chips : noValue}</div>
    <div class="cpansrc">
      <div class="ch">What that was read from</div>
      ${body}
    </div>
    ${sources}
    <button class="wholeentry" data-full="1">The whole ${esc(u.name)} entry<span aria-hidden="true"> →</span></button>
  </div>`;
}

function panelHTML(u, via) {
  const d = domain();
  const st = stateOf(u);
  const hue = hueOf(u);
  const countryName = (B.countries[u.cc] || {}).name || u.cc;
  const sibs = (IDX[domainId].byCC.get(u.cc) || []).filter(x => x !== u);
  const nat = sibs.find(x => x.nat);

  // Every field, in order. A field this unit has nothing of its own for falls
  // back to its country's text, marked as inherited rather than presented as
  // the unit's own work.
  const par = parentOf(u);
  let nInherited = 0;
  // Every field heading carries a way out to the same question asked of every
  // country. Reading one place answers "what does Kenya do"; the comparison is
  // a different question and it used to mean leaving the map, finding /views,
  // and re-picking the map and the field by hand -- three steps to ask a
  // question the panel already knows the answer to. The link is per FIELD
  // because that is the unit the other page is organised by.
  // The heading IS the way out. Clicking a field name re-draws the whole map by
  // that question -- every country's answer to it, in one picture -- which is
  // what the old /views table was for and is a better answer than a table.
  //
  // THE HEADING REDRAWS THE MAP; THE NAV TAB LEAVES IT. These two were briefly
  // swapped, which put both clicks on the page the reader was already on: a
  // heading inside an entry sent them to a table, and "Field views" in the nav
  // opened another map. Clicking a field name here is a question asked from
  // inside the map -- draw this one instead -- and the words are a tab away.
  //
  // Only where the map can actually shade by it: a field with no coded column,
  // or a row-grained one, has nothing to colour, so its heading stays plain
  // text rather than a link that leads to the coverage map with nothing
  // changed.
  const mappable = key => shadeableColumns().some(c => c.field === key);
  const head = (label, key) => key && mappable(key)
    ? `<a class="fieldmap" href="/${encodeURIComponent(d.id)}?field=${encodeURIComponent(key)}"
         title="Draw the map by this question">${esc(label)}<span aria-hidden="true"> →</span></a>`
    : esc(label);
  const block = (cls, label, body, from, key) =>
    `<div class="field ${cls}"><h4>${head(label, key)}${from ? `<span class="from">inherited from ${esc(from)}</span>` : ''}</h4>${body}</div>`;
  // A field is either a paragraph or a set of sub-bullets, one per line. Sources
  // are not repeated per field — every one is linked once under "Evidence for
  // this entry" at the foot of the panel. Prose fields hold no newline, so they
  // fall through to the paragraph they always were, and a contributor who types
  // a single block of text still gets one.
  // One bullet per line. All three live maps are written this way, so there is
  // no longer a per-domain flag: a field with no line break is one bullet, not
  // a paragraph, which is the only reading that renders a genuinely one-point
  // field — Northern Ireland's removal criteria, say — like its siblings.
  const prose = (text, entry) => {
    const lines = String(text == null ? '' : text).split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return `<p>${linkCitations(esc(text), entry)}</p>`;
    return `<ul class="bul">${lines.map(l => `<li>${linkCitations(esc(l), entry)}</li>`).join('')}</ul>`;
  };
  const fields = d.fields.map((f, i) => {
    const c = u.fieldStates[i];
    const isHist = f.k === 'policyHistory';
    const isLangs = f.type === 'languages';
    // `offering` is keyed by language, `programme` by subject; the renderer is
    // the same and only the head of the row differs.
    const rowKey = f.type === 'offering' ? 'language' : f.type === 'programme' ? 'subject' : null;
    const renderOwn = () => isHist ? historyHTML(u.history, u)
      : isLangs ? languagesHTML(u.records[f.k])
      : rowKey ? rowsHTML(u.records[f.k], rowKey)
      : prose(u.values[f.k], u);
    if (c === 'h') return block('on', f.label, renderOwn(), null, f.k);
    // "Not established from the sources consulted…" is a sentence explaining an
    // absence, not a list of facts, so it stays a paragraph even where the
    // domain's documented fields are bulleted.
    if (c === 'l') return block('looked', f.label, `<p>${linkCitations(esc(u.values[f.k]), u)}</p>`, null, f.k);
    // The question does not apply here — not a gap, and not something a
    // contributor should be invited to fill. It must be shown BEFORE the
    // inheritance branch: a state has no language count of its own, but its
    // country does, and inheriting India's 518 onto Kerala would state the one
    // thing the field is careful not to say.
    if (c === 'x') return block('na', f.label, `<p>${linkCitations(esc(u.values[f.k]), u)}</p>`, null, f.k);
    const inheritable = par && (isHist ? (par.history || []).length
      : (isLangs || rowKey) ? (par.records[f.k] || []).length
      : par.values[f.k]);
    if (inheritable) {
      nInherited++;
      return block('inh', f.label,
        isHist ? historyHTML(par.history, par)
          : isLangs ? languagesHTML(par.records[f.k])
          : rowKey ? rowsHTML(par.records[f.k], rowKey)
          : prose(par.values[f.k], par), par.name, f.k);
    }
    return block('empty', f.label, '<p>Not recorded.</p>', null, f.k);
  }).join('');

  const cross = LIVE.map(dd => {
    const other = IDX[dd.id].byKey.get(keyOf(u));
    return `<div class="r">${other ? swatch(other, other.coverage) : swatch(u, 'none')}
      <span>${esc(dd.label)}</span>
      <span class="n">${other ? other.filled.length + '/' + other.nFields + ' fields' : 'no entry'}</span></div>`;
  }).join('');

  const sibRows = sibs.map(x =>
    `<button data-key="${esc(keyOf(x))}">${swatch(x, stateOf(x))}<span>${esc(x.name)}</span>
      <span class="role">${x.nat ? 'national' : 'sub-national'}</span></button>`).join('');

  const inheritNote = !sibs.length ? ''
    : u.nat
      ? `These sub-national units exist because they differ somewhere. In this domain each of them falls back to the record above wherever it has nothing of its own.`
      : nat
        ? `A field left blank here is not necessarily a gap in the record — it falls back to <b>${esc(nat.name)}</b>, marked as inherited above.`
        : `${esc(countryName)} has no national entry in this domain, so these ${sibs.length + 1} units inherit nothing from each other. Every field has to be documented separately.`;

  return `
  <div class="inner" style="--mark:${hue}">
    <button class="close" aria-label="Close">×</button>
    <div class="eyebrow">${esc(u.nat ? 'National' : 'Sub-national')} · ${esc(d.label)}</div>
    <h2>${esc(u.name)}</h2>
    <div class="wherewrap">
      <div class="where">${u.nat
        ? esc(u.subregion || u.region)
        : (nat
            ? `<button class="tocountry" data-key="${esc(keyOf(nat))}">${esc(nat.name)}</button> · ${esc(u.subregion || u.region)}`
            : esc(countryName + ' · ' + (u.subregion || u.region)))}</div>
      ${u.nat && sibs.length ? `<select class="tosub" aria-label="Go to a sub-national entry">
        <option value="">${esc(sibs.length + ' sub-national entr' + (sibs.length === 1 ? 'y' : 'ies'))}…</option>
        ${sibs.map(x => `<option value="${esc(keyOf(x))}">${esc(x.name)}</option>`).join('')}
      </select>` : ''}
    </div>
    ${via ? `<p class="viaterr">You clicked <b>${esc(via.name)}</b>. ${via.note
      ? esc(via.note)
      : `There is no separate ${esc(d.label)} entry for it, so what applies is the ${esc(u.name)} record below.`}</p>` : ''}
    ${nInherited && !via ? `<p class="viaterr">${nInherited} of these ${d.fields.length} fields have nothing recorded for ${esc(u.name)} itself and follow <button class="tocountry" data-key="${esc(keyOf(par))}">${esc(par.name)}</button>. They are marked below.</p>` : ''}
    ${u.stubNote ? `<p class="stubnote">${esc(u.stubNote)}</p>` : ''}

    <div class="chips">
      <span class="chip">${u.filled.length}/${d.fields.length} fields</span>
      <span class="chip">${esc(u.status)}</span>
      <span class="chip">${esc(u.confidence.replace(/-/g, ' '))}</span>
      ${u.lastVerified ? `<span class="chip">verified ${esc(u.lastVerified)}</span>` : ''}
    </div>

    <!-- No heading over the fields: they are the entry, and saying so above
         them only pushes the first field further down the panel. The sections
         that follow still need their headings, because they are not. -->
    <div class="sect">
      ${fields}
    </div>

    ${u.docLinks.length ? `<div class="sect"><h3>Evidence for this entry</h3>
      <div class="links">${linkList(u.docLinks)}</div></div>` : ''}
    ${u.supportLinks.length ? `<div class="sect"><h3>Support available there</h3>
      <div class="links">${linkList(u.supportLinks)}</div></div>` : ''}

    <div class="sect">
      <h3>Across domains</h3>
      <div class="cross">${cross}</div>
    </div>

    ${u.collaborators.length ? `<div class="sect"><h3>Contributors</h3>
      <dl class="kv"><dt>Worked on by</dt><dd>${esc(u.collaborators.join(', '))}</dd></dl></div>` : ''}

    ${sibs.length ? `<div class="sect">
      <h3>Others in ${esc(countryName)}</h3>
      <div class="sibs">${sibRows}</div>
      <p class="caveat" style="margin-top:12px">${inheritNote}</p>
    </div>` : ''}

    ${contributeHTML(u, d)}
  </div>`;
}

// The ask sits at the end of the entry, phrased by what is already there: an
// empty record asks the reader to write it, a partial one asks for the gaps,
// and only an entry with something in it can be corrected.
function submitHref(u) {
  const q = new URLSearchParams({ domain: domainId, cc: u.cc, unit: u.name, national: u.nat ? '1' : '0' });
  return '/submit?' + q;
}

function contributeHTML(u, d) {
  const gaps = d.fields.length - u.filled.length;
  const documented = u.filled.length > 0;
  return `<div class="contribute">
    <h3>${documented ? 'Add to this entry' : 'Do you know this system?'}</h3>
    <p>${documented
      ? `${gaps === 0 ? 'Every field here has something in it' : `${gaps} of the ${d.fields.length} fields are still blank for ${esc(u.name)}`}. You can add one field without documenting the rest.`
      : `Nothing has been recorded for ${esc(u.name)} yet. If you teach, plan or research provision there, what you know is the record.`}</p>
    <div class="row">
      <a class="cbtn lead" href="${esc(submitHref(u))}">${documented ? 'Add what I know' : 'I know this'}</a>
      ${documented ? `<button class="cbtn" type="button" data-fix="${esc(keyOf(u))}">Suggest a correction</button>` : ''}
    </div>
    <p class="elsewhere">Everything is reviewed before it appears on the map.</p>
  </div>`;
}

/* ---------- chrome ---------- */
function buildDomains() {
  mountNav(domainId, B.domains);
  for (const id of ['addlink', 'addlink2']) {
    const a = document.getElementById(id);
    if (a) a.href = '/submit?domain=' + domainId;
  }
  document.getElementById('blurb').textContent = domain().blurb;
  // A domain may carry a note about its own framing. Only one does: the
  // Indigenous and regional languages map, whose NAME is a compromise between
  // regional terms of art that do not agree with each other. A reader who
  // notices that Senegal's entry says "national languages" under a heading
  // that says Indigenous is owed the reason on the same screen, not in a
  // repository README they will never open.
  // A domain whose own NAME needs explaining used to carry the explanation
  // here, which made this box a paragraph taller on the one map that can least
  // afford it. The explanation lives on the About page in full; this is the
  // door to it.
  const noteEl = document.getElementById('domainnote');
  const note = domain().note;
  noteEl.innerHTML = note
    ? `<a href="/about#terminology">Why this name?</a>`
    : '';
  noteEl.hidden = !note;
  // Each map is its own page, so it gets its own title in history and tabs.
  document.title = domain().label + ' — Language Atlas';
}



/* search */
const search = document.getElementById('search'), results = document.getElementById('results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  results.innerHTML = '';
  if (q.length < 2) return;
  const hits = B.units[domainId]
    .filter(u => u.name.toLowerCase().includes(q) || u.cc.toLowerCase() === q ||
                 (u.subregion || '').toLowerCase().includes(q) || u.region.toLowerCase().includes(q))
    .slice(0, 40);
  for (const u of hits) {
    const b = document.createElement('button');
    b.innerHTML = `${swatch(u, stateOf(u))}<span>${esc(u.name)}</span><span class="sub">${esc(u.subregion || u.region)}</span>`;
    b.onclick = () => { select(keyOf(u), true); results.innerHTML = ''; search.value = ''; };
    results.appendChild(b);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchwrap')) results.innerHTML = '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); results.innerHTML = ''; } });

/* legend swatches */
function paintLegend() {
  // The ramp means "share of fields documented" and means nothing while the map
  // is shaded by a coded value, so it goes away rather than sitting there
  // explaining a picture it is not describing.
  const ramp = document.querySelector('.legendbox .ramp');
  if (ramp) ramp.hidden = !!CODED.key;
  // The three coverage rows go too. Two of them still happen in a coded view
  // and are re-stated inside the value legend where they belong; the third,
  // "Follows its country", is not merely redundant here but WRONG -- this view
  // deliberately does not inherit a coding, so nothing on the map is painted
  // from a parent and a reader told otherwise would misread every sub-national
  // unit on the screen.
  const rows = document.querySelector('.legendbox .rows');
  if (rows) rows.hidden = !!CODED.key;
  // And on the coverage map itself, a row only earns its place if some unit is
  // actually painted that way on THIS domain. The three were static markup, so
  // a map with nothing hatched still explained hatching. Same rule as the
  // coded legend: do not explain a fill that is not on the screen.
  if (rows && !CODED.key) {
    const seen = { looked: 0, none: 0, inherited: 0 };
    for (const u of (B.units[domainId] || [])) {
      const st = stateOf(u);
      if (st in seen) seen[st]++;
    }
    const show = (id, n) => {
      const el = document.getElementById(id);
      if (el && el.parentElement) el.parentElement.hidden = !n;
    };
    show('sw-looked', seen.looked);
    show('sw-none', seen.none);
    show('sw-inh', seen.inherited);
    rows.hidden = !(seen.looked || seen.none || seen.inherited);
  }
  document.getElementById('sw-looked').style.background =
    'repeating-linear-gradient(45deg, var(--hatch-bg) 0 3px, var(--hatch-line) 3px 4px)';
  document.getElementById('sw-none').style.background = 'var(--nodata)';
  const inh = document.getElementById('sw-inh');
  inh.style.background = 'var(--cov-3)';
  inh.style.borderStyle = 'dashed';
  inh.style.borderColor = 'var(--surface)';
  const hues = document.getElementById('hues');
  hues.innerHTML = Array.from({ length: COV_STEPS }, (_, i) =>
    `<span style="background:var(--cov-${i + 1})"></span>`).join('');
}

/* ---------- the shade-by picker and its legend ---------- */
const shadeSel = document.getElementById('shadesel');
const crossBox = document.getElementById('crossby');
const crossOn = document.getElementById('crosson');
const crossSel = document.getElementById('crosssel');
const catLegend = document.getElementById('catlegend');

function buildShadePicker() {
  const cols = shadeableColumns();
  const opts = ['<option value="">what is documented</option>'];
  // Grouped under the field, so the questions about one subject sit together
  // and the select's own headings carry the subject. The option text then drops
  // the field name it used to repeat: inside a Terminology group, "label —
  // Terminology" said Terminology twice.
  let open = null;
  for (const c of cols) {
    if (c.label !== open) {
      if (open !== null) opts.push('</optgroup>');
      opts.push(`<optgroup label="${esc(c.label)}">`);
      open = c.label;
    }
    opts.push(`<option value="${esc(c.key)}">${esc(colLabel(c.field, c.col))}</option>`);
  }
  if (open !== null) opts.push('</optgroup>');
  shadeSel.innerHTML = opts.join('');
  shadeSel.value = CODED.key || '';
}

/* The same list of questions, minus the one already carrying the hue: crossing
   a column with itself paints a ramp that says exactly what the colour said. */
function buildCrossPicker() {
  const cols = crossColumns().filter(c => c.key !== CODED.key);
  const opts = [];
  let open = null;
  for (const c of cols) {
    if (c.label !== open) {
      if (open !== null) opts.push('</optgroup>');
      opts.push(`<optgroup label="${esc(c.label)}">`);
      open = c.label;
    }
    opts.push(`<option value="${esc(c.key)}">${esc(colLabel(c.field, c.col))}</option>`);
  }
  if (open !== null) opts.push('</optgroup>');
  crossSel.innerHTML = opts.join('');
  if (CROSS.key && cols.some(c => c.key === CROSS.key)) crossSel.value = CROSS.key;
}

function setCross(key) {
  CROSS.key = key || null;
  XSCALE = CROSS.key ? crossScale(CROSS.key) : null;
  paint(); paintCatLegend(); sizeMap(); clampView(); applyView();
}

function paintCatLegend() {
  if (!CODED.key) { catLegend.hidden = true; catLegend.innerHTML = ''; return; }
  catLegend.hidden = false;
  const rows = [];
  const sw = bg => `<span class="sw" style="background:${bg}"></span>`;
  if (CROSS.key && XSCALE) {
    // Depth is the second question, and it needs its own key: a reader cannot
    // recover an ordering from four hues at five strengths by looking. The
    // swatch uses the commonest hue so the ramp is read as depth rather than
    // as a sixth colour, and the count says how many units the cross reaches.
    // The first value that actually HAS a hue, not the commonest one: since
    // `not applicable` and `not stated` took the neutral, the commonest value
    // on several columns has no colour to ramp.
    const lead = (SCALE.legend || []).find(([v]) => SCALE.map.has(v));
    const base = lead ? SCALE.map.get(lead[0]) : 'var(--cat-1)';
    const reach = (B.units[domainId] || []).filter(u => crossPct(u) != null).length;
    const striped = (B.units[domainId] || []).filter(u => {
      const f = fillFor(u, null, u);
      return typeof f === 'string' && f.indexOf('url(') === 0 && crossPct(u) != null;
    }).length;
    const [xf, xc] = CROSS.key.split('.');
    rows.push(`<div class="cross-ramp"><span class="rh">Depth: ${esc(colLabel(xf, xc))}</span>`
      // A ranked column's values are often numbers with a word attached --
      // obliges is 0 to 4 and the words are what they mean -- and the ramp
      // prints the word. A bare 0 in a key is a level nobody can read.
      + XSCALE.order.map(v => {
        const def = (((schemeFor(xf) || {}).values || {})[xc] || {})[v];
        const txt = def && def.label ? v + ' · ' + def.label : v;
        return `<span class="rr"><i style="background:${deepen(base, XSCALE.rank.get(v))}"></i>${esc(txt)}</span>`;
      }).join('')
      + `<span class="rh">on ${reach} unit${reach === 1 ? '' : 's'}`
      + (striped ? `; ${striped} striped, left flat` : '') + `</span></div>`);
  }
  if (SCALE.list && CODED.only) {
    rows.push(`<p class="note">This answer can hold more than one value, so there is no single
      colour for a country. Pick a value to see which systems include it.</p>`);
  }
  // The stripe count used to be spelled out here -- how many answers hold two
  // or three values, how many go past three, and that a value can be clicked.
  // A striped country is visibly striped and a legend row is visibly
  // clickable; the sentence was describing the picture the reader is looking
  // at. The counts are still in SCALE for anything that needs them.
  // Every value gets a row up to a point; past it the tail is summarised, or a
  // column with twenty values would fill the pane with a legend nobody reads.
  const LEG_MAX = 9;
  for (const [v, n] of SCALE.legend.slice(0, LEG_MAX)) {
    const hue = SCALE.map.get(v);
    const isOn = CODED.only === v;
    const shown = CODED.only ? (isOn ? 'var(--cat-1)' : 'var(--cat-other)') : (hue || 'var(--cat-other)');
    rows.push(`<button class="cl${CODED.only && !isOn ? ' off' : ''}" data-v="${esc(v)}"
      title="${CODED.only && isOn ? 'Show every value again' : 'Show only this value'}">
      ${sw(shown)}<span>${esc(v)}</span><span class="n">${n}</span></button>`);
  }
  const hidden = Math.max(0, SCALE.ordered.length - LEG_MAX);
  if (hidden) {
    rows.push(`<div class="cl" disabled>${sw('var(--cat-other)')}<span>${hidden} more value${hidden === 1 ? '' : 's'}</span></div>`);
  }
  // Only the states actually on the map get a row. A legend that lists what is
  // not there is the same lie as a legend that omits what is.
  const fk0 = CODED.key.split('.')[0];
  const tally = { has: 0, unset: 0, absent: 0, looked: 0, na: 0, none: 0 };
  for (const u of (B.units[domainId] || [])) {
    if (codedValues(u, CODED.key)) continue;
    if (isAbsent(u, CODED.key)) { tally.absent++; continue; }
    if (isUnset(u, CODED.key)) { tally.unset++; continue; }
    tally[fieldStateOf(u, fk0)]++;
  }
  // First, because on several questions it is the largest group and it is an
  // ANSWER -- the entry establishes that the thing does not exist.
  if (SCALE.over && !CODED.only) rows.push(`<div class="cl" disabled>${sw('url(#manyvals)')}<span>More than three values</span><span class="n">${SCALE.over}</span></div>`);
  if (tally.absent) rows.push(`<div class="cl" disabled>${sw('url(#hatch)')}<span>Recorded as absent</span><span class="n">${tally.absent}</span></div>`);
  if (tally.has) rows.push(`<div class="cl" disabled>${sw('url(#uncoded)')}<span>Recorded, not yet coded</span><span class="n">${tally.has}</span></div>`);
  if (tally.unset) rows.push(`<div class="cl" disabled>${sw('url(#uncoded)')}<span>Coded, no value fitted</span><span class="n">${tally.unset}</span></div>`);
  if (tally.looked) rows.push(`<div class="cl" disabled>${sw('url(#hatch)')}<span>Looked, found nothing</span><span class="n">${tally.looked}</span></div>`);
  if (tally.na) rows.push(`<div class="cl" disabled>${sw('url(#na)')}<span>Not applicable here</span><span class="n">${tally.na}</span></div>`);
  if (tally.none) rows.push(`<div class="cl" disabled>${sw('var(--nodata)')}<span>Nothing recorded</span><span class="n">${tally.none}</span></div>`);
  // The map answers "who does what"; the table answers "what exactly does each
  // one say", which a colour cannot. It is one click from here rather than in
  // the nav, because the question it needs is the one already chosen.
  const [fk] = CODED.key.split('.');
  rows.push(`<a class="readall" href="/views?map=${encodeURIComponent(domainId)}&field=${encodeURIComponent(fk)}"
    >Read every country's answer<span aria-hidden="true"> →</span></a>`);
  catLegend.innerHTML = rows.join('');
  catLegend.querySelectorAll('button.cl').forEach(b => b.addEventListener('click', () => {
    CODED.only = CODED.only === b.dataset.v ? null : b.dataset.v;
    paint(); paintCatLegend();
  }));
  // A swatch cannot carry url(#pattern) as a CSS background, so every texture is
  // redrawn through the one translator the hover card also uses.
  catLegend.querySelectorAll('.cl[disabled] .sw').forEach(el => {
    const css = fillToCSS(el.style.background || '');
    el.style.background = css.bg;
    if (css.size) el.style.backgroundSize = css.size;
  });
}

function setShade(key) {
  CODED.key = key || null;
  CODED.only = null;
  SCALE = CODED.key ? codedScale(CODED.key) : null;
  // WHICH COLUMNS OPEN ISOLATED. The old test was `any unit holds more than
  // two colours`, and it was all-or-nothing: one entry out of hundreds shut the
  // whole map down to a single value. On `models` that was 2 units of 301, on
  // `discharge basis` 1 of 61. The reader met "pick a value" on a column where
  // 299 countries had exactly one answer and could have been drawn outright.
  // Three bands now draw whole, so the question is only how many units go past
  // THREE -- and a column opens isolated when enough of them do to make the
  // striping a lie rather than a corner case.
  const isoShare = SCALE && SCALE.coded ? SCALE.over / SCALE.coded : 0;
  if (SCALE && SCALE.list && isoShare > SHADE_ISOLATE_SHARE && SCALE.ordered.length) {
    CODED.only = SCALE.ordered[0][0];
  }
  // The cross rides on a hue, so it has nowhere to sit on the coverage map,
  // and it cannot be the column now carrying the hue. It also hides itself
  // where the map has no ranked column to deepen by: indigenous, fl and he
  // declare none at all, and an empty picker beside a tickbox is worse than
  // no tickbox.
  crossBox.hidden = !CODED.key || !crossColumns().filter(c => c.key !== CODED.key).length;
  if (!CODED.key || CROSS.key === CODED.key) {
    CROSS.key = null; XSCALE = null; crossOn.checked = false; crossSel.disabled = true;
  }
  buildCrossPicker();
  if (crossOn.checked && !CROSS.key) setCross(crossSel.value);
  paint(); paintCatLegend(); paintLegend();
  // THE KEY JUST CHANGED HEIGHT, so the map's share of the screen is stale.
  // sizeMap() has always measured the key and given the map what was left, but
  // nothing told it when the key itself changed -- it ran on load, on domain
  // switch and on resize, and picking a question is none of those. On a phone
  // that left the map at its full-height size and pushed the key, and the
  // Shade by control with it, off the bottom of the clipped stage.
  sizeMap(); clampView(); applyView();
  // An open panel is answering the old question; re-render it against the new
  // one rather than leaving a stale answer beside a repainted map.
  if (selected) { panelFull = false; select(selected, false); }
}
shadeSel.addEventListener('change', () => setShade(shadeSel.value));
crossOn.addEventListener('change', () => {
  crossSel.disabled = !crossOn.checked;
  setCross(crossOn.checked ? crossSel.value : null);
});
crossSel.addEventListener('change', () => { if (crossOn.checked) setCross(crossSel.value); });

buildShadePicker();

/* ?field=<key> opens the map already drawn by that question, which is what a
   field heading in an entry panel links to. A field usually has several coded
   columns -- newcomer criteria has designation, triggers, decided by and rule
   locus -- so the one with the most countries answering is chosen, because a
   reader arriving from a heading should land on the fullest picture of it and
   can change the question from the picker without going back. */
function openField(fieldKey) {
  const cols = shadeableColumns().filter(c => c.field === fieldKey);
  if (!cols.length) return false;
  const best = cols
    .map(c => ({ c, n: (B.units[domainId] || []).filter(u => codedValues(u, c.key)).length }))
    .sort((a, b) => b.n - a.n)[0];
  setShade(best.c.key);
  shadeSel.value = best.c.key;
  return true;
}
const askedField = new URLSearchParams(location.search).get('field');
if (askedField) openField(askedField);
buildDomainStack(); openDomainBox(domainId, false); buildDomains(); paint(); sizeMap(); applyView(); paintLegend();
loading.classList.add('done');

// There was a banner here for when a tracker could not be reached and the page
// was showing an older copy. Every domain is served from this app's own store
// now, so there is no upstream left to go stale against.
/* ---------- corrections ---------- */
const dlg = document.getElementById('fixdlg');
let fixUnit = null;

function said(text, kind) {
  document.getElementById('fixsaid').innerHTML = text ? `<div class="said ${kind}">${esc(text)}</div>` : '';
}

function openFix(u) {
  fixUnit = u;
  document.getElementById('fixsub').textContent =
    `${u.name} · ${domain().label}. This goes to the maintainer, who will reply to you.`;
  said('', '');
  dlg.classList.add('on');
  document.getElementById('fixwhat').focus();
}

function closeFix() { dlg.classList.remove('on'); }

document.getElementById('fixcancel').onclick = closeFix;
dlg.addEventListener('click', e => { if (e.target === dlg) closeFix(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && dlg.classList.contains('on')) closeFix(); });

document.getElementById('fixsend').onclick = async () => {
  const btn = document.getElementById('fixsend');
  const description = document.getElementById('fixwhat').value.trim();
  const email = document.getElementById('fixmail').value.trim();
  if (!description) return said('Please say what should change.', 'bad');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return said('An email address is needed so you can be answered.', 'bad');
  btn.disabled = true;
  said('', '');
  try {
    const res = await fetch(`/api/${domainId}/edit-requests`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ description, email, entryTitle: `${fixUnit.name} (${fixUnit.cc})` }),
    });
    if (!res.ok) {
      const e = (await res.json().catch(() => ({}))).error;
      throw new Error(e === 'not_accepting_yet'
        ? 'this map is not taking corrections just yet'
        : (e || `Error ${res.status}`));
    }
    said('Sent — thank you. You will get a copy at that address.', 'ok');
    document.getElementById('fixwhat').value = '';
    setTimeout(closeFix, 1600);
  } catch (err) {
    said('That did not send: ' + err.message + '. Nothing was lost — try again shortly.', 'bad');
  } finally {
    btn.disabled = false;
  }
};

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintLegend(); });
addEventListener('resize', () => { sizeMap(); clampView(); applyView(); });
// A phone's address bar collapsing on scroll changes 100dvh without reliably
// firing `resize`, and the legend's own height changes when its text rewraps.
// Watch the boxes themselves so the split is recomputed whenever either moves.
if (window.ResizeObserver) {
  let queued = false;
  const ro = new ResizeObserver(() => {
    if (queued) return;                       // the observer fires again when
    queued = true;                            // sizeMap resizes the map, so
    requestAnimationFrame(() => {             // coalesce to one pass a frame
      queued = false; sizeMap(); clampView(); applyView();
    });
  });
  ro.observe(document.getElementById('stage'));
  ro.observe(document.getElementById('domainstack'));
}

</script>

<script type="module">
import { mountNav } from '/nav.js';

/* Geometry is a static build artifact; the units come from this server's own
   store, assembled into one payload by src/catalog.js. */
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');

async function loadAtlas() {
  const [geo, atlas] = await Promise.all([
    // ?v= is the content hash, stamped in by assemble.js. geometry.json is
    // cached for a day, so without it a rebuild would not reach anyone who had
    // already loaded the map until that day was up.
    fetch('geometry.json?v=96db35ea00').then(r => { if (!r.ok) throw new Error('geometry ' + r.status); return r.json(); }),
    fetch('api/atlas').then(r => { if (!r.ok) throw new Error('data ' + r.status); return r.json(); }),
  ]);

  // Markers stand in for units too small, or too absent, to aim at. Which
  // countries have entries is only known once the live data is in.
  const dots = {};
  const present = new Set();
  for (const list of Object.values(atlas.units)) for (const u of list) present.add(u.cc);
  for (const cc of present) {
    const c = geo.countries[cc];
    if (c && c.area >= geo.areaMin) continue;
    if (geo.anchors[cc]) dots[cc] = geo.anchors[cc];
  }

  return {
    countries: geo.countries, subunits: geo.subunits, territories: geo.territories || [],
    dots, units: atlas.units, domains: atlas.domains, sources: atlas.sources, stats: atlas.stats,
  };
}

let B;
try {
  B = await loadAtlas();
} catch (err) {
  loading.classList.add('failed');
  loadingText.innerHTML = 'Could not load the map data.<br><span style="color:var(--ink-faint)">' +
    String(err.message || err).replace(/[<>&]/g, '') + '</span><br>Reload to try again.';
  throw err;
}

/* ---------- Equal Earth projection ----------
   Šavrič, Patterson & Jenny (2018). This map was Robinson, which is already a
   long way better than Mercator, but Robinson is a COMPROMISE projection: it
   is neither equal-area nor conformal, and it still runs about 1.5x too large
   at 60 degrees relative to the equator.

   That matters here more than it would on most maps. The one thing this map
   is for is comparing how much is recorded from place to place, and its
   coverage is not evenly distributed: on `fl`, uptake and assessment are
   filled for nearly every unit in Europe and Northern America and for almost
   none anywhere else. A projection that inflates the high latitudes gives the
   well-documented half of the world extra pixels, which is exactly the wrong
   thumb on the scale for a map whose subject is its own gaps.

   Equal Earth is equal-area, so a country's share of the ink is its share of
   the land. Geometry is stored as raw lon/lat and projected here, and the
   viewBox is computed from the projected extent, so this is a drop-in: no
   rebuild, nothing downstream re-tuned.

   K is set so the horizontal extent matches what Robinson produced at
   K=1000, because marker radii, the padding and the zoom ceiling are all
   authored in viewBox units against that scale. */
const EE_A1 = 1.340264, EE_A2 = -0.081106, EE_A3 = 0.000893, EE_A4 = 0.003796;
const EE_M = Math.sqrt(3) / 2;
const K = 985;
function project(lon, lat) {
  const phi = Math.max(-90, Math.min(90, lat)) * Math.PI / 180;
  const l = Math.asin(EE_M * Math.sin(phi));
  const l2 = l * l, l6 = l2 * l2 * l2;
  const x = lon * Math.PI / 180 * Math.cos(l) /
            (EE_M * (EE_A1 + 3 * EE_A2 * l2 + l6 * (7 * EE_A3 + 9 * EE_A4 * l2)));
  const y = l * (EE_A1 + EE_A2 * l2 + l6 * (EE_A3 + EE_A4 * l2));
  // Negated because SVG's y axis points down.
  return [x * K, -y * K];
}


/* ---------- state ---------- */
const LIVE = B.domains.filter(d => d.live);
// Each map has its own URL (/eal, /dld) so it can be linked and bookmarked.
const pathId = location.pathname.replace(/^\/|\/$/g, '');
let domainId = LIVE.some(d => d.id === pathId) ? pathId : LIVE[0].id;
let selected = null;         // unit key
let hovered = null;
const view = { k: 1, tx: 0, ty: 0 };
// Coastlines are simplified to ~1km, so past ~12x you are magnifying the
// simplification, not revealing detail.
const MAX_Z = 12;

const domain = () => B.domains.find(d => d.id === domainId);
const keyOf = u => u.cc + ':' + u.name;

/* Index every unit of every live domain once. */
const IDX = {};
for (const d of LIVE) {
  const byKey = new Map(), byCC = new Map();
  for (const u of B.units[d.id]) {
    byKey.set(keyOf(u), u);
    if (!byCC.has(u.cc)) byCC.set(u.cc, []);
    byCC.get(u.cc).push(u);
  }
  // The unit that owns the whole country outline: the national entry, or a
  // lone entry standing in for the country when no national one exists.
  const owner = new Map();
  for (const [cc, list] of byCC) {
    const nat = list.find(u => u.nat);
    if (nat) owner.set(cc, nat);
    else if (list.length === 1 && !B.subunits[keyOf(list[0])]) owner.set(cc, list[0]);
  }
  IDX[d.id] = { byKey, byCC, owner };
}

/* Shading answers one question: HOW MUCH of this unit's record is filled in.
   It used to answer only "is anything here at all", with hue standing for the
   world region — which meant a country with one sourced sentence and a country
   with eleven looked identical, and the map's own biggest weakness was the one
   thing it could not show.

   The ramp is five steps of the share of that domain's fields with content.
   Domains have different field counts (fl 11, dld 13, eal 9), so the share is
   computed per unit against its own domain rather than against a fixed number.

   Bucket 1 starts ABOVE zero on purpose: a unit with nothing documented is not
   the palest step of the ramp, it is --nodata, and a unit that was searched and
   came back empty is the hatch. Three states, still never conflated. */
function stateOf(u) { return u.coverage; }

const COV_STEPS = 5;
/* Share of fields with content, 0..1. nFields is per-domain and never zero,
   but the guard costs nothing and a divide-by-zero here would paint the whole
   map one colour without ever throwing. */
function covRatio(u) {
  const n = u && u.nFields ? u.nFields : 0;
  if (!n) return 0;
  // Own fields PLUS the ones answered by its country. A US state records the
  // four questions that vary by state and inherits the nine that IDEA settles
  // federally; counting only its own reported it as a pale, half-researched
  // place when every question about it has an answer. The panel still shows
  // which are its own and which are inherited, and the chip still counts only
  // its own, so nothing here claims the research was done twice.
  const own = u.filled ? u.filled.length : 0;
  const inherited = u.inh ? u.inh.length : 0;
  return Math.min(1, (own + inherited) / n);
}
/* 1..5. Anything documented is at least 1, so the ramp's low step always means
   "a little" and never "none". */
function covStep(u) {
  const r = covRatio(u);
  if (r <= 0) return 1;
  return Math.min(COV_STEPS, Math.ceil(r * COV_STEPS));
}
const covVar = u => `--cov-${covStep(u)}`;
/* Returns var(--cov-N), NOT a resolved hex. Anything written into an inline
   style must stay a var() reference: these are painted once at load, and a
   frozen hex silently keeps the old theme's colour when the reader switches
   between light and dark — which showed up as a legend contradicting the map
   it explains. */
const hueOf = u => `var(${covVar(u)})`;

function fillFor(u, st) {
  if (!u) return 'var(--nodata)';
  if (st === 'has') return `var(${covVar(u)})`;
  if (st === 'looked') return 'url(#hatch)';
  // An inherited unit is painted from its country's record, which resolve()
  // passes in as `paint`, so this branch is only reached for the unit itself.
  if (st === 'inherited') return 'var(--cov-1)';
  return 'var(--nodata)';
}
const STATE_LABEL = { has: 'Documented', inherited: 'Follows its country', looked: 'Looked, found nothing', none: 'Nothing recorded' };

/* ---------- build the scene once ---------- */
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

let ext = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
function pathFor(polys, box) {
  let d = '';
  for (const poly of polys) for (const ring of poly) {
    for (let i = 0; i < ring.length; i++) {
      const [px, py] = project(ring[i][0], ring[i][1]);
      d += (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
      if (px < ext.x0) ext.x0 = px; if (px > ext.x1) ext.x1 = px;
      if (py < ext.y0) ext.y0 = py; if (py > ext.y1) ext.y1 = py;
      if (box) {
        if (px < box.x0) box.x0 = px; if (px > box.x1) box.x1 = px;
        if (py < box.y0) box.y0 = py; if (py > box.y1) box.y1 = py;
      }
    }
    d += 'Z';
  }
  return d;
}

const defs = el('defs');
const pat = el('pattern', { id: 'hatch', patternUnits: 'userSpaceOnUse', width: 9, height: 9 });
pat.appendChild(el('rect', { width: 9, height: 9, fill: 'var(--hatch-bg)' }));
pat.appendChild(el('path', { d: 'M-2 2 L2 -2 M0 9 L9 0 M7 11 L11 7', stroke: 'var(--hatch-line)', 'stroke-width': 1.6 }));
defs.appendChild(pat);
svg.appendChild(defs);

const scene = el('g');
svg.appendChild(scene);
// gEdge sits above the regions so a split country's own outline is drawn last
// and cannot be covered by the regions inside it.
const gBase = el('g'), gSub = el('g'), gEdge = el('g'), gDot = el('g'), gTop = el('g');
scene.append(gBase, gSub, gEdge, gDot, gTop);
// The highlight is redrawn HERE rather than left on the shape itself.
//
// A shape's stroke is painted before its later siblings' fills, so a country
// only keeps the parts of its outline that no neighbour drawn after it covers.
// Belarus hovered showed white on the south and east, where it happens to come
// after its neighbours, and grey on the north and west, where it does not --
// three quarters of a highlight, and no way to tell from the map that the
// missing quarter was a drawing order rather than a border.
//
// Selection worked around this by moving the selected node to the end of its
// parent, which is a real fix for one shape but permanently reorders the
// document and cannot run on every pointer move. A copy of the outline, on top
// of everything, is the same effect for both states and costs one attribute.
const haloSel = el('path', { class: 'halo sel', d: '' });
const haloHov = el('path', { class: 'halo hov', d: '' });
gTop.append(haloSel, haloHov);

// One record per drawable shape. `key` links it back to a unit per domain.
const SHAPES = [];   // {node, cc, name|null, box}
const BOXES = {};    // key -> projected bbox

for (const [cc, c] of Object.entries(B.countries)) {
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const node = el('path', { d: pathFor(c.polys, box), class: 'unit' });
  node.dataset.cc = cc;
  gBase.appendChild(node);
  SHAPES.push({ node, cc, name: null, box });
  BOXES[cc] = box;
}
for (const [k, s] of Object.entries(B.subunits)) {
  const [cc, ...rest] = k.split(':');
  const name = rest.join(':');
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const node = el('path', { d: pathFor(s.polys, box), class: 'unit' });
  node.dataset.cc = cc; node.dataset.name = name;
  gSub.appendChild(node);
  SHAPES.push({ node, cc, name, box });
  BOXES[k] = box;
}

// One outline per SPLIT country: the visible heavier line, and beneath it a
// wide transparent stroke that is the click target for the country itself.
// Only where the country is actually divided -- an undivided country's own
// shape is already its target, and adding a band there would only steal
// clicks from its interior.
const EDGES = [];   // {hit, line, cc}
for (const [cc, c] of Object.entries(B.countries)) {
  if (!Object.keys(B.subunits).some(k => k.startsWith(cc + ':'))) continue;
  const d = pathFor(c.polys, { x0: 0, y0: 0, x1: 0, y1: 0 });
  // The band is CLIPPED TO ITS OWN COUNTRY, so it reaches inward only.
  // Unclipped, a 7px stroke straddles the line and spills across it, and on a
  // shared border the two countries' bands sit on top of each other -- so
  // whichever happened to be drawn later took the whole border. On the
  // United States/Canada line that meant Canada could not be selected at all.
  // Clipped, three pixels inside Canada is Canada and three inside the US is
  // the US, which is also what a reader would expect of a border.
  const clipId = 'edgeclip-' + cc;
  const clip = el('clipPath', { id: clipId });
  clip.appendChild(el('path', { d }));
  defs.appendChild(clip);
  const hit = el('path', { d, class: 'edgehit', 'clip-path': 'url(#' + clipId + ')' });
  const line = el('path', { d, class: 'edge' });
  hit.dataset.cc = cc;
  gEdge.append(hit, line);
  EDGES.push({ hit, line, cc });
}

const TERR = [];
for (let i = 0; i < (B.territories || []).length; i++) {
  const t = B.territories[i];
  const box = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const node = el('path', { d: pathFor(t.polys, box), class: 'unit' });
  node.dataset.terr = String(i);
  gSub.appendChild(node);
  TERR.push({ node, t, box });
  BOXES['terr:' + i] = box;
}

/* A marker stands in for any unit too small to aim at. It holds a constant
   size on screen, so it fades out of the way as soon as zooming makes the
   real shape big enough to click. Units with no usable polygon at all keep
   their marker at every zoom. */
const DOTS = [];
function addMark(key, cx, cy, size, always) {
  const node = el('circle', { cx: cx.toFixed(1), cy: cy.toFixed(1), r: 4, class: 'dot' });
  gDot.appendChild(node);
  DOTS.push({ node, key, size, always });
  if (cx < ext.x0) ext.x0 = cx; if (cx > ext.x1) ext.x1 = cx;
  if (cy < ext.y0) ext.y0 = cy; if (cy > ext.y1) ext.y1 = cy;
  return node;
}
// Countries the geometry does not carry at all: anchored on their centroid.
for (const [cc, ll] of Object.entries(B.dots)) {
  if (B.countries[cc]) continue;
  const [px, py] = project(ll[0], ll[1]);
  addMark(cc, px, py, 0, true).dataset.cc = cc;
  BOXES[cc] = { x0: px, y0: py, x1: px, y1: py };
}
// Everything that does have a shape: a marker that only shows while small.
const CENTROID = {};
for (const [cc, ll] of Object.entries(B.dots)) CENTROID[cc] = project(ll[0], ll[1]);
for (const s of SHAPES.concat(TERR.map(t => ({ node: t.node, cc: t.t.cc, name: null, box: t.box, terr: t })))) {
  const b = s.box;
  if (!isFinite(b.x0)) continue;
  const size = Math.max(b.x1 - b.x0, b.y1 - b.y0);
  const c = (!s.name && !s.terr && CENTROID[s.cc]) ? CENTROID[s.cc] : [(b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2];
  const node = addMark(null, c[0], c[1], size, false);
  node.dataset.cc = s.cc;
  if (s.name) node.dataset.name = s.name;
  if (s.terr) node.dataset.terr = s.node.dataset.terr;
}

const PAD = 30;
const VB = { x: ext.x0 - PAD, y: ext.y0 - PAD, w: (ext.x1 - ext.x0) + PAD * 2, h: (ext.y1 - ext.y0) + PAD * 2 };
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

/* ---------- paint ---------- */
function unitFor(cc, name) {
  const ix = IDX[domainId];
  if (name) return ix.byKey.get(cc + ':' + name) || null;
  return ix.owner.get(cc) || null;
}
const parentOf = u => (!u || u.nat) ? null : (IDX[domainId].owner.get(u.cc) || null);

/* A sub-unit exists because it differs from its country in SOME domain — the
   US states are split out because their second-language policy differs. In a domain
   it has nothing of its own it does not become a hole in the country: it
   follows the national entry, which is what inheritance means. */
function resolve(cc, name) {
  const own = unitFor(cc, name);
  const nat = name ? (IDX[domainId].owner.get(cc) || null) : null;
  if (!name) return { unit: own, paint: own, inherited: false, via: null };
  if (!own) {
    // no entry at all in this domain — the shape stands in for the country
    return nat ? { unit: nat, paint: nat, inherited: true, via: name }
               : { unit: null, paint: null, inherited: false, via: null };
  }
  // Only where derive.js has marked this unit `inherited`, which it does from
  // the domain's own `nationalFor` list. Painting any empty sub-unit with its
  // country's colour was the old behaviour and it overstated: China's
  // provinces took the national colour on every map while being counted as
  // undocumented, so the picture and the tally underneath it disagreed.
  if (own.coverage === 'inherited' && nat && nat.coverage === 'has') {
    return { unit: own, paint: nat, inherited: true, via: null };
  }
  return { unit: own, paint: own, inherited: false, via: null };
}

function paint() {
  const ix = IDX[domainId];
  for (const s of SHAPES) {
    const r = resolve(s.cc, s.name);
    // A country whose whole area is carved into sub-units (the UK) has no
    // entry of its own: draw it as an inert base beneath them.
    const carved = !s.name && !r.unit && (ix.byCC.get(s.cc) || []).some(x => B.subunits[keyOf(x)]);
    s.node.setAttribute('fill', carved ? 'var(--nodata)'
      : fillFor(r.paint, r.paint ? stateOf(r.paint) : 'none'));
    s.node.setAttribute('class', 'unit'
      + (s.name ? ' sub' : '')
      + (carved ? ' base' : r.unit ? ' hit' : '')
      + (r.inherited ? ' inherited' : ''));
    s.node.dataset.key = r.unit ? keyOf(r.unit) : '';
    if (r.via) s.node.dataset.via = r.via; else delete s.node.dataset.via;
  }
  // The edge band selects the COUNTRY, so it is only live where the country
  // has an entry of its own. The United Kingdom is four nations and no
  // national row: its outline is still drawn, but there is nothing to select.
  for (const { hit, cc } of EDGES) {
    const u = unitFor(cc, null);
    hit.dataset.key = u ? keyOf(u) : '';
    hit.setAttribute('class', 'edgehit' + (u ? ' hit' : ''));
    hit.style.pointerEvents = u ? 'stroke' : 'none';
  }
  for (const { node, t } of TERR) {
    const u = unitFor(t.cc, null);
    node.dataset.via = t.name;
    node.setAttribute('fill', fillFor(u, u ? stateOf(u) : 'none'));
    node.setAttribute('class', 'unit' + (u ? ' hit' : ''));
    node.dataset.key = u ? keyOf(u) : '';
  }
  for (const d of DOTS) {
    const n = d.node;
    const r = resolve(n.dataset.cc, n.dataset.name || null);
    const u = r.unit || (n.dataset.name ? null : (IDX[domainId].byCC.get(n.dataset.cc) || [])[0]) || null;
    const pnt = r.paint || u;
    n.setAttribute('fill', fillFor(pnt, pnt ? stateOf(pnt) : 'none'));
    n.setAttribute('class', 'dot' + (r.inherited ? ' inherited' : ''));
    n.dataset.key = u ? keyOf(u) : '';
    if (r.via) n.dataset.via = r.via; else delete n.dataset.via;
    d.hasUnit = !!u;
  }
  updateMarks();
  markSelection();
}

function markSelection() {
  // Territories are drawn into gSub alongside the regions, so they are
  // overdrawn by exactly the same rule and need the same treatment.
  const ALL = SHAPES.concat(TERR.map(x => ({ node: x.node })));
  for (const s of SHAPES) {
    if (s.node.classList.contains('base')) continue;
    s.node.classList.toggle('sel', !!selected && s.node.dataset.key === selected);
    s.node.classList.toggle('hov', !!hovered && s.node.dataset.key === hovered && hovered !== selected);
  }
  for (const d of DOTS.concat(TERR.map(x => ({ node: x.node })))) {
    d.node.classList.toggle('sel', !!selected && d.node.dataset.key === selected);
    d.node.classList.toggle('hov', !!hovered && d.node.dataset.key === hovered && hovered !== selected);
  }
  // A selected COUNTRY that is split cannot show its own outline: its shape
  // lives under its regions, and raising it inside gBase does not lift it past
  // them. The edge line is the part of it that is visible, so the highlight
  // goes there.
  for (const { hit, line } of EDGES) {
    const k = hit.dataset.key;
    line.classList.toggle('sel', !!k && k === selected);
    line.classList.toggle('hov', !!k && k === hovered && hovered !== selected);
  }
  // The outline of whatever is highlighted, redrawn on top. `inherited` comes
  // with it so a dashed border stays dashed when you point at it -- otherwise
  // hovering an inherited unit changes what KIND of line it has, not just its
  // colour.
  const paint = (halo, key, state) => {
    const s = key && ALL.find(x => x.node.dataset.key === key);
    halo.setAttribute('d', s ? s.node.getAttribute('d') : '');
    halo.setAttribute('class', 'halo ' + state +
      (s && s.node.classList.contains('inherited') ? ' inherited' : ''));
  };
  paint(haloSel, selected, 'sel');
  paint(haloHov, hovered && hovered !== selected ? hovered : null, 'hov');
}


/* ---------- pan & zoom ----------
   Same canvas mechanics as the syntax-tree viewer: one finger or the mouse
   pans, two fingers pinch, ctrl/⌘-wheel zooms, plain wheel scrolls the view. */
// A fingertip needs a bigger target than a cursor, so both the marker and the
// size below which a shape gets one grow on a touch screen.
const COARSE = matchMedia('(pointer: coarse)').matches;
const MARK_MIN_PX = COARSE ? 20 : 13;
const MARK_R_PX = COARSE ? 7 : 4.5;
function updateMarks() {
  // r is authored in viewBox units, so convert from the screen size we want.
  const s = baseScale() * view.k;
  if (!s) return;
  const r = (MARK_R_PX / s).toFixed(2);
  for (const d of DOTS) {
    d.node.setAttribute('r', r);
    d.node.style.display = (d.hasUnit && (d.always || d.size * s < MARK_MIN_PX)) ? '' : 'none';
  }
}
// On a portrait screen the stage is far taller than the map's proportions, so
// stretching the map into it just adds empty ground above and below. Allow a
// little letterboxing, not a screenful.
// The map is 2.33x as wide as it is tall; a portrait phone is about 1:2. So the
// drawing is always WIDTH-bound here and extra height cannot enlarge it — the
// only questions are how much ground it floats in and where the legend lands.
// Give the legend the height it actually needs, pin it to the bottom, and let
// the map take what is left up to a modest multiple of its own proportions.
/* ---------- the four boxes ---------- */
// Built once. Only the open/closed classes and where #dcontent lives change
// afterwards, so the headers keep their identity across a switch and the
// browser animates rather than re-rendering four elements.
function buildDomainStack() {
  const stack = document.getElementById('domainstack');
  stack.innerHTML = LIVE.map(d => `
    <section class="dbox" data-id="${esc(d.id)}">
      <button class="dhead" type="button" aria-expanded="false" aria-controls="dcontent">
        <span class="dot"></span><span>${esc(d.label)}</span>
      </button>
      <div class="dbody"><div class="dinner"></div></div>
    </section>`).join('');
  stack.querySelectorAll('.dhead').forEach(h => {
    h.onclick = () => switchDomain(h.closest('.dbox').dataset.id);
  });
}

// Move the single body into whichever box is open. The one leaving collapses
// as its grid row returns to 0fr; the one arriving expands to 1fr.
//
// The rAF is load-bearing, not politeness. Moving the content in and adding
// `open` in the same frame gives the transition no settled start: the row is
// measured against a box that is still empty, so it interpolates 0 to 0 and
// the panel silently stays shut. Laying the content out at 0fr first, then
// flipping the class on the next frame, gives it a real height to travel to.
function openDomainBox(id, animate = true) {
  const content = document.getElementById('dcontent');
  const target = document.querySelector('.dbox[data-id="' + id + '"]');
  if (!target) return;
  content.hidden = false;

  for (const box of document.querySelectorAll('.dbox')) {
    if (box === target) continue;
    box.classList.remove('open');
    box.querySelector('.dhead').setAttribute('aria-expanded', 'false');
  }

  const inner = target.querySelector('.dinner');
  if (content.parentElement !== inner) inner.appendChild(content);
  const head = target.querySelector('.dhead');
  head.setAttribute('aria-expanded', 'true');

  if (!animate || target.classList.contains('open')) { target.classList.add('open'); return; }
  void target.querySelector('.dbody').offsetHeight;   // settle at 0fr, with content
  // rAF does not fire in a tab that is not compositing, and a panel that never
  // opened is not a missing animation, it is a map with no legend and no way
  // back to one. The timer guarantees the state; the frame callback is only
  // there to make it move when the tab can see it. Adding the class twice
  // costs nothing.
  const open = () => target.classList.add('open');
  requestAnimationFrame(open);
  setTimeout(open, 60);
}

/* Switching is done here rather than by following a link, because every
   domain's units are already in this page's payload. A link would reload the
   whole map to show data the browser is holding, and the box would jump open
   instead of moving. The URL still changes, so /dld stays linkable and the
   back button still works. */
function switchDomain(id, push = true) {
  if (id === domainId || !LIVE.some(d => d.id === id)) return;
  domainId = id;
  closePanel();
  openDomainBox(id);
  buildDomains();
  paint();
  paintLegend();
  sizeMap();
  clampView();
  applyView();
  if (push) history.pushState({ domain: id }, '', '/' + id);
}

addEventListener('popstate', () => {
  const id = location.pathname.replace(/^\/|\/$/g, '');
  if (LIVE.some(d => d.id === id)) switchDomain(id, false);
});

function sizeMap() {
  if (!matchMedia('(max-width: 820px)').matches) { svg.style.height = ''; return; }
  const stage = document.getElementById('stage');
  const controls = document.getElementById('domainstack');
  const key = document.querySelector('.legendbox');
  // Collapse the map first so the panel reports its unconstrained height rather
  // than whatever the previous pass squeezed it to.
  svg.style.height = '0px';
  // scrollHeight excludes the element's own border, and on this layout both
  // boxes have a 1px top rule against the map. Two pixels is enough to clip
  // the ramp's bottom labels, so the borders are measured rather than ignored.
  const border = el => (el ? parseFloat(getComputedStyle(el).borderTopWidth) || 0 : 0);
  const need = controls.scrollHeight + border(controls)
             + (key ? key.getBoundingClientRect().height : 0);
  const natural = stage.clientWidth * (VB.h / VB.w);
  // Take everything the legend does not need. There is no cap: capping the box
  // cannot shrink the drawing (width-bound) and only decides whether the slack
  // shows as ocean around the map or as a void somewhere else. Centred in the
  // full field, the ocean sits symmetrically above and below the continents.
  // `natural` is still measured because a landscape phone can be shorter than
  // the map is tall, and there the box must not exceed what the drawing needs.
  const room = Math.max(140, stage.clientHeight - need);
  svg.style.height = Math.round(room < natural ? room : Math.max(room, natural)) + 'px';
}

function applyView() {
  scene.setAttribute('transform', `translate(${view.tx} ${view.ty}) scale(${view.k})`);
  pat.setAttribute('patternTransform', `scale(${1 / view.k})`);
  updateMarks();
}
function baseScale() {
  const r = svg.getBoundingClientRect();
  return Math.min(r.width / VB.w, r.height / VB.h);
}
function screenToContent(sx, sy) {
  const r = svg.getBoundingClientRect(), s = baseScale();
  const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
  const vx = (sx - ox) / s + VB.x, vy = (sy - oy) / s + VB.y;
  return [(vx - view.tx) / view.k, (vy - view.ty) / view.k];
}
function zoomAt(sx, sy, factor) {
  const [cx, cy] = screenToContent(sx, sy);
  const k = Math.max(1, Math.min(MAX_Z, view.k * factor));
  if (k === view.k) return;
  const r = svg.getBoundingClientRect(), s = baseScale();
  const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
  const vx = (sx - ox) / s + VB.x, vy = (sy - oy) / s + VB.y;
  view.k = k; view.tx = vx - k * cx; view.ty = vy - k * cy;
  clampView(); applyView();
}
function clampView() {
  // Keep at least a third of the viewport covered by the map in each axis.
  const spanX = VB.w * view.k, spanY = VB.h * view.k;
  const minTx = VB.x + VB.w - spanX - VB.x * view.k - VB.w * 0.66;
  view.tx = Math.min(VB.x + VB.w * 0.66 - VB.x * view.k, Math.max(minTx, view.tx));
  const minTy = VB.y + VB.h - spanY - VB.y * view.k - VB.h * 0.66;
  view.ty = Math.min(VB.y + VB.h * 0.66 - VB.y * view.k, Math.max(minTy, view.ty));
}
function resetView() { view.k = 1; view.tx = 0; view.ty = 0; applyView(); }

function zoomToBox(box, margin = 5) {
  // Margin keeps the neighbours in frame: a unit shown with no surroundings
  // is much harder to place than one shown in its region.
  const w = Math.max(box.x1 - box.x0, 6) * margin, h = Math.max(box.y1 - box.y0, 6) * margin;
  const k = Math.max(1, Math.min(MAX_Z, Math.min(VB.w / w, VB.h / h)));
  const cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
  view.k = k;
  view.tx = VB.x + VB.w / 2 - k * cx;
  view.ty = VB.y + VB.h / 2 - k * cy;
  clampView(); applyView();
}

const ptrs = new Map();
let anchor = null, moved = false;
svg.addEventListener('pointerdown', ev => {
  ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  moved = false;
  if (ptrs.size === 1) {
    anchor = { mode: 'pan', x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty };
    svg.classList.add('dragging');
  } else if (ptrs.size === 2) {
    try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
    const [a, b] = [...ptrs.values()];
    anchor = { mode: 'pinch', dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: view.k,
               mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    anchor.c = screenToContent(anchor.mx, anchor.my);
  }
});
svg.addEventListener('pointermove', ev => {
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (anchor && anchor.mode === 'pan' && ptrs.size === 1) {
    const s = baseScale();
    const dx = ev.clientX - anchor.x, dy = ev.clientY - anchor.y;
    if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
      moved = true;
      // Capture only now: taking it on pointerdown would retarget the click.
      try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
    }
    view.tx = anchor.tx + dx / s; view.ty = anchor.ty + dy / s;
    clampView(); applyView();
    hideTip();
    return;
  }
  if (anchor && anchor.mode === 'pinch' && ptrs.size === 2) {
    moved = true;
    const [a, b] = [...ptrs.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const k = Math.max(1, Math.min(MAX_Z, anchor.k * (dist / anchor.dist)));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = svg.getBoundingClientRect(), s = baseScale();
    const ox = r.left + (r.width - VB.w * s) / 2, oy = r.top + (r.height - VB.h * s) / 2;
    view.k = k;
    view.tx = ((mx - ox) / s + VB.x) - k * anchor.c[0];
    view.ty = ((my - oy) / s + VB.y) - k * anchor.c[1];
    clampView(); applyView();
    return;
  }
  hoverAt(ev);
});
function endPtr(ev) {
  ptrs.delete(ev.pointerId);
  if (ptrs.size === 0) { anchor = null; svg.classList.remove('dragging'); }
  else if (ptrs.size === 1) {
    const p = [...ptrs.values()][0];
    anchor = { mode: 'pan', x: p.x, y: p.y, tx: view.tx, ty: view.ty };
  }
}
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('pointerleave', () => { hovered = null; markSelection(); hideTip(); });

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * 0.0025));
  } else {
    const s = baseScale();
    view.tx -= ev.deltaX / s; view.ty -= ev.deltaY / s;
    clampView(); applyView();
  }
}, { passive: false });

document.getElementById('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5); };
document.getElementById('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5); };
document.getElementById('zreset').onclick = resetView;

/* ---------- hover & select ---------- */
const tip = document.getElementById('tip');
function hideTip() { tip.classList.remove('on'); }

// Hit-test the point rather than trusting ev.target: pointer capture and
// the tooltip both sit between the cursor and the shape underneath it.
function shapeAt(ev) {
  const prev = tip.style.pointerEvents;
  tip.style.pointerEvents = 'none';
  const t = document.elementFromPoint(ev.clientX, ev.clientY);
  tip.style.pointerEvents = prev;
  if (!(t instanceof SVGElement)) return null;
  if (!t.classList.contains('hit') && !t.classList.contains('dot')) return null;
  return t;
}
function targetKey(ev) {
  const t = shapeAt(ev);
  return t ? (t.dataset.key || null) : null;
}
function hoverAt(ev) {
  const node = shapeAt(ev);
  const key = node ? (node.dataset.key || null) : null;
  if (key !== hovered) { hovered = key; markSelection(); }
  if (!key) return hideTip();
  const u = IDX[domainId].byKey.get(key);
  if (!u) return hideTip();
  const terr = node.dataset.terr ? B.territories[+node.dataset.terr] : null;
  tip.innerHTML = tipHTML(u, terr, node.dataset.via || null,
    node.classList.contains('inherited'));
  tip.classList.add('on');
  const r = document.getElementById('stage').getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 16;
  if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 16;
  if (y + th > r.height - 8) y = ev.clientY - r.top - th - 16;
  tip.style.left = Math.max(8, x) + 'px';
  tip.style.top = Math.max(8, y) + 'px';
}
svg.addEventListener('click', ev => {
  if (moved) return;
  const node = shapeAt(ev);
  if (!node || !node.dataset.key) { closePanel(); return; }
  const terr = node.dataset.terr ? B.territories[+node.dataset.terr] : null;
  const via = terr ? { name: terr.name, note: terr.note }
    : node.dataset.via ? { name: node.dataset.via, note: null } : null;
  select(node.dataset.key, false, via);
});

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const escAttr = esc;   // esc already escapes the double quote

/* ------------------------------------------------------------------
   In-text citation linking, lifted verbatim from the DLD catalogue's
   catalog.html so the two stay in step. Resolves a citation first
   against the entry's own docLinks labels, then against the DOI
   registry; anything that resolves to neither stays plain text.
   ------------------------------------------------------------------ */
const REFERENCES = {
  "armon-lotem|2016": "https://doi.org/10.1111/1460-6984.12242",
  "almeida|2017": "https://doi.org/10.1075/lab.15019.alm",
  "fleckstein|2018": "https://doi.org/10.1080/10489223.2016.1192635",
  "tuller|2018": "https://doi.org/10.1111/1460-6984.12397",
  "hamann|2017": "https://doi.org/10.3389/fcomm.2017.00016",
  "chondrogianni|2018": "https://doi.org/10.1111/1460-6984.12363",
  "antonijevic|2017": "https://doi.org/10.1075/lab.15026.ant",
  "antonijevic-elliott|2019": "https://doi.org/10.1080/02699206.2019.1637458",
  "gavarró|2017": "https://doi.org/10.3389/fpsyg.2017.01865",
  // The COST IS1406 volume cited in every vignette stub note.
  "law|2019": "https://doi.org/10.4324/9780429455308",
};

// An author-ish run immediately before a year, in either narrative
// "Author (2016)" or parenthetical "(Author et al., 2016)" form. The run is
// deliberately permissive and capped in length; correctness comes from
// resolution, not from parsing — a run that resolves to nothing stays plain.
// String.raw, not plain quotes: these are regex fragments, and inside an
// ordinary string literal "\w" collapses to "w" before RegExp ever sees it.
const NAME = String.raw`[A-ZÀ-Þ][\w'’À-ɏ-]+`;
const AUTHORISH = "(?:" + NAME + String.raw`|[A-ZÀ-Þ]\.|&amp;|and|et|al\.|de|van|von|den|der|ter|di|da|la|le)`;
const RUN = AUTHORISH + String.raw`(?:[,\s]+` + AUTHORISH + "){0,5}";
const YEARS = String.raw`((?:19|20)\d{2})[a-z]?(?:,\s*(?:19|20)\d{2}[a-z]?)*`;
const NARRATIVE_RE = new RegExp(RUN + String.raw`[,\s]*\(` + YEARS + String.raw`\)`, "g");
const PARENTHETICAL_RE = new RegExp(String.raw`\(` + RUN + String.raw`,?\s*` + YEARS + String.raw`\)`, "g");

function citationKey(surname, year) {
  return surname.toLowerCase().replace(/['\u2019]/g, "") + "|" + year;
}

// A source link on this same entry resolves a citation when its label names
// both the surname and the year — which is how the seed labels are written
// ("Norbury et al. (2016), SCALES prevalence study").
function resolveFromDocLinks(entry, surname, year) {
  // Same normalisation as citationKey — otherwise a surname with an apostrophe
  // matches the registry but never its own source link.
  const lower = surname.toLowerCase().replace(/['’]/g, "");
  const hit = (entry.docLinks || []).find(d => {
    const l = (d.label || "").toLowerCase();
    return l.includes(lower) && l.includes(year);
  });
  return hit ? hit.url : null;
}

// Try every capitalised token against every year in the match. This is what
// makes "See Chondrogianni & John (2018)" work — "See" simply resolves to
// nothing and the next candidate is tried.
function resolveCitation(matchText, entry) {
  const names = matchText.match(new RegExp(NAME, "g")) || [];
  const years = matchText.match(/(?:19|20)\d{2}/g) || [];
  for (const n of names) {
    // All-caps tokens are acronyms, not surnames ("TOS' (2016)" is a document
    // title, and its own source pill sits at the foot of the card).
    if (n.length > 1 && n === n.toUpperCase()) continue;
    for (const y of years) {
      const url = REFERENCES[citationKey(n, y)] || resolveFromDocLinks(entry, n, y);
      if (url) return { url, name: n };
    }
  }
  return null;
}

// Runs over already-escaped HTML, and only ever wraps a plain run in an <a>.
const KEEP_IN_LINK = /^[(\s]*(?:(?:de|van|von|den|der|ter|di|da|la|le)\s+)?$/i;

function linkCitations(escapedText, entry) {
  const wrap = (match) => {
    const hit = resolveCitation(match, entry);
    if (!hit) return match;
    // The run can absorb a leading ordinary word ("See Chondrogianni…",
    // "and Tuller…"). Start the link at the surname that actually resolved so
    // the anchor text is the citation and nothing else.
    const at = match.indexOf(hit.name);
    let lead = at > 0 ? match.slice(0, at) : "";
    let cite = at > 0 ? match.slice(at) : match;
    // An opening bracket or a lowercase name particle belongs to the citation,
    // not to the sentence — otherwise "(Bishop…2017)" links with an unbalanced
    // paren and "de Almeida" loses its "de".
    if (lead && KEEP_IN_LINK.test(lead)) { cite = lead + cite; lead = ""; }
    return `${lead}<a class="cite" href="${escAttr(hit.url)}" target="_blank" rel="noopener">${cite}</a>`;
  };
  return escapedText.replace(NARRATIVE_RE, wrap).replace(PARENTHETICAL_RE, wrap);
}
const swatch = (u, st) => {
  if (st === 'has') return `<span class="sw" style="background:var(${covVar(u)})"></span>`;
  if (st === 'looked') return `<span class="sw" style="background:repeating-linear-gradient(45deg,var(--hatch-bg) 0 3px,var(--hatch-line) 3px 4px)"></span>`;
  return `<span class="sw" style="background:var(--nodata)"></span>`;
};

function fieldMarks(u, d) {
  return d.fields.map((f, i) => {
    const c = u.fieldStates[i];
    const cls = c === 'h' ? 'on' : c === 'l' ? 'looked' : c === 'x' ? 'na' : '';
    return `<span class="${cls}">${esc(f.label)}</span>`;
  }).join('');
}

function tipHTML(u, terr, via, inheriting) {
  const d = domain();
  const sibs = (IDX[domainId].byCC.get(u.cc) || []).filter(x => x !== u);
  const countryName = (B.countries[u.cc] || {}).name || u.cc;

  // When the shape follows its country, every number and marker has to come
  // from the country's entry — that is the record actually on offer here.
  const nat = IDX[domainId].owner.get(u.cc) || null;
  const src = (inheriting && !via && nat) ? nat : u;
  const st = stateOf(src);
  const nDoc = src.filled.length;

  let inherit = '';
  if (terr) {
    inherit = `${esc(terr.note)}`;
  } else if (via) {
    inherit = `No separate ${esc(d.label)} entry for ${esc(via)}. What applies is the <b>${esc(u.name)}</b> record shown here.`;
  } else if (inheriting) {
    inherit = `Nothing recorded for ${esc(u.name)} itself in this domain, so it follows <b>${esc(nat ? nat.name : countryName)}</b>. It is a separate unit because it differs in another domain.`;
  } else if (u.nat && sibs.length) {
    inherit = `${sibs.length} sub-national entr${sibs.length === 1 ? 'y' : 'ies'} also exist for ${esc(u.name)}. Each one falls back to this record where it has nothing of its own.`;
  } else if (sibs.length) {
    inherit = nat
      ? `Sits inside <b>${esc(nat.name)}</b>. Anything not recorded here follows the national entry.`
      : `${sibs.length + 1} separate entries for ${esc(countryName)} — nothing is recorded at national level, so none of them inherit.`;
  }

  const label = terr ? terr.name : (via || u.name);
  const meta = (terr || via) ? esc(u.name) + ' · shows that entry'
    : esc(u.subregion || u.region) + (u.nat ? ' · national' : ' · sub-national');
  return `
    <div class="name">${esc(label)}</div>
    <div class="meta">${meta}</div>
    <div class="state">${swatch(src, st)} ${nDoc} of ${d.fields.length} fields documented${src !== u ? ' by ' + esc(src.name) : ''}</div>
    <div class="fieldgrid" style="--mark:${hueOf(src)}">${fieldMarks(src, d)}</div>
    ${inherit ? `<div class="inherit">${inherit}</div>` : ''}
    <div class="hintline">Click for the full entry</div>`;
}

/* ---------- detail panel ---------- */
const panel = document.getElementById('panel');
function closePanel() { selected = null; panel.classList.remove('on'); markSelection(); }

function select(key, zoom, via) {
  const u = IDX[domainId].byKey.get(key);
  if (!u) return;
  selected = key;
  markSelection();
  panel.innerHTML = panelHTML(u, via);
  panel.classList.add('on');
  panel.scrollTop = 0;
  panel.querySelector('.close').onclick = closePanel;
  panel.querySelectorAll('.sibs button[data-key], .tocountry[data-key]').forEach(b => {
    b.onclick = () => select(b.dataset.key, true);
  });
  const toSub = panel.querySelector('.tosub');
  if (toSub) toSub.onchange = () => { if (toSub.value) select(toSub.value, true); };
  const fix = panel.querySelector('[data-fix]');
  if (fix) fix.onclick = () => openFix(u);
  if (zoom) {
    const box = BOXES[key] || BOXES[u.cc];
    if (box) zoomToBox(box);
  }
}

// Each dated row links to the policy it names, where the entry's own sources
// hold it. Rows whose document could not be identified stay as plain text.
function historyHTML(rows, entry) {
  return `<ol class="hist">` + (rows || []).map(h => `<li>
      <span class="yr">${esc(h.year)}</span>
      <div>
        ${linkCitations(esc(h.description), entry) ? `<p>${linkCitations(esc(h.description), entry)}</p>` : ''}
        ${h.links.length ? `<div class="links">${linkList(h.links)}</div>` : ''}
      </div>
    </li>`).join('') + `</ol>`;
}

// A named language, with its classification and a link to its WALS record.
// The link exists ONLY where a WALS code was resolved from WALS's own data:
// wals.info uses codes of its own that are not ISO 639-3, and they collide
// (Maori is `mao` in WALS while `mri`, its ISO code, is Moraori in WALS). A row
// with no code is shown without a link rather than with a plausible wrong one.
function languagesHTML(rows) {
  return `<ul class="langs">` + (rows || []).map(l => {
    const cls = [l.family, l.genus].filter(Boolean).join(' › ');
    const ids = [l.iso ? `ISO ${l.iso}` : '', l.wals ? `WALS ${l.wals}` : ''].filter(Boolean).join(', ');
    const name = l.wals
      ? `<a href="https://wals.info/languoid/lect/wals_code_${encodeURIComponent(l.wals)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a>`
      : esc(l.name);
    return `<li>
      <span class="lname">${name}</span>
      ${cls ? `<span class="lcls">${esc(cls)}</span>` : ''}
      ${l.typology ? `<span class="ltyp">${esc(l.typology)}</span>` : ''}
      ${ids ? `<span class="lids">${esc(ids)}</span>` : ''}
    </li>`;
  }).join('') + `</ul>`;
}

// Offering and programme rows: "which institutions, and take me to one".
//
// Both shapes carry a `url` to the programme page and NEITHER was rendering
// it. The rows reached the panel through asText(), which flattens a row to a
// dash-joined line and drops `url` on the floor — so every one of those links
// was collected, gated, stored, and then shown to nobody.
//
// The head of each row is what the row is ABOUT: the language for an offering,
// the subject for a programme. The institution is the link, because that is
// the thing a reader wants to reach. A row with no institution but a count is
// a legitimate row -- a source that says "twelve universities" without naming
// them -- and renders as the count.
function rowsHTML(rows, headKey) {
  return `<ul class="offs">` + (rows || []).map(r => {
    const head = esc(r[headKey] || '');
    const inst = r.institution
      ? (r.url
          ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.institution)}</a>`
          : esc(r.institution))
      : (r.institutions ? `${esc(r.institutions)} institutions` : '');
    const meta = [r.level, r.orientation, r.year].filter(Boolean).map(esc).join(' · ');
    return `<li>
      ${head ? `<span class="oname">${head}</span>` : ''}
      ${inst ? `<span class="oinst">${inst}</span>` : ''}
      ${meta ? `<span class="ometa">${meta}</span>` : ''}
      ${r.note ? `<span class="onote">${esc(r.note)}</span>` : ''}
    </li>`;
  }).join('') + `</ul>`;
}

function linkList(links) {
  return links.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}</a>`
  ).join('');
}

function panelHTML(u, via) {
  const d = domain();
  const st = stateOf(u);
  const hue = hueOf(u);
  const countryName = (B.countries[u.cc] || {}).name || u.cc;
  const sibs = (IDX[domainId].byCC.get(u.cc) || []).filter(x => x !== u);
  const nat = sibs.find(x => x.nat);

  // Every field, in order. A field this unit has nothing of its own for falls
  // back to its country's text, marked as inherited rather than presented as
  // the unit's own work.
  const par = parentOf(u);
  let nInherited = 0;
  const block = (cls, label, body, from) =>
    `<div class="field ${cls}"><h4>${esc(label)}${from ? `<span class="from">inherited from ${esc(from)}</span>` : ''}</h4>${body}</div>`;
  // A field is either a paragraph or a set of sub-bullets, one per line. Sources
  // are not repeated per field — every one is linked once under "Evidence for
  // this entry" at the foot of the panel. Prose fields hold no newline, so they
  // fall through to the paragraph they always were, and a contributor who types
  // a single block of text still gets one.
  // One bullet per line. All three live maps are written this way, so there is
  // no longer a per-domain flag: a field with no line break is one bullet, not
  // a paragraph, which is the only reading that renders a genuinely one-point
  // field — Northern Ireland's removal criteria, say — like its siblings.
  const prose = (text, entry) => {
    const lines = String(text == null ? '' : text).split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return `<p>${linkCitations(esc(text), entry)}</p>`;
    return `<ul class="bul">${lines.map(l => `<li>${linkCitations(esc(l), entry)}</li>`).join('')}</ul>`;
  };
  const fields = d.fields.map((f, i) => {
    const c = u.fieldStates[i];
    const isHist = f.k === 'policyHistory';
    const isLangs = f.type === 'languages';
    // `offering` is keyed by language, `programme` by subject; the renderer is
    // the same and only the head of the row differs.
    const rowKey = f.type === 'offering' ? 'language' : f.type === 'programme' ? 'subject' : null;
    const renderOwn = () => isHist ? historyHTML(u.history, u)
      : isLangs ? languagesHTML(u.records[f.k])
      : rowKey ? rowsHTML(u.records[f.k], rowKey)
      : prose(u.values[f.k], u);
    if (c === 'h') return block('on', f.label, renderOwn());
    // "Not established from the sources consulted…" is a sentence explaining an
    // absence, not a list of facts, so it stays a paragraph even where the
    // domain's documented fields are bulleted.
    if (c === 'l') return block('looked', f.label, `<p>${linkCitations(esc(u.values[f.k]), u)}</p>`);
    // The question does not apply here — not a gap, and not something a
    // contributor should be invited to fill. It must be shown BEFORE the
    // inheritance branch: a state has no language count of its own, but its
    // country does, and inheriting India's 518 onto Kerala would state the one
    // thing the field is careful not to say.
    if (c === 'x') return block('na', f.label, `<p>${linkCitations(esc(u.values[f.k]), u)}</p>`);
    const inheritable = par && (isHist ? (par.history || []).length
      : (isLangs || rowKey) ? (par.records[f.k] || []).length
      : par.values[f.k]);
    if (inheritable) {
      nInherited++;
      return block('inh', f.label,
        isHist ? historyHTML(par.history, par)
          : isLangs ? languagesHTML(par.records[f.k])
          : rowKey ? rowsHTML(par.records[f.k], rowKey)
          : prose(par.values[f.k], par), par.name);
    }
    return block('empty', f.label, '<p>Not recorded.</p>');
  }).join('');

  const cross = LIVE.map(dd => {
    const other = IDX[dd.id].byKey.get(keyOf(u));
    return `<div class="r">${other ? swatch(other, other.coverage) : swatch(u, 'none')}
      <span>${esc(dd.label)}</span>
      <span class="n">${other ? other.filled.length + '/' + other.nFields + ' fields' : 'no entry'}</span></div>`;
  }).join('');

  const sibRows = sibs.map(x =>
    `<button data-key="${esc(keyOf(x))}">${swatch(x, stateOf(x))}<span>${esc(x.name)}</span>
      <span class="role">${x.nat ? 'national' : 'sub-national'}</span></button>`).join('');

  const inheritNote = !sibs.length ? ''
    : u.nat
      ? `These sub-national units exist because they differ somewhere. In this domain each of them falls back to the record above wherever it has nothing of its own.`
      : nat
        ? `A field left blank here is not necessarily a gap in the record — it falls back to <b>${esc(nat.name)}</b>, marked as inherited above.`
        : `${esc(countryName)} has no national entry in this domain, so these ${sibs.length + 1} units inherit nothing from each other. Every field has to be documented separately.`;

  return `
  <div class="inner" style="--mark:${hue}">
    <button class="close" aria-label="Close">×</button>
    <div class="eyebrow">${esc(u.nat ? 'National' : 'Sub-national')} · ${esc(d.label)}</div>
    <h2>${esc(u.name)}</h2>
    <div class="wherewrap">
      <div class="where">${u.nat
        ? esc(u.subregion || u.region)
        : (nat
            ? `<button class="tocountry" data-key="${esc(keyOf(nat))}">${esc(nat.name)}</button> · ${esc(u.subregion || u.region)}`
            : esc(countryName + ' · ' + (u.subregion || u.region)))}</div>
      ${u.nat && sibs.length ? `<select class="tosub" aria-label="Go to a sub-national entry">
        <option value="">${esc(sibs.length + ' sub-national entr' + (sibs.length === 1 ? 'y' : 'ies'))}…</option>
        ${sibs.map(x => `<option value="${esc(keyOf(x))}">${esc(x.name)}</option>`).join('')}
      </select>` : ''}
    </div>
    ${via ? `<p class="viaterr">You clicked <b>${esc(via.name)}</b>. ${via.note
      ? esc(via.note)
      : `There is no separate ${esc(d.label)} entry for it, so what applies is the ${esc(u.name)} record below.`}</p>` : ''}
    ${nInherited && !via ? `<p class="viaterr">${nInherited} of these ${d.fields.length} fields have nothing recorded for ${esc(u.name)} itself and follow <button class="tocountry" data-key="${esc(keyOf(par))}">${esc(par.name)}</button>. They are marked below.</p>` : ''}
    ${u.stubNote ? `<p class="stubnote">${esc(u.stubNote)}</p>` : ''}

    <div class="chips">
      <span class="chip">${u.filled.length}/${d.fields.length} fields</span>
      <span class="chip">${esc(u.status)}</span>
      <span class="chip">${esc(u.confidence.replace(/-/g, ' '))}</span>
      ${u.lastVerified ? `<span class="chip">verified ${esc(u.lastVerified)}</span>` : ''}
    </div>

    <!-- No heading over the fields: they are the entry, and saying so above
         them only pushes the first field further down the panel. The sections
         that follow still need their headings, because they are not. -->
    <div class="sect">
      ${fields}
    </div>

    ${u.docLinks.length ? `<div class="sect"><h3>Evidence for this entry</h3>
      <div class="links">${linkList(u.docLinks)}</div></div>` : ''}
    ${u.supportLinks.length ? `<div class="sect"><h3>Support available there</h3>
      <div class="links">${linkList(u.supportLinks)}</div></div>` : ''}

    <div class="sect">
      <h3>Across domains</h3>
      <div class="cross">${cross}</div>
    </div>

    ${u.collaborators.length ? `<div class="sect"><h3>Contributors</h3>
      <dl class="kv"><dt>Worked on by</dt><dd>${esc(u.collaborators.join(', '))}</dd></dl></div>` : ''}

    ${sibs.length ? `<div class="sect">
      <h3>Others in ${esc(countryName)}</h3>
      <div class="sibs">${sibRows}</div>
      <p class="caveat" style="margin-top:12px">${inheritNote}</p>
    </div>` : ''}

    ${contributeHTML(u, d)}
  </div>`;
}

// The ask sits at the end of the entry, phrased by what is already there: an
// empty record asks the reader to write it, a partial one asks for the gaps,
// and only an entry with something in it can be corrected.
function submitHref(u) {
  const q = new URLSearchParams({ domain: domainId, cc: u.cc, unit: u.name, national: u.nat ? '1' : '0' });
  return '/submit?' + q;
}

function contributeHTML(u, d) {
  const gaps = d.fields.length - u.filled.length;
  const documented = u.filled.length > 0;
  return `<div class="contribute">
    <h3>${documented ? 'Add to this entry' : 'Do you know this system?'}</h3>
    <p>${documented
      ? `${gaps === 0 ? 'Every field here has something in it' : `${gaps} of the ${d.fields.length} fields are still blank for ${esc(u.name)}`}. You can add one field without documenting the rest.`
      : `Nothing has been recorded for ${esc(u.name)} yet. If you teach, plan or research provision there, what you know is the record.`}</p>
    <div class="row">
      <a class="cbtn lead" href="${esc(submitHref(u))}">${documented ? 'Add what I know' : 'I know this'}</a>
      ${documented ? `<button class="cbtn" type="button" data-fix="${esc(keyOf(u))}">Suggest a correction</button>` : ''}
    </div>
    <p class="elsewhere">Everything is reviewed before it appears on the map.</p>
  </div>`;
}

/* ---------- chrome ---------- */
function buildDomains() {
  mountNav(domainId, B.domains);
  for (const id of ['addlink', 'addlink2']) {
    const a = document.getElementById(id);
    if (a) a.href = '/submit?domain=' + domainId;
  }
  document.getElementById('blurb').textContent = domain().blurb;
  // A domain may carry a note about its own framing. Only one does: the
  // Indigenous and regional languages map, whose NAME is a compromise between
  // regional terms of art that do not agree with each other. A reader who
  // notices that Senegal's entry says "national languages" under a heading
  // that says Indigenous is owed the reason on the same screen, not in a
  // repository README they will never open.
  // A domain whose own NAME needs explaining used to carry the explanation
  // here, which made this box a paragraph taller on the one map that can least
  // afford it. The explanation lives on the About page in full; this is the
  // door to it.
  const noteEl = document.getElementById('domainnote');
  const note = domain().note;
  noteEl.innerHTML = note
    ? `<a href="/about#terminology">Why this name?</a>`
    : '';
  noteEl.hidden = !note;
  // Each map is its own page, so it gets its own title in history and tabs.
  document.title = domain().label + ' — Language Atlas';
}



/* search */
const search = document.getElementById('search'), results = document.getElementById('results');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  results.innerHTML = '';
  if (q.length < 2) return;
  const hits = B.units[domainId]
    .filter(u => u.name.toLowerCase().includes(q) || u.cc.toLowerCase() === q ||
                 (u.subregion || '').toLowerCase().includes(q) || u.region.toLowerCase().includes(q))
    .slice(0, 40);
  for (const u of hits) {
    const b = document.createElement('button');
    b.innerHTML = `${swatch(u, stateOf(u))}<span>${esc(u.name)}</span><span class="sub">${esc(u.subregion || u.region)}</span>`;
    b.onclick = () => { select(keyOf(u), true); results.innerHTML = ''; search.value = ''; };
    results.appendChild(b);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.searchwrap')) results.innerHTML = '';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); results.innerHTML = ''; } });

/* legend swatches */
function paintLegend() {
  document.getElementById('sw-looked').style.background =
    'repeating-linear-gradient(45deg, var(--hatch-bg) 0 3px, var(--hatch-line) 3px 4px)';
  document.getElementById('sw-none').style.background = 'var(--nodata)';
  const inh = document.getElementById('sw-inh');
  inh.style.background = 'var(--cov-3)';
  inh.style.borderStyle = 'dashed';
  inh.style.borderColor = 'var(--surface)';
  const hues = document.getElementById('hues');
  hues.innerHTML = Array.from({ length: COV_STEPS }, (_, i) =>
    `<span style="background:var(--cov-${i + 1})"></span>`).join('');
}

buildDomainStack(); openDomainBox(domainId, false); buildDomains(); paint(); sizeMap(); applyView(); paintLegend();
loading.classList.add('done');

// There was a banner here for when a tracker could not be reached and the page
// was showing an older copy. Every domain is served from this app's own store
// now, so there is no upstream left to go stale against.
/* ---------- corrections ---------- */
const dlg = document.getElementById('fixdlg');
let fixUnit = null;

function said(text, kind) {
  document.getElementById('fixsaid').innerHTML = text ? `<div class="said ${kind}">${esc(text)}</div>` : '';
}

function openFix(u) {
  fixUnit = u;
  document.getElementById('fixsub').textContent =
    `${u.name} · ${domain().label}. This goes to the maintainer, who will reply to you.`;
  said('', '');
  dlg.classList.add('on');
  document.getElementById('fixwhat').focus();
}

function closeFix() { dlg.classList.remove('on'); }

document.getElementById('fixcancel').onclick = closeFix;
dlg.addEventListener('click', e => { if (e.target === dlg) closeFix(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && dlg.classList.contains('on')) closeFix(); });

document.getElementById('fixsend').onclick = async () => {
  const btn = document.getElementById('fixsend');
  const description = document.getElementById('fixwhat').value.trim();
  const email = document.getElementById('fixmail').value.trim();
  if (!description) return said('Please say what should change.', 'bad');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return said('An email address is needed so you can be answered.', 'bad');
  btn.disabled = true;
  said('', '');
  try {
    const res = await fetch(`/api/${domainId}/edit-requests`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ description, email, entryTitle: `${fixUnit.name} (${fixUnit.cc})` }),
    });
    if (!res.ok) {
      const e = (await res.json().catch(() => ({}))).error;
      throw new Error(e === 'not_accepting_yet'
        ? 'this map is not taking corrections just yet'
        : (e || `Error ${res.status}`));
    }
    said('Sent — thank you. You will get a copy at that address.', 'ok');
    document.getElementById('fixwhat').value = '';
    setTimeout(closeFix, 1600);
  } catch (err) {
    said('That did not send: ' + err.message + '. Nothing was lost — try again shortly.', 'bad');
  } finally {
    btn.disabled = false;
  }
};

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintLegend(); });
addEventListener('resize', () => { sizeMap(); clampView(); applyView(); });
// A phone's address bar collapsing on scroll changes 100dvh without reliably
// firing `resize`, and the legend's own height changes when its text rewraps.
// Watch the boxes themselves so the split is recomputed whenever either moves.
if (window.ResizeObserver) {
  let queued = false;
  const ro = new ResizeObserver(() => {
    if (queued) return;                       // the observer fires again when
    queued = true;                            // sizeMap resizes the map, so
    requestAnimationFrame(() => {             // coalesce to one pass a frame
      queued = false; sizeMap(); clampView(); applyView();
    });
  });
  ro.observe(document.getElementById('stage'));
  ro.observe(document.getElementById('domainstack'));
}

</script>

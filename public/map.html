<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Language Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/shared.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
/* Palette, base type and the site nav come from shared.css. Only rules the
   map itself needs live here. */
.app { display: flex; flex-direction: column; height: 100dvh; }

.searchwrap { position: relative; margin-left: auto; flex: none; }
.searchwrap input {
  font: inherit; font-size: 13px;
  width: 230px; padding: 8px 11px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hair); border-radius: 4px;
}
.searchwrap input::placeholder { color: var(--ink-faint); }
.results {
  position: absolute; top: calc(100% + 6px); right: 0; width: 300px;
  max-height: 340px; overflow-y: auto; z-index: 40;
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 4px; box-shadow: var(--shadow); padding: 4px;
}
.results:empty { display: none; }
.results button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font: inherit; font-size: 13px; text-align: left;
  padding: 7px 8px; border: 0; border-radius: 3px;
  background: none; color: var(--ink); cursor: pointer;
}
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results .sub { color: var(--ink-faint); font-size: 11.5px; margin-left: auto; }

/* ---------------- map ---------------- */
/* The panel parks off-screen via a transform, which still counts toward the
   scrollable area — clip it here so the page itself never scrolls. */
.stage { position: relative; flex: 1; min-height: 0; background: var(--ground); overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }

/* A country border and a border between two states of one country are not the
   same kind of line, and drawing them at one weight made a split country read
   as though its parts were countries. Countries keep the heavier line; the
   divisions inside one are drawn lighter and in a softer colour, so Spain
   still reads as Spain with regions in it. */
/* --hair-strong rather than --ground-deep, which was too pale to be the thing
   the hover highlight contrasts WITH. Measured against the hover white:
   --ground-deep 1.33:1, --hair 1.57:1, --hair-strong 2.31:1. And on the palest
   coverage fill --ground-deep scored 1.01:1 against the fill itself -- an
   invisible line, which is why the hover looked hidden on some borders: there
   was nothing there to change. --hair-strong reads at 1.74:1 on that fill. */
.unit { stroke: var(--hair-strong); stroke-width: .9px; vector-effect: non-scaling-stroke; }
/* The SAME grey at half the weight. It was --hair-strong, which is darker than
   the country line, so a region border was the more prominent of the two and
   the hierarchy read backwards. One colour, two weights. */
.unit.sub { stroke-width: .45px; }
.unit.hit { cursor: pointer; }
.unit.base { pointer-events: none; }

/* The country outline of a SPLIT country, drawn above its own regions so the
   regions cannot bury it, and paired with a wide invisible stroke that makes
   the border itself the way to select the country.
   Before this the only way to reach Spain was to find a piece of it that no
   region covered; now its edge is a target. Non-scaling so the band stays the
   same handful of screen pixels at every zoom. */
.edge { fill: none; stroke: var(--hair-strong); stroke-width: 1.4px;
        vector-effect: non-scaling-stroke; pointer-events: none; }
/* 12px of stroke, clipped to the country, so about 6 fall inside it -- the
   band a reader actually gets. Unclipped this would be twice as wide as
   intended and would spill over the border into the neighbour. */
.edgehit { fill: none; stroke: transparent; stroke-width: 12px;
           vector-effect: non-scaling-stroke; pointer-events: stroke; cursor: pointer; }
.edge.sel { stroke: var(--pick); stroke-width: 2.4px; }
.edge.hov { stroke: var(--pick); stroke-width: 1.9px; }
/* Inherited: dashed rather than solid, but in the same grey as any other
   border. It was white, which read as a different KIND of line rather than a
   different state of one. The dash has to stay: an inherited unit is painted
   at --cov-1, the palest coverage step, so without it "follows its country"
   and "a fifth of the questions answered" are the same picture. */
.unit.inherited { stroke-dasharray: 3 2.5; opacity: .96; }
.dot.inherited { stroke-dasharray: 2 2; }

/* Resting borders are grey and differ only in weight. Pointing at something
   turns its border WHITE, which reads on every fill in the ramp -- black
   disappeared into the dark end of it. */
.unit.sel { stroke: var(--pick); stroke-width: 2px; }
.unit.hov { stroke: var(--pick); stroke-width: 1.5px; }
/* The same two rules, on the copy that sits above every other shape. No fill:
   this is an outline over the real shape, not a second shape covering it, so
   the coverage colour underneath still shows through. */
.halo { fill: none; stroke: var(--pick); vector-effect: non-scaling-stroke; pointer-events: none; }
.halo.sel { stroke-width: 2px; }
.halo.hov { stroke-width: 1.5px; }
.halo.inherited { stroke-dasharray: 3 2.5; }
.dot { stroke: var(--hair-strong); stroke-width: 1px; vector-effect: non-scaling-stroke; cursor: pointer; }
.dot.sel, .dot.hov { stroke: var(--pick); stroke-width: 2px; }
.leader { stroke: var(--hair-strong); stroke-width: .75px; vector-effect: non-scaling-stroke; fill: none; }

/* floating panels over the map */
.overlay {
  position: absolute; background: var(--surface);
  border: 1px solid var(--hair); border-radius: 4px;
  box-shadow: var(--shadow);
}
/* Four boxes, one open. The map being read is the expanded one, so the switch
   and the thing switched to are the same object: there is no separate list of
   links, and adding a fifth domain adds a fifth collapsed header rather than
   199px to a row that had already run out of room. */
.domainstack {
  top: 14px; left: 14px; width: 258px; padding: 0;
  background: transparent; border: 0; box-shadow: none;
  display: flex; flex-direction: column; gap: 7px;
  max-height: calc(100% - 28px); overflow-y: auto;
}
.dbox {
  background: var(--surface); border: 1px solid var(--hair);
  border-radius: 4px; box-shadow: var(--shadow); overflow: hidden;
  /* The stack is a column flexbox with a max-height, so without this the
     boxes are flex items that SHRINK: the open one was squashed to nothing
     and its grid row resolved to 0 however the track was written. Let them
     keep their height and let the stack scroll instead. */
  flex: 0 0 auto;
}
/* The open box carries the map you are reading, so it should not be a box
   like the other three with more inside it. An inset edge in the ramp's own
   colour and a heavier heading; the padding shift keeps the text off the bar. */
.dbox.open {
  border-color: var(--ink-faint);
  box-shadow: var(--shadow), inset 3px 0 0 var(--cov-4);
}
.dhead {
  width: 100%; font: inherit; font-size: 11px; font-weight: 600;
  letter-spacing: .085em; text-transform: uppercase; color: var(--ink-soft);
  background: none; border: 0; padding: 11px 14px; cursor: pointer;
  display: flex; align-items: center; gap: 9px; text-align: left; line-height: 1.35;
}
.dhead:hover { color: var(--ink); background: var(--surface-2); }
.dbox.open .dhead {
  color: var(--ink); cursor: default; background: none;
  font-weight: 700; padding-left: 17px; padding-bottom: 5px;
}
.dbox.open .dhead:hover { background: none; }
/* The swatch is the map's own colour for that domain's best-documented step,
   so a collapsed box still says which map it is without reading the words. */
.dhead .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; background: var(--cov-4); opacity: .55; }
.dbox.open .dhead .dot { opacity: 1; }
/* 0fr to 1fr animates; height:auto does not. The inner element carries the
   overflow so the content is clipped rather than spilling while it moves. */
.dbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s ease; }
.dbox.open .dbody { grid-template-rows: 1fr; }
.dinner { overflow: hidden; }
#dcontent { padding: 0 14px 12px 17px; }
#dcontent[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .dbody { transition: none; } }
.domainstack select {
  font: inherit; font-size: 13px; width: 100%;
  padding: 7px 8px; border-radius: 3px;
  border: 1px solid var(--hair); background: var(--surface-2); color: var(--ink);
}
.blurb { font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.45; }
/* A domain's note about its own framing. Set apart from the blurb by a rule
   rather than a colour, so it reads as an aside rather than as a warning —
   nothing here is wrong, the naming is just contested. */
.domainnote { margin: 6px 0 0; font-size: 11.5px; line-height: 1.45; }
.domainnote a {
  color: var(--focus); text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px;
}
.domainnote a:hover { text-decoration-style: solid; }
.domainnote[hidden] { display: none; }


/* Bottom of the map beside the zoom, laid out along the edge rather than down
   a column: it is a caption for the whole map now, not part of any one box. */
/* Swatches, then the ramp under them, both starting at the same left edge.
   Sitting them side by side centred the ramp against a block that wraps to
   two or three lines depending on the width, so it floated at a different
   height every time. */
.legendbox {
  bottom: 14px; right: 62px; padding: 10px 13px 11px;
  display: flex; flex-direction: column; gap: 9px;
  width: 236px;
}
.legendbox .rows { display: flex; flex-direction: column; gap: 5px; }
.legendbox .ramplabel {
  display: block; font-size: 10px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px;
}


.legend h2 { font: inherit; font-size: 11px; margin: 0 0 9px; }
.legendbox .row { display: flex; align-items: center; gap: 9px; font-size: 12px; margin-bottom: 6px; }
.legendbox .row { margin-bottom: 0; }
.legendbox .sw { width: 22px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.legend .note { font-size: 11px; color: var(--ink-faint); margin: 10px 0 0; line-height: 1.45; }
.legendbox .hues { display: flex; gap: 3px; }
.legendbox .hues span { flex: 1; height: 7px; border-radius: 1px; }
.legendbox .hueslabels {
  display: flex; gap: 3px; margin-top: 5px;
  font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em;
}
.legendbox .hueslabels span { flex: 1; text-align: center; }

.zoomctl { bottom: 14px; right: 14px; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.zoomctl button {
  font: inherit; font-size: 17px; line-height: 1;
  width: 34px; height: 34px; border: 0; background: var(--surface);
  color: var(--ink); cursor: pointer;
}
.zoomctl button + button { border-top: 1px solid var(--hair); }
.zoomctl button:hover { background: var(--surface-2); }
.zoomctl .reset { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

/* load + failure states, over the map */
.loading {
  position: absolute; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; background: var(--ground); text-align: center; padding: 24px;
}
.loading.done { display: none; }
.loading p { margin: 0; font-size: 13px; color: var(--ink-soft); max-width: 42ch; line-height: 1.5; }
.loading .spin {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--hair); border-top-color: var(--ink-soft);
  animation: spin .8s linear infinite;
}
.loading.failed .spin { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading .spin { animation-duration: 3s; } }

/* tooltip */
.tip {
  position: absolute; z-index: 30; pointer-events: none;
  max-width: 280px; padding: 9px 11px;
  background: var(--surface); border: 1px solid var(--hair-strong);
  border-radius: 4px; box-shadow: var(--shadow);
  opacity: 0; transition: opacity .09s;
}
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
.tip.on { opacity: 1; }
.tip .name { font-weight: 600; font-size: 13.5px; }
.tip .meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
.tip .state { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-top: 7px; }
.tip .state .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid var(--hair-strong); flex: none; }
.tip .inherit {
  font-size: 11px; color: var(--ink-soft); margin-top: 7px;
  padding-top: 7px; border-top: 1px solid var(--hair);
}
.tip .hintline { font-size: 10.5px; color: var(--ink-faint); margin-top: 8px; }

/* field checklist — the point of the hover is "what is and isn't here" */
.fieldgrid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px 12px;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair);
}
.fieldgrid span {
  font-size: 11px; line-height: 1.5; color: var(--ink-faint);
  display: flex; align-items: center; gap: 6px;
}
.fieldgrid span::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  border: 1px solid var(--hair-strong); background: transparent;
}
.fieldgrid span.on { color: var(--ink); }
.fieldgrid span.on::before { background: var(--mark, var(--cov-3)); border-color: var(--mark, var(--cov-3)); }
.fieldgrid span.looked { color: var(--ink-soft); }
.fieldgrid span.looked::before { background: var(--hatch-line); border-color: var(--hatch-line); opacity: .55; }

/* full entry in the panel */
/* No rule between fields: the uppercase label and its dot already separate
   them, and a hairline every 40px down a long entry reads as a table nobody
   asked for. Spacing alone does the work. */
.field { padding: 0 0 13px; }
.field:last-child { padding-bottom: 0; }
.field h4 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 5px; display: flex; align-items: center; gap: 7px;
}
.field h4::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; flex: none;
  border: 1px solid var(--hair-strong);
}
.field.on h4 { color: var(--ink-soft); }
.field.on h4::before { background: var(--mark, var(--cov-3)); border-color: var(--mark, var(--cov-3)); }
.field.looked h4::before { background: var(--hatch-line); border-color: var(--hatch-line); opacity: .55; }
.field p {
  margin: 0; font-size: 13.5px; line-height: 1.58; white-space: pre-line;
  overflow-wrap: break-word;
}
.field.empty p, .field.looked p { color: var(--ink-faint); font-style: italic; }
/* Not applicable: the question has no meaning for this unit. Set apart from
   "empty" so it does not read as an invitation to fill it in. */
.field.na h4::before { background: transparent; border-style: dotted; border-color: var(--hair-strong); }
.field.na p { color: var(--ink-faint); font-style: italic; }
.fieldgrid span.na { color: var(--ink-faint); }
.fieldgrid span.na::before { background: transparent; border-style: dotted; border-color: var(--hair-strong); }
.field.inh h4::before { background: transparent; border-style: dashed; border-color: var(--hair-strong); }
.field.inh p { color: var(--ink-soft); }

/* Sub-bullets. A short rule rather than a dot: the field heading already
   carries a dot, and two dot sizes stacked in one narrow column read as a
   hierarchy that isn't there. */
.field ul.bul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.field ul.bul li {
  position: relative; padding-left: 13px;
  font-size: 13px; line-height: 1.5; overflow-wrap: break-word;
}
.field ul.bul li::before {
  content: ""; position: absolute; left: 2px; top: .68em;
  width: 5px; height: 1px; background: var(--hair-strong);
}
.field.looked ul.bul li { color: var(--ink-faint); font-style: italic; }
.field.inh ul.bul li { color: var(--ink-soft); }
.field h4 .from {
  margin-left: auto; letter-spacing: .04em; text-transform: none;
  font-weight: 500; font-size: 10px; color: var(--ink-faint); font-style: italic;
}

a.cite {
  color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus);
}
a.cite:hover { color: var(--focus); text-decoration-style: solid; }

/* policy history reads as a dated list, each row carrying its document */
/* The languages themselves: a name that links to its WALS record where one
   exists, then classification, typology and identifiers, each stepping down in
   weight so the name is what the eye lands on. */
.langs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.langs li { display: flex; flex-direction: column; gap: 1px; }
.langs .lname { font-size: 13px; font-weight: 500; }
.langs .lname a { color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus); }
.langs .lname a:hover { color: var(--focus); text-decoration-style: solid; }
.langs .lcls { font-size: 11.5px; color: var(--ink-soft); }
.langs .ltyp { font-size: 11.5px; color: var(--ink-soft); }
.langs .lids { font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
/* Offering and programme rows. Same visual grammar as .langs -- the head of
   the row reads as the name, everything under it as its detail -- because a
   reader moving between "The languages" and "Linguistics" on one panel should
   not have to learn two layouts. The institution is the link. */
.offs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.offs li { display: flex; flex-direction: column; gap: 1px; }
.offs .oname { font-size: 13px; font-weight: 500; }
.offs .oinst { font-size: 12px; }
.offs .oinst a { color: inherit; text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 2px; text-decoration-color: var(--focus); }
.offs .oinst a:hover { color: var(--focus); text-decoration-style: solid; }
.offs .ometa { font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.offs .onote { font-size: 11.5px; color: var(--ink-soft); }

.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.hist li { display: grid; grid-template-columns: 58px 1fr; gap: 11px; align-items: start; }
.hist .yr {
  font-variant-numeric: tabular-nums; font-size: 11.5px; font-weight: 600;
  color: var(--ink-faint); padding-top: 2px; letter-spacing: .01em;
}
.hist p { margin: 0; }
.hist .links { margin-top: 5px; gap: 4px; }
.hist .links a { font-size: 12px; }

.links { display: flex; flex-direction: column; gap: 7px; }
.links a {
  font-size: 12.5px; line-height: 1.4; color: var(--focus);
  text-decoration: none; overflow-wrap: anywhere;
}
.links a:hover { text-decoration: underline; }
.links a { position: relative; padding-left: 15px; }
.links a::before {
  content: ""; position: absolute; left: 1px; top: .48em;
  width: 5px; height: 5px; opacity: .55;
  border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor;
  transform: rotate(45deg);
}
.viaterr {
  font-size: 11.5px; color: var(--ink-soft); line-height: 1.5;
  background: var(--surface-2); border-left: 2px solid var(--hair-strong);
  padding: 9px 11px; border-radius: 0 3px 3px 0; margin: 13px 0 0;
}

/* What was looked for and not found, where someone recorded it. Set apart from
   .viaterr because it is a finding about the world, not a note about how this
   panel is assembled. */
.stubnote {
  font-size: 12px; color: var(--ink-soft); line-height: 1.55;
  background: var(--surface-2); border-left: 2px solid var(--hatch-line);
  padding: 10px 12px; border-radius: 0 3px 3px 0; margin: 13px 0 0;
}
.stubnote b { color: var(--ink); font-weight: 600; }

/* Contributing, from the entry you are looking at. An empty record is the
   place a reader is most likely to know something, so the ask is loudest
   there and quietest where the entry is already full. */
.contribute { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hair); }
.contribute h3 {
  font: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 8px;
}
.contribute p { margin: 0 0 11px; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); }
.contribute .row { display: flex; gap: 8px; flex-wrap: wrap; }
.cbtn {
  font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  padding: 8px 13px; border-radius: 6px; text-decoration: none;
  border: 1px solid var(--hair-strong); background: var(--surface); color: var(--ink-soft);
  display: inline-flex; align-items: center;
}
.cbtn:hover { border-color: var(--ink-faint); color: var(--ink); }
.cbtn.lead { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
.cbtn.lead:hover { color: var(--surface); opacity: .9; }
.contribute .elsewhere { font-size: 11.5px; color: var(--ink-faint); margin: 10px 0 0; }

/* Correction dialog. Kept on the map rather than sending the reader to a
   separate page: a correction is about the entry they are already reading. */
.dlg {
  position: fixed; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; padding: 18px;
  background: color-mix(in srgb, var(--ink) 42%, transparent);
}
.dlg.on { display: flex; }
.dlg .box {
  background: var(--surface); border: 1px solid var(--hair); border-radius: 9px;
  box-shadow: var(--shadow); width: min(460px, 100%); max-height: 92dvh;
  overflow-y: auto; padding: 20px;
}
.dlg h3 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.dlg .sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 16px; }
.dlg label { display: block; font-size: 12.5px; font-weight: 600; margin: 0 0 4px; }
.dlg input, .dlg textarea {
  width: 100%; font: inherit; font-size: 13.5px; color: var(--ink);
  background: var(--ground); border: 1px solid var(--hair-strong);
  border-radius: 5px; padding: 8px 10px; margin-bottom: 13px;
}
.dlg textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.dlg .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg .said { font-size: 12.5px; padding: 9px 11px; border-radius: 5px; margin: 0 0 13px; }
.dlg .said.bad { background: color-mix(in srgb, var(--r-oceania) 15%, var(--surface)); }
.dlg .said.ok { background: color-mix(in srgb, var(--r-americas) 15%, var(--surface)); }

/* detail panel */
.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 380px;
  background: var(--surface); border-left: 1px solid var(--hair);

     wide as it is tall, so on a portrait phone the drawn map is always limited
     by WIDTH — giving it more height cannot make the drawing bigger, it just
     centres it in more of the map's own ground colour. That is the right place
     for the slack: ground reads as ocean and belongs to the map, whereas the
     same gap under a short legend read as a dead white slab across the bottom
     third of the screen. */

     three collapsed headers above a legend that is already pinned to the
     bottom of the screen, and the four maps are one tap away in the menu
